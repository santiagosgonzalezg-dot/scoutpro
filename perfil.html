<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perfil · ScoutPRO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg-base:#08090d; --bg-raised:#0f1117; --bg-panel:#161820; --bg-hover:#1e202a;
  --bl:rgba(255,255,255,.05); --bm:rgba(255,255,255,.09); --bs:rgba(255,255,255,.18);
  --offense:#f97316; --insight:#a78bfa; --positive:#34c769; --negative:#f05050;
  --text:#ffffff; --text-2:#8891a0; --text-3:#5a6172;
  --disp:'Barlow Condensed',sans-serif; --body:'DM Sans',sans-serif; --mono:'DM Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg-base);color:var(--text);font-family:var(--body);font-size:13px;-webkit-font-smoothing:antialiased;min-height:100vh}

/* ── TOPBAR (consistente con el resto) ── */
.topbar{display:flex;align-items:center;gap:12px;padding:0 20px;height:52px;background:var(--bg-raised);border-bottom:1px solid var(--bm);position:sticky;top:0;z-index:30}
.tb-logo{font-family:var(--disp);font-weight:800;font-size:18px;letter-spacing:2px;flex-shrink:0}
.tb-logo span{color:var(--offense)}
.tb-right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.tb-btn{background:var(--bg-panel);border:1px solid var(--bm);border-radius:5px;color:var(--text-2);font-family:var(--mono);font-size:10px;letter-spacing:.3px;padding:7px 13px;cursor:pointer;text-decoration:none;transition:all .15s;white-space:nowrap}
.tb-btn:hover{border-color:var(--offense);color:var(--offense)}

.wrap{max-width:880px;margin:0 auto;padding:28px 22px 70px}

/* ── HERO ── */
.hero{position:relative;display:flex;align-items:center;gap:20px;flex-wrap:wrap;background:linear-gradient(115deg,#14161f 0%,#0f1117 55%,#171922 100%);border:1px solid var(--bm);border-radius:16px;padding:24px;overflow:hidden}
.hero::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--offense),#fb923c)}
.hero::after{content:"";position:absolute;right:-60px;top:-80px;width:240px;height:240px;background:radial-gradient(circle,rgba(249,115,22,.10),transparent 70%);pointer-events:none}
.hero-info{flex:1;min-width:220px;position:relative;z-index:1}
.hero-name{font-family:var(--disp);font-weight:900;font-size:34px;letter-spacing:.5px;line-height:1}
.hero-mail{font-family:var(--mono);font-size:11px;color:var(--text-2);letter-spacing:.4px;margin-top:8px}
.hero-tag{display:inline-block;margin-top:12px;background:#f4f1ea;color:#11131a;font-family:var(--mono);font-weight:500;font-size:10.5px;letter-spacing:.8px;padding:5px 13px;border-radius:30px;text-transform:uppercase}
.hero-edit{position:relative;z-index:1;align-self:flex-start;background:none;border:1px solid var(--bm);color:var(--text-2);border-radius:9px;width:38px;height:38px;font-size:15px;cursor:pointer;transition:all .15s}
.hero-edit:hover{color:var(--offense);border-color:var(--offense)}

/* ── BADGE DE CLUB ── */
.club-badge{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:900;font-size:15px;color:#fff;letter-spacing:.3px;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.25);flex-shrink:0}
.club-badge.lg{width:72px;height:72px;font-size:28px;border-radius:18px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.club-badge.has-logo{background:#fff;padding:4px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.club-badge.has-logo img{width:100%;height:100%;object-fit:contain;border-radius:inherit;display:block}

/* ── EDITOR ── */
.editor{display:none;gap:10px;align-items:center;flex-wrap:wrap;background:var(--bg-raised);border:1px solid var(--bm);border-radius:12px;padding:16px;margin-top:14px}
.editor input{background:var(--bg-panel);border:1px solid var(--bm);border-radius:8px;color:var(--text);font-family:var(--body);font-size:14px;padding:10px 13px;outline:none;min-width:220px;transition:border-color .15s}
.editor input:focus{border-color:var(--offense)}
.btn-save{background:var(--offense);color:#fff;border:none;border-radius:8px;padding:10px 18px;font-family:var(--disp);font-weight:700;font-size:14px;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;transition:background .15s}
.btn-save:hover{background:#ea6c10}
.btn-ghost{background:none;border:1px solid var(--bm);color:var(--text-2);border-radius:8px;padding:10px 15px;font-family:var(--mono);font-size:12px;cursor:pointer;transition:all .15s}
.btn-ghost:hover{color:var(--text);border-color:var(--bs)}

/* ── SECCIONES / TARJETAS ── */
.sec{font-family:var(--disp);font-weight:800;font-size:15px;letter-spacing:.4px;text-transform:uppercase;color:var(--text);margin:28px 0 14px;display:flex;align-items:center;gap:10px}
.sec::before{content:"";width:3px;height:16px;background:var(--offense);border-radius:2px}
.sec::after{content:"";flex:1;height:1px;background:var(--bm)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.card{background:var(--bg-raised);border:1px solid var(--bm);border-radius:14px;padding:18px}
.card h3{font-family:var(--disp);font-weight:700;font-size:18px;margin-bottom:6px}
.card p{font-size:12.5px;line-height:1.55;color:var(--text-2)}
.club-line{display:flex;align-items:center;gap:12px;margin:4px 0 2px}
.club-line b{font-family:var(--disp);font-weight:800;font-size:20px;letter-spacing:.3px}
.team-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--bl)}
.team-row:last-child{border-bottom:none}
.team-row .tn{font-weight:600}
.note{font-family:var(--mono);font-size:10.5px;color:var(--text-3);line-height:1.6;margin-top:8px}
.actions{display:flex;flex-direction:column;gap:9px;margin-top:6px}
.act-btn{display:block;width:100%;text-align:left;background:var(--bg-panel);border:1px solid var(--bm);border-radius:9px;color:var(--text);font-family:var(--body);font-size:13px;padding:11px 14px;cursor:pointer;text-decoration:none;transition:all .15s}
.act-btn:hover{border-color:var(--offense);color:var(--offense)}
.act-btn.danger:hover{border-color:var(--negative);color:var(--negative)}
.loadbox{display:flex;flex-direction:column;align-items:center;gap:14px;padding:80px 20px;color:var(--text-2);font-family:var(--mono);font-size:11px;letter-spacing:1px;text-transform:uppercase}
.spinner{width:32px;height:32px;border-radius:50%;border:3px solid var(--bs);border-top-color:var(--offense);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── LOGIN GATE ── */
#auth-gate{position:fixed;inset:0;z-index:9000;display:flex;align-items:center;justify-content:center;padding:22px;background:radial-gradient(130% 100% at 22% 18%,#15171f 0%,#0a0b10 58%,#07080c 100%)}
.auth-card{width:392px;max-width:100%;background:var(--bg-raised);border:1px solid var(--bm);border-radius:20px;padding:34px 30px;box-shadow:0 30px 90px rgba(0,0,0,.62)}
.auth-logo{font-family:var(--disp);font-weight:900;font-size:42px;line-height:1;text-align:center}
.auth-logo span{color:var(--offense)}
.auth-tag{font-family:var(--mono);font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:var(--text-3);text-align:center;margin:6px 0 24px}
.auth-tabs{display:flex;gap:5px;background:var(--bg-panel);padding:4px;border-radius:11px;margin-bottom:18px}
.auth-tab{flex:1;text-align:center;padding:9px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);cursor:pointer;border-radius:8px;border:1px solid transparent;transition:all .15s}
.auth-tab.active{color:var(--offense);background:color-mix(in srgb,var(--offense) 14%,transparent);border-color:color-mix(in srgb,var(--offense) 40%,transparent)}
.auth-field{display:flex;flex-direction:column;gap:5px;margin-bottom:13px}
.auth-field label{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3)}
.auth-field input{background:var(--bg-panel);border:1px solid var(--bm);border-radius:9px;padding:11px 13px;font-family:var(--body);font-size:14.5px;color:var(--text);outline:none;transition:border-color .15s}
.auth-field input:focus{border-color:var(--offense)}
.auth-btn{width:100%;margin-top:6px;background:var(--offense);color:#fff;border:none;border-radius:9px;padding:12px;font-family:var(--disp);font-weight:800;font-size:16px;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;transition:background .15s}
.auth-btn:hover{background:#ea6c10}
.auth-btn:disabled{background:var(--bg-hover);color:var(--text-3);cursor:not-allowed}
.auth-msg{font-family:var(--mono);font-size:11px;text-align:center;margin-top:13px;min-height:15px;line-height:1.5}
.auth-msg.err{color:var(--negative)}.auth-msg.ok{color:var(--positive)}
body.auth-locked .topbar,body.auth-locked .wrap{display:none!important}
@media(max-width:560px){.hero-name{font-size:28px}}
</style>
</head>
<body class="auth-locked">

<!-- LOGIN -->
<div id="auth-gate" style="display:flex">
  <div class="auth-card">
    <div class="auth-logo">SCOUT<span>PRO</span></div>
    <div class="auth-tag">Perfil del entrenador</div>
    <div class="auth-tabs">
      <div class="auth-tab active" id="auth-tab-login" onclick="authSetMode('login')">Ingresar</div>
      <div class="auth-tab" id="auth-tab-signup" onclick="authSetMode('signup')">Crear cuenta</div>
    </div>
    <div class="auth-field" id="auth-name-field" style="display:none">
      <label>Nombre</label>
      <input type="text" id="auth-name" placeholder="Tu nombre (ej: Santiago)" autocomplete="given-name">
    </div>
    <div class="auth-field">
      <label>Email</label>
      <input type="email" id="auth-email" placeholder="tu@email.com" autocomplete="email">
    </div>
    <div class="auth-field">
      <label>Contraseña</label>
      <input type="password" id="auth-pass" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')authSubmit()">
    </div>
    <button class="auth-btn" id="auth-submit" onclick="authSubmit()">Ingresar</button>
    <div class="auth-msg" id="auth-msg"></div>
  </div>
</div>

<!-- TOPBAR -->
<div class="topbar">
  <div class="tb-logo">SCOUT<span>PRO</span></div>
  <div class="tb-right">
    <a class="tb-btn" href="quintetos.html">🔄 Quintetos</a>
    <a class="tb-btn" href="estadistico.html">📊 Estadístico</a>
    <a class="tb-btn" href="defensa.html">🛡 Defensa</a>
    <a class="tb-btn" href="index.html">🏠 Menú</a>
  </div>
</div>

<!-- PERFIL -->
<div class="wrap">
  <div id="profile-body">
    <div class="loadbox"><div class="spinner"></div><div>Cargando perfil…</div></div>
  </div>
</div>

function normTeamKey(s){return String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');}
function clubLogo(team){const k=normTeamKey(team);if(CLUB_LOGOS[k])return CLUB_LOGOS[k];for(const key in CLUB_LOGOS){if(k&&(k.indexOf(key)===0||key.indexOf(k)===0))return CLUB_LOGOS[key];}return null;}
function clubBadge(team,extra){const lg=clubLogo(team);const cls='club-badge '+(extra||'');if(lg)return '<span class="'+cls+' has-logo"><img src="'+lg+'" alt=""></span>';return '<span class="'+cls+'" style="background:'+clubColor(team)+'">'+clubInitials(team)+'</span>';}

function clubInitials(club){const w=String(club||'').trim().split(/\s+/).filter(Boolean);if(!w.length)return '?';if(w.length===1)return w[0].slice(0,2).toUpperCase();return (w[0][0]+w[1][0]).toUpperCase();}
function clubColor(club){let h=0;const s=String(club||'');for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%360;return 'hsl('+h+',52%,46%)';}

<script>
(function(){
  const SB_URL="https://jqudeomgafqilqmqcqzg.supabase.co";
  const SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpxdWRlb21nYWZxaWxxbXFjcXpnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyNjY1MTQsImV4cCI6MjA5NTg0MjUxNH0.0tl4jVOnuOE8DxTOQfGF2qirCeMIKRdv5RCZ0dGzBl8";
  const ADMIN_EMAIL='admin@scoutpro.app';
  const $=id=>document.getElementById(id);
  let mode='login', sb=null, EMAIL='';
  try{ if(window.supabase&&window.supabase.createClient){ sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}); } }catch(e){}

  function showGate(){document.body.classList.add('auth-locked');if($('auth-gate'))$('auth-gate').style.display='flex';}
  function hideGate(){document.body.classList.remove('auth-locked');if($('auth-gate'))$('auth-gate').style.display='none';}
  function setMsg(t,k){const m=$('auth-msg');if(!m)return;m.textContent=t||'';m.className='auth-msg'+(k?' '+k:'');}
  window.authSetMode=function(m){mode=m;$('auth-tab-login').classList.toggle('active',m==='login');$('auth-tab-signup').classList.toggle('active',m==='signup');$('auth-submit').textContent=m==='login'?'Ingresar':'Crear cuenta';var nf=$('auth-name-field');if(nf)nf.style.display=(m==='signup')?'flex':'none';setMsg('');};
  function tradErr(e){const m=(e&&e.message)?e.message:String(e);
    if(/Invalid login/i.test(m))return'Email o contraseña incorrectos.';
    if(/already registered|already exists|User already/i.test(m))return'Ese email ya tiene cuenta. Probá ingresar.';
    if(/at least 6|password should be|weak/i.test(m))return'La contraseña debe tener al menos 6 caracteres.';
    if(/confirm/i.test(m))return'Confirmá tu email antes de ingresar.';
    if(/rate limit|too many/i.test(m))return'Demasiados intentos. Esperá un momento.';
    return m;}
  window.authSubmit=async function(){
    if(!sb){setMsg('No se pudo conectar al servidor.','err');return;}
    const email=($('auth-email').value||'').trim(), pass=$('auth-pass').value||'';
    if(!email||!pass){setMsg('Completá email y contraseña.','err');return;}
    const btn=$('auth-submit');btn.disabled=true;
    try{
      if(mode==='signup'){
        const name=(($('auth-name')&&$('auth-name').value)||'').trim();
        const {data,error}=await sb.auth.signUp({email,password:pass,options:{data:{full_name:name}}});if(error)throw error;
        if(data&&data.session){hideGate();}else{setMsg('Cuenta creada. Si te pide confirmar por email, hacelo y después ingresá.','ok');window.authSetMode('login');}
      }else{
        const {error}=await sb.auth.signInWithPassword({email,password:pass});if(error)throw error;hideGate();
      }
    }catch(e){setMsg(tradErr(e),'err');}
    finally{btn.disabled=false;}
  };
  window.authLogout=async function(){try{if(sb)await sb.auth.signOut();}catch(e){}try{localStorage.removeItem('sp_coach');}catch(e){}showGate();location.reload();};

  // ── perfil ──
  function firstName(n){return ((n||'').trim().split(/\s+/)[0]||'');}
  function readCoach(){let c={};try{const s=localStorage.getItem('sp_coach');if(s)c=JSON.parse(s)||{};}catch(e){}return c;}
  function writeCoach(nombre,club){let c=readCoach();if(nombre!=null)c.nombre=nombre;if(club!=null)c.club=club;try{localStorage.setItem('sp_coach',JSON.stringify(c));}catch(e){}return c;}
  function niceNameFromEmail(email){let b=((email||'').split('@')[0]||'').replace(/[._-]+/g,' ').trim();if(!b||b.indexOf(' ')===-1)return'';return b.replace(/\b\w/g,c=>c.toUpperCase());}

  function renderProfile(user){
    EMAIL=(user&&user.email)||'';
    const meta=(user&&user.user_metadata)||{};
    const coach=readCoach();
    const nombre=((coach.nombre||'').trim())||((meta.full_name||meta.name||'').trim())||niceNameFromEmail(EMAIL)||'Coach';
    const club=((coach.club||'').trim())||((meta.club||'').trim())||'';
    writeCoach(nombre,club); // mantiene el storage compartido con el resto de secciones
    const isAdmin=EMAIL.toLowerCase()===ADMIN_EMAIL;
    const badgeLg=(typeof clubBadge==='function')?clubBadge(club||'?','lg'):'';
    const badgeSm=(typeof clubBadge==='function')?clubBadge(club||'?',''):'';
    const clubTxt=club||'Sin club asignado';

    const adminCard=isAdmin?(
      '<div class="card"><h3>Administración</h3>'+
      '<p>Tu cuenta es administradora. Gestioná perfiles y el estado de la base desde el panel.</p>'+
      '<div class="actions"><a class="act-btn" href="estadistico.html">Abrir panel de administración →</a></div></div>'):'';

    $('profile-body').innerHTML=
      '<div class="hero">'+badgeLg+
        '<div class="hero-info">'+
          '<div class="hero-name">'+firstName(nombre)+'</div>'+
          '<div class="hero-mail">'+(EMAIL||'—')+'</div>'+
          '<span class="hero-tag">DT · '+clubTxt+'</span>'+
        '</div>'+
        '<button class="hero-edit" title="Editar perfil" onclick="startEdit()">✎</button>'+
      '</div>'+
      '<div class="editor" id="editor">'+
        '<input type="text" id="ed-name" placeholder="Tu nombre" value="'+(nombre||'').replace(/"/g,'&quot;')+'" onkeydown="if(event.key===\'Enter\')saveProfile();if(event.key===\'Escape\')cancelEdit()">'+
        '<input type="text" id="ed-club" placeholder="Tu club (ej: Larrañaga)" value="'+(club||'').replace(/"/g,'&quot;')+'" onkeydown="if(event.key===\'Enter\')saveProfile();if(event.key===\'Escape\')cancelEdit()">'+
        '<button class="btn-save" onclick="saveProfile()">Guardar</button>'+
        '<button class="btn-ghost" onclick="cancelEdit()">Cancelar</button>'+
      '</div>'+
      '<div class="sec">Mi club y equipos</div>'+
      '<div class="grid">'+
        '<div class="card"><h3>Mi club</h3>'+
          '<div class="club-line">'+badgeSm+'<b>'+clubTxt+'</b></div>'+
          '<p>Es el club desde el que se lee toda la plataforma: tus estadísticas, scouting y quintetos quedan vinculados a él.</p>'+
        '</div>'+
        '<div class="card"><h3>Mis equipos</h3>'+
          (club?('<div class="team-row">'+badgeSm+'<span class="tn">'+club+'</span></div>'):'<p>Todavía no asignaste un club. Editá tu perfil para sumarlo.</p>')+
          '<div class="note">Por ahora tu perfil maneja un club. Si llevás varias categorías (U16, U18, primera…), avisanos y las sumamos acá.</div>'+
        '</div>'+
        '<div class="card"><h3>Sesión</h3>'+
          '<p>Ingresaste como <b style="color:var(--text)">'+(EMAIL||'—')+'</b>.</p>'+
          '<div class="actions">'+
            '<button class="act-btn danger" onclick="authLogout()">Cerrar sesión / entrar con otro usuario</button>'+
          '</div>'+
        '</div>'+
        adminCard+
      '</div>';
  }

  window.startEdit=function(){var e=$('editor');if(e)e.style.display='flex';var n=$('ed-name');if(n)setTimeout(()=>n.focus(),0);};
  window.cancelEdit=function(){var e=$('editor');if(e)e.style.display='none';};
  window.saveProfile=async function(){
    const nombre=(($('ed-name')&&$('ed-name').value)||'').trim();
    const club=(($('ed-club')&&$('ed-club').value)||'').trim();
    if(!nombre){if($('ed-name'))$('ed-name').focus();return;}
    const btns=document.querySelectorAll('.btn-save,.btn-ghost');btns.forEach(b=>b.disabled=true);
    try{if(sb)await sb.auth.updateUser({data:{full_name:nombre,club:club}});}catch(e){}
    writeCoach(nombre,club);
    btns.forEach(b=>b.disabled=false);
    const {data}=await sb.auth.getUser();
    renderProfile((data&&data.user)||{email:EMAIL,user_metadata:{full_name:nombre,club:club}});
  };

  function boot(){
    if(!sb){showGate();setMsg('No se pudo conectar al servidor. Revisá tu conexión y recargá.','err');return;}
    showGate();
    sb.auth.getSession().then(({data})=>{if(data&&data.session){hideGate();renderProfile(data.session.user);}});
    sb.auth.onAuthStateChange((ev,session)=>{if(session){hideGate();renderProfile(session.user);}else showGate();});
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
})();
</script>
<script src="scoutpro-nav.js"></script>
</body>
</html>
