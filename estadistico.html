<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estadístico · Equipos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=DM+Mono:wght@400;500&family=Barlow+Condensed:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg-base:#08090d;--bg-raised:#0f1117;--bg-panel:#161820;--bg-hover:#1e202a;
  --border-subtle:rgba(255,255,255,0.05);--border-light:rgba(255,255,255,0.09);--border-strong:rgba(255,255,255,0.18);
  --offense:#f97316;--offense-bg:rgba(249,115,22,0.10);--offense-mid:rgba(249,115,22,0.22);
  --defense:#4f8ef7;--defense-bg:rgba(79,142,247,0.10);--defense-mid:rgba(79,142,247,0.22);
  --positive:#34c769;--negative:#f05050;--insight:#a78bfa;
  --text:#d8dce8;--text-2:#8891a0;--text-3:#434b5a;
  --font-ui:'DM Sans',system-ui,sans-serif;--font-mono:'DM Mono',monospace;--font-disp:'Barlow Condensed',sans-serif;
  --sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--r-sm:3px;--r:5px;--r-lg:8px;--t-fast:100ms ease;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg-base);color:var(--text);font-family:var(--font-ui);font-size:13px;-webkit-font-smoothing:antialiased;min-height:100vh}
.topbar{display:flex;align-items:center;gap:var(--sp-3);padding:12px 20px;border-bottom:1px solid var(--border-light);background:var(--bg-raised);position:sticky;top:0;z-index:20}
.logo{font-family:var(--font-disp);font-weight:900;font-size:22px;letter-spacing:2px;line-height:1;flex-shrink:0}
.logo .a{color:var(--offense)}
.logo .v{font-family:var(--font-mono);font-size:8px;color:var(--text-3);letter-spacing:2px;margin-left:6px;border:1px solid var(--border-light);border-radius:var(--r-sm);padding:2px 6px;vertical-align:middle}
.tb-spacer{flex:1}
.tb-btn{background:var(--bg-panel);border:1px solid var(--border-light);border-radius:var(--r-sm);color:var(--text-2);font-family:var(--font-mono);font-size:10px;padding:7px 13px;cursor:pointer;transition:all var(--t-fast);white-space:nowrap;text-decoration:none;display:inline-block}
.tb-btn:hover{border-color:var(--offense);color:var(--offense)}
.tb-btn.qtos:hover{border-color:var(--insight);color:var(--insight)}
.wrap{max-width:1280px;margin:0 auto;padding:20px}
.controls{display:flex;gap:var(--sp-3);align-items:flex-end;flex-wrap:wrap;margin-bottom:var(--sp-4)}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-family:var(--font-mono);font-size:8px;letter-spacing:1px;color:var(--text-3);text-transform:uppercase}
.field select{background:var(--bg-raised);border:1px solid var(--border-light);border-radius:var(--r);padding:9px var(--sp-3);font-family:var(--font-ui);font-size:13px;color:var(--text);outline:none;min-width:180px;cursor:pointer}
.field select:focus{border-color:var(--offense)}
.tabs{display:flex;gap:4px;margin-bottom:var(--sp-4);border-bottom:1px solid var(--border-light)}
.tab{background:none;border:none;border-bottom:2px solid transparent;color:var(--text-3);font-family:var(--font-disp);font-weight:700;font-size:15px;letter-spacing:1px;text-transform:uppercase;padding:9px 16px;cursor:pointer;transition:all var(--t-fast);margin-bottom:-1px}
.tab:hover{color:var(--text-2)}
.tab.active{color:var(--offense);border-bottom-color:var(--offense)}
.view{display:none}.view.active{display:block}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:var(--sp-3);margin-bottom:var(--sp-4)}
.kpi{background:var(--bg-raised);border:1px solid var(--border-light);border-radius:var(--r-lg);padding:var(--sp-4)}
.kpi .v{font-family:var(--font-disp);font-weight:900;font-size:30px;line-height:1}
.kpi .k{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.6px;color:var(--text-2);text-transform:uppercase;margin-top:7px;font-weight:500}
.pos{color:var(--positive)}.neg{color:var(--negative)}.acc{color:var(--offense)}.def{color:var(--defense)}
.sec{font-family:var(--font-disp);font-weight:800;font-size:15px;letter-spacing:.4px;text-transform:uppercase;color:var(--text);margin:var(--sp-5) 0 var(--sp-3);display:flex;align-items:center;gap:10px}
.sec::before{content:"";width:3px;height:16px;background:var(--offense);border-radius:2px;flex-shrink:0}
.sec::after{content:'';flex:1;height:1px;background:var(--border-subtle)}
.board{background:var(--bg-raised);border:1px solid var(--border-light);border-radius:var(--r-lg);overflow:hidden;margin-bottom:var(--sp-4)}
.board-title{font-family:var(--font-disp);font-weight:700;font-size:15px;letter-spacing:.5px;color:var(--offense);padding:var(--sp-3) var(--sp-4);border-bottom:1px solid var(--border-subtle)}
.tblwrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse}
table.t thead tr{background:var(--bg-panel)}
table.t th{font-family:var(--font-mono);font-size:8px;letter-spacing:.8px;color:var(--text-2);padding:10px var(--sp-2);text-align:right;text-transform:uppercase;border-bottom:1px solid var(--border-light);font-weight:500;white-space:nowrap}
table.t th.l{text-align:left}
table.t th.s{cursor:pointer;user-select:none}
table.t th.s:hover{color:var(--text)}
table.t th.sorted{color:var(--offense);background:rgba(249,115,22,0.07)}
table.t td{padding:8px var(--sp-2);border-bottom:1px solid var(--border-subtle);font-family:var(--font-mono);font-size:10px;text-align:right;white-space:nowrap}
table.t td.l{text-align:left}
table.t td.active{color:var(--text);background:rgba(249,115,22,0.05)}
table.t tr:hover td{background:var(--bg-hover)}
.pchip{font-family:var(--font-mono);font-size:9px;color:var(--text);background:var(--bg-base);border:1px solid var(--border-subtle);border-radius:var(--r-sm);padding:2px 6px 2px 3px;display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.pchip .pn{font-family:var(--font-mono);font-size:8px;font-weight:500;color:#000;background:var(--offense);border-radius:2px;padding:0 3px}
.rank{color:var(--text-3)}
.empty{text-align:center;color:var(--text-2);font-family:var(--font-mono);font-size:12px;line-height:1.8;padding:60px 20px}
.empty b{color:var(--offense)}
.chartbox{background:var(--bg-raised);border:1px solid var(--border-light);border-radius:var(--r-lg);padding:var(--sp-4);margin-bottom:var(--sp-4)}
.legend{display:flex;gap:var(--sp-4);font-family:var(--font-mono);font-size:9px;color:var(--text-2);margin-top:var(--sp-2)}
.legend i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.lid-toggle{display:flex;gap:6px;margin-bottom:var(--sp-4)}
.lid-toggle button{background:var(--bg-panel);border:1px solid var(--border-subtle);border-radius:var(--r-sm);color:var(--text-3);font-family:var(--font-mono);font-size:10px;padding:7px 16px;cursor:pointer;transition:all var(--t-fast)}
.lid-toggle button.on{border-color:var(--offense);color:var(--offense);background:var(--offense-bg)}
.lb-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:var(--sp-3);margin-bottom:var(--sp-5)}
.lb-card{background:var(--bg-raised);border:1px solid var(--border-light);border-radius:var(--r-lg);padding:var(--sp-3) var(--sp-4) var(--sp-4)}
.lb-title{font-family:var(--font-disp);font-weight:800;font-size:16px;letter-spacing:.5px;margin-bottom:var(--sp-3);display:flex;align-items:center;gap:7px}
.lb-title .dot{width:8px;height:8px;border-radius:2px}
.lb-row{display:flex;align-items:center;gap:var(--sp-2);margin-bottom:8px}
.lb-rank{font-family:var(--font-mono);font-size:9px;color:var(--text-3);width:12px;flex-shrink:0}
.lb-name{font-family:var(--font-ui);font-size:12px;color:var(--text);width:138px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0}
.lb-name small{color:var(--text-3);font-family:var(--font-mono);font-size:8px;margin-left:4px}
.lb-track{flex:1;height:9px;background:var(--bg-panel);border-radius:2px;overflow:hidden}
.lb-fill{height:100%;border-radius:2px;transition:width .3s}
.lb-val{font-family:var(--font-disp);font-weight:800;font-size:16px;width:46px;text-align:right;flex-shrink:0}
.shot-wrap{display:grid;grid-template-columns:minmax(260px,1fr) minmax(220px,300px);gap:var(--sp-4);align-items:start}
@media(max-width:720px){.shot-wrap{grid-template-columns:1fr}}
.court-box{background:var(--bg-raised);border:1px solid var(--border-light);border-radius:var(--r-lg);padding:var(--sp-3)}
.court-svg{width:100%;height:auto;display:block}
.court-line{fill:none;stroke:rgba(255,255,255,.18);stroke-width:1}
.court-fill{fill:rgba(255,255,255,.02)}
.shot-made{fill:#34c769;fill-opacity:.85}
.shot-miss{fill:none;stroke:#f05050;stroke-width:1.4;stroke-opacity:.8}
.tiros-ctl{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:var(--sp-4);align-items:center}
.tiros-ctl select{background:var(--bg-panel);border:1px solid var(--border-subtle);border-radius:var(--r-sm);color:var(--text);font-family:var(--font-ui);font-size:13px;padding:7px 12px}
.zone-row{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--border-subtle)}
.zone-row:last-child{border-bottom:none}
.zone-lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:1px;color:var(--text-2);text-transform:uppercase;font-weight:500}
.zone-val{font-family:var(--font-disp);font-weight:800;font-size:18px}
.tramo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--sp-3)}
@media(max-width:600px){.tramo-grid{grid-template-columns:1fr}}
.tramo-card{background:var(--bg-raised);border:1px solid var(--border-light);border-radius:var(--r-lg);padding:var(--sp-3) var(--sp-4)}
.tramo-card .lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:1px;color:var(--text-2);text-transform:uppercase;font-weight:500}
.tramo-card .big{font-family:var(--font-disp);font-weight:900;font-size:28px;line-height:1;margin:6px 0 3px}
.tramo-card .sub{font-family:var(--font-mono);font-size:10px;color:var(--text-2)}
.tramo-bar{height:6px;background:var(--bg-panel);border-radius:2px;overflow:hidden;margin-top:9px}
.tramo-fill{height:100%;border-radius:2px}
.zone-sub{font-family:var(--font-mono);font-size:10.5px;color:var(--text-2);margin-left:6px}
</style>
</head>
<body>
<div class="topbar">
  <div class="logo"><span class="a">ESTADÍSTICO</span><span class="v">EQUIPOS</span></div>
  <div class="tb-spacer"></div>
  <a class="tb-btn qtos" href="quintetos.html">🔄 Quintetos</a>
  <a class="tb-btn" href="index.html">🏠 Menú</a>
  <button class="tb-btn" onclick="loadData()">↻ Actualizar</button>
</div>

<div class="wrap">
  <div class="controls" id="controls" style="display:none">
    <div class="field"><label>Equipo</label><select id="selTeam" onchange="renderAll()"></select></div>
    <div class="field"><label>Fase</label><select id="selFase" onchange="renderAll()"><option value="">Todas</option></select></div>
  </div>

  <div class="tabs" id="tabs" style="display:none">
    <button class="tab active" data-v="dashboard" onclick="switchView('dashboard')">Dashboard</button>
    <button class="tab" data-v="lideres" onclick="switchView('lideres')">Líderes</button>
    <button class="tab" data-v="tiros" onclick="switchView('tiros')">Tiros</button>
    <button class="tab" data-v="correl" onclick="switchView('correl')">Correlaciones</button>
    <button class="tab" data-v="cuartos" onclick="switchView('cuartos')">Cuartos</button>
    <button class="tab" data-v="equipo" onclick="switchView('equipo')">Equipo</button>
    <button class="tab" data-v="comparar" onclick="switchView('comparar')">Comparar</button>
    <button class="tab" data-v="jugadores" onclick="switchView('jugadores')">Jugadores</button>
    <button class="tab" data-v="evolucion" onclick="switchView('evolucion')">Evolución</button>
  </div>

  <div class="view active" id="view-dashboard"></div>
  <div class="view" id="view-lideres"></div>
  <div class="view" id="view-tiros"></div>
  <div class="view" id="view-correl"></div>
  <div class="view" id="view-cuartos"></div>
  <div class="view" id="view-equipo"></div>
  <div class="view" id="view-comparar"></div>
  <div class="view" id="view-jugadores"></div>
  <div class="view" id="view-evolucion"></div>

  <div id="msg" class="empty">Cargando datos…</div>
</div>

<script>
const SB_CFG={url:'https://jqudeomgafqilqmqcqzg.supabase.co',key:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpxdWRlb21nYWZxaWxxbXFjcXpnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyNjY1MTQsImV4cCI6MjA5NTg0MjUxNH0.0tl4jVOnuOE8DxTOQfGF2qirCeMIKRdv5RCZ0dGzBl8'};
let sb=null,DATA=[],PLAYERS=[],SHOTS=[],QUARTERS=[];
function getSB(){if(!sb&&window.supabase)sb=window.supabase.createClient(SB_CFG.url,SB_CFG.key);return sb;}

function pkey(p){return (p.num||'')+'|'+String(p.name||'').toLowerCase().replace(/[\s.,]/g,'');}
function num(x){return +x||0;}

async function loadData(){
  const m=document.getElementById('msg');m.style.display='block';m.textContent='Cargando datos…';
  const c=getSB();
  if(!c){m.innerHTML='No se pudo conectar a la base.';return;}
  try{
    const {data,error}=await c.from('quintetos_log').select('*').limit(8000);
    if(error)throw error;
    DATA=(data||[]).map(r=>({...r,jugadores:Array.isArray(r.jugadores)?r.jugadores:(r.jugadores?JSON.parse(r.jugadores):[])}));
    // Box score de jugadores (best-effort: si no existe la tabla, queda vacío)
    try{ const pr=await c.from('jugadores_log').select('*').limit(20000); PLAYERS=pr.error?[]:(pr.data||[]); }
    catch(_){ PLAYERS=[]; }
    try{ const tr=await c.from('tiros_log').select('*').limit(40000); SHOTS=tr.error?[]:(tr.data||[]); }
    catch(_){ SHOTS=[]; }
    try{ const cr=await c.from('cuartos_log').select('*').limit(20000); QUARTERS=cr.error?[]:(cr.data||[]); }
    catch(_){ QUARTERS=[]; }
    if(!DATA.length){
      m.innerHTML='Todavía no hay partidos guardados.<br>Andá a <b>Quintetos</b>, cargá un partido y tocá <b>Guardar partido</b>.<br>Cuando guardes uno, refrescá esta página.';
      document.getElementById('controls').style.display='none';
      document.getElementById('tabs').style.display='none';
      return;
    }
    m.style.display='none';
    document.getElementById('controls').style.display='flex';
    document.getElementById('tabs').style.display='flex';
    buildSelectors();
    renderAll();
  }catch(e){ m.innerHTML='Error al leer la base: '+(e.message||e); }
}

function buildSelectors(){
  const teams=[...new Set(DATA.map(r=>r.equipo))].sort();
  const fases=[...new Set(DATA.map(r=>r.fase).filter(Boolean))].sort();
  const st=document.getElementById('selTeam'),sf=document.getElementById('selFase');
  const cur=st.value;
  st.innerHTML=teams.map(t=>'<option>'+t+'</option>').join('');
  if(teams.includes(cur))st.value=cur;
  sf.innerHTML='<option value="">Todas</option>'+fases.map(f=>'<option>'+f+'</option>').join('');
}

// ── agregación ──
function agg(rows){
  const a={min:0,ptsF:0,ptsC:0,pos:0,posRiv:0,pt2c:0,pt2i:0,pt3c:0,pt3i:0,tlc:0,tli:0,ast:0,rob:0,per:0,rd:0,ro:0,matches:new Set()};
  for(const r of rows){
    a.min+=num(r.minutos);a.ptsF+=num(r.pts_favor);a.ptsC+=num(r.pts_contra);
    a.pos+=num(r.pos);a.posRiv+=num(r.pos_riv);
    a.pt2c+=num(r.pt2c);a.pt2i+=num(r.pt2i);a.pt3c+=num(r.pt3c);a.pt3i+=num(r.pt3i);
    a.tlc+=num(r.tlc);a.tli+=num(r.tli);
    a.ast+=num(r.ast);a.rob+=num(r.rob);a.per+=num(r.per);a.rd+=num(r.reb_def);a.ro+=num(r.reb_off);
    if(r.match_id)a.matches.add(r.match_id);
  }
  a.diff=a.ptsF-a.ptsC;
  a.efOff=a.pos>0?a.ptsF/a.pos:0;
  a.efDef=a.posRiv>0?a.ptsC/a.posRiv:0;
  a.pj=a.matches.size;
  a.fga=a.pt2i+a.pt3i;a.fgm=a.pt2c+a.pt3c;
  a.efg=a.fga>0?Math.round((a.fgm+0.5*a.pt3c)/a.fga*1000)/10:0;            // eFG%
  a.ts=(a.fga+0.44*a.tli)>0?Math.round(a.ptsF/(2*(a.fga+0.44*a.tli))*1000)/10:0; // True Shooting %
  return a;
}
function teamRows(team){const f=document.getElementById('selFase').value;return DATA.filter(r=>r.equipo===team&&(!f||r.fase===f));}
function allRowsFiltered(){const f=document.getElementById('selFase').value;return DATA.filter(r=>!f||r.fase===f);}

// ── tabla ordenable genérica ──
const sortState={};
function sortableTable(elId,title,cols,rows,stateKey){
  if(!sortState[stateKey])sortState[stateKey]={key:cols.find(c=>c.sortable).key,dir:-1};
  const ss=sortState[stateKey];
  const col=cols.find(c=>c.key===ss.key)||cols[0];
  const arrow=ss.dir<0?'▼':'▲';
  let sorted=rows.slice();
  if(col.val)sorted.sort((x,y)=>(col.val(x)-col.val(y))*ss.dir);
  const head=cols.map(c=>{
    const on=c.key===ss.key&&c.sortable;
    const cls=(c.left?'l ':'')+(c.sortable?'s ':'')+(on?'sorted':'');
    return '<th class="'+cls+'"'+(c.sortable?' onclick="doSort(\''+stateKey+'\',\''+c.key+'\')"':'')+'>'+c.label+(on?' '+arrow:'')+'</th>';
  }).join('');
  const body=sorted.map((r,i)=>'<tr>'+cols.map(c=>{
    const active=c.key===ss.key&&c.sortable;
    const cls=(c.left?'l ':'')+(active?'active':'');
    const st=c.color?(' style="color:'+c.color(r)+'"'):'';
    return '<td class="'+cls+'"'+st+'>'+c.cell(r,i)+'</td>';
  }).join('')+'</tr>').join('');
  return '<div class="board"><div class="board-title">'+title+'</div><div class="tblwrap"><table class="t"><thead><tr>'+head+'</tr></thead><tbody>'+body+'</tbody></table></div></div>';
}
function doSort(stateKey,key){const s=sortState[stateKey];if(s.key===key)s.dir*=-1;else{s.key=key;s.dir=-1;}renderAll();}
function chips(players){return players.map(p=>'<span class="pchip"><span class="pn">'+(p.num||'·')+'</span>'+p.name+'</span>').join(' ');}
function dc(v){return v>0?'var(--positive)':v<0?'var(--negative)':'var(--text-3)';}
function sgn(v){return (v>0?'+':'')+v;}
function pp(v){return (Number(v)||0).toFixed(2);}
function sgn2(v){const n=Number(v)||0;return (n>0?'+':'')+n.toFixed(2);}

// ── VISTA DASHBOARD (LIGA) ──
function matchReboundIndex(rows){
  const matches={};
  for(const r of rows){const mid=r.match_id||'?';(matches[mid]=matches[mid]||{});(matches[mid][r.equipo]=matches[mid][r.equipo]||{ro:0,rd:0});matches[mid][r.equipo].ro+=num(r.reb_off);matches[mid][r.equipo].rd+=num(r.reb_def);}
  return matches;
}
function leagueTeamStats(){
  const rows=allRowsFiltered();
  const matches=matchReboundIndex(rows);
  const teamNames=[...new Set(rows.map(r=>r.equipo))];
  return teamNames.map(t=>{
    const tr=rows.filter(r=>r.equipo===t);
    const a=agg(tr);
    let orbN=0,orbD=0,drbN=0,drbD=0;
    for(const mid of new Set(tr.map(r=>r.match_id))){
      const mt=matches[mid];if(!mt)continue;const me=mt[t]||{ro:0,rd:0};
      let rro=0,rrd=0;for(const rn of Object.keys(mt)){if(rn!==t){rro+=mt[rn].ro;rrd+=mt[rn].rd;}}
      orbN+=me.ro;orbD+=me.ro+rrd;drbN+=me.rd;drbD+=me.rd+rro;
    }
    a.orbPct=orbD>0?Math.round(orbN/orbD*100):0;
    a.drbPct=drbD>0?Math.round(drbN/drbD*100):0;
    a.pace=a.pj>0?Math.round(a.pos/a.pj*10)/10:0;
    a.net=a.efOff-a.efDef;
    a.fga=a.pt2i+a.pt3i;a.fgm=a.pt2c+a.pt3c;
    a.fgPct=a.fga>0?Math.round(a.fgm/a.fga*1000)/10:0;
    a.threeVol=a.fga>0?Math.round(a.pt3i/a.fga*1000)/10:0;
    a.threePct=a.pt3i>0?Math.round(a.pt3c/a.pt3i*1000)/10:0;
    a.astPos=a.pos>0?a.ast/a.pos:0;
    a.astTo=a.per>0?a.ast/a.per:0;
    a.astRob=a.rob>0?a.ast/a.rob:0;
    return {team:t,a};
  });
}
function leagueLineups(){
  const rows=allRowsFiltered();const groups={};
  for(const r of rows){if(!r.jugadores||r.jugadores.length!==5)continue;const key=r.equipo+'#'+(r.jugadores_key||pkeyArr(r.jugadores));(groups[key]=groups[key]||{team:r.equipo,players:r.jugadores,rows:[]}).rows.push(r);}
  let lus=Object.values(groups).map(g=>{const a=agg(g.rows);return {team:g.team,players:g.players,a,net:a.min>0?Math.round(a.diff/a.min*40*10)/10:0};});
  let f=lus.filter(l=>l.a.min>=10);
  if(f.length<5)f=lus.filter(l=>l.a.min>=4);
  if(f.length<5)f=lus;
  return f;
}

function evoChart(list){
  if(list.length<2)return '<div class="chartbox"><div class="empty" style="padding:20px">Necesitás al menos 2 partidos guardados para ver la evolución.</div></div>';
  const W=Math.max(420,list.length*70),H=200,pad=30;
  const vals=list.map(g=>g.a.diff);const mx=Math.max(5,...vals.map(Math.abs));
  const x=i=>pad+i*(W-2*pad)/(list.length-1);
  const y=v=>H/2-(v/mx)*(H/2-pad);
  let path='',dots='';
  list.forEach((g,i)=>{const px=x(i),py=y(g.a.diff);path+=(i?'L':'M')+px+' '+py+' ';dots+='<circle cx="'+px+'" cy="'+py+'" r="3.5" fill="'+(g.a.diff>=0?'#34c769':'#f05050')+'"/>';});
  let labels='';list.forEach((g,i)=>{labels+='<text x="'+x(i)+'" y="'+(H-8)+'" fill="#434b5a" font-family="DM Mono,monospace" font-size="8" text-anchor="middle">'+(g.rival||'').slice(0,6)+'</text>';});
  return '<div class="chartbox"><div class="board-title" style="border:none;padding:0 0 10px">+/- por partido</div>'+
    '<div style="overflow-x:auto"><svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">'+
    '<line x1="'+pad+'" y1="'+(H/2)+'" x2="'+(W-pad)+'" y2="'+(H/2)+'" stroke="rgba(255,255,255,0.10)" stroke-dasharray="3 3"/>'+
    '<path d="'+path+'" fill="none" stroke="#f97316" stroke-width="2"/>'+dots+labels+'</svg></div>'+
    '<div class="legend"><span><i style="background:#f97316"></i>Diferencial (+/-) por partido</span></div></div>';
}

function shotMade(s){return s.made===true||s.made==='true'||+s.made===1;}
function foldShot(s){let fx=+s.x,fy=+s.y;if(!isFinite(fx)||!isFinite(fy))return null;if(fx>50){fx=100-fx;fy=100-fy;}return{fx,fy,made:shotMade(s),tipo:s.tipo};}
const HEAT_ZONES={
  pint:[44,75], mizq:[60,48], mder:[60,102],
  tizq:[34,24], tcen:[98,75], tder:[34,126]
};
function heatZone(f){
  if(f.tipo==='3pt'){ if(f.fy<40)return 'tizq'; if(f.fy>60)return 'tder'; return 'tcen'; }
  if(f.fx<21&&Math.abs(f.fy-50)<17)return 'pint';
  return f.fy<50?'mizq':'mder';
}
function ppsColor(pps){
  if(pps>=1.30)return '#34c769';
  if(pps>=1.10)return '#7bc96f';
  if(pps>=0.95)return '#e0a83b';
  if(pps>=0.80)return '#f97316';
  return '#f05050';
}

function courtHeatSVG(shots){
  const dots=shots.map(s=>{const x=+s.x,y=+s.y;if(!isFinite(x)||!isFinite(y))return'';
    const cx=(x/100*280).toFixed(1),cy=(y/100*150).toFixed(1);
    return shotMade(s)?'<circle cx="'+cx+'" cy="'+cy+'" r="1.7" fill="#34c769" fill-opacity="0.26"/>'
                      :'<circle cx="'+cx+'" cy="'+cy+'" r="1.7" fill="none" stroke="#f05050" stroke-opacity="0.24" stroke-width="0.8"/>';
  }).join('');
  const buckets={};Object.keys(HEAT_ZONES).forEach(k=>buckets[k]=[]);
  shots.map(foldShot).filter(Boolean).forEach(f=>{const z=heatZone(f);if(buckets[z])buckets[z].push(f);});
  let bubbles='';
  Object.keys(HEAT_ZONES).forEach(k=>{
    const arr=buckets[k];if(!arr.length)return;
    const m=arr.filter(f=>f.made).length,a=arr.length,pct=Math.round(m/a*100);
    const pps=(k[0]==='t'?3:2)*pct/100, col=ppsColor(pps);
    const r=Math.min(8,3+Math.sqrt(a)*1.0), z=HEAT_ZONES[k];
    [[z[0],z[1]],[280-z[0],z[1]]].forEach(c=>{const cx=c[0],cy=c[1];
      bubbles+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r.toFixed(1)+'" fill="'+col+'" fill-opacity="0.24" stroke="'+col+'" stroke-width="0.7"/>'+
        '<text x="'+cx+'" y="'+(cy-0.6)+'" fill="#fff" font-family="Barlow Condensed,sans-serif" font-weight="800" font-size="5" text-anchor="middle">'+pct+'%</text>'+
        '<text x="'+cx+'" y="'+(cy+3.7)+'" fill="#cfd5e3" font-family="DM Mono,monospace" font-size="3" text-anchor="middle">'+m+'/'+a+'</text>';
    });
  });
  return '<svg class="court-svg" viewBox="0 0 280 150" xmlns="http://www.w3.org/2000/svg">'+fullCourtLines()+dots+bubbles+'</svg>';
}
function courtSVGFull(shots){
  const dots=shots.map(s=>{
    const x=+s.x,y=+s.y;if(!isFinite(x)||!isFinite(y))return'';
    const cx=(x/100*280).toFixed(1),cy=(y/100*150).toFixed(1);
    return shotMade(s)?'<circle class="shot-made" cx="'+cx+'" cy="'+cy+'" r="2.2"/>'
                      :'<circle class="shot-miss" cx="'+cx+'" cy="'+cy+'" r="2.2"/>';
  }).join('');
  return '<svg class="court-svg" viewBox="0 0 280 150" xmlns="http://www.w3.org/2000/svg">'+fullCourtLines()+dots+'</svg>';
}

let corrLevel='game',corrX='ts',corrY='efOff';
function setCorr(which,v){if(which==='lvl')corrLevel=v;if(which==='x')corrX=v;if(which==='y')corrY=v;renderCorrel();}
const CORR_METRICS=[
  {key:'efg',label:'eFG%'},
  {key:'ts',label:'TS% (True Shooting)'},
  {key:'threeVol',label:'Volumen de 3 (%)'},
  {key:'orbPct',label:'REB.OF%'},
  {key:'drbPct',label:'REB.DEF%'},
  {key:'pos',label:'Posesiones',cnt:1},
  {key:'efOff',label:'EF.OF (pts/pos)'},
  {key:'efDef',label:'EF.DEF (pts/pos)'},
  {key:'ast',label:'Asistencias',cnt:1},
  {key:'astPos',label:'AST / POS'},
  {key:'astTo',label:'AST / PÉR'},
  {key:'per',label:'Pérdidas',cnt:1},
  {key:'rob',label:'Robos',cnt:1},
  {key:'ptsF',label:'Puntos a favor',cnt:1},
  {key:'ptsC',label:'Puntos en contra',cnt:1}
];
function metricVal(a,key){const meta=CORR_METRICS.find(m=>m.key===key);let v=num(a[key]);if(meta&&meta.cnt)v=v/(a.pj||1);return v;}
function teamColor(name){const pal=['#f97316','#4f8ef7','#34c769','#a78bfa','#e0a83b','#f05050','#22d3ee','#ec4899','#84cc16','#fb923c'];name=String(name||'');let h=0;for(let i=0;i<name.length;i++)h=(h*31+name.charCodeAt(i))>>>0;return pal[h%pal.length];}
function teamGameStats(){
  const rows=allRowsFiltered();
  const matches=matchReboundIndex(rows);
  const g={};
  for(const r of rows){const k=(r.match_id||'?')+'|'+r.equipo;(g[k]=g[k]||{match_id:r.match_id,equipo:r.equipo,fecha:r.fecha,rows:[]}).rows.push(r);}
  const out=[];
  for(const k in g){
    const e=g[k];const a=agg(e.rows);
    const mt=matches[e.match_id]||{};const me=mt[e.equipo]||{ro:0,rd:0};
    let rro=0,rrd=0;for(const rn of Object.keys(mt)){if(rn!==e.equipo){rro+=mt[rn].ro;rrd+=mt[rn].rd;}}
    a.orbPct=(me.ro+rrd)>0?Math.round(me.ro/(me.ro+rrd)*100):0;
    a.drbPct=(me.rd+rro)>0?Math.round(me.rd/(me.rd+rro)*100):0;
    a.fga=a.pt2i+a.pt3i;a.fgm=a.pt2c+a.pt3c;
    a.fgPct=a.fga>0?Math.round(a.fgm/a.fga*1000)/10:0;
    a.threeVol=a.fga>0?Math.round(a.pt3i/a.fga*1000)/10:0;
    a.astPos=a.pos>0?a.ast/a.pos:0;a.astTo=a.per>0?a.ast/a.per:0;a.astRob=a.rob>0?a.ast/a.rob:0;
    out.push({team:e.equipo,label:e.equipo.slice(0,3).toUpperCase()+(e.fecha?' '+String(e.fecha).slice(5):''),a});
  }
  return out;
}
function scatterSVG(pts,xlabel,ylabel,showLabels,hl){
  const W=480,H=318,M={l:56,r:20,t:16,b:52};
  const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y);
  let xmin=Math.min(...xs),xmax=Math.max(...xs),ymin=Math.min(...ys),ymax=Math.max(...ys);
  if(xmin===xmax){xmin-=1;xmax+=1;}if(ymin===ymax){ymin-=1;ymax+=1;}
  const xp=(xmax-xmin)*0.1,yp=(ymax-ymin)*0.12;
  const x0=xmin-xp,x1=xmax+xp,y0=ymin-yp,y1=ymax+yp;
  const sx=v=>M.l+(v-x0)/(x1-x0)*(W-M.l-M.r);
  const sy=v=>H-M.b-(v-y0)/(y1-y0)*(H-M.t-M.b);
  const n=pts.length,mx=xs.reduce((s,v)=>s+v,0)/n,my=ys.reduce((s,v)=>s+v,0)/n;
  let sxy=0,sxx=0,syy=0;pts.forEach(p=>{sxy+=(p.x-mx)*(p.y-my);sxx+=(p.x-mx)**2;syy+=(p.y-my)**2;});
  const slope=sxx?sxy/sxx:0,intercept=my-slope*mx,r=(sxx&&syy)?sxy/Math.sqrt(sxx*syy):0;
  const fmt=v=>Math.abs(v)>=100?Math.round(v):Math.abs(v)>=10?Math.round(v*10)/10:Math.round(v*100)/100;
  // fondo neutro, sin líneas de promedio ni cuadrantes
  const quad='<rect x="'+M.l+'" y="'+M.t+'" width="'+(W-M.l-M.r)+'" height="'+(H-M.t-M.b)+'" fill="rgba(255,255,255,0.012)"/>';
  const means='';
  let grid='';
  for(let i=0;i<=4;i++){
    const vx=x0+(x1-x0)*i/4,vy=y0+(y1-y0)*i/4;
    grid+='<line x1="'+sx(vx).toFixed(1)+'" y1="'+M.t+'" x2="'+sx(vx).toFixed(1)+'" y2="'+(H-M.b)+'" stroke="rgba(255,255,255,0.05)"/>'+
      '<line x1="'+M.l+'" y1="'+sy(vy).toFixed(1)+'" x2="'+(W-M.r)+'" y2="'+sy(vy).toFixed(1)+'" stroke="rgba(255,255,255,0.05)"/>'+
      '<text x="'+sx(vx).toFixed(1)+'" y="'+(H-M.b+15)+'" fill="#aeb4c2" font-size="9.5" text-anchor="middle" font-family="DM Mono,monospace">'+fmt(vx)+'</text>'+
      '<text x="'+(M.l-7)+'" y="'+(sy(vy)+3.5).toFixed(1)+'" fill="#aeb4c2" font-size="9.5" text-anchor="end" font-family="DM Mono,monospace">'+fmt(vy)+'</text>';
  }
  const ty0=intercept+slope*x0,ty1=intercept+slope*x1;
  const trend='<line x1="'+sx(x0).toFixed(1)+'" y1="'+sy(ty0).toFixed(1)+'" x2="'+sx(x1).toFixed(1)+'" y2="'+sy(ty1).toFixed(1)+'" stroke="#a78bfa" stroke-width="1.6" stroke-dasharray="5 4" stroke-opacity="0.9"/>';
  const dots=pts.map(p=>{
    const c=teamColor(p.team);
    const dim=hl&&p.team!==hl;
    const R=dim?3:(hl&&p.team===hl?5.2:4.2);
    const op=dim?0.18:0.95;
    const ring=(hl&&p.team===hl)?'<circle cx="'+sx(p.x).toFixed(1)+'" cy="'+sy(p.y).toFixed(1)+'" r="'+(R+2.6)+'" fill="none" stroke="'+c+'" stroke-opacity="0.45" stroke-width="1.2"/>':'';
    const lbl=(showLabels&&!dim)?'<text x="'+(sx(p.x)+7).toFixed(1)+'" y="'+(sy(p.y)+3.5).toFixed(1)+'" fill="#dde1ec" font-size="9" font-family="DM Sans,sans-serif" font-weight="600">'+p.label+'</text>':'';
    return ring+'<circle class="scpt" cx="'+sx(p.x).toFixed(1)+'" cy="'+sy(p.y).toFixed(1)+'" r="'+R+'" fill="'+c+'" fill-opacity="'+op+'" stroke="rgba(255,255,255,0.35)" stroke-width="0.6"><title>'+p.label+'\n'+xlabel+': '+fmt(p.x)+'\n'+ylabel+': '+fmt(p.y)+'</title></circle>'+lbl;
  }).join('');
  const titles='<text x="'+((M.l+W-M.r)/2)+'" y="'+(H-7)+'" fill="#d8dce8" font-size="11" text-anchor="middle" font-family="DM Mono,monospace" letter-spacing="0.5">'+xlabel+'</text>'+
    '<text x="15" y="'+((M.t+H-M.b)/2)+'" fill="#d8dce8" font-size="11" text-anchor="middle" font-family="DM Mono,monospace" letter-spacing="0.5" transform="rotate(-90 15 '+((M.t+H-M.b)/2)+')">'+ylabel+'</text>';
  const frame='<line x1="'+M.l+'" y1="'+M.t+'" x2="'+M.l+'" y2="'+(H-M.b)+'" stroke="rgba(255,255,255,0.22)"/><line x1="'+M.l+'" y1="'+(H-M.b)+'" x2="'+(W-M.r)+'" y2="'+(H-M.b)+'" stroke="rgba(255,255,255,0.22)"/>';
  return {svg:'<svg class="court-svg" viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">'+quad+grid+means+frame+trend+dots+titles+'</svg>',r,n};
}

  const ar=Math.abs(res.r);
  const fuerza=ar<0.2?'casi nula':ar<0.4?'débil':ar<0.6?'moderada':ar<0.8?'fuerte':'muy fuerte';

  const col=ar<0.2?'#8891a0':res.r>=0?'#34c769':'#f05050';
  const legend='<div class="zone-sub" style="margin-top:10px;display:flex;gap:14px;flex-wrap:wrap">'+
    teams.map((t,i)=>'<span style="cursor:pointer'+(corrHL&&corrHL!==t?';opacity:.4':'')+'" onclick="toggleCorrHL('+i+')"><i style="display:inline-block;width:9px;height:9px;border-radius:50%;background:'+teamColor(t)+';margin-right:5px;vertical-align:middle"></i>'+t+'</span>').join('')+'</div>';
  window.__corrTeams=teams;
  const panel='<div class="court-box" style="margin-top:14px">'+
    '<div class="zone-row"><span class="zone-lbl">Correlación (r)</span><span class="zone-val" style="color:'+col+'">'+res.r.toFixed(2)+'</span></div>'+
    '<div class="zone-row"><span class="zone-lbl">r² (varianza explicada)</span><span class="zone-val">'+Math.round(res.r*res.r*100)+'%</span></div>'+
    '<div class="zone-sub" style="margin-top:8px;color:#cfd5e3">'+interp+'</div>'+
    '<div class="zone-sub" style="margin-top:6px">'+res.n+' puntos · línea punteada violeta = tendencia · pasá el mouse por un punto para ver el detalle.</div></div>';
  el.innerHTML=presets+ctl+'<div class="sec">'+ylab+' vs '+xlab+'</div><div class="court-box">'+res.svg+legend+'</div>'+panel;
}

// ── VISTA CUARTOS (análisis por cuarto) ──
let cuartoTeam='';
function setCuartoTeam(v){cuartoTeam=v;renderCuartos();}
function qLabel(q){return q<=4?('Q'+q):('PR'+(q-4));}
function renderCuartos(){
  const el=document.getElementById('view-cuartos');
  const fase=document.getElementById('selFase').value;
  const rows=QUARTERS.filter(r=>!fase||r.fase===fase);
  if(!rows.length){
    el.innerHTML='<div class="empty">Todavía no hay datos por cuarto.<br>Necesitás crear la tabla <b>cuartos_log</b> (te paso el SQL) y <b>re-guardar</b> los partidos desde Quintetos.</div>';
    return;
  }
  const qs=[...new Set(rows.map(r=>num(r.cuarto)))].filter(q=>q>=1).sort((a,b)=>a-b);
  const cols=Math.min(qs.length,4);
  // A) promedio de puntos por cuarto (liga)
  const byQ={};qs.forEach(q=>byQ[q]={pf:0,pc:0,n:0});
  rows.forEach(r=>{const q=num(r.cuarto);if(byQ[q]){byQ[q].pf+=num(r.pts_favor);byQ[q].pc+=num(r.pts_contra);byQ[q].n++;}});
  const maxPf=Math.max(1,...qs.map(q=>byQ[q].n?byQ[q].pf/byQ[q].n:0));
  const aCards=qs.map(q=>{const b=byQ[q],pf=b.n?b.pf/b.n:0,w=Math.round(pf/maxPf*100);
    return '<div class="tramo-card"><div class="lbl">'+qLabel(q)+'</div><div class="big" style="color:#f97316">'+pf.toFixed(1)+'</div><div class="sub">pts/cuarto · '+(b.n?(b.pc/b.n).toFixed(1):'0')+' en contra</div><div class="tramo-bar"><div class="tramo-fill" style="width:'+w+'%;background:#f97316"></div></div></div>';
  }).join('');
  // B) ¿ganar el cuarto = ganar el partido?
  const g={};
  rows.forEach(r=>{const k=r.match_id+'|'+r.equipo;if(!g[k])g[k]={byQ:{},gd:0};g[k].byQ[num(r.cuarto)]=num(r.diff);g[k].gd+=num(r.diff);});
  const ents=Object.values(g);
  const bCards=qs.map(q=>{
    const won=ents.filter(e=>e.byQ[q]!==undefined&&e.byQ[q]>0);
    const pct=won.length?Math.round(won.filter(e=>e.gd>0).length/won.length*100):0;
    const col=pct>=65?'#34c769':pct>=50?'#e0a83b':'#f05050';
    return '<div class="tramo-card"><div class="lbl">Gana '+qLabel(q)+'</div><div class="big" style="color:'+col+'">'+pct+'%</div><div class="sub">gana el partido · '+won.length+' casos</div><div class="tramo-bar"><div class="tramo-fill" style="width:'+pct+'%;background:'+col+'"></div></div></div>';
  }).join('');
  // C) rendimiento por cuarto de un equipo
  const teams=[...new Set(rows.map(r=>r.equipo))].sort();
  if(cuartoTeam&&!teams.includes(cuartoTeam))cuartoTeam='';
  const teamSel='<div class="tiros-ctl"><span class="zone-lbl">Equipo</span><select onchange="setCuartoTeam(this.value)"><option value="">— Elegí un equipo —</option>'+teams.map(t=>'<option'+(t===cuartoTeam?' selected':'')+'>'+t+'</option>').join('')+'</select></div>';
  let teamBlock='';
  if(cuartoTeam){
    const tr=rows.filter(r=>r.equipo===cuartoTeam);
    const t={};qs.forEach(q=>t[q]={pf:0,pc:0,diff:0,n:0,w:0,l:0,e:0});
    tr.forEach(r=>{const q=num(r.cuarto),b=t[q];if(!b)return;b.pf+=num(r.pts_favor);b.pc+=num(r.pts_contra);b.diff+=num(r.diff);b.n++;const d=num(r.diff);if(d>0)b.w++;else if(d<0)b.l++;else b.e++;});
    const head='<tr><th style="text-align:left">Cuarto</th><th>PJ</th><th>PF</th><th>PC</th><th>DIF</th><th>Récord</th></tr>';
    const body=qs.map(q=>{const b=t[q];if(!b.n)return'';const dif=b.diff/b.n;
      return '<tr><td style="text-align:left"><b>'+qLabel(q)+'</b></td><td>'+b.n+'</td><td>'+(b.pf/b.n).toFixed(1)+'</td><td>'+(b.pc/b.n).toFixed(1)+'</td><td style="color:'+dc(dif)+'">'+sgn(Math.round(dif*10)/10)+'</td><td>'+b.w+'-'+b.l+(b.e?'-'+b.e:'')+'</td></tr>';}).join('');
    teamBlock='<div class="sec">'+cuartoTeam+' · rendimiento por cuarto</div><div class="board"><div class="tblwrap"><table class="t"><thead>'+head+'</thead><tbody>'+body+'</tbody></table></div></div>';
  }
  el.innerHTML='<div class="sec">Promedio de puntos por cuarto (liga)</div>'+
    '<div class="tramo-grid" style="grid-template-columns:repeat('+cols+',1fr)">'+aCards+'</div>'+
    '<div class="sec">¿Ganar el cuarto = ganar el partido?</div>'+
    '<div class="tramo-grid" style="grid-template-columns:repeat('+cols+',1fr)">'+bCards+'</div>'+
    teamSel+teamBlock;
}

function renderAll(){renderDashboard();renderLideres();renderTiros();renderCorrel();renderCuartos();renderEquipo();renderComparar();renderJugadores();renderEvolucion();}
function switchView(v){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.v===v));
  document.querySelectorAll('.view').forEach(el=>el.classList.remove('active'));
  document.getElementById('view-'+v).classList.add('active');
}
loadData();
</script>
