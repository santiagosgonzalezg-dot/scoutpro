<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Esfuerzo · ScoutPro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=DM+Mono:wght@400;500&family=Barlow+Condensed:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg-base:#08090d;--bg-raised:#0f1117;--bg-panel:#161820;--bg-hover:#1e202a;
  --border-subtle:rgba(255,255,255,0.05);--border-light:rgba(255,255,255,0.09);--border-strong:rgba(255,255,255,0.18);
  --offense:#f97316;--offense-bg:rgba(249,115,22,0.10);--offense-mid:rgba(249,115,22,0.22);
  --defense:#4f8ef7;--defense-bg:rgba(79,142,247,0.10);--defense-mid:rgba(79,142,247,0.22);
  --positive:#34c769;--negative:#f05050;--insight:#a78bfa;
  --text:#d8dce8;--text-2:#8891a0;--text-3:#434b5a;
  --font-ui:'DM Sans',system-ui,sans-serif;--font-mono:'DM Mono',monospace;--font-disp:'Barlow Condensed',sans-serif;
  --sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--r-sm:3px;--r:5px;--r-lg:8px;--t-fast:100ms ease;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg-base);color:var(--text);font-family:var(--font-ui);font-size:13px;-webkit-font-smoothing:antialiased;min-height:100vh}
.topbar{display:flex;align-items:center;gap:var(--sp-3);padding:12px 20px;border-bottom:1px solid var(--border-light);background:var(--bg-raised);position:sticky;top:0;z-index:20}
.logo{font-family:var(--font-disp);font-weight:900;font-size:22px;letter-spacing:2px;line-height:1;flex-shrink:0}
.logo .a{color:var(--offense)}
.logo .v{font-family:var(--font-mono);font-size:8px;color:var(--text-3);letter-spacing:2px;margin-left:6px;border:1px solid var(--border-light);border-radius:var(--r-sm);padding:2px 6px;vertical-align:middle}
.tb-spacer{flex:1}
.tb-btn{background:var(--bg-panel);border:1px solid var(--border-light);border-radius:var(--r-sm);color:var(--text-2);font-family:var(--font-mono);font-size:10px;padding:7px 13px;cursor:pointer;transition:all var(--t-fast);white-space:nowrap;text-decoration:none;display:inline-block}
.tb-btn:hover{border-color:var(--offense);color:var(--offense)}
.tb-btn.qtos:hover{border-color:var(--insight);color:var(--insight)}
.wrap{max-width:1180px;margin:0 auto;padding:var(--sp-5) 20px 80px}
.controls{display:flex;flex-wrap:wrap;gap:var(--sp-3);margin-bottom:var(--sp-4)}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-family:var(--font-mono);font-size:8px;letter-spacing:1px;color:var(--text-3);text-transform:uppercase}
.field select,.field input{background:var(--bg-raised);border:1px solid var(--border-light);border-radius:var(--r);padding:9px var(--sp-3);font-family:var(--font-ui);font-size:13px;color:var(--text);outline:none;min-width:150px;cursor:pointer}
.field input{cursor:text;font-family:var(--font-mono);font-size:12px}
.tabs{display:flex;gap:4px;margin-bottom:var(--sp-4);border-bottom:1px solid var(--border-light)}
.tab{background:none;border:none;border-bottom:2px solid transparent;color:var(--text-3);font-family:var(--font-mono);font-size:11px;letter-spacing:.5px;padding:10px 16px;cursor:pointer;transition:all var(--t-fast);margin-bottom:-1px}
.tab:hover{color:var(--text-2)}
.tab.active{color:var(--offense);border-bottom-color:var(--offense)}
.view{display:none}.view.active{display:block}
.sec{font-family:var(--font-disp);font-weight:700;font-size:16px;letter-spacing:.5px;color:var(--text);display:flex;align-items:center;gap:10px;margin:var(--sp-5) 0 var(--sp-3)}
.sec::after{content:'';flex:1;height:1px;background:var(--border-subtle)}
.zone-sub{font-family:var(--font-mono);font-size:11px;color:var(--text-2);line-height:1.6}
.kpis{display:flex;flex-wrap:wrap;gap:var(--sp-3);margin-bottom:var(--sp-4)}
.kpi{background:var(--bg-raised);border:1px solid var(--border-light);border-radius:var(--r-lg);padding:var(--sp-4);min-width:120px;flex:1}
.kpi .v{font-family:var(--font-disp);font-weight:800;font-size:26px;line-height:1}
.kpi .k{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.6px;color:var(--text-2);text-transform:uppercase;margin-top:7px;font-weight:500}
.v.acc{color:var(--offense)}.v.def{color:var(--defense)}.v.pos{color:var(--positive)}.v.neg{color:var(--negative)}.v.ins{color:var(--insight)}
.board{background:var(--bg-raised);border:1px solid var(--border-light);border-radius:var(--r-lg);overflow:hidden;margin-bottom:var(--sp-4)}
.board-title{font-family:var(--font-disp);font-weight:700;font-size:15px;letter-spacing:.5px;color:var(--offense);padding:var(--sp-3) var(--sp-4);border-bottom:1px solid var(--border-subtle)}
.tblwrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse}
table.t th{font-family:var(--font-mono);font-size:8px;letter-spacing:.8px;color:var(--text-2);padding:10px var(--sp-2);text-align:right;text-transform:uppercase;border-bottom:1px solid var(--border-light);font-weight:500;white-space:nowrap}
table.t th.l,table.t td.l{text-align:left}
table.t td{padding:8px var(--sp-2);border-bottom:1px solid var(--border-subtle);font-family:var(--font-mono);font-size:10.5px;text-align:right;white-space:nowrap}
table.t tbody tr:hover{background:var(--bg-hover)}
.pchip{font-family:var(--font-mono);font-size:9px;color:var(--text);background:var(--bg-base);border:1px solid var(--border-subtle);border-radius:var(--r-sm);padding:2px 7px 2px 3px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.pchip .pn{font-family:var(--font-mono);font-size:8px;font-weight:500;color:#000;background:var(--offense);border-radius:2px;padding:0 3px;min-width:14px;text-align:center}
.empty{text-align:center;color:var(--text-2);font-family:var(--font-mono);font-size:12px;line-height:1.8;padding:60px 20px}
.loadbox{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:80px 20px;color:var(--text-2);font-family:var(--font-mono);font-size:11px;letter-spacing:1px;text-transform:uppercase}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--border-strong);border-top-color:var(--offense);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* roster chips */
.roster{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 var(--sp-4)}
.rchip{background:var(--bg-panel);border:1px solid var(--border-light);border-radius:30px;padding:6px 12px 6px 6px;cursor:pointer;display:flex;align-items:center;gap:7px;transition:all var(--t-fast);font-size:12px}
.rchip:hover{border-color:var(--border-strong)}
.rchip.sel{border-color:var(--offense);background:var(--offense-bg)}
.rchip .pn{font-family:var(--font-mono);font-size:9px;font-weight:600;color:#000;background:var(--text-2);border-radius:3px;padding:1px 5px;min-width:18px;text-align:center}
.rchip.sel .pn{background:var(--offense)}
.rchip .tot{font-family:var(--font-mono);font-size:10px;color:var(--text-2);border-left:1px solid var(--border-light);padding-left:7px;margin-left:1px}
.rchip.sel .tot{color:var(--offense)}
/* barra de jugadores fija (sticky) para cambiar rápido sin perder el scroll */
.player-bar{position:sticky;top:var(--topbar-h,49px);z-index:9;display:flex;align-items:stretch;gap:6px;background:var(--bg-base);border-bottom:1px solid var(--border-light);padding:8px 0 9px;margin:0 0 12px}
.player-bar .pnav{flex:none;width:34px;border:1px solid var(--border-light);background:var(--bg-panel);color:var(--text-2);border-radius:9px;cursor:pointer;font-size:13px;transition:all var(--t-fast)}
.player-bar .pnav:hover{color:var(--offense);border-color:var(--offense)}
.pbtns{display:flex;gap:8px;overflow-x:auto;scroll-behavior:smooth;padding:2px;flex:1}
.pbtns::-webkit-scrollbar{height:6px}.pbtns::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:3px}
.pbtn{flex:none;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:78px;padding:8px 11px;border:1px solid var(--border-light);background:var(--bg-raised);border-radius:11px;cursor:pointer;transition:all var(--t-fast)}
.pbtn:hover{border-color:var(--border-strong);transform:translateY(-1px)}
.pbtn.sel{border-color:var(--offense);background:var(--offense-bg);box-shadow:0 0 0 1px var(--offense) inset}
.pbtn .pn{font-family:var(--font-mono);font-size:11px;font-weight:600;color:#000;background:var(--text-2);border-radius:4px;padding:1px 7px;min-width:22px;text-align:center}
.pbtn.sel .pn{background:var(--offense)}
.pbtn .pnm{font-size:12.5px;color:var(--text);max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbtn .pt{font-family:var(--font-mono);font-size:10px;color:var(--text-2)}
.pbtn.sel .pt{color:var(--offense);font-weight:600}
/* capture grid */
.side{border:1px solid var(--border-light);border-radius:var(--r-lg);overflow:hidden;margin-bottom:var(--sp-3)}
.side>summary{list-style:none;cursor:pointer;padding:11px 15px;font-family:var(--font-disp);font-weight:700;font-size:15px;letter-spacing:.5px;display:flex;align-items:center;gap:8px;background:var(--bg-raised)}
.side>summary::-webkit-details-marker{display:none}
.side.of>summary{color:var(--offense)}.side.df>summary{color:var(--defense)}
.side>summary::before{content:'▸';font-size:11px;color:var(--text-3);transition:transform var(--t-fast)}
.side[open]>summary::before{transform:rotate(90deg)}
.cat{padding:4px 15px 12px}
.cat-h{font-family:var(--font-mono);font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--text-3);margin:14px 0 6px;border-bottom:1px solid var(--border-subtle);padding-bottom:4px}
.met{display:flex;align-items:center;gap:10px;padding:5px 0}
.met-l{flex:1;font-size:12.5px;color:var(--text)}
.met-w{font-family:var(--font-mono);font-size:9px;color:var(--text-3);border:1px solid var(--border-subtle);border-radius:3px;padding:0 4px}
.step{display:flex;align-items:center;gap:0;background:var(--bg-base);border:1px solid var(--border-light);border-radius:6px;overflow:hidden}
.step button{width:30px;height:28px;background:none;border:none;color:var(--text-2);font-size:16px;cursor:pointer;font-family:var(--font-mono);transition:all var(--t-fast)}
.step button:hover{background:var(--bg-hover);color:var(--text)}
.step button.plus:hover{color:var(--positive)}
.step .val{min-width:30px;text-align:center;font-family:var(--font-mono);font-size:13px;font-weight:500}
.step .val.nz{color:var(--offense)}
.savebar{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg-base) 28%);padding:18px 0 4px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.btn-primary{background:var(--offense);border:none;border-radius:6px;color:#1a1205;font-family:var(--font-mono);font-size:12px;letter-spacing:.5px;padding:11px 22px;cursor:pointer;font-weight:600;transition:filter var(--t-fast)}
.btn-primary:hover{filter:brightness(1.08)}
.btn-ghost{background:var(--bg-panel);border:1px solid var(--border-light);border-radius:6px;color:var(--text-2);font-family:var(--font-mono);font-size:11px;padding:11px 16px;cursor:pointer}
.savemsg{font-family:var(--font-mono);font-size:11px}
.bar-wrap{display:inline-block;width:60px;height:6px;background:var(--bg-base);border-radius:3px;overflow:hidden;vertical-align:middle;margin-left:6px}
.bar{height:100%;background:var(--offense)}
.wedit{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 15px}
.wedit label{font-size:12px;color:var(--text-2);display:flex;align-items:center}
.wedit input{width:64px;background:var(--bg-base);border:1px solid var(--border-light);border-radius:5px;color:var(--text);font-family:var(--font-mono);font-size:12px;padding:5px 7px;text-align:right}
.note{background:rgba(167,139,250,.07);border:1px solid rgba(167,139,250,.25);border-radius:var(--r-lg);padding:12px 15px;font-size:12.5px;color:var(--text-2);line-height:1.6;margin-bottom:var(--sp-4)}
.note b{color:var(--insight)}
pre.sql{background:var(--bg-base);border:1px solid var(--border-subtle);border-radius:6px;padding:12px 14px;font-family:var(--font-mono);font-size:11.5px;color:var(--text);overflow-x:auto;margin:8px 0;line-height:1.5}
</style>
</head>
<body>
<div class="topbar">
  <div class="logo"><span class="a">ESFUERZO</span><span class="v">HUSTLE</span></div>
  <div class="tb-spacer"></div>
  <a class="tb-btn" href="estadistico.html">📊 Estadístico</a>
  <a class="tb-btn qtos" href="quintetos.html">🔄 Quintetos</a>
  <a class="tb-btn" href="index.html">🏠 Menú</a>
  <button class="tb-btn" id="btnReload" onclick="loadAll()">↻ Actualizar</button>
</div>

<div class="wrap">
  <div class="tabs" id="tabs" style="display:none">
    <button class="tab active" data-v="cargar" onclick="switchView('cargar')">📝 Cargar</button>
    <button class="tab" data-v="evaluar" onclick="switchView('evaluar')">📊 Evaluar</button>
  </div>
  <div class="view active" id="view-cargar"></div>
  <div class="view" id="view-evaluar"></div>
  <div id="msg" class="empty"><div class="loadbox"><div class="spinner"></div><div>Cargando…</div></div></div>
</div>

<script>
const SB_CFG={url:'https://jqudeomgafqilqmqcqzg.supabase.co',key:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpxdWRlb21nYWZxaWxxbXFjcXpnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyNjY1MTQsImV4cCI6MjA5NTg0MjUxNH0.0tl4jVOnuOE8DxTOQfGF2qirCeMIKRdv5RCZ0dGzBl8'};
let sb=null;function getSB(){if(!sb&&window.supabase)sb=window.supabase.createClient(SB_CFG.url,SB_CFG.key);return sb;}

/* ════════ MÉTRICAS ════════
   side: 'of'|'df' · cat: subcategoría · w: peso por defecto en el índice (editable) */
const METRICS=[
  // ── OFENSIVAS ──
  {k:'oreb',       side:'of',cat:'Rebote ofensivo',  l:'Rebotes ofensivos',                 w:1},
  {k:'oreb_disp',  side:'of',cat:'Rebote ofensivo',  l:'Reb. ofensivos disputados',         w:1.5},
  {k:'boxout_of',  side:'of',cat:'Rebote ofensivo',  l:'Box out ofensivo',                  w:1},
  {k:'screen_ast', side:'of',cat:'Juego sin balón',  l:'Screen assist (pantalla → canasta)',w:2},
  {k:'extra_pass', side:'of',cat:'Juego sin balón',  l:'Extra pass (mejora el tiro)',       w:1},
  {k:'rim_cut',    side:'of',cat:'Juego sin balón',  l:'Corte fuerte al aro',               w:1},
  {k:'rim_run',    side:'of',cat:'Juego sin balón',  l:'Rim run en transición',             w:1},
  {k:'carril_ok',  side:'of',cat:'Juego sin balón',  l:'Ocupó bien el carril (contraataque)',w:1},
  {k:'loose_of',   side:'of',cat:'Recuperación',     l:'Pelota dividida recuperada (atq)',  w:1.5},
  {k:'save_of',    side:'of',cat:'Recuperación',     l:'Balón salvado (evita pérdida)',     w:2},
  {k:'drive_help', side:'of',cat:'Genera ventaja',   l:'Penetración que genera ayuda',      w:1.5},
  {k:'hockey_ast', side:'of',cat:'Genera ventaja',   l:'Hockey assist (pase → ventaja)',    w:2},
  {k:'pass_move',  side:'of',cat:'Genera ventaja',   l:'Pass & move (2ª acción)',           w:1},
  // ── DEFENSIVAS ──
  {k:'defl',       side:'df',cat:'Presión al balón', l:'Deflection (desvío)',               w:1.5},
  {k:'intercept',  side:'df',cat:'Presión al balón', l:'Pase interceptado',                 w:1.5},
  {k:'cont_1v1',   side:'df',cat:'Presión al balón', l:'Contención 1v1 exitosa',            w:1},
  {k:'forced_to',  side:'df',cat:'Presión al balón', l:'Forzó pérdida',                     w:2},
  {k:'help_ok',    side:'df',cat:'Rotaciones',       l:'Ayuda correcta',                    w:1},
  {k:'help_recover',side:'df',cat:'Rotaciones',      l:'Help & recover',                    w:1.5},
  {k:'xout',       side:'df',cat:'Rotaciones',       l:'Rotación X-out',                    w:1.5},
  {k:'sink_fill',  side:'df',cat:'Rotaciones',       l:'Sink & fill',                       w:1},
  {k:'low_man',    side:'df',cat:'Rotaciones',       l:'Low man efectivo',                  w:1.5},
  {k:'contest2',   side:'df',cat:'Contestación',     l:'Tiro de 2 contestado',              w:1},
  {k:'contest3',   side:'df',cat:'Contestación',     l:'Tiro de 3 contestado',              w:1},
  {k:'closeout',   side:'df',cat:'Contestación',     l:'Closeout efectivo',                 w:1},
  {k:'loose_def',  side:'df',cat:'Recuperación',     l:'Pelota dividida recuperada (def)',  w:1.5},
  {k:'dreb_disp',  side:'df',cat:'Recuperación',     l:'Reb. defensivo disputado ganado',   w:1.5},
  {k:'dreb_box',   side:'df',cat:'Recuperación',     l:'Reb. defensivo tras box out',       w:1},
  {k:'charge',     side:'df',cat:'Sacrificio',       l:'Falta ofensiva recibida (carga)',   w:3},
  {k:'block',      side:'df',cat:'Sacrificio',       l:'Tapa',                              w:1.5},
  {k:'block_keep', side:'df',cat:'Sacrificio',       l:'Tapa que mantiene la posesión',     w:2.5},
  {k:'floor_dive', side:'df',cat:'Sacrificio',       l:'Salida al piso por una pelota',     w:2},
  {k:'first_back', side:'df',cat:'Transición def',   l:'Primer jugador en volver',          w:1.5},
  {k:'def_sprint', side:'df',cat:'Transición def',   l:'Sprint defensivo',                  w:1},
  {k:'balance_ok', side:'df',cat:'Transición def',   l:'Balance defensivo correcto',        w:1},
  {k:'stop_break', side:'df',cat:'Transición def',   l:'Detuvo el contraataque rival',      w:2},
];
const MK=METRICS.map(m=>m.k);
let WEIGHTS={};METRICS.forEach(m=>WEIGHTS[m.k]=m.w);
try{const sw=localStorage.getItem('esf_weights');if(sw)WEIGHTS=Object.assign(WEIGHTS,JSON.parse(sw));}catch(_){}

/* ════════ ESTADO ════════ */
let ROSTERS={};          // equipo -> [{num,name}]
let TEAMS=[];
let ESF=[];              // filas de esfuerzo_log
let TABLE_OK=true;
// captura
let capTeam='',capRival='',capFecha=new Date().toISOString().slice(0,10),capLocal=true;
let capPlayer='';        // key del jugador seleccionado
let tally={};            // pkey -> {metricKey:count, _min:minutos, _p:{num,name}}
// evaluación
let evTeam='',evScope='all',evNorm='tot';

function pk(p){return (p.num!=null?p.num:'')+'|'+String(p.name||'').toLowerCase().replace(/[\s.,]/g,'');}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}
function n(x){return +x||0;}
function matchId(){return 'ESF|'+capTeam+'|'+capRival+'|'+capFecha;}

/* índice de esfuerzo de una fila/acumulado */
function idxOf(o,side){let s=0;METRICS.forEach(m=>{if(side&&m.side!==side)return;s+=n(o[m.k])*(WEIGHTS[m.k]||0);});return s;}
function rawOf(o,side){let s=0;METRICS.forEach(m=>{if(side&&m.side!==side)return;s+=n(o[m.k]);});return s;}

/* ════════ CARGA ════════ */
async function loadAll(){
  const c=getSB();
  if(!c){document.getElementById('msg').innerHTML='<div class="empty">No se pudo iniciar Supabase.</div>';return;}
  document.getElementById('msg').style.display='';document.getElementById('tabs').style.display='none';
  // plantel desde quintetos_log
  try{
    const qr=await c.from('quintetos_log').select('equipo,jugadores').limit(20000);
    const rows=qr.error?[]:(qr.data||[]);
    const rmap={};
    rows.forEach(r=>{let js=r.jugadores;if(typeof js==='string'){try{js=JSON.parse(js);}catch(_){js=[];}}if(!Array.isArray(js))return;
      const t=r.equipo;if(!t)return;rmap[t]=rmap[t]||{};
      js.forEach(p=>{if(!p)return;const k=pk(p);if(!rmap[t][k])rmap[t][k]={num:p.num,name:p.name};else if(p.name&&p.name.length>(rmap[t][k].name||'').length)rmap[t][k].name=p.name;});
    });
    ROSTERS={};Object.entries(rmap).forEach(([t,m])=>{ROSTERS[t]=Object.values(m).sort((a,b)=>(n(a.num)-n(b.num))||String(a.name).localeCompare(b.name));});
    TEAMS=Object.keys(ROSTERS).sort();
  }catch(_){ROSTERS={};TEAMS=[];}
  // esfuerzo_log
  try{
    const er=await c.from('esfuerzo_log').select('*').limit(50000);
    if(er.error){TABLE_OK=false;ESF=[];}else{TABLE_OK=true;ESF=er.data||[];}
  }catch(_){TABLE_OK=false;ESF=[];}

  if(!capTeam)capTeam=TEAMS[0]||'';
  if(!evTeam)evTeam=TEAMS[0]||'';
  document.getElementById('msg').style.display='none';
  document.getElementById('tabs').style.display='';
  renderCargar();renderEvaluar();
}
function switchView(v){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.v===v));
  document.querySelectorAll('.view').forEach(el=>el.classList.remove('active'));
  document.getElementById('view-'+v).classList.add('active');
}

/* ════════ TAB CARGAR ════════ */
function setCapTeam(v){capTeam=v;capPlayer='';renderCargar();}
function setCapField(f,v){if(f==='rival')capRival=v;else if(f==='fecha')capFecha=v;else if(f==='local')capLocal=(v==='1');}
function selPlayer(k){capPlayer=k;applyPlayer();scrollPlayerIntoView();}
function shiftPlayer(d){const r=ROSTERS[capTeam]||[];if(!r.length)return;const keys=r.map(pk);let i=keys.indexOf(capPlayer);if(i<0)i=0;capPlayer=keys[(i+d+keys.length)%keys.length];applyPlayer();scrollPlayerIntoView();}
function scrollPlayerIntoView(){const b=document.querySelector('.pbtn.sel');if(b&&b.scrollIntoView){try{b.scrollIntoView({inline:'center',block:'nearest'});}catch(_){}}}
function applyPlayer(){
  const cur=tally[capPlayer]||{};
  MK.forEach(m=>{const e=document.getElementById('v-'+m);if(e){const v=n(cur[m]);e.textContent=v;e.classList.toggle('nz',v>0);}});
  const mi=document.getElementById('capMin');if(mi)mi.value=cur._min||0;
  const curP=cur._p||{};const w=document.getElementById('capWho');if(w)w.textContent=(curP.name||'')+(curP.num!=null?' · #'+curP.num:'');
  document.querySelectorAll('.pbtn').forEach(b=>b.classList.toggle('sel',b.dataset.k===capPlayer));
  updateCapTotals();
}
function setTopbarH(){const tb=document.querySelector('.topbar');if(tb)document.documentElement.style.setProperty('--topbar-h',tb.offsetHeight+'px');}
window.addEventListener('resize',setTopbarH);
function ensureP(k,p){if(!tally[k])tally[k]={_min:0,_p:p};return tally[k];}
function bump(k,d){
  if(!capPlayer)return;
  const o=tally[capPlayer];if(!o)return;
  o[k]=Math.max(0,n(o[k])+d);
  const vEl=document.getElementById('v-'+k);if(vEl){vEl.textContent=o[k];vEl.classList.toggle('nz',o[k]>0);}
  // refrescar totales sin re-render completo
  updateCapTotals();
}
function setMin(v){if(capPlayer&&tally[capPlayer])tally[capPlayer]._min=Math.max(0,n(v));updateCapTotals();}
function updateCapTotals(){
  // chips
  Object.keys(tally).forEach(k=>{const el=document.getElementById('tot-'+k);if(el)el.textContent=Math.round(idxOf(tally[k]));});
  const cur=tally[capPlayer];
  const a=document.getElementById('curIdx');if(a&&cur)a.textContent=idxOf(cur).toFixed(1);
  const ao=document.getElementById('curIdxO');if(ao&&cur)ao.textContent=idxOf(cur,'of').toFixed(1);
  const ad=document.getElementById('curIdxD');if(ad&&cur)ad.textContent=idxOf(cur,'df').toFixed(1);
}
function renderCargar(){
  const el=document.getElementById('view-cargar');
  if(!TEAMS.length){el.innerHTML='<div class="empty">No hay equipos cargados todavía.<br>Primero cargá partidos en <b>Quintetos</b> (de ahí sale el plantel).</div>';return;}
  if(capTeam&&!TEAMS.includes(capTeam))capTeam=TEAMS[0];
  const roster=ROSTERS[capTeam]||[];
  if(roster.length&&(!capPlayer||!roster.some(p=>pk(p)===capPlayer)))capPlayer=pk(roster[0]);
  roster.forEach(p=>ensureP(pk(p),p));

  const meta='<div class="controls">'+
    '<div class="field"><label>Equipo</label><select onchange="setCapTeam(this.value)">'+TEAMS.map(t=>'<option'+(t===capTeam?' selected':'')+'>'+esc(t)+'</option>').join('')+'</select></div>'+
    '<div class="field"><label>Rival</label><input type="text" value="'+esc(capRival)+'" placeholder="Nombre del rival" oninput="setCapField(\'rival\',this.value)"></div>'+
    '<div class="field"><label>Fecha</label><input type="date" value="'+esc(capFecha)+'" oninput="setCapField(\'fecha\',this.value)"></div>'+
    '<div class="field"><label>Condición</label><select onchange="setCapField(\'local\',this.value)"><option value="1"'+(capLocal?' selected':'')+'>Local</option><option value="0"'+(!capLocal?' selected':'')+'>Visitante</option></select></div>'+
    '</div>';

  const playerBar='<div class="player-bar" id="playerBar">'+
    '<button class="pnav" onclick="shiftPlayer(-1)" title="Jugador anterior">◀</button>'+
    '<div class="pbtns" id="pbtns">'+roster.map(p=>{const k=pk(p);const sel=k===capPlayer;
      return '<button class="pbtn'+(sel?' sel':'')+'" data-k="'+esc(k)+'" onclick="selPlayer(\''+k.replace(/'/g,"\\'")+'\')">'+
        '<span class="pn">'+(p.num!=null?p.num:'·')+'</span>'+
        '<span class="pnm">'+esc(p.name||'?')+'</span>'+
        '<span class="pt" id="tot-'+esc(k)+'">'+Math.round(idxOf(tally[k]||{}))+'</span></button>';
    }).join('')+'</div>'+
    '<button class="pnav" onclick="shiftPlayer(1)" title="Jugador siguiente">▶</button></div>';
  const hint='<div class="zone-sub" style="margin:-4px 0 10px">Tocá un jugador (queda fijo arriba mientras marcás) o saltá con ◀ ▶. El número de cada uno es su índice acumulado.</div>';

  let grid='';
  if(capPlayer){
    const cur=tally[capPlayer]||{};
    const sideBlock=(side,cls,title)=>{
      const cats=[...new Set(METRICS.filter(m=>m.side===side).map(m=>m.cat))];
      const inner=cats.map(cat=>'<div class="cat-h">'+cat+'</div>'+
        METRICS.filter(m=>m.side===side&&m.cat===cat).map(m=>{const v=n(cur[m.k]);
          return '<div class="met"><span class="met-l">'+m.l+'</span><span class="met-w">×'+(WEIGHTS[m.k]||0)+'</span>'+
            '<div class="step"><button onclick="bump(\''+m.k+'\',-1)">−</button>'+
            '<span class="val'+(v>0?' nz':'')+'" id="v-'+m.k+'">'+v+'</span>'+
            '<button class="plus" onclick="bump(\''+m.k+'\',1)">+</button></div></div>';
        }).join('')).join('');
      return '<details class="side '+cls+'" open><summary>'+title+'</summary><div class="cat">'+inner+'</div></details>';
    };
    const curP=(tally[capPlayer]||{})._p||{};
    grid='<div class="sec">Marcando a: <span id="capWho" style="color:var(--offense)">'+esc(curP.name||'')+(curP.num!=null?' · #'+curP.num:'')+'</span></div>'+
      '<div class="kpis">'+
        '<div class="kpi"><div class="v acc" id="curIdx">'+idxOf(cur).toFixed(1)+'</div><div class="k">Índice total</div></div>'+
        '<div class="kpi"><div class="v" style="color:var(--offense)" id="curIdxO">'+idxOf(cur,'of').toFixed(1)+'</div><div class="k">Índice ofensivo</div></div>'+
        '<div class="kpi"><div class="v def" id="curIdxD">'+idxOf(cur,'df').toFixed(1)+'</div><div class="k">Índice defensivo</div></div>'+
        '<div class="kpi" style="flex:0 0 auto"><div class="field"><label>Minutos jugados</label><input id="capMin" type="number" min="0" step="1" value="'+(cur._min||0)+'" oninput="setMin(this.value)" style="min-width:90px"></div></div>'+
      '</div>'+
      sideBlock('of','of','▲ Ofensivas')+sideBlock('df','df','▼ Defensivas');
  }

  const save='<div class="savebar">'+
    '<button class="btn-primary" onclick="saveEsf()">💾 Guardar partido</button>'+
    '<button class="btn-ghost" onclick="loadEsfMatch()">↘ Cargar lo ya guardado de este partido</button>'+
    '<button class="btn-ghost" onclick="clearCap()">Limpiar planilla</button>'+
    '<span class="savemsg" id="saveMsg"></span></div>';

  let setup='';
  if(!TABLE_OK)setup=tableSetup();

  el.innerHTML=meta+playerBar+hint+grid+save+setup;
  updateCapTotals();setTopbarH();
}
function clearCap(){if(!confirm('¿Borrar todo lo cargado en pantalla? (no toca lo guardado en la base)'))return;tally={};renderCargar();}

async function loadEsfMatch(){
  const c=getSB();const mid=matchId();
  const r=await c.from('esfuerzo_log').select('*').eq('equipo',capTeam).eq('match_id',mid);
  if(r.error){msgSave(r.error.message,true);return;}
  if(!r.data||!r.data.length){msgSave('No hay nada guardado para '+capTeam+' vs '+(capRival||'?')+' ('+capFecha+').',true);return;}
  r.data.forEach(row=>{const p={num:row.jugador_num,name:row.jugador};const k=pk(p);const o=ensureP(k,p);MK.forEach(m=>o[m]=n(row[m]));o._min=n(row.minutos);});
  msgSave('Cargados '+r.data.length+' jugadores desde la base.',false);renderCargar();
}
function msgSave(t,err){const el=document.getElementById('saveMsg');if(el){el.textContent=t;el.style.color=err?'var(--negative)':'var(--positive)';}}
async function saveEsf(){
  const c=getSB();
  if(!capRival.trim()){msgSave('Poné el nombre del rival antes de guardar.',true);return;}
  const mid=matchId();
  const rows=[];
  Object.entries(tally).forEach(([k,o])=>{
    const tot=rawOf(o);if(tot<=0&&!o._min)return; // saltar jugadores sin nada
    const row={equipo:capTeam,rival:capRival.trim(),es_local:capLocal,fecha:capFecha,match_id:mid,
      jugador:(o._p&&o._p.name)||'',jugador_num:(o._p&&o._p.num!=null)?o._p.num:null,minutos:n(o._min)};
    MK.forEach(m=>row[m]=n(o[m]));rows.push(row);
  });
  if(!rows.length){msgSave('No hay nada para guardar.',true);return;}
  msgSave('Guardando…',false);
  // re-guardado limpio: borro lo previo de este partido+equipo y reinserto
  const del=await c.from('esfuerzo_log').delete().eq('equipo',capTeam).eq('match_id',mid);
  if(del.error){if(/relation .* does not exist|esfuerzo_log/.test(del.error.message)){TABLE_OK=false;renderCargar();return;}msgSave(del.error.message,true);return;}
  const ins=await c.from('esfuerzo_log').insert(rows);
  if(ins.error){msgSave(ins.error.message,true);return;}
  msgSave('✓ Guardado: '+rows.length+' jugadores.',false);
  await loadAll();
}

/* ════════ TAB EVALUAR ════════ */
function setEv(f,v){if(f==='team')evTeam=v;else if(f==='scope')evScope=v;else if(f==='norm')evNorm=v;renderEvaluar();}
function renderEvaluar(){
  const el=document.getElementById('view-evaluar');
  if(!TABLE_OK){el.innerHTML='<div class="sec">Evaluación</div>'+tableSetup();return;}
  if(!ESF.length){el.innerHTML='<div class="empty">Todavía no hay esfuerzo cargado.<br>Cargá un partido en la pestaña <b>📝 Cargar</b> y volvé acá.</div>';return;}
  const teams=[...new Set(ESF.map(r=>r.equipo))].sort();
  if(!teams.includes(evTeam))evTeam=teams[0];
  let rows=ESF.filter(r=>r.equipo===evTeam);
  const matches=[...new Set(rows.map(r=>r.match_id))];
  if(evScope!=='all'&&!matches.includes(evScope))evScope='all';
  if(evScope!=='all')rows=rows.filter(r=>r.match_id===evScope);

  // acumular por jugador
  const pmap={};
  rows.forEach(r=>{const p={num:r.jugador_num,name:r.jugador};const k=pk(p);
    const o=pmap[k]||(pmap[k]={p,min:0,pj:new Set()});MK.forEach(m=>o[m]=n(o[m])+n(r[m]));o.min+=n(r.minutos);o.pj.add(r.match_id);});
  let players=Object.values(pmap).map(o=>{
    const tot=idxOf(o),io=idxOf(o,'of'),id=idxOf(o,'df'),pj=o.pj.size,min=o.min;
    const factor=(evNorm==='p40'&&min>0)?40/min:1;
    return {...o,pj,min,idx:tot,idxO:io,idxD:id,idxN:tot*factor,idxON:io*factor,idxDN:id*factor};
  }).sort((a,b)=>b.idxN-a.idxN);

  const per40=evNorm==='p40';
  const maxIdx=Math.max(1,...players.map(p=>p.idxN));

  // controles
  const ctl='<div class="controls">'+
    '<div class="field"><label>Equipo</label><select onchange="setEv(\'team\',this.value)">'+teams.map(t=>'<option'+(t===evTeam?' selected':'')+'>'+esc(t)+'</option>').join('')+'</select></div>'+
    '<div class="field"><label>Partido</label><select onchange="setEv(\'scope\',this.value)"><option value="all"'+(evScope==='all'?' selected':'')+'>Todos ('+matches.length+')</option>'+
      matches.map(mid=>{const r=rows.concat(ESF).find(x=>x.match_id===mid);const lbl=r?((r.fecha||'')+' vs '+(r.rival||'?')):mid;return '<option value="'+esc(mid)+'"'+(evScope===mid?' selected':'')+'>'+esc(lbl)+'</option>';}).join('')+'</select></div>'+
    '<div class="field"><label>Normalización</label><select onchange="setEv(\'norm\',this.value)"><option value="tot"'+(!per40?' selected':'')+'>Totales</option><option value="p40"'+(per40?' selected':'')+'>Por 40 minutos</option></select></div>'+
    '</div>';

  // KPIs del equipo
  const teamTot=players.reduce((s,p)=>s+p.idx,0);
  const topO=players.slice().sort((a,b)=>b.idxON-a.idxON)[0];
  const topD=players.slice().sort((a,b)=>b.idxDN-a.idxDN)[0];
  const kpis='<div class="kpis">'+
    '<div class="kpi"><div class="v acc">'+(players[0]?esc(players[0].p.name):'—')+'</div><div class="k">Líder de esfuerzo</div></div>'+
    '<div class="kpi"><div class="v" style="color:var(--offense)">'+(topO?esc(topO.p.name):'—')+'</div><div class="k">Mejor sin balón / ataque</div></div>'+
    '<div class="kpi"><div class="v def">'+(topD?esc(topD.p.name):'—')+'</div><div class="k">Mejor esfuerzo defensivo</div></div>'+
    '<div class="kpi"><div class="v ins">'+Math.round(teamTot)+'</div><div class="k">Índice total del equipo</div></div>'+
    '</div>';

  // tabla ranking
  const sfx=per40?' /40':'';
  const rk='<div class="board"><div class="board-title">Ranking de esfuerzo'+(per40?' (por 40 min)':'')+'</div><div class="tblwrap"><table class="t"><thead><tr>'+
    '<th class="l">#</th><th class="l">Jugador</th><th>PJ</th><th>Min</th><th>Índice'+sfx+'</th><th>Ofensivo'+sfx+'</th><th>Defensivo'+sfx+'</th></tr></thead><tbody>'+
    players.map((p,i)=>'<tr><td class="l">'+(i+1)+'</td>'+
      '<td class="l"><span class="pchip"><span class="pn">'+(p.p.num!=null?p.p.num:'·')+'</span>'+esc(p.p.name||'?')+'</span></td>'+
      '<td>'+p.pj+'</td><td>'+Math.round(p.min)+'</td>'+
      '<td style="color:var(--offense);font-weight:600">'+p.idxN.toFixed(1)+'<span class="bar-wrap"><span class="bar" style="width:'+Math.round(p.idxN/maxIdx*100)+'%"></span></span></td>'+
      '<td>'+p.idxON.toFixed(1)+'</td><td style="color:var(--defense)">'+p.idxDN.toFixed(1)+'</td></tr>').join('')+
    '</tbody></table></div></div>';

  // líderes por métrica (top 3 con valor > 0)
  const totByMetric={};MK.forEach(m=>{totByMetric[m]=players.map(p=>({name:p.p.name,num:p.p.num,v:per40&&p.min>0?n(p[m])*40/p.min:n(p[m])})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v).slice(0,3);});
  const leadersFor=side=>{
    const ms=METRICS.filter(m=>m.side===side);
    const cells=ms.map(m=>{const L=totByMetric[m.k];if(!L.length)return '';
      return '<tr><td class="l">'+m.l+'</td><td class="l">'+L.map(x=>'<span class="pchip" style="margin:1px 2px"><span class="pn">'+(x.num!=null?x.num:'·')+'</span>'+esc(x.name)+' · '+(per40?x.v.toFixed(1):Math.round(x.v))+'</span>').join(' ')+'</td></tr>';
    }).filter(Boolean).join('');
    return cells?'<div class="board"><div class="board-title">Líderes · '+(side==='of'?'Ofensivas':'Defensivas')+'</div><div class="tblwrap"><table class="t"><thead><tr><th class="l">Acción</th><th class="l">Top 3</th></tr></thead><tbody>'+cells+'</tbody></table></div></div>':'';
  };

  // editor de pesos
  const wedit='<details class="board"><summary style="cursor:pointer;list-style:none;padding:11px 15px;font-family:var(--font-disp);font-weight:700;font-size:15px;color:var(--insight)">⚙ Pesos del índice (qué tanto vale cada acción) ▾</summary>'+
    '<div class="zone-sub" style="padding:0 15px 4px">Cambiá cuánto suma cada acción al índice. Se recalcula al instante y se guarda en este navegador.</div>'+
    '<div class="wedit">'+METRICS.map(m=>'<label>'+m.l+' <span class="met-w" style="margin-left:6px">'+(m.side==='of'?'ATQ':'DEF')+'</span></label><input type="number" step="0.5" min="0" value="'+(WEIGHTS[m.k]||0)+'" onchange="setWeight(\''+m.k+'\',this.value)">').join('')+'</div>'+
    '<div style="padding:6px 15px 14px"><button class="btn-ghost" onclick="resetWeights()">↺ Volver a los pesos por defecto</button></div></details>';

  el.innerHTML=ctl+kpis+
    '<div class="zone-sub" style="margin-bottom:8px">Índice = suma de cada acción × su peso. Separado en ofensivo (rebote of., juego sin balón, ventajas) y defensivo (presión, rotaciones, contestación, sacrificio, transición).</div>'+
    rk+'<div class="sec">Quién aporta qué</div>'+leadersFor('of')+leadersFor('df')+wedit;
}
function setWeight(k,v){WEIGHTS[k]=Math.max(0,n(v));persistW();renderEvaluar();}
function resetWeights(){METRICS.forEach(m=>WEIGHTS[m.k]=m.w);persistW();renderEvaluar();}
function persistW(){try{localStorage.setItem('esf_weights',JSON.stringify(WEIGHTS));}catch(_){}}

/* ════════ SETUP (si falta la tabla) ════════ */
function tableSetup(){
  const cols=MK.map(m=>'  '+m+' int default 0').join(',\n');
  const sql='create table if not exists esfuerzo_log (\n'+
    '  id bigint generated always as identity primary key,\n'+
    '  created_at timestamptz default now(),\n'+
    '  equipo text, rival text, fase text, es_local bool,\n'+
    '  fecha date, match_id text,\n'+
    '  jugador text, jugador_num int, minutos int default 0,\n'+
    cols+'\n);\n\n'+
    'alter table esfuerzo_log enable row level security;\n'+
    'create policy "esf_all" on esfuerzo_log for all using (true) with check (true);';
  return '<div class="note"><b>Falta crear la tabla <code>esfuerzo_log</code> en Supabase.</b><br>'+
    'Pegá esto en el SQL Editor de Supabase y dale Run. Después tocá «↻ Actualizar» acá arriba y ya podés cargar.'+
    '<pre class="sql">'+esc(sql)+'</pre>'+
    'Nota: la policy abierta (<code>using(true)</code>) es la misma lógica con la que ya guarda Quintetos. Si tu proyecto usa auth más estricta, ajustala a tu gusto.</div>';
}

loadAll();
</script>
