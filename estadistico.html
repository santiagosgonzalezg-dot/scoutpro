<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estadístico · Equipos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=DM+Mono:wght@400;500&family=Barlow+Condensed:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg-base:#08090d;--bg-raised:#0f1117;--bg-panel:#161820;--bg-hover:#1e202a;
  --border-subtle:rgba(255,255,255,0.05);--border-light:rgba(255,255,255,0.09);--border-strong:rgba(255,255,255,0.18);
  --offense:#f97316;--offense-bg:rgba(249,115,22,0.10);--offense-mid:rgba(249,115,22,0.22);
  --defense:#4f8ef7;--defense-bg:rgba(79,142,247,0.10);--defense-mid:rgba(79,142,247,0.22);
  --positive:#34c769;--negative:#f05050;--insight:#a78bfa;
  --text:#d8dce8;--text-2:#8891a0;--text-3:#434b5a;
  --font-ui:'DM Sans',system-ui,sans-serif;--font-mono:'DM Mono',monospace;--font-disp:'Barlow Condensed',sans-serif;
  --sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--r-sm:3px;--r:5px;--r-lg:8px;--t-fast:100ms ease;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg-base);color:var(--text);font-family:var(--font-ui);font-size:13px;-webkit-font-smoothing:antialiased;min-height:100vh}
.topbar{display:flex;align-items:center;gap:var(--sp-3);padding:12px 20px;border-bottom:1px solid var(--border-light);background:var(--bg-raised);position:sticky;top:0;z-index:20}
.logo{font-family:var(--font-disp);font-weight:900;font-size:22px;letter-spacing:2px;line-height:1;flex-shrink:0}
.logo .a{color:var(--offense)}
.logo .v{font-family:var(--font-mono);font-size:8px;color:var(--text-3);letter-spacing:2px;margin-left:6px;border:1px solid var(--border-light);border-radius:var(--r-sm);padding:2px 6px;vertical-align:middle}
.tb-spacer{flex:1}
.tb-btn{background:var(--bg-panel);border:1px solid var(--border-light);border-radius:var(--r-sm);color:var(--text-2);font-family:var(--font-mono);font-size:10px;padding:7px 13px;cursor:pointer;transition:all var(--t-fast);white-space:nowrap;text-decoration:none;display:inline-block}
.tb-btn:hover{border-color:var(--offense);color:var(--offense)}
.tb-btn.qtos:hover{border-color:var(--insight);color:var(--insight)}
.wrap{max-width:1280px;margin:0 auto;padding:20px}
.controls{display:flex;gap:var(--sp-3);align-items:flex-end;flex-wrap:wrap;margin-bottom:var(--sp-4)}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-family:var(--font-mono);font-size:8px;letter-spacing:1px;color:var(--text-3);text-transform:uppercase}
.field select{background:var(--bg-raised);border:1px solid var(--border-light);border-radius:var(--r);padding:9px var(--sp-3);font-family:var(--font-ui);font-size:13px;color:var(--text);outline:none;min-width:180px;cursor:pointer}
.field select:focus{border-color:var(--offense)}
.tabs{display:flex;gap:4px;margin-bottom:var(--sp-4);border-bottom:1px solid var(--border-light)}
.tab{background:none;border:none;border-bottom:2px solid transparent;color:var(--text-3);font-family:var(--font-disp);font-weight:700;font-size:15px;letter-spacing:1px;text-transform:uppercase;padding:9px 16px;cursor:pointer;transition:all var(--t-fast);margin-bottom:-1px}
.tab:hover{color:var(--text-2)}
.tab.active{color:var(--offense);border-bottom-color:var(--offense)}
.view{display:none}.view.active{display:block}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:var(--sp-3);margin-bottom:var(--sp-4)}
.kpi{background:var(--bg-raised);border:1px solid var(--border-light);border-radius:var(--r-lg);padding:var(--sp-4)}
.kpi .v{font-family:var(--font-disp);font-weight:900;font-size:30px;line-height:1}
.kpi .k{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.6px;color:var(--text-2);text-transform:uppercase;margin-top:7px;font-weight:500}
.pos{color:var(--positive)}.neg{color:var(--negative)}.acc{color:var(--offense)}.def{color:var(--defense)}
.sec{font-family:var(--font-disp);font-weight:800;font-size:15px;letter-spacing:.4px;text-transform:uppercase;color:var(--text);margin:var(--sp-5) 0 var(--sp-3);display:flex;align-items:center;gap:10px}
.sec::before{content:"";width:3px;height:16px;background:var(--offense);border-radius:2px;flex-shrink:0}
.sec::after{content:'';flex:1;height:1px;background:var(--border-subtle)}
.board{background:var(--bg-raised);border:1px solid var(--border-light);border-radius:var(--r-lg);overflow:hidden;margin-bottom:var(--sp-4)}
.board-title{font-family:var(--font-disp);font-weight:700;font-size:15px;letter-spacing:.5px;color:var(--offense);padding:var(--sp-3) var(--sp-4);border-bottom:1px solid var(--border-subtle)}
.tblwrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse}
table.t thead tr{background:var(--bg-panel)}
table.t th{font-family:var(--font-mono);font-size:8px;letter-spacing:.8px;color:var(--text-2);padding:10px var(--sp-2);text-align:right;text-transform:uppercase;border-bottom:1px solid var(--border-light);font-weight:500;white-space:nowrap}
table.t th.l{text-align:left}
table.t th.s{cursor:pointer;user-select:none}
table.t th.s:hover{color:var(--text)}
table.t th.sorted{color:var(--offense);background:rgba(249,115,22,0.07)}
table.t td{padding:8px var(--sp-2);border-bottom:1px solid var(--border-subtle);font-family:var(--font-mono);font-size:10px;text-align:right;white-space:nowrap}
table.t td.l{text-align:left}
table.t td.active{color:var(--text);background:rgba(249,115,22,0.05)}
table.t tr:hover td{background:var(--bg-hover)}
.pchip{font-family:var(--font-mono);font-size:9px;color:var(--text);background:var(--bg-base);border:1px solid var(--border-subtle);border-radius:var(--r-sm);padding:2px 6px 2px 3px;display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.pchip .pn{font-family:var(--font-mono);font-size:8px;font-weight:500;color:#000;background:var(--offense);border-radius:2px;padding:0 3px}
.rank{color:var(--text-3)}
.empty{text-align:center;color:var(--text-2);font-family:var(--font-mono);font-size:12px;line-height:1.8;padding:60px 20px}
.empty b{color:var(--offense)}
.chartbox{background:var(--bg-raised);border:1px solid var(--border-light);border-radius:var(--r-lg);padding:var(--sp-4);margin-bottom:var(--sp-4)}
.legend{display:flex;gap:var(--sp-4);font-family:var(--font-mono);font-size:9px;color:var(--text-2);margin-top:var(--sp-2)}
.legend i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.lid-toggle{display:flex;gap:6px;margin-bottom:var(--sp-4)}
.lid-toggle button{background:var(--bg-panel);border:1px solid var(--border-subtle);border-radius:var(--r-sm);color:var(--text-3);font-family:var(--font-mono);font-size:10px;padding:7px 16px;cursor:pointer;transition:all var(--t-fast)}
.lid-toggle button.on{border-color:var(--offense);color:var(--offense);background:var(--offense-bg)}
.lb-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:var(--sp-3);margin-bottom:var(--sp-5)}
.lb-card{background:var(--bg-raised);border:1px solid var(--border-light);border-radius:var(--r-lg);padding:var(--sp-3) var(--sp-4) var(--sp-4)}
.lb-title{font-family:var(--font-disp);font-weight:800;font-size:16px;letter-spacing:.5px;margin-bottom:var(--sp-3);display:flex;align-items:center;gap:7px}
.lb-title .dot{width:8px;height:8px;border-radius:2px}
.lb-row{display:flex;align-items:center;gap:var(--sp-2);margin-bottom:8px}
.lb-rank{font-family:var(--font-mono);font-size:9px;color:var(--text-3);width:12px;flex-shrink:0}
.lb-name{font-family:var(--font-ui);font-size:12px;color:var(--text);width:138px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0}
.lb-name small{color:var(--text-3);font-family:var(--font-mono);font-size:8px;margin-left:4px}
.lb-track{flex:1;height:9px;background:var(--bg-panel);border-radius:2px;overflow:hidden}
.lb-fill{height:100%;border-radius:2px;transition:width .3s}
.lb-val{font-family:var(--font-disp);font-weight:800;font-size:16px;width:46px;text-align:right;flex-shrink:0}
.shot-wrap{display:grid;grid-template-columns:minmax(260px,1fr) minmax(220px,300px);gap:var(--sp-4);align-items:start}
@media(max-width:720px){.shot-wrap{grid-template-columns:1fr}}
.court-box{background:var(--bg-raised);border:1px solid var(--border-light);border-radius:var(--r-lg);padding:var(--sp-3)}
.court-svg{width:100%;height:auto;display:block}
.court-line{fill:none;stroke:rgba(255,255,255,.18);stroke-width:1}
.court-fill{fill:rgba(255,255,255,.02)}
.shot-made{fill:#34c769;fill-opacity:.85}
.shot-miss{fill:none;stroke:#f05050;stroke-width:1.4;stroke-opacity:.8}
.tiros-ctl{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:var(--sp-4);align-items:center}
.tiros-ctl select{background:var(--bg-panel);border:1px solid var(--border-subtle);border-radius:var(--r-sm);color:var(--text);font-family:var(--font-ui);font-size:13px;padding:7px 12px}
.zone-row{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--border-subtle)}
.zone-row:last-child{border-bottom:none}
.zone-lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:1px;color:var(--text-2);text-transform:uppercase;font-weight:500}
.zone-val{font-family:var(--font-disp);font-weight:800;font-size:18px}
.tramo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--sp-3)}
@media(max-width:600px){.tramo-grid{grid-template-columns:1fr}}
.tramo-card{background:var(--bg-raised);border:1px solid var(--border-light);border-radius:var(--r-lg);padding:var(--sp-3) var(--sp-4)}
.tramo-card .lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:1px;color:var(--text-2);text-transform:uppercase;font-weight:500}
.tramo-card .big{font-family:var(--font-disp);font-weight:900;font-size:28px;line-height:1;margin:6px 0 3px}
.tramo-card .sub{font-family:var(--font-mono);font-size:10px;color:var(--text-2)}
.tramo-bar{height:6px;background:var(--bg-panel);border-radius:2px;overflow:hidden;margin-top:9px}
.tramo-fill{height:100%;border-radius:2px}
.ficha-card{position:relative;background:linear-gradient(115deg,#14161f 0%,#0f1117 55%,#171922 100%);border:1px solid var(--border-light);border-radius:14px;padding:20px 22px 18px;margin:16px 0;overflow:hidden}
.ficha-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--offense),#fb923c)}
.ficha-card::after{content:"";position:absolute;right:-50px;top:-70px;width:220px;height:220px;background:radial-gradient(circle,rgba(249,115,22,.10),transparent 70%);pointer-events:none}
.ficha-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:relative;z-index:1}
.fh-name{font-family:var(--font-disp);font-weight:900;font-size:34px;letter-spacing:.5px;line-height:1}
.fh-num{color:var(--offense);font-size:23px}
.fh-team{color:var(--text-2);font-family:var(--font-mono);font-size:11px;letter-spacing:.7px;text-transform:uppercase;margin-top:9px;position:relative;z-index:1}
.fh-tag{background:#f4f1ea;color:#11131a;font-family:var(--font-mono);font-weight:500;font-size:10.5px;letter-spacing:.9px;padding:6px 14px;border-radius:30px;text-transform:uppercase;box-shadow:0 2px 10px rgba(0,0,0,.4)}
.ficha-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
@media(max-width:760px){.ficha-grid{grid-template-columns:1fr}}
.pbar-row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.pbar-lbl{width:100px;font-family:var(--font-ui);font-size:12.5px;flex-shrink:0}
.pbar-track{flex:1;height:14px;background:var(--bg-panel);border:1px solid rgba(255,255,255,.07);border-radius:7px;overflow:hidden;display:block}
.pbar-fill{display:block;height:100%;border-radius:7px;transition:width .45s ease}
.pbar-pct{width:42px;text-align:right;font-family:var(--font-disp);font-weight:800;font-size:15px}
.ficha-input{background:var(--bg-panel);border:1px solid var(--border-subtle);border-radius:5px;color:var(--text);font-family:var(--font-ui);font-size:14px;padding:8px 12px;min-width:260px}
.ficha-input:focus{outline:none;border-color:var(--offense)}
.ficha-team{background:var(--bg-panel);border:1px solid var(--border-subtle);border-radius:5px;color:var(--text);font-family:var(--font-ui);font-size:13px;padding:8px 10px}
.ficha-team:focus{outline:none;border-color:var(--offense)}
.fchips{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0 4px}
.fchip{background:var(--bg-panel);border:1px solid var(--border-subtle);border-radius:20px;color:var(--text-2);font-family:var(--font-ui);font-size:12.5px;padding:6px 13px;cursor:pointer;transition:all .14s}
.fchip:hover{border-color:var(--offense);color:var(--text)}
.fchip.on{background:rgba(249,115,22,.14);border-color:var(--offense);color:#fdba74}
.fh-warn{color:#e0a83b;font-family:var(--font-mono);font-size:11px;margin-top:10px;letter-spacing:.3px;position:relative;z-index:1}
.ficha-kpis .kpi{position:relative;overflow:hidden}
.ficha-kpis .kpi::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent)}
.kpi .v.val-hl{color:var(--offense)}
.sim-btn{background:var(--bg-panel);border:1px solid var(--border-light);border-radius:7px;color:var(--text);font-family:var(--font-mono);font-size:11px;letter-spacing:.5px;padding:11px 20px;cursor:pointer;transition:all .16s}
.sim-btn:hover{border-color:var(--offense);color:var(--offense)}
.sim-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
@media(max-width:680px){.sim-grid{grid-template-columns:1fr}}
.sim-card{background:var(--bg-raised);border:1px solid var(--border-light);border-radius:10px;padding:15px;cursor:pointer;transition:all .16s}
.sim-card:hover{border-color:var(--offense);transform:translateY(-2px)}
.sim-match{display:flex;align-items:center;gap:9px;margin-bottom:11px}
.sim-pct{font-family:var(--font-disp);font-weight:900;font-size:26px;color:#34c769;line-height:1}
.sim-pct-lbl{font-family:var(--font-mono);font-size:8.5px;letter-spacing:.5px;color:var(--text-3);text-transform:uppercase;line-height:1.35}
.sim-name{font-family:var(--font-disp);font-weight:800;font-size:18px;line-height:1.05}
.sim-num{color:var(--offense);font-size:13px}
.sim-team{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.5px;color:var(--text-2);text-transform:uppercase;margin:3px 0 11px}
.sim-stats{display:flex;gap:14px}
.sim-stat{font-family:var(--font-mono);font-size:9px;letter-spacing:.5px;color:var(--text-3);text-transform:uppercase}
.sim-stat b{font-family:var(--font-disp);font-size:16px;color:var(--text);font-weight:800;display:block}
.bs-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.bs-dim,.bs-min,.bs-max{background:var(--bg-panel);border:1px solid var(--border-subtle);border-radius:5px;color:var(--text);font-family:var(--font-ui);font-size:13px;padding:8px 10px}
.bs-dim:focus,.bs-min:focus,.bs-max:focus{outline:none;border-color:var(--offense)}
.bs-dim{min-width:150px}
.bs-min,.bs-max{width:62px;text-align:center}
.bs-range{font-family:var(--font-mono);font-size:10px;letter-spacing:.5px;color:var(--text-2);text-transform:uppercase;display:flex;align-items:center;gap:7px}
.bs-del{background:var(--bg-panel);border:1px solid var(--border-subtle);border-radius:5px;color:var(--text-3);font-family:var(--font-mono);font-size:12px;padding:8px 11px;cursor:pointer;transition:all .16s}
.bs-del:hover{border-color:var(--negative);color:var(--negative)}
.bs-add{background:var(--bg-panel);border:1px dashed var(--border-light);border-radius:6px;color:var(--text-2);font-family:var(--font-mono);font-size:10px;letter-spacing:.5px;padding:9px 16px;cursor:pointer;margin-top:2px;transition:all .16s}
.bs-add:hover{border-color:var(--offense);color:var(--offense)}
.bs-count{font-family:var(--font-mono);font-size:11px;letter-spacing:.5px;color:var(--text-2);margin:18px 0 10px;text-transform:uppercase}
.bs-table{width:100%;border-collapse:collapse;font-size:13px}
.bs-table th{font-family:var(--font-mono);font-size:9px;letter-spacing:.5px;color:var(--text-2);text-transform:uppercase;text-align:right;padding:8px 10px;border-bottom:1px solid var(--border-light);white-space:nowrap}
.bs-table td{padding:8px 10px;border-bottom:1px solid var(--border-subtle);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.bs-table th.l,.bs-table td.l{text-align:left}
.bs-table td.l{font-weight:600}
.bs-table tbody tr{cursor:pointer;transition:background .12s}
.bs-table tbody tr:hover{background:var(--bg-hover)}
.bs-table .pc{font-family:var(--font-disp);font-weight:800;font-size:14px}
.sc-tip{position:fixed;z-index:200;pointer-events:none;background:rgba(15,17,23,.97);border:1px solid var(--border-light);border-radius:8px;padding:9px 12px;box-shadow:0 8px 26px rgba(0,0,0,.55);opacity:0;transition:opacity .1s}
.sc-tip.on{opacity:1}
.sc-tip .t{font-family:var(--font-disp);font-weight:800;font-size:16px;display:flex;align-items:center;gap:8px;margin-bottom:5px;color:var(--text)}
.sc-tip .t i{width:12px;height:12px;border-radius:50%;display:inline-block}
.sc-tip .r{font-family:var(--font-mono);font-size:10.5px;color:var(--text-2);letter-spacing:.3px;line-height:1.5}
.sc-tip .r b{color:var(--text);font-weight:500}
.scpt{cursor:pointer}
.rv-item{font-size:13.5px;color:#cfd5e3;line-height:1.5;padding:5px 0}
.brk-row{display:flex;align-items:center;gap:12px;margin-bottom:9px}
.brk-name{width:150px;font-size:13px;flex-shrink:0}
.brk-track{flex:1;height:13px;background:var(--bg-panel);border-radius:3px;overflow:hidden}
.brk-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,#4f8ef7,#6aa3ff);display:block}
.brk-val{width:128px;text-align:right;font-family:var(--font-mono);font-size:11px;color:var(--text-2);flex-shrink:0}
.brk-val b{color:var(--text);font-family:var(--font-disp);font-size:15px;font-weight:800;margin-right:3px}
.ficha-help p{color:var(--text-2);font-size:13.5px;line-height:1.65;margin:0 0 13px}
.ficha-help b{color:var(--text)}
.hrow{display:flex;gap:14px;padding:8px 0;border-bottom:1px solid var(--border-subtle);font-size:13.5px;align-items:baseline}
.hrow:last-of-type{border-bottom:none}
.hrow .h-k{width:118px;flex-shrink:0;font-family:var(--font-mono);font-size:10px;letter-spacing:.5px;color:var(--text);text-transform:uppercase}
.hrow .h-v{color:var(--text-2)}
.ficha-help .warn{color:#e0a83b;margin:13px 0 0;font-size:12.5px;line-height:1.6}
.zone-sub{font-family:var(--font-mono);font-size:10.5px;color:var(--text-2);margin-left:6px}
</style>
</head>
<body>
<div class="topbar">
  <div class="logo"><span class="a">ESTADÍSTICO</span><span class="v">EQUIPOS</span></div>
  <div class="tb-spacer"></div>
  <a class="tb-btn qtos" href="quintetos.html">🔄 Quintetos</a>
  <a class="tb-btn" href="defensa.html">🛡 Defensa</a>
  <a class="tb-btn" href="index.html">🏠 Menú</a>
  <button class="tb-btn" onclick="loadData()">↻ Actualizar</button>
</div>

<div class="wrap">
  <div class="controls" id="controls" style="display:none">
    <div class="field"><label>Equipo</label><select id="selTeam" onchange="renderAll()"></select></div>
    <div class="field"><label>Fase</label><select id="selFase" onchange="renderAll()"><option value="">Todas</option></select></div>
  </div>

  <div class="tabs" id="tabs" style="display:none">
    <button class="tab active" data-v="dashboard" onclick="switchView('dashboard')">Dashboard</button>

function buildSelectors(){

// ── agregación ──
function agg(rows){
  const a={min:0,ptsF:0,ptsC:0,pos:0,posRiv:0,pt2c:0,pt2i:0,pt3c:0,pt3i:0,tlc:0,tli:0,ast:0,rob:0,per:0,rd:0,ro:0,matches:new Set()};
  for(const r of rows){
    a.min+=num(r.minutos);a.ptsF+=num(r.pts_favor);a.ptsC+=num(r.pts_contra);
    a.pos+=num(r.pos);a.posRiv+=num(r.pos_riv);
    a.pt2c+=num(r.pt2c);a.pt2i+=num(r.pt2i);a.pt3c+=num(r.pt3c);a.pt3i+=num(r.pt3i);
    a.tlc+=num(r.tlc);a.tli+=num(r.tli);
    a.ast+=num(r.ast);a.rob+=num(r.rob);a.per+=num(r.per);a.rd+=num(r.reb_def);a.ro+=num(r.reb_off);
    if(r.match_id)a.matches.add(r.match_id);
  }
  a.diff=a.ptsF-a.ptsC;
  a.efOff=a.pos>0?a.ptsF/a.pos:0;
  a.efDef=a.posRiv>0?a.ptsC/a.posRiv:0;
  a.pj=a.matches.size;
  a.fga=a.pt2i+a.pt3i;a.fgm=a.pt2c+a.pt3c;
  a.efg=a.fga>0?Math.round((a.fgm+0.5*a.pt3c)/a.fga*1000)/10:0;            // eFG%
  a.ts=(a.fga+0.44*a.tli)>0?Math.round(a.ptsF/(2*(a.fga+0.44*a.tli))*1000)/10:0; // True Shooting %
  return a;
}
function teamRows(team){const f=document.getElementById('selFase').value;return DATA.filter(r=>r.equipo===team&&(!f||r.fase===f));}
function allRowsFiltered(){const f=document.getElementById('selFase').value;return DATA.filter(r=>!f||r.fase===f);}

// ── tabla ordenable genérica ──
const sortState={};
function sortableTable(elId,title,cols,rows,stateKey){
  if(!sortState[stateKey])sortState[stateKey]={key:cols.find(c=>c.sortable).key,dir:-1};
  const ss=sortState[stateKey];
  const col=cols.find(c=>c.key===ss.key)||cols[0];
  const arrow=ss.dir<0?'▼':'▲';
  let sorted=rows.slice();
  if(col.val)sorted.sort((x,y)=>(col.val(x)-col.val(y))*ss.dir);
  const head=cols.map(c=>{
    const on=c.key===ss.key&&c.sortable;
    const cls=(c.left?'l ':'')+(c.sortable?'s ':'')+(on?'sorted':'');
    return '<th class="'+cls+'"'+(c.sortable?' onclick="doSort(\''+stateKey+'\',\''+c.key+'\')"':'')+'>'+c.label+(on?' '+arrow:'')+'</th>';
  }).join('');
  const body=sorted.map((r,i)=>'<tr>'+cols.map(c=>{
    const active=c.key===ss.key&&c.sortable;
    const cls=(c.left?'l ':'')+(active?'active':'');
    const st=c.color?(' style="color:'+c.color(r)+'"'):'';
    return '<td class="'+cls+'"'+st+'>'+c.cell(r,i)+'</td>';
  }).join('')+'</tr>').join('');
  return '<div class="board"><div class="board-title">'+title+'</div><div class="tblwrap"><table class="t"><thead><tr>'+head+'</tr></thead><tbody>'+body+'</tbody></table></div></div>';
}
function doSort(stateKey,key){const s=sortState[stateKey];if(s.key===key)s.dir*=-1;else{s.key=key;s.dir=-1;}renderAll();}
function chips(players){return players.map(p=>'<span class="pchip"><span class="pn">'+(p.num||'·')+'</span>'+p.name+'</span>').join(' ');}
function dc(v){return v>0?'var(--positive)':v<0?'var(--negative)':'var(--text-3)';}
function sgn(v){return (v>0?'+':'')+v;}
function pp(v){return (Number(v)||0).toFixed(2);}
function sgn2(v){const n=Number(v)||0;return (n>0?'+':'')+n.toFixed(2);}

// ── VISTA DASHBOARD (LIGA) ──
function matchReboundIndex(rows){
  const matches={};
  for(const r of rows){const mid=r.match_id||'?';(matches[mid]=matches[mid]||{});(matches[mid][r.equipo]=matches[mid][r.equipo]||{ro:0,rd:0});matches[mid][r.equipo].ro+=num(r.reb_off);matches[mid][r.equipo].rd+=num(r.reb_def);}
  return matches;
}
function leagueTeamStats(){
  const rows=allRowsFiltered();
  const matches=matchReboundIndex(rows);
  const teamNames=[...new Set(rows.map(r=>r.equipo))];
  return teamNames.map(t=>{
    const tr=rows.filter(r=>r.equipo===t);
    const a=agg(tr);
    let orbN=0,orbD=0,drbN=0,drbD=0;
    for(const mid of new Set(tr.map(r=>r.match_id))){
      const mt=matches[mid];if(!mt)continue;const me=mt[t]||{ro:0,rd:0};
      let rro=0,rrd=0;for(const rn of Object.keys(mt)){if(rn!==t){rro+=mt[rn].ro;rrd+=mt[rn].rd;}}
      orbN+=me.ro;orbD+=me.ro+rrd;drbN+=me.rd;drbD+=me.rd+rro;
    }
    a.orbPct=orbD>0?Math.round(orbN/orbD*100):0;
    a.drbPct=drbD>0?Math.round(drbN/drbD*100):0;
    a.pace=a.pj>0?Math.round(a.pos/a.pj*10)/10:0;
    a.net=a.efOff-a.efDef;
    a.fga=a.pt2i+a.pt3i;a.fgm=a.pt2c+a.pt3c;
    a.fgPct=a.fga>0?Math.round(a.fgm/a.fga*1000)/10:0;
    a.threeVol=a.fga>0?Math.round(a.pt3i/a.fga*1000)/10:0;
    a.threePct=a.pt3i>0?Math.round(a.pt3c/a.pt3i*1000)/10:0;
    a.astPos=a.pos>0?a.ast/a.pos:0;
    a.astTo=a.per>0?a.ast/a.per:0;
    a.astRob=a.rob>0?a.ast/a.rob:0;
    return {team:t,a};
  });
}
function leagueLineups(){
  const rows=allRowsFiltered();const groups={};
  for(const r of rows){if(!r.jugadores||r.jugadores.length!==5)continue;const key=r.equipo+'#'+(r.jugadores_key||pkeyArr(r.jugadores));(groups[key]=groups[key]||{team:r.equipo,players:r.jugadores,rows:[]}).rows.push(r);}
  let lus=Object.values(groups).map(g=>{const a=agg(g.rows);return {team:g.team,players:g.players,a,net:a.min>0?Math.round(a.diff/a.min*40*10)/10:0};});
  let f=lus.filter(l=>l.a.min>=10);
  if(f.length<5)f=lus.filter(l=>l.a.min>=4);
  if(f.length<5)f=lus;
  return f;
}
function renderDashboard(){
  const teams=leagueTeamStats();
  const el=document.getElementById('view-dashboard');
  if(!teams.length){el.innerHTML='<div class="empty">Sin datos para mostrar.</div>';return;}
  const cols=[

    {key:'net',label:'NET',sortable:true,val:r=>r.a.net,cell:r=>sgn2(r.a.net),color:r=>dc(r.a.net)},
    {key:'orb',label:'REB.OF%',sortable:true,val:r=>r.a.orbPct,cell:r=>r.a.orbPct+'%'},
    {key:'drb',label:'REB.DEF%',sortable:true,val:r=>r.a.drbPct,cell:r=>r.a.drbPct+'%'},
    {key:'fg',label:'eFG%',sortable:true,val:r=>r.a.efg,cell:r=>r.a.efg+'%'},
    {key:'ts',label:'TS%',sortable:true,val:r=>r.a.ts,cell:r=>r.a.ts+'%'},
    {key:'3v',label:'3VOL',sortable:true,val:r=>r.a.threeVol,cell:r=>r.a.threeVol+'%'},
    {key:'ap',label:'AST/POS',sortable:true,val:r=>r.a.astPos,cell:r=>r.a.astPos.toFixed(2)},
    {key:'at',label:'AST/PÉR',sortable:true,val:r=>r.a.astTo,cell:r=>r.a.astTo.toFixed(2)},
    {key:'diff',label:'+/-',sortable:true,val:r=>r.a.diff,cell:r=>sgn(r.a.diff),color:r=>dc(r.a.diff)},
  ];
  if(!sortState['ligaTeams'])sortState['ligaTeams']={key:'net',dir:-1};
  const rankTable=sortableTable('view-dashboard','Ranking de equipos',cols,teams,'ligaTeams');

  const lus=leagueLineups();
  const best=lus.slice().sort((a,b)=>b.net-a.net).slice(0,5);
  const worst=lus.slice().sort((a,b)=>a.net-b.net).slice(0,5);
  const luTable=(title,list)=>{
    const body=list.map((l,i)=>'<tr>'+
      '<td class="l"><span class="rank">'+String(i+1).padStart(2,'0')+'</span></td>'+
      '<td class="l"><b>'+l.team+'</b></td>'+
      '<td class="l">'+chips(l.players)+'</td>'+
      '<td>'+Math.round(l.a.min)+'</td>'+
      '<td style="color:'+dc(l.a.diff)+'">'+sgn(l.a.diff)+'</td>'+
      '<td style="color:'+dc(l.net)+'">'+sgn(l.net)+'</td>'+
      '<td>'+pp(l.a.efOff)+'</td><td>'+pp(l.a.efDef)+'</td></tr>').join('');
    return '<div class="board"><div class="board-title">'+title+'</div><div class="tblwrap"><table class="t"><thead><tr>'+
      '<th class="l">#</th><th class="l">Cuadro</th><th class="l">Quinteto</th><th>Min</th><th>+/-</th><th>NET/40</th><th>EF.OF</th><th>EF.DEF</th>'+
      '</tr></thead><tbody>'+body+'</tbody></table></div></div>';
  };
  const avg=(f)=>teams.length?teams.reduce((s,t)=>s+f(t),0)/teams.length:0;
  const lgPace=avg(t=>t.a.pace),lgEfo=avg(t=>t.a.efOff),lgEfd=avg(t=>t.a.efDef),
        lgEfg=avg(t=>t.a.efg),lgTs=avg(t=>t.a.ts),lg3v=avg(t=>t.a.threeVol),
        lgAstPos=avg(t=>t.a.astPos),lgAstTo=avg(t=>t.a.astTo),lgAstRob=avg(t=>t.a.astRob),
        lgOrb=avg(t=>t.a.orbPct),lgDrb=avg(t=>t.a.drbPct);
  const ligaKpis='<div class="sec">Promedios de la liga</div><div class="kpis">'+
    kpi(lgPace.toFixed(1),'POS / PARTIDO')+
    kpi(pp(lgEfo),'EF.OF')+
    kpi(pp(lgEfd),'EF.DEF')+
    kpi(lgEfg.toFixed(1)+'%','eFG%')+
    kpi(lgTs.toFixed(1)+'%','TS%')+
    kpi(lg3v.toFixed(1)+'%','VOLUMEN DE 3')+
    kpi(lgAstPos.toFixed(2),'AST / POS')+
    kpi(lgAstTo.toFixed(2),'AST / PÉR')+
    kpi(lgAstRob.toFixed(2),'AST / ROBO')+
    kpi(Math.round(lgOrb)+'%','REB.OF%')+
    kpi(Math.round(lgDrb)+'%','REB.DEF%')+
    '</div>';
  el.innerHTML=
    ligaKpis+
    rankTable+
    '<div class="sec">Mejores 5 quintetos de la liga</div>'+luTable('Top quintetos',best)+
    '<div class="sec">Peores 5 quintetos de la liga</div>'+luTable('Quintetos a revisar',worst);
}

function renderJugadores(){

  for(const r of rows){for(const p of (r.jugadores||[])){const k=pkey(p);if(!pmap[k])pmap[k]={p,rows:[]};pmap[k].rows.push(r);}}
  const players=Object.values(pmap).map(o=>{
    const on=agg(o.rows);
    const offMin=tot.min-on.min, offDiff=tot.diff-on.diff;

    const offR=offMin>0?offDiff/offMin*40:0;
    return {p:o.p,on,onR,offR,net:onR-offR};
  });

function renderEvolucion(){

  const list=Object.values(byMatch).map(g=>({...g,a:agg(g.rows)})).sort((x,y)=>String(x.fecha||'').localeCompare(String(y.fecha||''))||String(x.match).localeCompare(String(y.match)));
  const chart=evoChart(list);
  const cols=[
    {key:'fecha',label:'Fecha',left:true,cell:r=>r.fecha||'—'},

function evoChart(list){
  if(list.length<2)return '<div class="chartbox"><div class="empty" style="padding:20px">Necesitás al menos 2 partidos guardados para ver la evolución.</div></div>';
  const W=Math.max(420,list.length*70),H=200,pad=30;
  const vals=list.map(g=>g.a.diff);const mx=Math.max(5,...vals.map(Math.abs));
  const x=i=>pad+i*(W-2*pad)/(list.length-1);
  const y=v=>H/2-(v/mx)*(H/2-pad);
  let path='',dots='';
  list.forEach((g,i)=>{const px=x(i),py=y(g.a.diff);path+=(i?'L':'M')+px+' '+py+' ';dots+='<circle cx="'+px+'" cy="'+py+'" r="3.5" fill="'+(g.a.diff>=0?'#34c769':'#f05050')+'"/>';});
  let labels='';list.forEach((g,i)=>{labels+='<text x="'+x(i)+'" y="'+(H-8)+'" fill="#434b5a" font-family="DM Mono,monospace" font-size="8" text-anchor="middle">'+(g.rival||'').slice(0,6)+'</text>';});
  return '<div class="chartbox"><div class="board-title" style="border:none;padding:0 0 10px">+/- por partido</div>'+
    '<div style="overflow-x:auto"><svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">'+
    '<line x1="'+pad+'" y1="'+(H/2)+'" x2="'+(W-pad)+'" y2="'+(H/2)+'" stroke="rgba(255,255,255,0.10)" stroke-dasharray="3 3"/>'+
    '<path d="'+path+'" fill="none" stroke="#f97316" stroke-width="2"/>'+dots+labels+'</svg></div>'+
    '<div class="legend"><span><i style="background:#f97316"></i>Diferencial (+/-) por partido</span></div></div>';
}

    a.min+=num(r.min);a.pts+=num(r.pts);a.ast+=num(r.ast);a.rob+=num(r.rob);a.tap+=num(r.tap);a.per+=num(r.per);

function shotMade(s){return s.made===true||s.made==='true'||+s.made===1;}
function foldShot(s){let fx=+s.x,fy=+s.y;if(!isFinite(fx)||!isFinite(fy))return null;if(fx>50){fx=100-fx;fy=100-fy;}return{fx,fy,made:shotMade(s),tipo:s.tipo};}
const HEAT_ZONES={
  pint:[44,75], mizq:[60,48], mder:[60,102],
  tizq:[34,24], tcen:[98,75], tder:[34,126]
};
function heatZone(f){
  if(f.tipo==='3pt'){ if(f.fy<40)return 'tizq'; if(f.fy>60)return 'tder'; return 'tcen'; }

function courtHeatSVG(shots){
  const dots=shots.map(s=>{const x=+s.x,y=+s.y;if(!isFinite(x)||!isFinite(y))return'';
    const cx=(x/100*280).toFixed(1),cy=(y/100*150).toFixed(1);
    return shotMade(s)?'<circle cx="'+cx+'" cy="'+cy+'" r="1.7" fill="#34c769" fill-opacity="0.26"/>'
                      :'<circle cx="'+cx+'" cy="'+cy+'" r="1.7" fill="none" stroke="#f05050" stroke-opacity="0.24" stroke-width="0.8"/>';
  }).join('');
  const buckets={};Object.keys(HEAT_ZONES).forEach(k=>buckets[k]=[]);
  shots.map(foldShot).filter(Boolean).forEach(f=>{const z=heatZone(f);if(buckets[z])buckets[z].push(f);});
  let bubbles='';
  Object.keys(HEAT_ZONES).forEach(k=>{
    const arr=buckets[k];if(!arr.length)return;
    const m=arr.filter(f=>f.made).length,a=arr.length,pct=Math.round(m/a*100);
    const pps=(k[0]==='t'?3:2)*pct/100, col=ppsColor(pps);
    const r=Math.min(8,3+Math.sqrt(a)*1.0), z=HEAT_ZONES[k];
    [[z[0],z[1]],[280-z[0],z[1]]].forEach(c=>{const cx=c[0],cy=c[1];
      bubbles+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r.toFixed(1)+'" fill="'+col+'" fill-opacity="0.24" stroke="'+col+'" stroke-width="0.7"/>'+
        '<text x="'+cx+'" y="'+(cy-0.6)+'" fill="#fff" font-family="Barlow Condensed,sans-serif" font-weight="800" font-size="5" text-anchor="middle">'+pct+'%</text>'+
        '<text x="'+cx+'" y="'+(cy+3.7)+'" fill="#cfd5e3" font-family="DM Mono,monospace" font-size="3" text-anchor="middle">'+m+'/'+a+'</text>';
    });
  });
  return '<svg class="court-svg" viewBox="0 0 280 150" xmlns="http://www.w3.org/2000/svg">'+fullCourtLines()+dots+bubbles+'</svg>';
}
function courtSVGFull(shots){
  const dots=shots.map(s=>{
    const x=+s.x,y=+s.y;if(!isFinite(x)||!isFinite(y))return'';

function scatterSVG(pts,xlabel,ylabel,showLabels,hl){
  const W=480,H=318,M={l:56,r:20,t:16,b:52};
  const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y);
  let xmin=Math.min(...xs),xmax=Math.max(...xs),ymin=Math.min(...ys),ymax=Math.max(...ys);
  if(xmin===xmax){xmin-=1;xmax+=1;}if(ymin===ymax){ymin-=1;ymax+=1;}
  const xp=(xmax-xmin)*0.1,yp=(ymax-ymin)*0.12;
  const x0=xmin-xp,x1=xmax+xp,y0=ymin-yp,y1=ymax+yp;
  const sx=v=>M.l+(v-x0)/(x1-x0)*(W-M.l-M.r);
  const sy=v=>H-M.b-(v-y0)/(y1-y0)*(H-M.t-M.b);
  const n=pts.length,mx=xs.reduce((s,v)=>s+v,0)/n,my=ys.reduce((s,v)=>s+v,0)/n;
  let sxy=0,sxx=0,syy=0;pts.forEach(p=>{sxy+=(p.x-mx)*(p.y-my);sxx+=(p.x-mx)**2;syy+=(p.y-my)**2;});
  const slope=sxx?sxy/sxx:0,intercept=my-slope*mx,r=(sxx&&syy)?sxy/Math.sqrt(sxx*syy):0;
  const fmt=v=>Math.abs(v)>=100?Math.round(v):Math.abs(v)>=10?Math.round(v*10)/10:Math.round(v*100)/100;
  // fondo neutro, sin líneas de promedio ni cuadrantes
  const quad='<rect x="'+M.l+'" y="'+M.t+'" width="'+(W-M.l-M.r)+'" height="'+(H-M.t-M.b)+'" fill="rgba(255,255,255,0.012)"/>';
  const means='';
  let grid='';
  for(let i=0;i<=4;i++){
    const vx=x0+(x1-x0)*i/4,vy=y0+(y1-y0)*i/4;
    grid+='<line x1="'+sx(vx).toFixed(1)+'" y1="'+M.t+'" x2="'+sx(vx).toFixed(1)+'" y2="'+(H-M.b)+'" stroke="rgba(255,255,255,0.05)"/>'+
      '<line x1="'+M.l+'" y1="'+sy(vy).toFixed(1)+'" x2="'+(W-M.r)+'" y2="'+sy(vy).toFixed(1)+'" stroke="rgba(255,255,255,0.05)"/>'+
      '<text x="'+sx(vx).toFixed(1)+'" y="'+(H-M.b+15)+'" fill="#aeb4c2" font-size="9.5" text-anchor="middle" font-family="DM Mono,monospace">'+fmt(vx)+'</text>'+
      '<text x="'+(M.l-7)+'" y="'+(sy(vy)+3.5).toFixed(1)+'" fill="#aeb4c2" font-size="9.5" text-anchor="end" font-family="DM Mono,monospace">'+fmt(vy)+'</text>';
  }
  const ty0=intercept+slope*x0,ty1=intercept+slope*x1;
  const trend='<line x1="'+sx(x0).toFixed(1)+'" y1="'+sy(ty0).toFixed(1)+'" x2="'+sx(x1).toFixed(1)+'" y2="'+sy(ty1).toFixed(1)+'" stroke="#a78bfa" stroke-width="1.6" stroke-dasharray="5 4" stroke-opacity="0.9"/>';
  const dots=pts.map(p=>{
    const c=teamColor(p.team);
    const dim=hl&&p.team!==hl;
    const R=dim?3:(hl&&p.team===hl?5.2:4.2);
    const op=dim?0.18:0.95;
    const ring=(hl&&p.team===hl)?'<circle cx="'+sx(p.x).toFixed(1)+'" cy="'+sy(p.y).toFixed(1)+'" r="'+(R+2.6)+'" fill="none" stroke="'+c+'" stroke-opacity="0.45" stroke-width="1.2"/>':'';
    const lbl=(showLabels&&!dim)?'<text x="'+(sx(p.x)+7).toFixed(1)+'" y="'+(sy(p.y)+3.5).toFixed(1)+'" fill="#dde1ec" font-size="9" font-family="DM Sans,sans-serif" font-weight="600">'+p.label+'</text>':'';
    return ring+'<circle class="scpt" cx="'+sx(p.x).toFixed(1)+'" cy="'+sy(p.y).toFixed(1)+'" r="'+R+'" fill="'+c+'" fill-opacity="'+op+'" stroke="rgba(255,255,255,0.35)" stroke-width="0.6" data-team="'+escAttr(p.label)+'" data-x="'+fmt(p.x)+'" data-y="'+fmt(p.y)+'" data-col="'+c+'"></circle>'+lbl;
  }).join('');
  const titles='<text x="'+((M.l+W-M.r)/2)+'" y="'+(H-7)+'" fill="#d8dce8" font-size="11" text-anchor="middle" font-family="DM Mono,monospace" letter-spacing="0.5">'+xlabel+'</text>'+
    '<text x="15" y="'+((M.t+H-M.b)/2)+'" fill="#d8dce8" font-size="11" text-anchor="middle" font-family="DM Mono,monospace" letter-spacing="0.5" transform="rotate(-90 15 '+((M.t+H-M.b)/2)+')">'+ylabel+'</text>';
  const frame='<line x1="'+M.l+'" y1="'+M.t+'" x2="'+M.l+'" y2="'+(H-M.b)+'" stroke="rgba(255,255,255,0.22)"/><line x1="'+M.l+'" y1="'+(H-M.b)+'" x2="'+(W-M.r)+'" y2="'+(H-M.b)+'" stroke="rgba(255,255,255,0.22)"/>';
  return {svg:'<svg class="court-svg" viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">'+quad+grid+means+frame+trend+dots+titles+'</svg>',r,n};
}

  const col=ar<0.2?'#8891a0':res.r>=0?'#34c769':'#f05050';
  const legend='<div class="zone-sub" style="margin-top:10px;display:flex;gap:14px;flex-wrap:wrap">'+

    '<div class="zone-row"><span class="zone-lbl">r² (varianza explicada)</span><span class="zone-val">'+Math.round(res.r*res.r*100)+'%</span></div>'+
    '<div class="zone-sub" style="margin-top:8px;color:#cfd5e3">'+interp+'</div>'+

function attachScatterTips(xlabel,ylabel){

let cuartoTeam='';
function setCuartoTeam(v){cuartoTeam=v;renderCuartos();}
function qLabel(q){return q<=4?('Q'+q):('PR'+(q-4));}
function renderCuartos(){
  const el=document.getElementById('view-cuartos');
  const fase=document.getElementById('selFase').value;
  const rows=QUARTERS.filter(r=>!fase||r.fase===fase);
  if(!rows.length){
    el.innerHTML='<div class="empty">Todavía no hay datos por cuarto.<br>Necesitás crear la tabla <b>cuartos_log</b> (te paso el SQL) y <b>re-guardar</b> los partidos desde Quintetos.</div>';
    return;
  }
  const qs=[...new Set(rows.map(r=>num(r.cuarto)))].filter(q=>q>=1).sort((a,b)=>a-b);
  const cols=Math.min(qs.length,4);
  // A) promedio de puntos por cuarto (liga)
  const byQ={};qs.forEach(q=>byQ[q]={pf:0,pc:0,n:0});
  rows.forEach(r=>{const q=num(r.cuarto);if(byQ[q]){byQ[q].pf+=num(r.pts_favor);byQ[q].pc+=num(r.pts_contra);byQ[q].n++;}});
  const maxPf=Math.max(1,...qs.map(q=>byQ[q].n?byQ[q].pf/byQ[q].n:0));
  const aCards=qs.map(q=>{const b=byQ[q],pf=b.n?b.pf/b.n:0,w=Math.round(pf/maxPf*100);
    return '<div class="tramo-card"><div class="lbl">'+qLabel(q)+'</div><div class="big" style="color:#f97316">'+pf.toFixed(1)+'</div><div class="sub">pts/cuarto · '+(b.n?(b.pc/b.n).toFixed(1):'0')+' en contra</div><div class="tramo-bar"><div class="tramo-fill" style="width:'+w+'%;background:#f97316"></div></div></div>';
  }).join('');
  // B) ¿ganar el cuarto = ganar el partido?
  const g={};
  rows.forEach(r=>{const k=r.match_id+'|'+r.equipo;if(!g[k])g[k]={byQ:{},gd:0};g[k].byQ[num(r.cuarto)]=num(r.diff);g[k].gd+=num(r.diff);});
  const ents=Object.values(g);
  const bCards=qs.map(q=>{
    const won=ents.filter(e=>e.byQ[q]!==undefined&&e.byQ[q]>0);
    const pct=won.length?Math.round(won.filter(e=>e.gd>0).length/won.length*100):0;
    const col=pct>=65?'#34c769':pct>=50?'#e0a83b':'#f05050';
    return '<div class="tramo-card"><div class="lbl">Gana '+qLabel(q)+'</div><div class="big" style="color:'+col+'">'+pct+'%</div><div class="sub">gana el partido · '+won.length+' casos</div><div class="tramo-bar"><div class="tramo-fill" style="width:'+pct+'%;background:'+col+'"></div></div></div>';
  }).join('');
  // C) rendimiento por cuarto de un equipo
  const teams=[...new Set(rows.map(r=>r.equipo))].sort();
  if(cuartoTeam&&!teams.includes(cuartoTeam))cuartoTeam='';
  const teamSel='<div class="tiros-ctl"><span class="zone-lbl">Equipo</span><select onchange="setCuartoTeam(this.value)"><option value="">— Elegí un equipo —</option>'+teams.map(t=>'<option'+(t===cuartoTeam?' selected':'')+'>'+t+'</option>').join('')+'</select></div>';
  let teamBlock='';
  if(cuartoTeam){
    const tr=rows.filter(r=>r.equipo===cuartoTeam);
    const t={};qs.forEach(q=>t[q]={pf:0,pc:0,diff:0,n:0,w:0,l:0,e:0});
    tr.forEach(r=>{const q=num(r.cuarto),b=t[q];if(!b)return;b.pf+=num(r.pts_favor);b.pc+=num(r.pts_contra);b.diff+=num(r.diff);b.n++;const d=num(r.diff);if(d>0)b.w++;else if(d<0)b.l++;else b.e++;});
    const head='<tr><th style="text-align:left">Cuarto</th><th>PJ</th><th>PF</th><th>PC</th><th>DIF</th><th>Récord</th></tr>';
    const body=qs.map(q=>{const b=t[q];if(!b.n)return'';const dif=b.diff/b.n;
      return '<tr><td style="text-align:left"><b>'+qLabel(q)+'</b></td><td>'+b.n+'</td><td>'+(b.pf/b.n).toFixed(1)+'</td><td>'+(b.pc/b.n).toFixed(1)+'</td><td style="color:'+dc(dif)+'">'+sgn(Math.round(dif*10)/10)+'</td><td>'+b.w+'-'+b.l+(b.e?'-'+b.e:'')+'</td></tr>';}).join('');
    teamBlock='<div class="sec">'+cuartoTeam+' · rendimiento por cuarto</div><div class="board"><div class="tblwrap"><table class="t"><thead>'+head+'</thead><tbody>'+body+'</tbody></table></div></div>';
  }
  el.innerHTML='<div class="sec">Promedio de puntos por cuarto (liga)</div>'+
    '<div class="tramo-grid" style="grid-template-columns:repeat('+cols+',1fr)">'+aCards+'</div>'+
    '<div class="sec">¿Ganar el cuarto = ganar el partido?</div>'+
    '<div class="tramo-grid" style="grid-template-columns:repeat('+cols+',1fr)">'+bCards+'</div>'+
    teamSel+teamBlock;
}

function evolutionChart(games){
  const W=480,H=215,M={l:34,r:16,t:18,b:46},n=games.length;
  const pts=games.map(g=>g.pts),vals=games.map(g=>g.val);
  const ymax=Math.max(...pts,...vals,1),ymin=Math.min(0,...vals,...pts);

function radarSVG(dims){
  const cx=160,cy=152,R=100,N=dims.length;
  const ang=i=>(-90+i*360/N)*Math.PI/180;

  let rings='';[20,40,60,80,100].forEach(lev=>{const pts=dims.map((_,i)=>{const[x,y]=pt(i,lev/100*R);return x.toFixed(1)+','+y.toFixed(1);}).join(' ');rings+='<polygon points="'+pts+'" fill="none" stroke="rgba(255,255,255,0.07)"/>';});
  let axes='';dims.forEach((d,i)=>{const[x,y]=pt(i,R);axes+='<line x1="'+cx+'" y1="'+cy+'" x2="'+x.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="rgba(255,255,255,0.08)"/>';});
  const poly=dims.map((d,i)=>{const[x,y]=pt(i,d[1]/100*R);return x.toFixed(1)+','+y.toFixed(1);}).join(' ');
  const verts=dims.map((d,i)=>{const[x,y]=pt(i,d[1]/100*R);return '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="2.6" fill="#34c769"/>';}).join('');
  let labels='';dims.forEach((d,i)=>{const[x,y]=pt(i,R+19);const anc=Math.abs(x-cx)<12?'middle':(x>cx?'start':'end');
    labels+='<text x="'+x.toFixed(1)+'" y="'+(y-2).toFixed(1)+'" fill="#aeb4c2" font-size="9" text-anchor="'+anc+'" font-family="DM Sans,sans-serif">'+d[0]+'</text>'+
      '<text x="'+x.toFixed(1)+'" y="'+(y+9).toFixed(1)+'" fill="#34c769" font-size="11.5" font-weight="800" text-anchor="'+anc+'" font-family="Barlow Condensed,sans-serif">'+(d[1]/10).toFixed(1)+'</text>';});
  return '<svg viewBox="0 0 320 300" class="court-svg" style="max-width:360px;margin:0 auto;display:block">'+rings+axes+'<polygon points="'+poly+'" fill="rgba(52,199,105,0.18)" stroke="#34c769" stroke-width="1.6"/>'+verts+labels+'</svg>';
}

const BS_DIMS=[['anot','Anotación'],['gen','Generación'],['tiro','Tiro ext.'],['reb','Rebote'],['def','Defensa'],['vers','Versatilidad'],['glob','Global']];

function buscadorData(){
  const pool=fichaList();const pg=(p,k)=>p[k]/(p.g||1);

function bsSync(){
  const rows=[...document.querySelectorAll('#view-buscador .bs-row')];

}
function bsAdd(){bsSync();const used=bsRows.map(r=>r.dim);const next=(BS_DIMS.find(d=>!used.includes(d[0]))||BS_DIMS[0])[0];bsRows.push({dim:next,min:0,max:100});renderBuscador();}

  for(const r of rows){const ps=r.jugadores;if(!ps||ps.length!==5)continue;
    combos(ps,size).forEach(combo=>{const key=r.equipo+'#'+combo.map(pkey).sort().join('|');
      (groups[key]=groups[key]||{team:r.equipo,players:combo,rows:[]}).rows.push(r);});}
  let lus=Object.values(groups).map(g=>{const a=agg(g.rows);return {team:g.team,players:g.players,a,net:a.min>0?Math.round(a.diff/a.min*40*10)/10:0};});
  let f=lus.filter(l=>l.a.min>=10);if(f.length<5)f=lus.filter(l=>l.a.min>=5);if(f.length<5)f=lus.filter(l=>l.a.min>=2);
  return f;
}

// ── VISTA RIVAL (scouting / próximo partido) ──
function topShare(team,key){
  const pool=playersAgg().filter(p=>p.equipo===team&&(+p[key]||0)>0).map(p=>({name:p.nombre,num:p.num,val:+p[key]||0})).sort((a,b)=>b.val-a.val);
  if(!pool.length)return null;const total=pool.reduce((s,p)=>s+p.val,0);
  return {name:pool[0].name,num:pool[0].num,share:Math.round(pool[0].val/total*100)};
}
function rivalShareBars(team,key,c1,c2){
  const pool=playersAgg().filter(p=>p.equipo===team&&(+p[key]||0)>0).map(p=>({name:p.nombre,num:p.num,val:+p[key]||0})).sort((a,b)=>b.val-a.val);
  if(!pool.length)return '<div class="zone-sub">Sin datos cargados.</div>';
  const total=pool.reduce((s,p)=>s+p.val,0),max=pool[0].val;
  return pool.map(p=>{const share=Math.round(p.val/total*100),w=Math.round(p.val/max*100);
    return '<div class="brk-row"><span class="brk-name" style="width:118px">'+(p.num?'#'+p.num+' ':'')+p.name+'</span><span class="brk-track"><span class="brk-fill" style="width:'+w+'%;background:linear-gradient(90deg,'+c1+','+c2+')"></span></span><span class="brk-val"><b>'+p.val+'</b> · '+share+'%</span></div>';}).join('')+
    '<div class="zone-sub" style="margin-top:6px">Total del equipo: '+total+'.</div>';
}
let rivalTeam='';
function setRival(v){rivalTeam=v;renderRival();}
function rankPct(arr,v,hb){const n=arr.length;if(!n)return 50;const p=Math.round(arr.filter(x=>x<=v).length/n*100);return hb?p:100-p;}
function renderRival(){
  const el=document.getElementById('view-rival');
  if(!DATA.length){el.innerHTML='<div class="empty">No hay datos cargados.</div>';return;}
  const stats=leagueTeamStats();
  const teams=stats.map(s=>s.team).sort();
  if(rivalTeam&&!teams.includes(rivalTeam))rivalTeam='';
  if(!rivalTeam)rivalTeam=teams[0];
  const sel='<div class="tiros-ctl"><span class="zone-lbl">Rival a analizar</span><select onchange="setRival(this.value)">'+teams.map(t=>'<option'+(t===rivalTeam?' selected':'')+'>'+t+'</option>').join('')+'</select>'+
    '<button class="sim-btn" id="rivalPdfBtn" onclick="downloadRivalPDF()" style="margin-left:auto">⬇ Descargar PDF</button></div>';
  const me=stats.find(s=>s.team===rivalTeam);if(!me){el.innerHTML=sel+'<div class="empty">Sin datos del equipo.</div>';return;}
  const a=me.a;
  const METR=[
    {k:'efOff',label:'Ataque (pts/pos)',val:a.efOff,fmt:pp,hb:true,arr:stats.map(s=>s.a.efOff)},
    {k:'efDef',label:'Defensa (recibe/pos)',val:a.efDef,fmt:pp,hb:false,arr:stats.map(s=>s.a.efDef)},
    {k:'pace',label:'Ritmo (pos/partido)',val:a.pace,fmt:v=>v.toFixed(1),hb:true,arr:stats.map(s=>s.a.pace),neutral:true},
    {k:'ts',label:'TS%',val:a.ts,fmt:v=>v+'%',hb:true,arr:stats.map(s=>s.a.ts)},
    {k:'threeVol',label:'Volumen de 3',val:a.threeVol,fmt:v=>v+'%',hb:true,arr:stats.map(s=>s.a.threeVol),neutral:true},
    {k:'threePct',label:'3P%',val:a.threePct,fmt:v=>v+'%',hb:true,arr:stats.map(s=>s.a.threePct)},
    {k:'orbPct',label:'Rebote of. %',val:a.orbPct,fmt:v=>v+'%',hb:true,arr:stats.map(s=>s.a.orbPct)},
    {k:'drbPct',label:'Rebote def. %',val:a.drbPct,fmt:v=>v+'%',hb:true,arr:stats.map(s=>s.a.drbPct)},
    {k:'astTo',label:'AST / Pérdida',val:a.astTo,fmt:pp,hb:true,arr:stats.map(s=>s.a.astTo)}
  ];
  const bar=METR.map(m=>{const pct=rankPct(m.arr,m.val,m.hb),col=m.neutral?'#8891a0':pctColor(pct);
    return '<div class="pbar-row"><span class="pbar-lbl" style="width:150px">'+m.label+'</span><span class="pbar-track"><span class="pbar-fill" style="width:'+pct+'%;background:'+col+'"></span></span><span class="pbar-pct" style="width:62px;color:'+col+'">'+m.fmt(m.val)+'</span></div>';}).join('');
  const strong=METR.filter(m=>!m.neutral&&rankPct(m.arr,m.val,m.hb)>=70).map(m=>m.label);
  const weak=METR.filter(m=>!m.neutral&&rankPct(m.arr,m.val,m.hb)<=30).map(m=>m.label);
  const R=(k,hb)=>{const m=METR.find(x=>x.k===k);return m?rankPct(m.arr,m.val,hb):50;};
  const claves=[];
  if(R('orbPct',true)>=65)claves.push('Bloqueá el rebote: atacan fuerte el rebote ofensivo.');
  if(R('threeVol',true)>=65)claves.push('Cerrá el perímetro: el '+a.threeVol+'% de sus tiros son triples.');
  if(R('threePct',true)>=60)claves.push('Ojo con sus tiradores: meten el '+a.threePct+'% de tres.');
  if(R('ts',true)>=65)claves.push('Equipo muy eficiente al tiro: TS% del '+a.ts+'%.');
  if(R('efDef',false)<=35)claves.push('Su defensa concede: corré la cancha y buscá ritmo alto.');
  if(R('efDef',false)>=65)claves.push('Defienden bien: paciencia y buena selección de tiro.');
  if(R('astTo',true)>=65)claves.push('Cortá las líneas de pase: mueven muy bien la pelota.');
  if(R('pace',true)>=65)claves.push('Controlá el ritmo: les gusta correr.');
  if(R('pace',true)<=35)claves.push('Te van a frenar el ritmo: generá ventajas temprano.');
  if(!claves.length)claves.push('Equipo parejo sin un patrón marcado: jugá tu partido y ajustá sobre la marcha.');
  const tRb=topShare(rivalTeam,'ro');
  if(tRb&&tRb.share>=30)claves.unshift((tRb.num?'#'+tRb.num+' ':'')+tRb.name+' concentra el '+tRb.share+'% del rebote ofensivo del equipo: bloqueálo en el tiro.');
  const tSh=topShare(rivalTeam,'fga');
  if(tSh&&tSh.share>=25)claves.unshift((tSh.num?'#'+tSh.num+' ':'')+tSh.name+' es el que más dispara ('+tSh.share+'% de los tiros del equipo): no lo dejes cómodo.');
  let resumen='';
  if(strong.length)resumen+='Fuerte en '+strong.slice(0,2).join(' y ').toLowerCase()+'. ';
  if(weak.length)resumen+='Flojo en '+weak.slice(0,2).join(' y ').toLowerCase()+'.';
  if(!resumen)resumen='Equipo parejo, sin fortalezas ni debilidades marcadas en los datos cargados.';
  const ros=buscadorData().filter(d=>d.p.equipo===rivalTeam).sort((x,y)=>y.val-x.val).slice(0,4);
  const watch=ros.length?ros.map(d=>{const v=[d.pct.anot,d.pct.gen,d.pct.tiro,d.pct.reb,d.pct.def];
    return '<div class="sim-card" data-id="'+escAttr(fichaId(d.p))+'" onclick="openFicha(this.dataset.id)">'+
      '<div class="sim-name">'+d.p.nombre+' <span class="sim-num">#'+d.p.num+'</span></div>'+
      '<div class="sim-team">'+roleFromVec(v)+'</div>'+
      '<div class="sim-stats"><span class="sim-stat"><b>'+pp1(d.pts)+'</b>PTS</span><span class="sim-stat"><b>'+pp1(d.reb)+'</b>REB</span><span class="sim-stat"><b>'+pp1(d.ast)+'</b>AST</span><span class="sim-stat"><b>'+pp1(d.val)+'</b>VAL</span></div>'+
    '</div>';}).join(''):'<div class="zone-sub">Sin box scores individuales de este equipo todavía.</div>';
  const dRows=DEF.filter(d=>d.rival===rivalTeam);
  const dmap={};dRows.forEach(d=>{const t=d.tipo||'?';(dmap[t]=dmap[t]||{pts:0,ev:0});dmap[t].pts+=+d.puntos||0;dmap[t].ev+=+d.eventos||0;});
  const dArr=Object.entries(dmap).map(([t,o])=>({t,pts:o.pts,ev:o.ev})).sort((x,y)=>y.pts-x.pts);
  const dTot=dArr.reduce((s,o)=>s+o.pts,0);
  const defSec=dArr.length?(dArr.map(o=>{const w=Math.round(o.pts/(dArr[0].pts||1)*100),sh=dTot?Math.round(o.pts/dTot*100):0;
      return '<div class="brk-row"><span class="brk-name">'+o.t+'</span><span class="brk-track"><span class="brk-fill" style="width:'+w+'%"></span></span><span class="brk-val"><b>'+o.pts+'</b>pts · '+sh+'%</span></div>';}).join('')+
      '<div class="zone-sub" style="margin-top:8px">Sale de lo que tagueaste en la herramienta Defensa contra este rival.</div>'):
      '<div class="zone-sub">Todavía no tagueaste ningún partido contra '+rivalTeam+' en la herramienta Defensa. Cuando lo hagas, vas a ver acá de qué jugadas te anotó.</div>';
  el.innerHTML=sel+'<div id="rival-report">'+
    '<div class="ficha-card"><div class="ficha-head"><div class="fh-name">'+rivalTeam+'</div><span class="fh-tag">'+(a.pj||0)+' partidos</span></div>'+
      '<div class="fh-team" style="text-transform:none;font-size:13.5px;letter-spacing:0;color:#cfd5e3;line-height:1.55;margin-top:10px">'+resumen+'</div></div>'+
    '<div class="sec">Perfil vs la liga</div><div class="court-box">'+bar+
      '<div class="zone-sub" style="margin-top:8px">Barra = posición en la liga (más llena = mejor). Gris = neutro (ritmo / volumen). El valor real va a la derecha.</div></div>'+
    '<div class="ficha-grid"><div class="court-box"><div class="zone-lbl" style="margin-bottom:10px;color:#34c769">Fortalezas</div>'+(strong.length?strong.map(s=>'<div class="rv-item">✔ '+s+'</div>').join(''):'<div class="zone-sub">Sin fortalezas marcadas.</div>')+'</div>'+
      '<div class="court-box"><div class="zone-lbl" style="margin-bottom:10px;color:#f05050">Debilidades</div>'+(weak.length?weak.map(s=>'<div class="rv-item">✘ '+s+'</div>').join(''):'<div class="zone-sub">Sin debilidades marcadas.</div>')+'</div></div>'+
    '<div class="sec">Jugadores a vigilar</div><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px">'+watch+'</div>'+
    '<div class="sec">Volumen de tiro y rebote (reparto del equipo)</div>'+
    '<div class="ficha-grid">'+
      '<div class="court-box"><div class="zone-lbl" style="margin-bottom:12px">Tiros tomados por jugador</div>'+rivalShareBars(rivalTeam,'fga','#34c769','#5fd98a')+'</div>'+
      '<div class="court-box"><div class="zone-lbl" style="margin-bottom:12px">Rebote ofensivo por jugador</div>'+rivalShareBars(rivalTeam,'ro','#f97316','#fb923c')+'</div>'+
    '</div>'+
    '<div class="sec">Claves del partido</div><div class="court-box">'+claves.map(c=>'<div class="rv-item">🔑 '+c+'</div>').join('')+'</div>'+
    '<div class="sec">Cómo nos anotó este rival</div><div class="court-box">'+defSec+'</div>'+
    '</div>';
}
function loadScript(src){return new Promise((res,rej)=>{if([...document.scripts].some(s=>s.src===src))return res();const sc=document.createElement('script');sc.src=src;sc.onload=res;sc.onerror=()=>rej(new Error('No se pudo cargar la librería (revisá tu conexión).'));document.head.appendChild(sc);});}
async function downloadRivalPDF(){
  const btn=document.getElementById('rivalPdfBtn');if(!btn)return;const old=btn.textContent;btn.textContent='Generando…';btn.disabled=true;
  try{
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    const node=document.getElementById('rival-report');
    const canvas=await html2canvas(node,{backgroundColor:'#08090d',scale:2,useCORS:true});
    const jsPDF=window.jspdf.jsPDF;
    const pdf=new jsPDF('p','pt','a4');
    const pw=pdf.internal.pageSize.getWidth(),ph=pdf.internal.pageSize.getHeight();
    const imgW=pw,imgH=canvas.height*pw/canvas.width;
    const img=canvas.toDataURL('image/png');
    let left=imgH,pos=0;
    pdf.addImage(img,'PNG',0,pos,imgW,imgH);left-=ph;
    while(left>0){pos-=ph;pdf.addPage();pdf.addImage(img,'PNG',0,pos,imgW,imgH);left-=ph;}
    pdf.save('Informe_'+String(rivalTeam).replace(/\s+/g,'_')+'.pdf');
  }catch(e){alert('No se pudo generar el PDF: '+(e.message||e));}
  btn.textContent=old;btn.disabled=false;
}

// ── VISTA REPARTO (Pareto por jugador) ──
let paretoTeam='',paretoMetric='ro';
const PARETO_METR=[{k:'ro',label:'Rebote ofensivo',unit:'reb of.'},{k:'fga',label:'Tiros tomados',unit:'tiros'},{k:'tpa',label:'Triples tomados',unit:'triples'},{k:'pts',label:'Puntos',unit:'pts'},{k:'reb',label:'Rebote total',unit:'reb'},{k:'ast',label:'Asistencias',unit:'ast'}];
function setParetoTeam(v){paretoTeam=v;renderPareto();}
function setParetoMetric(v){paretoMetric=v;renderPareto();}
function paretoChart(items){
  const W=680,H=330,M={l:40,r:46,t:18,b:78},n=items.length;
  const total=items.reduce((s,it)=>s+it.val,0)||1,maxVal=Math.max(...items.map(it=>it.val),1);
  const innerW=W-M.l-M.r,innerH=H-M.t-M.b,step=innerW/n,bw=Math.min(46,step*0.6);
  const cx=i=>M.l+step*(i+0.5),syL=v=>H-M.b-(v/maxVal)*innerH,syR=p=>H-M.b-(p/100)*innerH;
  let grid='';for(let i=0;i<=4;i++){const v=maxVal*i/4,y=syL(v).toFixed(1);
    grid+='<line x1="'+M.l+'" y1="'+y+'" x2="'+(W-M.r)+'" y2="'+y+'" stroke="rgba(255,255,255,0.05)"/>'+
      '<text x="'+(M.l-5)+'" y="'+(+y+3)+'" fill="#8891a0" font-size="8.5" text-anchor="end" font-family="DM Mono,monospace">'+Math.round(v)+'</text>';}
  let rax='';[0,25,50,75,100].forEach(p=>{const y=syR(p).toFixed(1);rax+='<text x="'+(W-M.r+6)+'" y="'+(+y+3)+'" fill="#f9a86b" font-size="8.5" text-anchor="start" font-family="DM Mono,monospace">'+p+'%</text>';});
  const l80='<line x1="'+M.l+'" y1="'+syR(80).toFixed(1)+'" x2="'+(W-M.r)+'" y2="'+syR(80).toFixed(1)+'" stroke="#f97316" stroke-opacity="0.45" stroke-dasharray="4 4"/>';
  let bars='',xl='',cum=0;const pts=[];
  items.forEach((it,i)=>{const x=cx(i),top=syL(it.val),share=Math.round(it.val/total*100);
    bars+='<rect x="'+(x-bw/2).toFixed(1)+'" y="'+top.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+(H-M.b-top).toFixed(1)+'" rx="2" fill="#34c769" fill-opacity="0.55"/>'+
      '<text x="'+x.toFixed(1)+'" y="'+(top-4).toFixed(1)+'" fill="#34c769" font-size="9" font-weight="800" text-anchor="middle" font-family="Barlow Condensed,sans-serif">'+share+'%</text>';
    cum+=it.val;const cp=Math.round(cum/total*100);pts.push([x,syR(cp),cp]);
    const lab=(it.num?'#'+it.num+' ':'')+String(it.name).split(' ')[0];
    xl+='<text transform="rotate(38 '+x.toFixed(1)+' '+(H-M.b+13)+')" x="'+x.toFixed(1)+'" y="'+(H-M.b+13)+'" fill="#aeb4c2" font-size="8.5" text-anchor="start" font-family="DM Mono,monospace">'+lab+'</text>';});
  const line='<polyline points="'+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')+'" fill="none" stroke="#f97316" stroke-width="2"/>';
  const dots=pts.map(p=>'<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3" fill="#f97316"/><text x="'+p[0].toFixed(1)+'" y="'+(p[1]-6).toFixed(1)+'" fill="#f9a86b" font-size="8" text-anchor="middle" font-family="DM Mono,monospace">'+p[2]+'%</text>').join('');
  const baseline='<line x1="'+M.l+'" y1="'+(H-M.b)+'" x2="'+(W-M.r)+'" y2="'+(H-M.b)+'" stroke="rgba(255,255,255,0.22)"/>';
  return '<svg class="court-svg" viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">'+grid+l80+bars+baseline+line+dots+xl+rax+'</svg>';
}
function renderPareto(){
  const el=document.getElementById('view-pareto');
  const pool=playersAgg().filter(p=>p.g>0);
  if(!pool.length){el.innerHTML='<div class="empty">No hay box scores individuales todavía. Re-guardá partidos desde Quintetos.</div>';return;}
  const teams=[...new Set(pool.map(p=>p.equipo))].sort();
  if(paretoTeam&&!teams.includes(paretoTeam))paretoTeam='';
  if(!paretoTeam)paretoTeam=teams[0];
  const m=PARETO_METR.find(x=>x.k===paretoMetric)||PARETO_METR[0];
  const sel='<div class="tiros-ctl"><span class="zone-lbl">Equipo</span><select onchange="setParetoTeam(this.value)">'+teams.map(t=>'<option'+(t===paretoTeam?' selected':'')+'>'+t+'</option>').join('')+'</select>'+
    '<span class="zone-lbl">Métrica</span><select onchange="setParetoMetric(this.value)">'+PARETO_METR.map(x=>'<option value="'+x.k+'"'+(x.k===paretoMetric?' selected':'')+'>'+x.label+'</option>').join('')+'</select></div>';
  const items=pool.filter(p=>p.equipo===paretoTeam&&(+p[paretoMetric]||0)>0).map(p=>({name:p.nombre,num:p.num,val:+p[paretoMetric]||0})).sort((a,b)=>b.val-a.val);
  if(!items.length){el.innerHTML=sel+'<div class="empty">'+paretoTeam+' no tiene datos de esa métrica.</div>';return;}
  const total=items.reduce((s,it)=>s+it.val,0);let cum=0;
  const rows=items.map((it,i)=>{cum+=it.val;return {...it,share:Math.round(it.val/total*100),acum:Math.round(cum/total*100),i:i+1};});
  el.innerHTML=sel+'<div class="sec">Reparto de '+m.label.toLowerCase()+' · '+paretoTeam+'</div>'+
    '<div class="court-box">'+paretoChart(items)+
    '<div class="zone-sub" style="margin-top:8px">Barras verdes = '+m.unit+' de cada jugador (su % del equipo arriba). Línea naranja = % acumulado. La cortada marca el 80%. Total del equipo: '+total+' '+m.unit+'.</div></div>'+
    '<div class="court-box" style="margin-top:14px;overflow-x:auto"><table class="bs-table"><thead><tr><th>#</th><th class="l">Jugador</th><th>'+m.unit+'</th><th>% equipo</th><th>% acum.</th></tr></thead><tbody>'+
    rows.map(r=>'<tr><td>'+r.i+'</td><td class="l">'+(r.num?'#'+r.num+' ':'')+r.name+'</td><td>'+r.val+'</td><td class="pc" style="color:#34c769">'+r.share+'%</td><td>'+r.acum+'%</td></tr>').join('')+'</tbody></table></div>';
}

function renderAll(){renderDashboard();renderLideres();renderFicha();renderBuscador();renderTiros();renderCorrel();renderCuartos();renderEquipo();renderComparar();renderDuplas();renderRival();renderPareto();renderJugadores();renderEvolucion();}

  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.v===v));
  document.querySelectorAll('.view').forEach(el=>el.classList.remove('active'));
