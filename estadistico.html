// ── VISTA: QUINTETO IDEAL POR SITUACIÓN ──
// Idea: no comparamos quintetos exactos (poca muestra), sino TIPOS de quinteto.
// 1) Cada quinteto se clasifica Alto/Bajo según un criterio que elige el usuario.
// 2) Para cada situación (rival, cuarto, marcador) sumamos los tramos de cada tipo
//    y comparamos el NET (EF.OF − EF.DEF). Así se ve qué TIPO conviene en cada caso.
let sitTeam='',sitDim='rival',sitCrit='ritmo',sitCut='auto';
const SIT_MIN=4;        // minutos mínimos para clasificar un quinteto
const SIT_MIN_CELL=6;   // por debajo de esto, una celda se marca como muestra chica
const SIT_CRITS={
  ritmo:{lbl:'Ritmo · posesiones por 40\'', short:'ritmo', val:a=>a.min>0?a.pos/a.min*40:0, dec:1, hi:'de ritmo alto', lo:'de ritmo bajo'},
  triple:{lbl:'Volumen de triple · % de tiros que son de 3', short:'volumen de 3', val:a=>{const fga=a.pt2i+a.pt3i;return fga>0?a.pt3i/fga*100:0;}, dec:1, suf:'%', hi:'tiradores', lo:'de adentro'},
  rebof:{lbl:'Rebote ofensivo · rebotes of. por 40\'', short:'rebote of.', val:a=>a.min>0?a.ro/a.min*40:0, dec:1, hi:'reboteadores', lo:'livianos'},
  gen:{lbl:'Generación · asistencias por posesión', short:'ast/pos', val:a=>a.pos>0?a.ast/a.pos:0, dec:2, hi:'asociadores', lo:'directos'},
  seg:{lbl:'Cuidado de la pelota · pérdidas por posesión', short:'pér/pos', val:a=>a.pos>0?a.per/a.pos:0, dec:2, hi:'descuidados', lo:'seguros'},
  def:{lbl:'Perfil defensivo · puntos que concede por posesión', short:'ef.def', val:a=>a.efDef||0, dec:2, hi:'permisivos', lo:'firmes'},
};
function setSitTeam(v){sitTeam=v;renderSituacion();}
function setSitDim(v){sitDim=v;renderSituacion();}
function setSitCrit(v){sitCrit=v;sitCut='auto';renderSituacion();}
function setSitCut(v){sitCut=(v===''||v==null)?'auto':v;renderSituacion();}
function sitNet(a){return (a.efOff||0)-(a.efDef||0);}
function sitMedian(arr){if(!arr.length)return 0;const s=arr.slice().sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2;}

function renderSituacion(){
  const el=document.getElementById('view-situacion');if(!el)return;
  if(!DATA.length){el.innerHTML='<div class="empty">No hay quintetos cargados.</div>';return;}
  const teams=[...new Set(DATA.map(r=>r.equipo))].sort();
  if(sitTeam&&!teams.includes(sitTeam))sitTeam='';
  if(!sitTeam)sitTeam=(document.getElementById('selTeam')||{}).value||teams[0];
  const rows=teamRows(sitTeam).filter(r=>Array.isArray(r.jugadores)&&r.jugadores.length===5);

  // ── 1) clasificar cada quinteto (muestra completa) por el criterio elegido ──
  const crit=SIT_CRITS[sitCrit];
  const groups={};
  rows.forEach(r=>{const k=r.jugadores_key||pkeyArr(r.jugadores);(groups[k]=groups[k]||{players:r.jugadores,rows:[]}).rows.push(r);});
  const lus=Object.entries(groups).map(([k,g])=>{const a=agg(g.rows);return {k,players:g.players,a,val:crit.val(a)};});
  const elig=lus.filter(l=>l.a.min>=SIT_MIN);
  const cut=(sitCut==='auto')?sitMedian(elig.map(l=>l.val)):(+sitCut||0);
  const classOf={};
  elig.forEach(l=>{classOf[l.k]=l.val>=cut?'hi':'lo';});

  // ── controles ──
  const teamSel='<div class="tiros-ctl"><span class="zone-lbl">Equipo</span>'+
    '<select onchange="setSitTeam(this.value)">'+teams.map(t=>'<option'+(t===sitTeam?' selected':'')+'>'+t+'</option>').join('')+'</select>'+
    '<span class="zone-lbl" style="margin-left:8px">Situación</span>'+
    '<select onchange="setSitDim(this.value)">'+
      ['rival|Contra cada rival','cuarto|Por cuarto','marcador|Ganando vs perdiendo']
        .map(o=>{const[v,t]=o.split('|');return '<option value="'+v+'"'+(v===sitDim?' selected':'')+'>'+t+'</option>';}).join('')+
    '</select></div>';
  const critSel='<div class="tiros-ctl" style="margin-top:8px"><span class="zone-lbl">Tipo de quinteto según</span>'+
    '<select onchange="setSitCrit(this.value)">'+Object.entries(SIT_CRITS).map(([v,c])=>'<option value="'+v+'"'+(v===sitCrit?' selected':'')+'>'+c.lbl+'</option>').join('')+'</select>'+
    '<span class="zone-lbl" style="margin-left:8px">Corte</span>'+
    '<select onchange="setSitCut(this.value===\'auto\'?\'auto\':document.getElementById(\'sitCutN\').value)">'+
      '<option value="auto"'+(sitCut==='auto'?' selected':'')+'>Automático (mediana)</option>'+
      '<option value="manual"'+(sitCut!=='auto'?' selected':'')+'>Manual…</option></select>'+
    '<input id="sitCutN" type="number" step="any" value="'+(sitCut==='auto'?cut.toFixed(crit.dec):sitCut)+'" '+
      'oninput="setSitCut(this.value)" style="width:90px;background:var(--bg-raised);border:1px solid var(--border-light);border-radius:var(--r);padding:7px 9px;color:var(--text);font-family:var(--font-mono);font-size:12px"'+
      (sitCut==='auto'?' disabled':'')+'>'+
    '<span class="zone-sub" style="margin-left:auto">Corte usado: <b>'+cut.toFixed(crit.dec)+(crit.suf||'')+'</b> · quintetos clasificados: '+elig.length+'/'+lus.length+'</span></div>';

  // ── miembros de cada tipo ──
  const fmt=v=>v.toFixed(crit.dec)+(crit.suf||'');
  const memCard=(cls,title,clsCol)=>{
    const list=elig.filter(l=>classOf[l.k]===cls).sort((a,b)=>(b.val-a.val)*(cls==='hi'?1:-1));
    const items=list.length?list.map(l=>'<div class="lu-item"><div class="lu-body"><div class="lu-chips">'+chips(l.players)+'</div>'+
      '<div class="lu-meta">'+crit.short+' '+fmt(l.val)+' · '+Math.round(l.a.min)+' min · NET '+sitNet(l.a).toFixed(2)+'</div></div></div>').join(''):
      '<div class="zone-sub" style="font-size:11px">Ninguno por encima del mínimo de minutos.</div>';
    return '<div class="lu-card '+clsCol+'"><div class="lu-h">'+title+'</div>'+items+'</div>';
  };
  const buckets='<div class="sec">Cómo quedaron clasificados</div>'+
    '<div class="zone-sub" style="margin-bottom:6px">El "tipo" se calcula con la muestra completa de cada quinteto ('+SIT_MIN+'+ min juntos). Después se cruza con la situación.</div>'+
    '<div class="arm-dest">'+
      memCard('hi','▲ Quintetos '+crit.hi,'good')+
      memCard('lo','▼ Quintetos '+crit.lo,'bad')+
    '</div>';

  // ── 2) cruce situación × tipo ──
  let body='';
  if(sitDim==='cuarto'&&!DATA.some(r=>r.cuarto!=null)){
    body=sitMissing('por cuarto','cuarto',
      'Hoy cada quinteto está sumado por TODO el partido, no por cuarto. Para abrir esto necesitás que <b>Quintetos</b> guarde un tramo por cada cuarto.',
      'alter table quintetos_log add column if not exists cuarto int;',
      'En el guardado, escribí una fila por (quinteto × cuarto) con su <code>cuarto</code> (1–4, 5+ para alargues). Cuando re-guardes los partidos, esta vista se prende sola.');
  }else if(sitDim==='marcador'&&!DATA.some(r=>r.margen!=null)){
    body=sitMissing('ganando vs perdiendo','margen',
      'Falta saber con qué diferencia en el marcador jugó cada quinteto. Hay que guardar el margen promedio (puntos propios − rival) mientras ese cinco estuvo en cancha.',
      'alter table quintetos_log add column if not exists margen numeric;',
      'En el guardado, calculá <code>margen</code> = (tanteador propio − rival) promedio del tramo. Al re-guardar, agrupo en <b>ganando</b> (+4 o más), <b>parejo</b> (±3) y <b>perdiendo</b> (−4 o menos).');
  }else{
    const sitOf = sitDim==='rival'   ? (r=>r.rival||null)
               : sitDim==='cuarto'  ? (r=>r.cuarto!=null?('Cuarto '+r.cuarto):null)
               : (r=>{const m=r.margen;if(m==null)return null;return m>=4?'Ganando (+4 o más)':m<=-4?'Perdiendo (−4 o menos)':'Parejo (±3)';});
    const sits={};
    rows.forEach(r=>{const s=sitOf(r);if(s==null||s==='')return;const k=r.jugadores_key||pkeyArr(r.jugadores);const cls=classOf[k];if(!cls)return;(sits[s]=sits[s]||{hi:[],lo:[]})[cls].push(r);});
    let mat=Object.entries(sits).map(([s,o])=>{const hi=agg(o.hi),lo=agg(o.lo);return {sit:s,hi,lo,nHi:sitNet(hi),nLo:sitNet(lo),mHi:hi.min,mLo:lo.min,delta:sitNet(hi)-sitNet(lo)};});
    mat=mat.filter(m=>m.mHi>0||m.mLo>0).sort((a,b)=>b.delta-a.delta);

    if(!mat.length){
      body='<div class="empty" style="padding:30px">No hay tramos suficientes para cruzar. Probá con otro criterio o bajá el mínimo de minutos.</div>';
    }else{
      // pooled
      const allHi=[],allLo=[];rows.forEach(r=>{const cls=classOf[r.jugadores_key||pkeyArr(r.jugadores)];if(cls==='hi')allHi.push(r);else if(cls==='lo')allLo.push(r);});
      const pHi=agg(allHi),pLo=agg(allLo),pd=sitNet(pHi)-sitNet(pLo);
      const verdict=Math.abs(pd)<0.02
        ? 'En general rinden parejo; lo que manda es la situación de abajo.'
        : 'En conjunto conviene el quinteto <b>'+(pd>0?crit.hi:crit.lo)+'</b>: NET '+sgn2(Math.abs(pd))+' por encima del otro tipo. Igual, mirá fila por fila — casi siempre depende de la situación.';
      const cell=(net,min)=>{const muestra=min>0&&min<SIT_MIN_CELL;return min<=0?'<span style="color:var(--text-3)">—</span>':
        '<span style="color:'+dc(net)+'">'+net.toFixed(2)+'</span><span style="color:var(--text-3);font-size:11px"> · '+Math.round(min)+'m'+(muestra?' ⚠':'')+'</span>';};
      const head='<th class="l">'+({rival:'Rival',cuarto:'Momento',marcador:'Marcador'}[sitDim])+'</th>'+
        '<th>▲ '+crit.hi+'<br><span style="font-weight:400;color:var(--text-3)">NET · min</span></th>'+
        '<th>▼ '+crit.lo+'<br><span style="font-weight:400;color:var(--text-3)">NET · min</span></th>'+
        '<th>Δ (▲−▼)</th><th class="l">Quién conviene</th>';
      const rowsHtml=mat.map(m=>{
        const conv=m.mHi<=0?('▼ '+crit.lo):m.mLo<=0?('▲ '+crit.hi):(m.delta>0.02?'▲ '+crit.hi:m.delta<-0.02?'▼ '+crit.lo:'parejo');
        return '<tr><td class="l"><b>'+m.sit+'</b></td>'+
          '<td>'+cell(m.nHi,m.mHi)+'</td><td>'+cell(m.nLo,m.mLo)+'</td>'+
          '<td style="color:'+dc(m.delta)+'">'+(m.mHi>0&&m.mLo>0?sgn2(m.delta):'—')+'</td>'+
          '<td class="l">'+conv+'</td></tr>';
      }).join('');
      const table='<div class="board"><div class="board-title">Tipo de quinteto que conviene · '+({rival:'por rival',cuarto:'por momento',marcador:'por marcador'}[sitDim])+'</div>'+
        '<div class="tblwrap"><table class="t"><thead><tr>'+head+'</tr></thead><tbody>'+rowsHtml+'</tbody></table></div></div>';
      body='<div class="sec">Lectura general</div>'+
        '<div class="kpis ficha-kpis">'+
          kpi(sitNet(pHi).toFixed(2),'NET ▲ '+crit.hi.toUpperCase(),'acc')+
          kpi(sitNet(pLo).toFixed(2),'NET ▼ '+crit.lo.toUpperCase(),'def')+
          kpi(sgn2(pd),'DIFERENCIA',pd>=0?'pos':'neg')+'</div>'+
        '<div class="court-box" style="margin:8px 0 4px">'+verdict+'</div>'+
        '<div class="sec">'+({rival:'Contra cada rival',cuarto:'Por momento del partido',marcador:'Según el marcador'}[sitDim])+'</div>'+
        '<div class="zone-sub" style="margin-bottom:6px">NET = puntos por posesión a favor − en contra (más alto = mejor). ⚠ = pocos minutos, tomalo con pinzas. Ordenado por dónde más se nota la diferencia.</div>'+
        table;
    }
  }

  el.innerHTML=
    '<div class="sec">Quinteto ideal por situación · '+sitTeam+'</div>'+
    '<div class="zone-sub" style="margin-bottom:8px">En vez de comparar los 5 nombres exactos (poca muestra), clasificamos los quintetos por <b>tipo</b> y miramos qué tipo rinde mejor en cada situación. Vos elegís el criterio.</div>'+
    teamSel+critSel+body+buckets;
}

let partidoSel='';
function setPartido(v){partidoSel=v;renderPartido();}
function renderPartido(){
  const el=document.getElementById('view-partido');if(!el)return;
  if(!DATA.length){el.innerHTML='<div class="empty">No hay partidos cargados.</div>';return;}
  const fase=document.getElementById('selFase').value;
  const pool=DATA.filter(r=>!fase||r.fase===fase);
  const mids=[...new Set(pool.map(r=>r.match_id))].filter(Boolean);
  const mLabel=mid=>{const r=pool.filter(x=>x.match_id===mid);const eqs=[...new Set(r.map(x=>x.equipo))];const f=(r[0]&&r[0].fecha)||'';return (f?f+' · ':'')+eqs.join(' vs ');};
  const mObjs=mids.map(mid=>({mid,lbl:mLabel(mid),fecha:(pool.find(x=>x.match_id===mid)||{}).fecha||''})).sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)));
  if(partidoSel&&!mids.includes(partidoSel))partidoSel='';
  if(!partidoSel&&mObjs.length)partidoSel=mObjs[0].mid;
  const selHtml='<div class="tiros-ctl"><span class="zone-lbl">Partido</span><select onchange="setPartido(this.value)">'+mObjs.map(m=>'<option value="'+m.mid+'"'+(m.mid===partidoSel?' selected':'')+'>'+m.lbl+'</option>').join('')+'</select></div>';
  if(!partidoSel){el.innerHTML=selHtml+'<div class="empty">Sin partidos.</div>';return;}
  const teams=[...new Set(pool.filter(r=>r.match_id===partidoSel).map(r=>r.equipo))];
  const plRows=PLAYERS.filter(r=>r.match_id===partidoSel);
  const boxFor=team=>{
    const ps=plRows.filter(r=>r.equipo===team).sort((x,y)=>(+y.pts||0)-(+x.pts||0));
    if(!ps.length)return '<div class="zone-sub" style="margin:4px 0 14px">Sin box score de este equipo.</div>';
    const body=ps.map(p=>'<tr><td class="l"><span class="pchip"><span class="pn">'+(p.num||'·')+'</span>'+(p.nombre||'')+'</span></td><td>'+Math.round(+p.min||0)+'</td><td>'+(+p.pts||0)+'</td><td>'+(+p.reb||0)+'</td><td>'+(+p.ast||0)+'</td><td>'+(+p.rob||0)+'</td><td>'+(+p.tap||0)+'</td><td>'+(+p.per||0)+'</td><td style="color:'+dc(+p.mas_menos||0)+'">'+sgn(+p.mas_menos||0)+'</td></tr>').join('');
    return '<div class="tblwrap"><table class="t"><thead><tr><th class="l">Jugador</th><th>MIN</th><th>PTS</th><th>REB</th><th>AST</th><th>ROB</th><th>TAP</th><th>PER</th><th>+/-</th></tr></thead><tbody>'+body+'</tbody></table></div>';
  };
  const qRows=QUARTERS.filter(r=>r.match_id===partidoSel);
  let quartersHtml='';
  if(qRows.length){
    const byTeam={};qRows.forEach(r=>{(byTeam[r.equipo]=byTeam[r.equipo]||{})[+r.cuarto]=(+r.pts_favor||0);});
    const qs=[...new Set(qRows.map(r=>+r.cuarto))].sort((a,b)=>a-b);
    const head='<tr><th class="l">Equipo</th>'+qs.map(q=>'<th>Q'+q+'</th>').join('')+'<th>TOT</th></tr>';
    const body=Object.keys(byTeam).map(t=>{const tot=qs.reduce((s,q)=>s+(byTeam[t][q]||0),0);return '<tr><td class="l"><b>'+t+'</b></td>'+qs.map(q=>'<td>'+(byTeam[t][q]||0)+'</td>').join('')+'<td><b>'+tot+'</b></td></tr>';}).join('');
    quartersHtml='<div class="sec">Parciales por cuarto</div><div class="tblwrap"><table class="t"><thead>'+head+'</thead><tbody>'+body+'</tbody></table></div>';
  }
  const shots=SHOTS.filter(s=>s.match_id===partidoSel);
  const shotsHtml=shots.length?('<div class="sec">Mapa de tiros del partido</div><div class="court-box">'+courtSVGFull(shots)+'</div>'):'';
  let scoreHtml='';
  if(teams.length===2){
    const sc=t=>plRows.filter(r=>r.equipo===t).reduce((s,p)=>s+(+p.pts||0),0);
    scoreHtml='<div class="court-box" style="display:flex;justify-content:center;gap:20px;align-items:center;margin-bottom:12px">'+
      '<div style="flex:1;text-align:right;font-family:var(--font-disp);font-weight:800;font-size:19px">'+teams[0]+'</div>'+
      '<div style="font-family:var(--font-disp);font-weight:900;font-size:30px;letter-spacing:1px">'+sc(teams[0])+' – '+sc(teams[1])+'</div>'+
      '<div style="flex:1;text-align:left;font-family:var(--font-disp);font-weight:800;font-size:19px">'+teams[1]+'</div></div>';
  }
  const box=teams.map(t=>'<div class="sec">Box score · '+t+'</div>'+boxFor(t)).join('');
  el.innerHTML=selHtml+scoreHtml+box+quartersHtml+shotsHtml;
}

async function enviarSolicitud(){
  const msg=document.getElementById('ssMsg');
  const nombre=(document.getElementById('ssNombre').value||'').trim();
  const apellido=(document.getElementById('ssApellido').value||'').trim();
  const correo=(document.getElementById('ssCorreo').value||'').trim();
  const club=(document.getElementById('ssClub').value||'').trim();
  if(!nombre||!apellido||!correo||!club){if(msg){msg.style.color='var(--negative)';msg.textContent='Completá los 4 campos.';}return;}
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(correo)){if(msg){msg.style.color='var(--negative)';msg.textContent='El correo no parece válido.';}return;}
  const c=getSB();
  try{const r=await c.from('perfiles').insert([{nombre,apellido,correo,club,estado:'pendiente'}]);if(r.error)throw r.error;}
  catch(e){if(msg){msg.style.color='var(--negative)';msg.textContent='No se pudo enviar: '+(e.message||e);}return;}
  document.getElementById('adminBody').innerHTML='<div class="adm-login" style="text-align:center"><div style="font-size:38px;margin-bottom:8px">✅</div><p style="color:var(--text);font-size:15px;margin:0 0 6px">¡Solicitud enviada!</p><p class="zone-sub">Tu perfil quedó pendiente. El administrador lo va a revisar y aprobar.</p><div class="adm-altlink"><a onclick="adminClose()">Cerrar</a></div></div>';
}
async function adminLogin(){
  const c=getSB();
  const email=(document.getElementById('admEmail').value||'').trim();
  const pass=document.getElementById('admPass').value||'';
  if(!email||!pass){renderAdminLogin('Completá email y contraseña.');return;}
  let r;try{r=await c.auth.signInWithPassword({email,password:pass});}catch(e){renderAdminLogin('Error de conexión.');return;}
  if(r.error){renderAdminLogin('Email o contraseña incorrectos.');return;}
  const userEmail=(r.data&&r.data.user?r.data.user.email:email).toLowerCase();
  if(userEmail!==ADMIN_EMAIL){try{await c.auth.signOut();}catch(e){}renderAdminLogin('Esta cuenta no tiene acceso de administrador.');return;}
  renderAdmin();
}
async function adminLogout(){const c=getSB();try{await c.auth.signOut();}catch(e){}renderAdminLogin('Sesión cerrada.');}
function dbStatus(){
  const M={};
  const add=(arr,key)=>{(arr||[]).forEach(r=>{const id=r.match_id||'?';const m=M[id]||(M[id]={id,fecha:r.fecha||'',teams:new Set(),q:0,j:0,t:0,c:0});if(r.equipo)m.teams.add(r.equipo);if(r.rival)m.teams.add(r.rival);if(r.fecha&&!m.fecha)m.fecha=r.fecha;m[key]++;});};
  add(DATA,'q');add(PLAYERS,'j');add(SHOTS,'t');add(QUARTERS,'c');
  return Object.values(M).sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)));
}

  if(sug.length){
    html+=sug.map(s=>'<div class="merge-box"><div class="merge-q">¿Es el mismo jugador? <b>'+s.equipo+' · #'+s.num+'</b> aparece con nombres distintos:</div>'+
      '<div class="merge-names">'+s.variants.map(v=>'<span class="merge-name">'+v+'</span>').join('<span class="merge-sep">·</span>')+'</div>'+
      '<div class="merge-btns"><button class="merge-yes" onclick="confirmMerge(\''+escAttr(s.equipo)+'\',\''+escAttr(s.num)+'\')">✓ Sí, es el mismo (unir)</button>'+
      '<button class="merge-no" onclick="dismissMerge(\''+escAttr(s.equipo)+'\',\''+escAttr(s.num)+'\')">✕ Son distintos</button></div></div>').join('');
  }else{
    html+='<div class="empty" style="padding:18px">✓ No hay jugadores dudosos nuevos.</div>';
  }
  if(merged.length){
    html+='<div class="sec" style="margin-top:18px">Uniones confirmadas por vos</div><div class="merge-done">'+
      merged.map(x=>{const p=x.split('|'),eq=p[0],nu=p[1];return '<span class="merge-tag">'+eq+' #'+nu+' <button onclick="undoMerge(\''+escAttr(eq)+'\',\''+escAttr(nu)+'\')" title="Deshacer">↺</button></span>';}).join(' ')+'</div>';
  }
  sub.innerHTML=html;
}
function renderAdminEstado(){
  const rows=dbStatus(),sub=document.getElementById('admSub');
  const kpis='<div class="adm-kpis">'+
    '<div class="adm-kpi"><div class="n">'+rows.length+'</div><div class="l">Partidos</div></div>'+
    '<div class="adm-kpi"><div class="n">'+DATA.length+'</div><div class="l">Quintetos</div></div>'+
    '<div class="adm-kpi"><div class="n">'+PLAYERS.length+'</div><div class="l">Jugadores</div></div>'+
    '<div class="adm-kpi"><div class="n">'+SHOTS.length+'</div><div class="l">Tiros</div></div>'+
    '<div class="adm-kpi"><div class="n">'+QUARTERS.length+'</div><div class="l">Cuartos</div></div>'+
    '<div class="adm-kpi"><div class="n">'+DEF.length+'</div><div class="l">Defensa</div></div></div>';
  if(!rows.length){sub.innerHTML=kpis+'<div class="empty">No hay partidos cargados todavía.</div>';return;}
  const ck=v=>v>0?'<span class="adm-ok">'+v+'</span>':'<span class="adm-bad">0</span>';
  const trs=rows.map(m=>{
    const faltan=[];if(!m.q)faltan.push('quintetos');if(!m.j)faltan.push('jugadores');if(!m.t)faltan.push('tiros');if(!m.c)faltan.push('cuartos');
    const estado=faltan.length?'<span class="adm-warn">⚠ falta '+faltan.join(', ')+'</span>':'<span class="adm-ok">✓ completo</span>';
    return '<tr><td class="l">'+(m.fecha||'s/f')+'</td><td class="l">'+([...m.teams].join(' vs ')||m.id)+'</td><td>'+ck(m.q)+'</td><td>'+ck(m.j)+'</td><td>'+ck(m.t)+'</td><td>'+ck(m.c)+'</td><td class="l">'+estado+'</td></tr>';
  }).join('');
  sub.innerHTML=kpis+'<div style="overflow-x:auto"><table class="adm-table"><thead><tr><th class="l">Fecha</th><th class="l">Partido</th><th>Quint.</th><th>Jug.</th><th>Tiros</th><th>Cuartos</th><th class="l">Estado</th></tr></thead><tbody>'+trs+'</tbody></table></div>'+
    '<div class="zone-sub" style="margin-top:12px">Si a un partido le falta <b>tiros</b> o <b>cuartos</b>, re-guardalo desde Quintetos (cargá ese partido y tocá «Guardar en base»): completa todo de una.</div>';
}
async function loadPerfiles(){const c=getSB();try{const r=await c.from('perfiles').select('*').order('created_at',{ascending:true});PERFILES=r.error?[]:(r.data||[]);}catch(e){PERFILES=[];}}
function esAprobado(p){return (p.estado||'aprobado')==='aprobado';}
async function renderAdminPerfiles(){
  const sub=document.getElementById('admSub');
  sub.innerHTML='<div class="zone-sub">Cargando perfiles…</div>';
  await loadPerfiles();
  const pend=PERFILES.filter(p=>!esAprobado(p)),aprob=PERFILES.filter(esAprobado);
  let html='<div class="adm-kpis">'+
    '<div class="adm-kpi"><div class="n">'+aprob.length+'</div><div class="l">Aprobados</div></div>'+
    '<div class="adm-kpi"><div class="n adm-warn">'+pend.length+'</div><div class="l">Pendientes</div></div></div>';
  // pendientes
  if(pend.length){
    html+='<div style="font-family:var(--font-disp);font-weight:800;font-size:15px;margin:6px 0 10px;text-transform:uppercase;color:#e0a83b">Pendientes de aprobación</div>'+
      '<table class="adm-table" style="margin-bottom:20px"><thead><tr><th class="l">Nombre</th><th class="l">Correo</th><th class="l">Club</th><th></th></tr></thead><tbody>'+
      pend.map(p=>'<tr><td class="l">'+(p.nombre||'')+' '+(p.apellido||'')+'</td><td class="l">'+(p.correo||'')+'</td><td class="l">'+(p.club||'')+'</td>'+
        '<td style="white-space:nowrap"><button class="adm-ap" onclick="aprobarPerfil('+p.id+')">✓ Aprobar</button> <button class="adm-del" onclick="borrarPerfil('+p.id+')">✕</button></td></tr>').join('')+
      '</tbody></table>';
  }
  // aprobados
  html+='<div style="font-family:var(--font-disp);font-weight:800;font-size:15px;margin:6px 0 10px;text-transform:uppercase">Perfiles aprobados</div>';
  html+=aprob.length?('<table class="adm-table" style="margin-bottom:18px"><thead><tr><th class="l">Nombre</th><th class="l">Correo</th><th class="l">Club</th><th></th></tr></thead><tbody>'+
    aprob.map(p=>'<tr><td class="l">'+(p.nombre||'')+' '+(p.apellido||'')+'</td><td class="l">'+(p.correo||'')+'</td><td class="l">'+(p.club||'')+'</td><td><button class="adm-del" onclick="borrarPerfil('+p.id+')">✕</button></td></tr>').join('')+
    '</tbody></table>'):'<div class="zone-sub" style="margin-bottom:16px">Todavía no hay perfiles aprobados.</div>';
  // alta directa por admin (queda aprobado)
  html+='<div style="font-family:var(--font-disp);font-weight:800;font-size:15px;margin:14px 0 12px;text-transform:uppercase">Crear perfil (queda aprobado)</div>'+
    '<div class="adm-formgrid">'+
      '<input id="pfNombre" class="adm-inp" placeholder="Nombre">'+
      '<input id="pfApellido" class="adm-inp" placeholder="Apellido">'+
      '<input id="pfCorreo" class="adm-inp" type="email" placeholder="Correo">'+
      '<input id="pfClub" class="adm-inp" placeholder="Club al que pertenece">'+
    '</div><button class="adm-btn" style="max-width:220px" onclick="crearPerfil()">+ Crear perfil</button><div id="pfMsg" class="adm-msg" style="text-align:left"></div>';
  sub.innerHTML=html;
}
async function crearPerfil(){
  const msg=document.getElementById('pfMsg');
  const nombre=(document.getElementById('pfNombre').value||'').trim();
  const apellido=(document.getElementById('pfApellido').value||'').trim();
  const correo=(document.getElementById('pfCorreo').value||'').trim();
  const club=(document.getElementById('pfClub').value||'').trim();
  if(!nombre||!apellido||!correo||!club){if(msg){msg.style.color='var(--negative)';msg.textContent='Completá los 4 campos.';}return;}
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(correo)){if(msg){msg.style.color='var(--negative)';msg.textContent='El correo no parece válido.';}return;}
  const c=getSB();
  try{const r=await c.from('perfiles').insert([{nombre,apellido,correo,club,estado:'aprobado'}]);if(r.error)throw r.error;}
  catch(e){if(msg){msg.style.color='var(--negative)';msg.textContent='No se pudo guardar: '+(e.message||e);}return;}
  renderAdminPerfiles();
}
async function aprobarPerfil(id){
  const c=getSB();try{await c.from('perfiles').update({estado:'aprobado'}).eq('id',id);}catch(e){}
  renderAdminPerfiles();
}
async function borrarPerfil(id){
  if(!confirm('¿Borrar este perfil?'))return;
  const c=getSB();try{await c.from('perfiles').delete().eq('id',id);}catch(e){}
  renderAdminPerfiles();
}

function normTeamKey(s){return String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');}
function clubLogo(team){const k=normTeamKey(team);if(CLUB_LOGOS[k])return CLUB_LOGOS[k];for(const key in CLUB_LOGOS){if(k&&(k.indexOf(key)===0||key.indexOf(k)===0))return CLUB_LOGOS[key];}return null;}
function clubBadge(team,extra){const lg=clubLogo(team);const cls='club-badge '+(extra||'');if(lg)return '<span class="'+cls+' has-logo"><img src="'+lg+'" alt=""></span>';return '<span class="'+cls+'" style="background:'+clubColor(team)+'">'+clubInitials(team)+'</span>';}

function clubInitials(club){const w=String(club||'').trim().split(/\s+/).filter(Boolean);if(!w.length)return '?';if(w.length===1)return w[0].slice(0,2).toUpperCase();return (w[0][0]+w[1][0]).toUpperCase();}
function clubColor(club){let h=0;const s=String(club||'');for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%360;return 'hsl('+h+',52%,46%)';}
function renderPerspBanner(){
  const b=document.getElementById('perspBanner');if(!b)return;
  if(typeof COACH!=='undefined'&&COACH&&COACH.club){
    b.style.display='block';
    b.innerHTML='<div style="display:flex;align-items:center;gap:10px;background:linear-gradient(90deg,rgba(167,139,250,.12),rgba(167,139,250,.03));border:1px solid rgba(167,139,250,.28);border-radius:8px;padding:9px 14px;margin-bottom:12px">'+
      clubBadge(COACH.club)+
      '<span style="font-family:var(--font-mono);font-size:11px;color:var(--text-2);letter-spacing:.4px">VIENDO LA LIGA DESDE</span>'+
      '<b style="font-family:var(--font-disp);font-weight:800;font-size:17px;color:var(--text);letter-spacing:.3px">'+COACH.club+'</b>'+
      '<span style="margin-left:auto;font-size:11px;color:var(--text-2)">tu club · todo se lee como «nosotros»</span>'+
      '</div>';
  }else{
    b.style.display='block';
    b.innerHTML='<div style="display:flex;align-items:center;gap:8px;background:var(--bg-panel);border:1px dashed var(--border-light);border-radius:8px;padding:8px 14px;margin-bottom:12px">'+
      '<span style="font-size:13px;color:var(--text-2)">👤 Entrá con tu usuario para ver la liga desde la óptica de tu club.</span>'+
      '<button class="coach-in" style="margin-left:auto" onclick="coachOpen()">Ingresar</button>'+
      '</div>';
  }
}
function renderCoachChip(){
  const el=document.getElementById('coachChip');if(!el)return;
  if(COACH&&COACH.club){
    el.className='coach-chip on';
    el.innerHTML=clubBadge(COACH.club)+
      '<span class="coach-meta"><b>'+COACH.club+'</b><span>'+((COACH.nombre||'')+' '+(COACH.apellido||'')).trim()+'</span></span>'+
      '<button class="coach-out" onclick="coachLogout()" title="Cerrar sesión">✕</button>';
  }else{
    el.className='coach-chip';
    el.innerHTML='<button class="coach-in" onclick="coachOpen()">👤 Ingresar</button>';
  }
}
function coachOpen(){renderCoachLogin('');document.getElementById('coachOverlay').style.display='flex';}
function coachClose(){document.getElementById('coachOverlay').style.display='none';}
function renderCoachLogin(msg){
  document.getElementById('coachBody').innerHTML=
    '<div class="adm-login">'+
      '<p class="zone-sub" style="margin-bottom:14px">Ingresá con el correo de tu perfil (el que aprobó el admin).</p>'+
      '<input id="coEmail" class="adm-inp" type="email" placeholder="Tu correo" autocomplete="username" onkeydown="if(event.key===\'Enter\')coachLogin()">'+
      '<button class="adm-btn" onclick="coachLogin()">Entrar</button>'+
      (msg?'<div class="adm-msg" style="text-align:left">'+msg+'</div>':'')+
      '<div class="adm-altlink">¿No tenés perfil? <a onclick="renderCoachSignup(\'\')">Creá el tuyo</a></div>'+
    '</div>';
  const e=document.getElementById('coEmail');if(e)e.focus();
}
async function coachLogin(){
  const email=(document.getElementById('coEmail').value||'').trim();
  if(!email){renderCoachLogin('Ingresá tu correo.');return;}
  const c=getSB();let data=[];
  try{const r=await c.from('perfiles').select('*').ilike('correo',email);data=r.error?[]:(r.data||[]);}catch(e){}
  const p=data[0];
  if(!p){renderCoachLogin('No encontramos un perfil con ese correo. Pedile al admin que te cree o apruebe uno.');return;}
  if((p.estado||'aprobado')!=='aprobado'){renderCoachLogin('Tu perfil todavía está pendiente de aprobación del admin.');return;}
  COACH={nombre:p.nombre,apellido:p.apellido,correo:p.correo,club:p.club};saveCoach();
  coachClose();renderCoachChip();renderPerspBanner();coachTrySelectTeam();
}
function coachLogout(){COACH=null;saveCoach();renderCoachChip();renderPerspBanner();if(DATA&&DATA.length)renderAll();}
function renderCoachSignup(msg){
  document.getElementById('coachBody').innerHTML=
    '<div class="adm-login">'+
      '<p class="zone-sub" style="margin-bottom:14px">Cargá tus datos. El perfil queda <b>pendiente</b> hasta que el admin lo apruebe.</p>'+
      '<div class="adm-formgrid"><input id="csNombre" class="adm-inp" placeholder="Nombre"><input id="csApellido" class="adm-inp" placeholder="Apellido"><input id="csCorreo" class="adm-inp" type="email" placeholder="Correo"><input id="csClub" class="adm-inp" placeholder="Club al que pertenece"></div>'+
      '<button class="adm-btn" onclick="enviarSolicitudCoach()">Enviar solicitud</button>'+
      '<div class="adm-msg" id="csMsg" style="text-align:left">'+(msg||'')+'</div>'+
      '<div class="adm-altlink"><a onclick="renderCoachLogin(\'\')">← Volver</a></div>'+
    '</div>';
}
async function enviarSolicitudCoach(){
  const g=id=>(document.getElementById(id).value||'').trim(),msg=document.getElementById('csMsg');
  const nombre=g('csNombre'),apellido=g('csApellido'),correo=g('csCorreo'),club=g('csClub');
  if(!nombre||!apellido||!correo||!club){msg.style.color='var(--negative)';msg.textContent='Completá los 4 campos.';return;}
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(correo)){msg.style.color='var(--negative)';msg.textContent='El correo no parece válido.';return;}
  const c=getSB();
  try{const r=await c.from('perfiles').insert([{nombre,apellido,correo,club,estado:'pendiente'}]);if(r.error)throw r.error;}
  catch(e){msg.style.color='var(--negative)';msg.textContent='No se pudo enviar: '+(e.message||e);return;}
  document.getElementById('coachBody').innerHTML='<div class="adm-login" style="text-align:center"><div style="font-size:38px;margin-bottom:8px">✅</div><p style="color:var(--text);font-size:15px;margin:0 0 6px">¡Solicitud enviada!</p><p class="zone-sub">El administrador la va a revisar y aprobar.</p><div class="adm-altlink"><a onclick="coachClose()">Cerrar</a></div></div>';
}
function coachTrySelectTeam(){
  if(!COACH||!COACH.club)return;const st=document.getElementById('selTeam');if(!st)return;
  const norm=s=>String(s||'').toLowerCase().replace(/[\s.]/g,'');const t=norm(COACH.club);
  for(const o of st.options){if(o.value&&(norm(o.value)===t||norm(o.textContent)===t)){st.value=o.value;renderAll();break;}}
}
renderCoachChip();
renderPerspBanner();
loadData();
</script>
