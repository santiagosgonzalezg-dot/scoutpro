function renderPartido(){
  const el=document.getElementById('view-partido');if(!el)return;
  if(!DATA.length){el.innerHTML='<div class="empty">No hay partidos cargados.</div>';return;}
  const fase=document.getElementById('selFase').value;
  const pool=DATA.filter(r=>!fase||r.fase===fase);
  const mids=[...new Set(pool.map(r=>r.match_id))].filter(Boolean);
  const mLabel=mid=>{const r=pool.filter(x=>x.match_id===mid);const eqs=[...new Set(r.map(x=>x.equipo))];const f=(r[0]&&r[0].fecha)||'';return (f?f+' · ':'')+eqs.join(' vs ');};
  const mObjs=mids.map(mid=>({mid,lbl:mLabel(mid),fecha:(pool.find(x=>x.match_id===mid)||{}).fecha||''})).sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)));
  if(partidoSel&&!mids.includes(partidoSel))partidoSel='';
  if(!partidoSel&&mObjs.length)partidoSel=mObjs[0].mid;
  const selHtml='<div class="tiros-ctl"><span class="zone-lbl">Partido</span><select onchange="setPartido(this.value)">'+mObjs.map(m=>'<option value="'+m.mid+'"'+(m.mid===partidoSel?' selected':'')+'>'+m.lbl+'</option>').join('')+'</select></div>';
  if(!partidoSel){el.innerHTML=selHtml+'<div class="empty">Sin partidos.</div>';return;}
  const teams=[...new Set(pool.filter(r=>r.match_id===partidoSel).map(r=>r.equipo))];
  const plRows=PLAYERS.filter(r=>r.match_id===partidoSel);
  const boxFor=team=>{
    const ps=plRows.filter(r=>r.equipo===team).sort((x,y)=>(+y.pts||0)-(+x.pts||0));
    if(!ps.length)return '<div class="zone-sub" style="margin:4px 0 14px">Sin box score de este equipo.</div>';
    const body=ps.map(p=>'<tr><td class="l"><span class="pchip"><span class="pn">'+(p.num||'·')+'</span>'+(p.nombre||'')+'</span></td><td>'+Math.round(+p.min||0)+'</td><td>'+(+p.pts||0)+'</td><td>'+(+p.reb||0)+'</td><td>'+(+p.ast||0)+'</td><td>'+(+p.rob||0)+'</td><td>'+(+p.tap||0)+'</td><td>'+(+p.per||0)+'</td><td style="color:'+dc(+p.mas_menos||0)+'">'+sgn(+p.mas_menos||0)+'</td></tr>').join('');
    return '<div class="tblwrap"><table class="t"><thead><tr><th class="l">Jugador</th><th>MIN</th><th>PTS</th><th>REB</th><th>AST</th><th>ROB</th><th>TAP</th><th>PER</th><th>+/-</th></tr></thead><tbody>'+body+'</tbody></table></div>';
  };
  const qRows=QUARTERS.filter(r=>r.match_id===partidoSel);
  let quartersHtml='';
  if(qRows.length){
    const byTeam={};qRows.forEach(r=>{(byTeam[r.equipo]=byTeam[r.equipo]||{})[+r.cuarto]=(+r.pts_favor||0);});
    const qs=[...new Set(qRows.map(r=>+r.cuarto))].sort((a,b)=>a-b);
    const head='<tr><th class="l">Equipo</th>'+qs.map(q=>'<th>Q'+q+'</th>').join('')+'<th>TOT</th></tr>';
    const body=Object.keys(byTeam).map(t=>{const tot=qs.reduce((s,q)=>s+(byTeam[t][q]||0),0);return '<tr><td class="l"><b>'+t+'</b></td>'+qs.map(q=>'<td>'+(byTeam[t][q]||0)+'</td>').join('')+'<td><b>'+tot+'</b></td></tr>';}).join('');
    quartersHtml='<div class="sec">Parciales por cuarto</div><div class="tblwrap"><table class="t"><thead>'+head+'</thead><tbody>'+body+'</tbody></table></div>';
  }
  const shots=SHOTS.filter(s=>s.match_id===partidoSel);
  const shotsHtml=shots.length?('<div class="sec">Mapa de tiros del partido</div><div class="court-box">'+courtSVGFull(shots)+'</div>'):'';
  let scoreHtml='';
  if(teams.length===2){
    const sc=t=>plRows.filter(r=>r.equipo===t).reduce((s,p)=>s+(+p.pts||0),0);
    scoreHtml='<div class="court-box" style="display:flex;justify-content:center;gap:20px;align-items:center;margin-bottom:12px">'+
      '<div style="flex:1;text-align:right;font-family:var(--font-disp);font-weight:800;font-size:19px">'+teams[0]+'</div>'+
      '<div style="font-family:var(--font-disp);font-weight:900;font-size:30px;letter-spacing:1px">'+sc(teams[0])+' – '+sc(teams[1])+'</div>'+
      '<div style="flex:1;text-align:left;font-family:var(--font-disp);font-weight:800;font-size:19px">'+teams[1]+'</div></div>';
  }
  const box=teams.map(t=>'<div class="sec">Box score · '+t+'</div>'+boxFor(t)).join('');
  el.innerHTML=selHtml+scoreHtml+box+quartersHtml+shotsHtml;
}

async function enviarSolicitud(){
  const msg=document.getElementById('ssMsg');
  const nombre=(document.getElementById('ssNombre').value||'').trim();
  const apellido=(document.getElementById('ssApellido').value||'').trim();
  const correo=(document.getElementById('ssCorreo').value||'').trim();

async function adminLogin(){
  const c=getSB();
  const email=(document.getElementById('admEmail').value||'').trim();
  const pass=document.getElementById('admPass').value||'';
  if(!email||!pass){renderAdminLogin('Completá email y contraseña.');return;}
  let r;try{r=await c.auth.signInWithPassword({email,password:pass});}catch(e){renderAdminLogin('Error de conexión.');return;}
  if(r.error){renderAdminLogin('Email o contraseña incorrectos.');return;}
  const userEmail=(r.data&&r.data.user?r.data.user.email:email).toLowerCase();
  if(userEmail!==ADMIN_EMAIL){try{await c.auth.signOut();}catch(e){}renderAdminLogin('Esta cuenta no tiene acceso de administrador.');return;}
  renderAdmin();
}
async function adminLogout(){const c=getSB();try{await c.auth.signOut();}catch(e){}renderAdminLogin('Sesión cerrada.');}
function dbStatus(){
  const M={};
  const add=(arr,key)=>{(arr||[]).forEach(r=>{const id=r.match_id||'?';const m=M[id]||(M[id]={id,fecha:r.fecha||'',teams:new Set(),q:0,j:0,t:0,c:0});if(r.equipo)m.teams.add(r.equipo);if(r.rival)m.teams.add(r.rival);if(r.fecha&&!m.fecha)m.fecha=r.fecha;m[key]++;});};
  add(DATA,'q');add(PLAYERS,'j');add(SHOTS,'t');add(QUARTERS,'c');
  return Object.values(M).sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)));
}

function renderAdminRevisar(){

  if(!sug.length&&!merged.length){sub.innerHTML=html+'<div class="empty">✓ Todo en orden. No hay nada para revisar.</div>';return;}
  if(sug.length){
    html+=sug.map(s=>'<div class="merge-box"><div class="merge-q">¿Es el mismo jugador? <b>'+s.equipo+' · #'+s.num+'</b> aparece con nombres distintos:</div>'+

      '<div class="merge-btns"><button class="merge-yes" onclick="confirmMerge(\''+escAttr(s.equipo)+'\',\''+escAttr(s.num)+'\')">✓ Sí, es el mismo (unir)</button>'+
      '<button class="merge-no" onclick="dismissMerge(\''+escAttr(s.equipo)+'\',\''+escAttr(s.num)+'\')">✕ Son distintos</button></div></div>').join('');
  }else{
    html+='<div class="empty" style="padding:18px">✓ No hay jugadores dudosos nuevos.</div>';

    html+='<div class="sec" style="margin-top:18px">Uniones confirmadas por vos</div><div class="merge-done">'+
      merged.map(x=>{const p=x.split('|'),eq=p[0],nu=p[1];return '<span class="merge-tag">'+eq+' #'+nu+' <button onclick="undoMerge(\''+escAttr(eq)+'\',\''+escAttr(nu)+'\')" title="Deshacer">↺</button></span>';}).join(' ')+'</div>';

}

function normTeamKey(s){return String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');}
function clubLogo(team){const k=normTeamKey(team);if(CLUB_LOGOS[k])return CLUB_LOGOS[k];for(const key in CLUB_LOGOS){if(k&&(k.indexOf(key)===0||key.indexOf(k)===0))return CLUB_LOGOS[key];}return null;}
function clubBadge(team,extra){const lg=clubLogo(team);const cls='club-badge '+(extra||'');if(lg)return '<span class="'+cls+' has-logo"><img src="'+lg+'" alt=""></span>';return '<span class="'+cls+'" style="background:'+clubColor(team)+'">'+clubInitials(team)+'</span>';}

function clubInitials(club){const w=String(club||'').trim().split(/\s+/).filter(Boolean);if(!w.length)return '?';if(w.length===1)return w[0].slice(0,2).toUpperCase();return (w[0][0]+w[1][0]).toUpperCase();}
function clubColor(club){let h=0;const s=String(club||'');for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%360;return 'hsl('+h+',52%,46%)';}
function renderCoachChip(){
  const el=document.getElementById('coachChip');if(!el)return;
  if(COACH&&COACH.club){
    el.className='coach-chip on';
    el.innerHTML=clubBadge(COACH.club)+
      '<span class="coach-meta"><b>'+COACH.club+'</b><span>'+((COACH.nombre||'')+' '+(COACH.apellido||'')).trim()+'</span></span>'+
      '<button class="coach-out" onclick="coachLogout()" title="Cerrar sesión">✕</button>';
  }else{
    el.className='coach-chip';
    el.innerHTML='<button class="coach-in" onclick="coachOpen()">👤 Ingresar</button>';
  }
}
function coachOpen(){renderCoachLogin('');document.getElementById('coachOverlay').style.display='flex';}
function coachClose(){document.getElementById('coachOverlay').style.display='none';}
function renderCoachLogin(msg){
  document.getElementById('coachBody').innerHTML=
    '<div class="adm-login">'+
      '<p class="zone-sub" style="margin-bottom:14px">Ingresá con el correo de tu perfil (el que aprobó el admin).</p>'+
      '<input id="coEmail" class="adm-inp" type="email" placeholder="Tu correo" autocomplete="username" onkeydown="if(event.key===\'Enter\')coachLogin()">'+
      '<button class="adm-btn" onclick="coachLogin()">Entrar</button>'+
      (msg?'<div class="adm-msg" style="text-align:left">'+msg+'</div>':'')+
      '<div class="adm-altlink">¿No tenés perfil? <a onclick="renderCoachSignup(\'\')">Creá el tuyo</a></div>'+
    '</div>';
  const e=document.getElementById('coEmail');if(e)e.focus();
}
async function coachLogin(){
  const email=(document.getElementById('coEmail').value||'').trim();
  if(!email){renderCoachLogin('Ingresá tu correo.');return;}
  const c=getSB();let data=[];
  try{const r=await c.from('perfiles').select('*').ilike('correo',email);data=r.error?[]:(r.data||[]);}catch(e){}
  const p=data[0];
  if(!p){renderCoachLogin('No encontramos un perfil con ese correo. Pedile al admin que te cree o apruebe uno.');return;}
  if((p.estado||'aprobado')!=='aprobado'){renderCoachLogin('Tu perfil todavía está pendiente de aprobación del admin.');return;}
  COACH={nombre:p.nombre,apellido:p.apellido,correo:p.correo,club:p.club};saveCoach();
  coachClose();renderCoachChip();coachTrySelectTeam();
}
function coachLogout(){COACH=null;saveCoach();renderCoachChip();}
function renderCoachSignup(msg){
  document.getElementById('coachBody').innerHTML=
    '<div class="adm-login">'+
      '<p class="zone-sub" style="margin-bottom:14px">Cargá tus datos. El perfil queda <b>pendiente</b> hasta que el admin lo apruebe.</p>'+
      '<div class="adm-formgrid"><input id="csNombre" class="adm-inp" placeholder="Nombre"><input id="csApellido" class="adm-inp" placeholder="Apellido"><input id="csCorreo" class="adm-inp" type="email" placeholder="Correo"><input id="csClub" class="adm-inp" placeholder="Club al que pertenece"></div>'+
      '<button class="adm-btn" onclick="enviarSolicitudCoach()">Enviar solicitud</button>'+
      '<div class="adm-msg" id="csMsg" style="text-align:left">'+(msg||'')+'</div>'+
      '<div class="adm-altlink"><a onclick="renderCoachLogin(\'\')">← Volver</a></div>'+
    '</div>';
}
async function enviarSolicitudCoach(){
  const g=id=>(document.getElementById(id).value||'').trim(),msg=document.getElementById('csMsg');
  const nombre=g('csNombre'),apellido=g('csApellido'),correo=g('csCorreo'),club=g('csClub');
  if(!nombre||!apellido||!correo||!club){msg.style.color='var(--negative)';msg.textContent='Completá los 4 campos.';return;}
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(correo)){msg.style.color='var(--negative)';msg.textContent='El correo no parece válido.';return;}
  const c=getSB();
  try{const r=await c.from('perfiles').insert([{nombre,apellido,correo,club,estado:'pendiente'}]);if(r.error)throw r.error;}
  catch(e){msg.style.color='var(--negative)';msg.textContent='No se pudo enviar: '+(e.message||e);return;}
  document.getElementById('coachBody').innerHTML='<div class="adm-login" style="text-align:center"><div style="font-size:38px;margin-bottom:8px">✅</div><p style="color:var(--text);font-size:15px;margin:0 0 6px">¡Solicitud enviada!</p><p class="zone-sub">El administrador la va a revisar y aprobar.</p><div class="adm-altlink"><a onclick="coachClose()">Cerrar</a></div></div>';
}
function coachTrySelectTeam(){
  if(!COACH||!COACH.club)return;const st=document.getElementById('selTeam');if(!st)return;
  const norm=s=>String(s||'').toLowerCase().replace(/[\s.]/g,'');const t=norm(COACH.club);
  for(const o of st.options){if(o.value&&(norm(o.value)===t||norm(o.textContent)===t)){st.value=o.value;renderAll();break;}}
}
renderCoachChip();
loadData();
</script>
