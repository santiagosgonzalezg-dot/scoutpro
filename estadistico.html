<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estadístico · Equipos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=DM+Mono:wght@400;500&family=Barlow+Condensed:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg-base:#08090d;--bg-raised:#0f1117;--bg-panel:#161820;--bg-hover:#1e202a;
  --border-subtle:rgba(255,255,255,0.05);--border-light:rgba(255,255,255,0.09);--border-strong:rgba(255,255,255,0.18);
  --offense:#f97316;--offense-bg:rgba(249,115,22,0.10);--offense-mid:rgba(249,115,22,0.22);
  --defense:#4f8ef7;--defense-bg:rgba(79,142,247,0.10);--defense-mid:rgba(79,142,247,0.22);
  --positive:#34c769;--negative:#f05050;--insight:#a78bfa;
  --text:#d8dce8;--text-2:#8891a0;--text-3:#434b5a;
  --font-ui:'DM Sans',system-ui,sans-serif;--font-mono:'DM Mono',monospace;--font-disp:'Barlow Condensed',sans-serif;
  --sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--r-sm:3px;--r:5px;--r-lg:8px;--t-fast:100ms ease;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg-base);color:var(--text);font-family:var(--font-ui);font-size:13px;-webkit-font-smoothing:antialiased;min-height:100vh}
.topbar{display:flex;align-items:center;gap:var(--sp-3);padding:12px 20px;border-bottom:1px solid var(--border-light);background:var(--bg-raised);position:sticky;top:0;z-index:20}
.logo{font-family:var(--font-disp);font-weight:900;font-size:22px;letter-spacing:2px;line-height:1;flex-shrink:0}
.logo .a{color:var(--offense)}
.logo .v{font-family:var(--font-mono);font-size:8px;color:var(--text-3);letter-spacing:2px;margin-left:6px;border:1px solid var(--border-light);border-radius:var(--r-sm);padding:2px 6px;vertical-align:middle}
.tb-spacer{flex:1}
.tb-btn{background:var(--bg-panel);border:1px solid var(--border-light);border-radius:var(--r-sm);color:var(--text-2);font-family:var(--font-mono);font-size:10px;padding:7px 13px;cursor:pointer;transition:all var(--t-fast);white-space:nowrap;text-decoration:none;display:inline-block}
.tb-btn:hover{border-color:var(--offense);color:var(--offense)}
.tb-btn.qtos:hover{border-color:var(--insight);color:var(--insight)}
.tb-admin{border-color:transparent!important;color:var(--text-3)!important;opacity:.5;font-size:9px!important;padding:7px 8px!important}
.tb-admin:hover{opacity:1;color:var(--text-2)!important;border-color:var(--border-subtle)!important}
.adm-overlay{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.74);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.adm-box{background:var(--bg-raised);border:1px solid var(--border-light);border-radius:14px;width:100%;max-width:880px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.adm-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.adm-title{font-family:var(--font-disp);font-weight:900;font-size:24px;letter-spacing:.5px}
.adm-close{background:var(--bg-panel);border:1px solid var(--border-subtle);border-radius:6px;color:var(--text-2);font-family:var(--font-mono);font-size:11px;padding:8px 14px;cursor:pointer;transition:all var(--t-fast)}
.adm-close:hover{border-color:var(--negative);color:var(--negative)}
.adm-kpis{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.adm-kpi{background:var(--bg-panel);border:1px solid var(--border-subtle);border-radius:8px;padding:11px 16px;min-width:96px}
.adm-kpi .n{font-family:var(--font-disp);font-weight:900;font-size:24px;line-height:1}
.adm-kpi .l{font-family:var(--font-mono);font-size:9px;letter-spacing:.5px;color:var(--text-2);text-transform:uppercase;margin-top:3px}
.adm-table{width:100%;border-collapse:collapse;font-size:13px}
.adm-table th{font-family:var(--font-mono);font-size:9px;letter-spacing:.5px;color:var(--text-2);text-transform:uppercase;text-align:right;padding:8px 9px;border-bottom:1px solid var(--border-light);white-space:nowrap}
.adm-table th.l,.adm-table td.l{text-align:left}
.adm-table td{padding:8px 9px;border-bottom:1px solid var(--border-subtle);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.adm-ok{color:var(--positive)}.adm-warn{color:#e0a83b}.adm-bad{color:var(--negative)}
.adm-login{max-width:340px;margin:6px auto 10px}
.adm-inp{display:block;width:100%;background:var(--bg-panel);border:1px solid var(--border-subtle);border-radius:6px;color:var(--text);font-family:var(--font-ui);font-size:14px;padding:10px 12px;margin-bottom:10px}
.adm-inp:focus{outline:none;border-color:var(--offense)}
.adm-btn{width:100%;background:var(--offense);border:none;border-radius:6px;color:#1a1205;font-family:var(--font-mono);font-size:12px;letter-spacing:.5px;padding:11px;cursor:pointer;font-weight:500;transition:filter var(--t-fast)}
.adm-btn:hover{filter:brightness(1.08)}
.adm-msg{margin-top:12px;color:var(--negative);font-family:var(--font-mono);font-size:11px;text-align:center}
.adm-logout{background:var(--bg-panel);border:1px solid var(--border-subtle);border-radius:6px;color:var(--text-2);font-family:var(--font-mono);font-size:10px;letter-spacing:.5px;padding:8px 14px;cursor:pointer;transition:all var(--t-fast)}
.adm-logout:hover{border-color:var(--negative);color:var(--negative)}
.adm-nav{display:flex;gap:8px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
.adm-nav button{background:var(--bg-panel);border:1px solid var(--border-subtle);border-radius:6px;color:var(--text-2);font-family:var(--font-mono);font-size:10px;letter-spacing:.5px;padding:8px 14px;cursor:pointer;transition:all var(--t-fast)}
.adm-nav button:hover{color:var(--text)}
.adm-nav button.on{background:rgba(249,115,22,.13);border-color:var(--offense);color:var(--offense)}
.adm-badge{display:inline-flex;align-items:center;justify-content:center;min-width:15px;height:15px;padding:0 4px;border-radius:8px;background:var(--offense);color:#fff;font-size:9px;font-weight:700;margin-left:3px}
.adm-formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;max-width:520px}
@media(max-width:560px){.adm-formgrid{grid-template-columns:1fr}}
.adm-formgrid .adm-inp{margin-bottom:0}
.adm-del{background:var(--bg-panel);border:1px solid var(--border-subtle);border-radius:5px;color:var(--text-3);font-family:var(--font-mono);font-size:11px;padding:5px 9px;cursor:pointer;transition:all var(--t-fast)}
.adm-del:hover{border-color:var(--negative);color:var(--negative)}
.adm-ap{background:rgba(52,199,105,.13);border:1px solid rgba(52,199,105,.4);border-radius:5px;color:var(--positive);font-family:var(--font-mono);font-size:10px;letter-spacing:.4px;padding:5px 10px;cursor:pointer;transition:all var(--t-fast)}
.adm-ap:hover{background:rgba(52,199,105,.22)}
.adm-altlink{margin-top:16px;font-family:var(--font-ui);font-size:12.5px;color:var(--text-2);text-align:center}
.adm-altlink a{color:var(--offense);cursor:pointer;text-decoration:underline}
.wrap{max-width:1280px;margin:0 auto;padding:20px}
.controls{display:flex;gap:var(--sp-3);align-items:flex-end;flex-wrap:wrap;margin-bottom:var(--sp-4)}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-family:var(--font-mono);font-size:8px;letter-spacing:1px;color:var(--text-3);text-transform:uppercase}
.field select{background:var(--bg-raised);border:1px solid var(--border-light);border-radius:var(--r);padding:9px var(--sp-3);font-family:var(--font-ui);font-size:13px;color:var(--text);outline:none;min-width:180px;cursor:pointer}
.field select:focus{border-color:var(--offense)}
.tabs{display:flex;gap:4px;margin-bottom:var(--sp-4);border-bottom:1px solid var(--border-light)}
.tab{background:none;border:none;border-bottom:2px solid transparent;color:var(--text-3);font-family:var(--font-disp);font-weight:700;font-size:15px;letter-spacing:1px;text-transform:uppercase;padding:9px 16px;cursor:pointer;transition:all var(--t-fast);margin-bottom:-1px}
.tab:hover{color:var(--text-2)}
.tab.active{color:var(--offense);border-bottom-color:var(--offense)}
.view{display:none}.view.active{display:block}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:var(--sp-3);margin-bottom:var(--sp-4)}
.kpi{background:var(--bg-raised);border:1px solid var(--border-light);border-radius:var(--r-lg);padding:var(--sp-4)}
.kpi .v{font-family:var(--font-disp);font-weight:900;font-size:30px;line-height:1}
.kpi .k{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.6px;color:var(--text-2);text-transform:uppercase;margin-top:7px;font-weight:500}
.pos{color:var(--positive)}.neg{color:var(--negative)}.acc{color:var(--offense)}.def{color:var(--defense)}
.sec{font-family:var(--font-disp);font-weight:800;font-size:15px;letter-spacing:.4px;text-transform:uppercase;color:var(--text);margin:var(--sp-5) 0 var(--sp-3);display:flex;align-items:center;gap:10px}
.sec::before{content:"";width:3px;height:16px;background:var(--offense);border-radius:2px;flex-shrink:0}
.sec::after{content:'';flex:1;height:1px;background:var(--border-subtle)}
.board{background:var(--bg-raised);border:1px solid var(--border-light);border-radius:var(--r-lg);overflow:hidden;margin-bottom:var(--sp-4)}
.board-title{font-family:var(--font-disp);font-weight:700;font-size:15px;letter-spacing:.5px;color:var(--offense);padding:var(--sp-3) var(--sp-4);border-bottom:1px solid var(--border-subtle)}
.tblwrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse}
table.t thead tr{background:var(--bg-panel)}
table.t th{font-family:var(--font-mono);font-size:8px;letter-spacing:.8px;color:var(--text-2);padding:10px var(--sp-2);text-align:right;text-transform:uppercase;border-bottom:1px solid var(--border-light);font-weight:500;white-space:nowrap}
table.t th.l{text-align:left}
table.t th.s{cursor:pointer;user-select:none}
table.t th.s:hover{color:var(--text)}
table.t th.sorted{color:var(--offense);background:rgba(249,115,22,0.07)}
table.t td{padding:8px var(--sp-2);border-bottom:1px solid var(--border-subtle);font-family:var(--font-mono);font-size:10px;text-align:right;white-space:nowrap}
table.t td.l{text-align:left}
table.t td.active{color:var(--text);background:rgba(249,115,22,0.05)}
table.t tr:hover td{background:var(--bg-hover)}
.pchip{font-family:var(--font-mono);font-size:9px;color:var(--text);background:var(--bg-base);border:1px solid var(--border-subtle);border-radius:var(--r-sm);padding:2px 6px 2px 3px;display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.pchip .pn{font-family:var(--font-mono);font-size:8px;font-weight:500;color:#000;background:var(--offense);border-radius:2px;padding:0 3px}
.rank{color:var(--text-3)}
.empty{text-align:center;color:var(--text-2);font-family:var(--font-mono);font-size:12px;line-height:1.8;padding:60px 20px}
.loadbox{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:80px 20px;color:var(--text-2);font-family:var(--font-mono);font-size:11px;letter-spacing:1px;text-transform:uppercase}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--border-strong);border-top-color:var(--offense);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loadbox .ldsub{font-size:9px;letter-spacing:.5px;color:var(--text-3);text-transform:none}
.empty b{color:var(--offense)}
.chartbox{background:var(--bg-raised);border:1px solid var(--border-light);border-radius:var(--r-lg);padding:var(--sp-4);margin-bottom:var(--sp-4)}
.legend{display:flex;gap:var(--sp-4);font-family:var(--font-mono);font-size:9px;color:var(--text-2);margin-top:var(--sp-2)}
.legend i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.lid-toggle{display:flex;gap:6px;margin-bottom:var(--sp-4)}
.lid-toggle button{background:var(--bg-panel);border:1px solid var(--border-subtle);border-radius:var(--r-sm);color:var(--text-3);font-family:var(--font-mono);font-size:10px;padding:7px 16px;cursor:pointer;transition:all var(--t-fast)}
.lid-toggle button.on{border-color:var(--offense);color:var(--offense);background:var(--offense-bg)}
.wk-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
@media(max-width:620px){.wk-grid{grid-template-columns:1fr}}
.wk-card{background:var(--bg-raised);border:1px solid var(--border-light);border-radius:var(--r-lg);padding:13px 14px}
.wk-top{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:9px}
.wk-tag{font-family:var(--font-mono);font-size:9px;letter-spacing:.6px;color:var(--text-2)}
.wk-badge{font-family:var(--font-mono);font-size:8.5px;letter-spacing:.3px;border:1px solid;border-radius:var(--r-sm);padding:2px 6px;white-space:nowrap}
.wk-val{font-family:var(--font-disp);font-weight:900;font-size:26px;line-height:1}
.wk-val .wk-u{font-family:var(--font-mono);font-size:9px;font-weight:500;color:var(--text-2);letter-spacing:.5px;margin-left:4px}
.wk-sub{font-family:var(--font-ui);font-size:11px;color:var(--text-2);margin-top:7px;line-height:1.35}
.wk-lg{font-family:var(--font-mono);font-size:9.5px;color:var(--text-3);margin-top:6px;border-top:1px solid var(--border-subtle);padding-top:6px}
.wk-lead{font-family:var(--font-ui);font-size:12.5px;color:var(--text);background:var(--bg-panel);border:1px solid var(--border-subtle);border-left:3px solid var(--offense);border-radius:var(--r);padding:9px 12px;margin:4px 0 14px;line-height:1.5}
.wk-lead b{color:var(--offense)}
.dup-rk{font-family:var(--font-mono);font-size:11px;color:var(--text-3);font-weight:600}
.dup-rk.top1{color:var(--offense)}
.dd-head{margin:2px 0 10px}
.dd-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:10px}
@media(max-width:760px){.dd-grid{grid-template-columns:repeat(3,1fr)}}
.dd-grid .kpi{padding:10px 8px;text-align:center}
.dd-grid .kpi .v{font-size:22px}
.dd-sub{font-family:var(--font-mono);font-size:10.5px;color:var(--text-2);margin:0 0 10px;line-height:1.6}
.dd-close{background:var(--bg-panel);border:1px solid var(--border-subtle);border-radius:var(--r-sm);color:var(--text-2);font-family:var(--font-mono);font-size:9px;letter-spacing:.3px;padding:3px 8px;cursor:pointer;margin-left:8px;text-transform:none}
.dd-close:hover{border-color:var(--offense);color:var(--offense)}
.t tbody tr[onclick]{cursor:pointer}
.t tbody tr[onclick]:hover{background:var(--bg-hover)}
.t tbody tr.selrow{background:var(--offense-bg)!important;box-shadow:inset 2px 0 0 var(--offense)}
.lb-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:var(--sp-3);margin-bottom:var(--sp-5)}
.lb-card{background:var(--bg-raised);border:1px solid var(--border-light);border-radius:var(--r-lg);padding:var(--sp-3) var(--sp-4) var(--sp-4)}
.lb-title{font-family:var(--font-disp);font-weight:800;font-size:16px;letter-spacing:.5px;margin-bottom:var(--sp-3);display:flex;align-items:center;gap:7px}
.lb-title .dot{width:8px;height:8px;border-radius:2px}
.lb-row{display:flex;align-items:center;gap:var(--sp-2);margin-bottom:8px}
.lb-rank{font-family:var(--font-mono);font-size:9px;color:var(--text-3);width:12px;flex-shrink:0}
.lb-name{font-family:var(--font-ui);font-size:12px;color:var(--text);width:138px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0}
.lb-name small{color:var(--text-3);font-family:var(--font-mono);font-size:8px;margin-left:4px}
.lb-track{flex:1;height:9px;background:var(--bg-panel);border-radius:2px;overflow:hidden}
.lb-fill{height:100%;border-radius:2px;transition:width .3s}
.lb-val{font-family:var(--font-disp);font-weight:800;font-size:16px;width:46px;text-align:right;flex-shrink:0}
.shot-wrap{display:grid;grid-template-columns:minmax(260px,1fr) minmax(220px,300px);gap:var(--sp-4);align-items:start}
@media(max-width:720px){.shot-wrap{grid-template-columns:1fr}}
.court-box{background:var(--bg-raised);border:1px solid var(--border-light);border-radius:var(--r-lg);padding:var(--sp-3)}
.court-svg{width:100%;height:auto;display:block}
.court-line{fill:none;stroke:rgba(255,255,255,.18);stroke-width:1}
.court-fill{fill:rgba(255,255,255,.02)}
.shot-made{fill:#34c769;fill-opacity:.85}
.shot-miss{fill:none;stroke:#f05050;stroke-width:1.4;stroke-opacity:.8}
.tiros-ctl{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:var(--sp-4);align-items:center}
.tiros-ctl select{background:var(--bg-panel);border:1px solid var(--border-subtle);border-radius:var(--r-sm);color:var(--text);font-family:var(--font-ui);font-size:13px;padding:7px 12px}
.tipo-seg{display:inline-flex;border:1px solid var(--border-subtle);border-radius:var(--r-sm);overflow:hidden}
.tipo-seg button{background:var(--bg-panel);border:none;border-right:1px solid var(--border-subtle);color:var(--text-2);font-family:var(--font-mono);font-size:11px;letter-spacing:.5px;padding:7px 13px;cursor:pointer;transition:all var(--t-fast)}
.tipo-seg button:last-child{border-right:none}
.tipo-seg button:hover{color:var(--text)}
.tipo-seg button.on{background:var(--offense);color:#fff;font-weight:700}
.frm-badge{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:7px;font-family:var(--font-disp);font-weight:800;font-size:14px;color:#fff}
.frm-badge.w{background:var(--positive)}.frm-badge.l{background:var(--negative)}
.shooters{margin-top:var(--sp-3)}
.sh-row{display:grid;grid-template-columns:22px 1fr 130px 92px;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border-subtle)}
.sh-row:last-child{border-bottom:none}
.sh-rk{font-family:var(--font-disp);font-weight:800;font-size:15px;color:var(--text-3);text-align:center}
.sh-nm{font-weight:600;color:var(--text);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-bar{height:8px;background:var(--bg-hover);border-radius:4px;overflow:hidden}
.sh-fill{display:block;height:100%;background:var(--offense);border-radius:4px}
.sh-val{font-family:var(--font-mono);font-size:11px;color:var(--text-2);text-align:right}
.sh-val b{color:var(--text)}
@media(max-width:620px){.sh-row{grid-template-columns:20px 1fr 80px}.sh-bar{display:none}}
.zone-row{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--border-subtle)}
.zone-row:last-child{border-bottom:none}
.zone-lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:1px;color:var(--text-2);text-transform:uppercase;font-weight:500}
.zone-val{font-family:var(--font-disp);font-weight:800;font-size:18px}
.tramo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--sp-3)}
@media(max-width:600px){.tramo-grid{grid-template-columns:1fr}}
.tramo-card{background:var(--bg-raised);border:1px solid var(--border-light);border-radius:var(--r-lg);padding:var(--sp-3) var(--sp-4)}
.tramo-card .lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:1px;color:var(--text-2);text-transform:uppercase;font-weight:500}
.tramo-card .big{font-family:var(--font-disp);font-weight:900;font-size:28px;line-height:1;margin:6px 0 3px}
.tramo-card .sub{font-family:var(--font-mono);font-size:10px;color:var(--text-2)}
.tramo-bar{height:6px;background:var(--bg-panel);border-radius:2px;overflow:hidden;margin-top:9px}
.tramo-fill{height:100%;border-radius:2px}
.ficha-card{position:relative;background:linear-gradient(115deg,#14161f 0%,#0f1117 55%,#171922 100%);border:1px solid var(--border-light);border-radius:14px;padding:20px 22px 18px;margin:16px 0;overflow:hidden}
.ficha-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--offense),#fb923c)}

// ── agregación ──
function agg(rows){
  const a={min:0,ptsF:0,ptsC:0,pos:0,posRiv:0,pt2c:0,pt2i:0,pt3c:0,pt3i:0,tlc:0,tli:0,ast:0,rob:0,per:0,rd:0,ro:0,matches:new Set()};
  for(const r of rows){
    a.min+=num(r.minutos);a.ptsF+=num(r.pts_favor);a.ptsC+=num(r.pts_contra);
    a.pos+=num(r.pos);a.posRiv+=num(r.pos_riv);
    a.pt2c+=num(r.pt2c);a.pt2i+=num(r.pt2i);a.pt3c+=num(r.pt3c);a.pt3i+=num(r.pt3i);
    a.tlc+=num(r.tlc);a.tli+=num(r.tli);
    a.ast+=num(r.ast);a.rob+=num(r.rob);a.per+=num(r.per);a.rd+=num(r.reb_def);a.ro+=num(r.reb_off);
    if(r.match_id)a.matches.add(r.match_id);
  }
  a.diff=a.ptsF-a.ptsC;
  a.efOff=a.pos>0?a.ptsF/a.pos:0;
  a.efDef=a.posRiv>0?a.ptsC/a.posRiv:0;
  a.pj=a.matches.size;
  a.fga=a.pt2i+a.pt3i;a.fgm=a.pt2c+a.pt3c;
  a.efg=a.fga>0?Math.round((a.fgm+0.5*a.pt3c)/a.fga*1000)/10:0;            // eFG%
  a.ts=(a.fga+0.44*a.tli)>0?Math.round(a.ptsF/(2*(a.fga+0.44*a.tli))*1000)/10:0; // True Shooting %
  return a;
}
function teamRows(team){const f=document.getElementById('selFase').value;return DATA.filter(r=>r.equipo===team&&(!f||r.fase===f));}
function allRowsFiltered(){const f=document.getElementById('selFase').value;return DATA.filter(r=>!f||r.fase===f);}

// ── tabla ordenable genérica ──
const sortState={};
function sortableTable(elId,title,cols,rows,stateKey,onRow){
  if(!sortState[stateKey])sortState[stateKey]={key:cols.find(c=>c.sortable).key,dir:-1};
  const ss=sortState[stateKey];
  const col=cols.find(c=>c.key===ss.key)||cols[0];
  const arrow=ss.dir<0?'▼':'▲';
  let sorted=rows.slice();
  if(col.val)sorted.sort((x,y)=>(col.val(x)-col.val(y))*ss.dir);
  const head=cols.map(c=>{
    const on=c.key===ss.key&&c.sortable;
    const cls=(c.left?'l ':'')+(c.sortable?'s ':'')+(on?'sorted':'');
    return '<th class="'+cls+'"'+(c.sortable?' onclick="doSort(\''+stateKey+'\',\''+c.key+'\')"':'')+'>'+c.label+(on?' '+arrow:'')+'</th>';
  }).join('');
  const body=sorted.map((r,i)=>'<tr'+(onRow?onRow(r):'')+'>'+cols.map(c=>{
    const active=c.key===ss.key&&c.sortable;
    const cls=(c.left?'l ':'')+(active?'active':'');
    const st=c.color?(' style="color:'+c.color(r)+'"'):'';
    return '<td class="'+cls+'"'+st+'>'+c.cell(r,i)+'</td>';
  }).join('')+'</tr>').join('');
  return '<div class="board"><div class="board-title">'+title+'</div><div class="tblwrap"><table class="t"><thead><tr>'+head+'</tr></thead><tbody>'+body+'</tbody></table></div></div>';
}
function doSort(stateKey,key){const s=sortState[stateKey];if(s.key===key)s.dir*=-1;else{s.key=key;s.dir=-1;}renderAll();}
function chips(players){return players.map(p=>'<span class="pchip"><span class="pn">'+(p.num||'·')+'</span>'+p.name+'</span>').join(' ');}
function dc(v){return v>0?'var(--positive)':v<0?'var(--negative)':'var(--text-3)';}
function sgn(v){return (v>0?'+':'')+v;}
function pp(v){return (Number(v)||0).toFixed(2);}

function matchReboundIndex(rows){
  const matches={};
  for(const r of rows){const mid=r.match_id||'?';(matches[mid]=matches[mid]||{});(matches[mid][r.equipo]=matches[mid][r.equipo]||{ro:0,rd:0});matches[mid][r.equipo].ro+=num(r.reb_off);matches[mid][r.equipo].rd+=num(r.reb_def);}
  return matches;
}
function leagueTeamStats(){
  const rows=allRowsFiltered();
  const matches=matchReboundIndex(rows);
  const teamNames=[...new Set(rows.map(r=>r.equipo))];
  return teamNames.map(t=>{
    const tr=rows.filter(r=>r.equipo===t);
    const a=agg(tr);
    let orbN=0,orbD=0,drbN=0,drbD=0;
    for(const mid of new Set(tr.map(r=>r.match_id))){
      const mt=matches[mid];if(!mt)continue;const me=mt[t]||{ro:0,rd:0};
      let rro=0,rrd=0;for(const rn of Object.keys(mt)){if(rn!==t){rro+=mt[rn].ro;rrd+=mt[rn].rd;}}
      orbN+=me.ro;orbD+=me.ro+rrd;drbN+=me.rd;drbD+=me.rd+rro;
    }
    a.orbPct=orbD>0?Math.round(orbN/orbD*100):0;
    a.drbPct=drbD>0?Math.round(drbN/drbD*100):0;
    a.pace=a.pj>0?Math.round(a.pos/a.pj*10)/10:0;
    a.net=a.efOff-a.efDef;
    a.fga=a.pt2i+a.pt3i;a.fgm=a.pt2c+a.pt3c;
    a.fgPct=a.fga>0?Math.round(a.fgm/a.fga*1000)/10:0;
    a.threeVol=a.fga>0?Math.round(a.pt3i/a.fga*1000)/10:0;
    a.threePct=a.pt3i>0?Math.round(a.pt3c/a.pt3i*1000)/10:0;
    a.astPos=a.pos>0?a.ast/a.pos:0;
    a.astTo=a.per>0?a.ast/a.per:0;
    a.astRob=a.rob>0?a.ast/a.rob:0;
    return {team:t,a};
  });
}
function leagueLineups(){
  const rows=allRowsFiltered();const groups={};
  for(const r of rows){if(!r.jugadores||r.jugadores.length!==5)continue;const key=r.equipo+'#'+(r.jugadores_key||pkeyArr(r.jugadores));(groups[key]=groups[key]||{team:r.equipo,players:r.jugadores,rows:[]}).rows.push(r);}
  let lus=Object.values(groups).map(g=>{const a=agg(g.rows);return {team:g.team,players:g.players,a,net:(a.efOff||0)-(a.efDef||0)};});

  if(f.length<5)f=lus.filter(l=>l.a.min>=4);

}

function teamGames(team){
  const rows=allRowsFiltered().filter(r=>r.equipo===team),g={};
  rows.forEach(r=>{const id=r.match_id||r.fecha||'?';const o=g[id]||(g[id]={mid:id,fecha:r.fecha,rival:r.rival,es_local:r.es_local,ptsF:0,ptsC:0,pos:0,posRiv:0,p2c:0,p2i:0,p3c:0,p3i:0,tlc:0,tli:0});
    o.ptsF+=num(r.pts_favor);o.ptsC+=num(r.pts_contra);o.pos+=num(r.pos);o.posRiv+=num(r.pos_riv);
    o.p2c+=num(r.pt2c);o.p2i+=num(r.pt2i);o.p3c+=num(r.pt3c);o.p3i+=num(r.pt3i);o.tlc+=num(r.tlc);o.tli+=num(r.tli);
    if(r.rival&&!o.rival)o.rival=r.rival;if(r.es_local!=null)o.es_local=r.es_local;});
  return Object.values(g).map(o=>{const fga=o.p2i+o.p3i,fgm=o.p2c+o.p3c;return {...o,fga,fgm,
    diff:o.ptsF-o.ptsC,efOff:o.pos>0?o.ptsF/o.pos:0,efDef:o.posRiv>0?o.ptsC/o.posRiv:0,
    threeRate:fga>0?o.p3i/fga*100:0,tp:o.p3i>0?o.p3c/o.p3i*100:0,efg:fga>0?(fgm+0.5*o.p3c)/fga*100:0};});
}
function splitAgg(games){
  const n=games.length;if(!n)return null;
  let w=0,l=0,pf=0,pc=0,eo=0,ed=0,ne=0,p3i=0,p3c=0,fga=0,fgm=0;
  games.forEach(x=>{if(x.diff>0)w++;else if(x.diff<0)l++;pf+=x.ptsF;pc+=x.ptsC;if(x.efOff){eo+=x.efOff;ed+=x.efDef;ne++;}p3i+=x.p3i;p3c+=x.p3c;fga+=x.fga;fgm+=x.fgm;});
  return {n,w,l,pf:pf/n,pc:pc/n,dif:(pf-pc)/n,efo:ne?eo/ne:0,efd:ne?ed/ne:0,
    tpaG:p3i/n,threeRate:fga>0?p3i/fga*100:0,tp:p3i>0?p3c/p3i*100:0,efg:fga>0?(fgm+0.5*p3c)/fga*100:0};
}

function evoChart(list){
  if(list.length<2)return '<div class="chartbox"><div class="empty" style="padding:20px">Necesitás al menos 2 partidos guardados para ver la evolución.</div></div>';
  const W=Math.max(420,list.length*70),H=200,pad=30;
  const vals=list.map(g=>g.a.diff);const mx=Math.max(5,...vals.map(Math.abs));
  const x=i=>pad+i*(W-2*pad)/(list.length-1);
  const y=v=>H/2-(v/mx)*(H/2-pad);
  let path='',dots='';
  list.forEach((g,i)=>{const px=x(i),py=y(g.a.diff);path+=(i?'L':'M')+px+' '+py+' ';dots+='<circle cx="'+px+'" cy="'+py+'" r="3.5" fill="'+(g.a.diff>=0?'#34c769':'#f05050')+'"/>';});
  let labels='';list.forEach((g,i)=>{labels+='<text x="'+x(i)+'" y="'+(H-8)+'" fill="#434b5a" font-family="DM Mono,monospace" font-size="8" text-anchor="middle">'+(g.rival||'').slice(0,6)+'</text>';});
  return '<div class="chartbox"><div class="board-title" style="border:none;padding:0 0 10px">+/- por partido</div>'+
    '<div style="overflow-x:auto"><svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">'+
    '<line x1="'+pad+'" y1="'+(H/2)+'" x2="'+(W-pad)+'" y2="'+(H/2)+'" stroke="rgba(255,255,255,0.10)" stroke-dasharray="3 3"/>'+
    '<path d="'+path+'" fill="none" stroke="#f97316" stroke-width="2"/>'+dots+labels+'</svg></div>'+
    '<div class="legend"><span><i style="background:#f97316"></i>Diferencial (+/-) por partido</span></div></div>';
}

let lidMode='pg';
function setLidMode(m){lidMode=m;renderLideres();}
let MERGES=(function(){try{return JSON.parse(localStorage.getItem('sp_merges')||'[]');}catch(_){return[];}})();
function saveMerges(){try{localStorage.setItem('sp_merges',JSON.stringify(MERGES));}catch(_){}}
function refreshAfterMerge(){renderAll();const ov=document.getElementById('adminOverlay');if(ov&&ov.style.display!=='none')renderAdmin();}
function isMerged(equipo,nu){return MERGES.indexOf(equipo+'|'+nu)>=0;}
function confirmMerge(equipo,nu){if(!isMerged(equipo,nu))MERGES.push(equipo+'|'+nu);saveMerges();refreshAfterMerge();}
function undoMerge(equipo,nu){MERGES=MERGES.filter(x=>x!==equipo+'|'+nu);saveMerges();refreshAfterMerge();}
let MERGE_DISMISS=(function(){try{return JSON.parse(localStorage.getItem('sp_merge_dismiss')||'[]');}catch(_){return[];}})();
function saveDismiss(){try{localStorage.setItem('sp_merge_dismiss',JSON.stringify(MERGE_DISMISS));}catch(_){}}
function isDismissed(equipo,nu){return MERGE_DISMISS.indexOf(equipo+'|'+nu)>=0;}
function dismissMerge(equipo,nu){if(!isDismissed(equipo,nu))MERGE_DISMISS.push(equipo+'|'+nu);saveDismiss();refreshAfterMerge();}
function mergeTokens(v){return v.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(t=>t.length>=3);}
function mergeSuggestions(team){
  const sug=[],byNum={};
  PLAYERS.forEach(r=>{if(team&&r.equipo!==team)return;const nu=String(r.num||'').trim();if(!nu)return;const k=r.equipo+'|'+nu;(byNum[k]=byNum[k]||{equipo:r.equipo,num:nu,names:{}});const nm=String(r.nombre||'').trim();if(nm)byNum[k].names[nm]=(byNum[k].names[nm]||0)+1;});
  Object.values(byNum).forEach(g=>{
    if(isMerged(g.equipo,g.num))return;
    if(isDismissed(g.equipo,g.num))return;
    const variants=Object.keys(g.names);if(variants.length<2)return;
    const tok=variants.map(v=>new Set(mergeTokens(v)));
    let allShare=true;
    for(let i=0;i<tok.length;i++)for(let j=i+1;j<tok.length;j++){let sh=false;tok[i].forEach(t=>{if(tok[j].has(t))sh=true;});if(!sh)allShare=false;}
    if(allShare)sug.push({equipo:g.equipo,num:g.num,variants});
  });
  return sug;
}
function playersAgg(){
  const fase=document.getElementById('selFase').value;
  const rows=PLAYERS.filter(r=>!fase||r.fase===fase);
  const map={};
  for(const r of rows){
    const merged=isMerged(r.equipo,String(r.num||'').trim());
    const k=merged?(r.equipo+'|#'+r.num):(r.equipo+'|'+r.num+'|'+String(r.nombre||'').toLowerCase());
    if(!map[k])map[k]={equipo:r.equipo,num:r.num,nombre:r.nombre,_nmlen:-1,g:0,min:0,pts:0,ast:0,rob:0,tap:0,per:0,ro:0,rd:0,reb:0,fgm:0,fga:0,tpm:0,tpa:0,ftm:0,fta:0,faltas:0,pm:0};
    const a=map[k];
    if(merged){const ln=String(r.nombre||'').length;if(ln>a._nmlen){a.nombre=r.nombre;a._nmlen=ln;}}
    if(num(r.min)>0)a.g++;
    a.min+=num(r.min);a.pts+=num(r.pts);a.ast+=num(r.ast);a.rob+=num(r.rob);a.tap+=num(r.tap);a.per+=num(r.per);
    a.ro+=num(r.ro);a.rd+=num(r.rd);a.reb+=num(r.reb);a.fgm+=num(r.fgm);a.fga+=num(r.fga);
    a.tpm+=num(r.tpm);a.tpa+=num(r.tpa);a.ftm+=num(r.ftm);a.fta+=num(r.fta);a.faltas+=num(r.faltas);a.pm+=num(r.mas_menos);
  }
  return Object.values(map).map(a=>{delete a._nmlen;return a;});
}

let tiroTeam='',tiroPlayer='__all__',tiroMatch='',tiroTipo='all';
function setTiroTeam(v){tiroTeam=v;tiroPlayer='__all__';renderTiros();}
function setTiroPlayer(v){tiroPlayer=v;renderTiros();}

function shotMade(s){return s.made===true||s.made==='true'||+s.made===1;}
// Distancia del tiro al aro (en el sistema de coordenadas del dibujo de cancha).
function shotDist(s){const x=+s.x,y=+s.y;if(!isFinite(x)||!isFinite(y))return -1;const X=x/100*280,Y=y/100*150,bx=X<140?15.75:264.25;return Math.hypot(X-bx,Y-75);}
// Ancla el tipo de cada tiro al box score (planilla): por jugador-partido, los N
// tiros más lejanos (atrás del arco) son los triples que realmente intentó.
// Así los conteos coinciden EXACTO con la planilla oficial y el mapa ubica bien cada tiro.
function anchorShotTypes(){
  if(!SHOTS.length)return;
  const box={};
  (PLAYERS||[]).forEach(p=>{box[(p.match_id||'')+'|'+String(p.num)]={tpa:+p.tpa||0};});
  const groups={};
  SHOTS.forEach(s=>{const k=(s.match_id||'')+'|'+String(s.num);(groups[k]=groups[k]||[]).push(s);});
  Object.keys(groups).forEach(k=>{
    const arr=groups[k],info=box[k];
    if(!info)return; // sin planilla: dejar el tipo guardado
    const saved3=arr.filter(s=>s.tipo==='3pt').length;
    if(saved3===info.tpa)return; // ya coincide con la planilla → confiar en el dato guardado
    // dato viejo mal clasificado: re-anclar por distancia (los más lejanos = triples)
    arr.forEach(s=>{s._d=shotDist(s);});
    arr.slice().sort((a,b)=>b._d-a._d).forEach((s,i)=>{s.tipo=(i<info.tpa)?'3pt':'2pt';});
    arr.forEach(s=>{delete s._d;});
  });
}
function foldShot(s){let fx=+s.x,fy=+s.y;if(!isFinite(fx)||!isFinite(fy))return null;if(fx>50){fx=100-fx;fy=100-fy;}return{fx,fy,made:shotMade(s),tipo:s.tipo};}
const HEAT_ZONES={
  pint:[44,75], mizq:[60,48], mder:[60,102],
  tizq:[34,24], tcen:[98,75], tder:[34,126]
};
function heatZone(f){
  if(f.tipo==='3pt'){ if(f.fy<40)return 'tizq'; if(f.fy>60)return 'tder'; return 'tcen'; }
  if(f.fx<21&&Math.abs(f.fy-50)<17)return 'pint';
  return f.fy<50?'mizq':'mder';
}
function ppsColor(pps){
  if(pps>=1.30)return '#34c769';
  if(pps>=1.10)return '#7bc96f';
  if(pps>=0.95)return '#e0a83b';
  if(pps>=0.80)return '#f97316';
  return '#f05050';
}

function scatter3(est3){
  if(!est3)return '';
  let out='',seed=20260618;
  const rnd=()=>{seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff;};
  // rangos angulares (rad) desde el aro: tizq=arriba, tcen=tope, tder=abajo
  const zoneAng={tizq:[-1.40,-0.50],tcen:[-0.42,0.42],tder:[0.50,1.40]};
  const baskets=[{x:15.75,dir:1},{x:264.25,dir:-1}];
  const CAP=160; // máx de puntos por zona-aro, para no saturar
  ['tizq','tcen','tder'].forEach(k=>{
    const z=est3[k];if(!z||!z.a)return;
    const [a0,a1]=zoneAng[k];
    baskets.forEach(b=>{
      let n=Math.round(z.a/2),nm=Math.round(z.m/2);
      let scale=1;if(n>CAP){scale=CAP/n;nm=Math.round(nm*scale);n=CAP;}
      for(let i=0;i<n;i++){
        const ang=a0+(a1-a0)*rnd();
        const r=68.5+rnd()*22;
        let cx=b.x+b.dir*Math.cos(ang)*r;
        let cy=75+Math.sin(ang)*r;
        cx=Math.max(5,Math.min(275,cx));cy=Math.max(5,Math.min(145,cy));
        const made=i<nm;
        out+= made?'<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="1.5" fill="#34c769" fill-opacity="0.5"/>'
                  :'<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="1.5" fill="none" stroke="#f05050" stroke-opacity="0.42" stroke-width="0.7"/>';
      }
    });
  });
  return out;
}
function courtHeatSVG(shots,real3){
  const realDot=s=>{const x=+s.x,y=+s.y;if(!isFinite(x)||!isFinite(y))return'';
    const cx=(x/100*280).toFixed(1),cy=(y/100*150).toFixed(1);
    return shotMade(s)?'<circle cx="'+cx+'" cy="'+cy+'" r="1.7" fill="#34c769" fill-opacity="0.28"/>'
                      :'<circle cx="'+cx+'" cy="'+cy+'" r="1.7" fill="none" stroke="#f05050" stroke-opacity="0.26" stroke-width="0.8"/>';};
  const buckets={};Object.keys(HEAT_ZONES).forEach(k=>buckets[k]=[]);
  shots.map(foldShot).filter(Boolean).forEach(f=>{const z=heatZone(f);if(buckets[z])buckets[z].push(f);});
  // Zonas de TRIPLE: escalar a los totales reales de la planilla, repartiendo por densidad de los ubicados
  let est3=null;
  if(real3&&real3.a>0){
    const tz=['tizq','tcen','tder'],locA=tz.map(k=>buckets[k].length),tot=locA.reduce((a,b)=>a+b,0);
    const def={tizq:0.30,tcen:0.40,tder:0.30},o3=real3.m/real3.a;
    est3={};let usedA=0;
    tz.forEach((k,i)=>{const prop=tot>0?locA[i]/tot:def[k];const a=Math.round(real3.a*prop);est3[k]={a,m:Math.round(a*o3)};usedA+=a;});
    if(est3.tcen){est3.tcen.a+=(real3.a-usedA);if(est3.tcen.a<0)est3.tcen.a=0;est3.tcen.m=Math.round(est3.tcen.a*o3);}
  }
  // Puntos en cancha
  let dots;
  if(est3){
    // dobles: posición real · triples: nube estimada que iguala los carteles
    dots=shots.filter(s=>s.tipo!=='3pt').map(realDot).join('')+scatter3(est3);
  }else{
    dots=shots.map(realDot).join('');
  }
  let bubbles='';
  Object.keys(HEAT_ZONES).forEach(k=>{
    let m,a,estimated=false;
    if(est3&&est3[k]){a=est3[k].a;m=est3[k].m;estimated=true;}
    else{const arr=buckets[k];if(!arr.length)return;m=arr.filter(f=>f.made).length;a=arr.length;}
    if(!a)return;
    const pct=Math.round(m/a*100);
    const pps=(k[0]==='t'?3:2)*pct/100, col=ppsColor(pps);
    const r=Math.min(8,3+Math.sqrt(a)*1.0), z=HEAT_ZONES[k];
    [[z[0],z[1]],[280-z[0],z[1]]].forEach(c=>{const cx=c[0],cy=c[1];
      bubbles+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r.toFixed(1)+'" fill="'+col+'" fill-opacity="0.22" stroke="'+col+'" stroke-width="0.8"'+(estimated?' stroke-dasharray="2 1.3"':'')+'/>'+
        '<text x="'+cx+'" y="'+(cy-0.6)+'" fill="#fff" font-family="Barlow Condensed,sans-serif" font-weight="800" font-size="5" text-anchor="middle">'+pct+'%</text>'+
        '<text x="'+cx+'" y="'+(cy+3.7)+'" fill="#cfd5e3" font-family="DM Mono,monospace" font-size="3" text-anchor="middle">'+(estimated?'~':'')+m+'/'+a+'</text>';
    });
  });
  return '<svg class="court-svg" viewBox="0 0 280 150" xmlns="http://www.w3.org/2000/svg">'+fullCourtLines()+dots+bubbles+'</svg>';
}
function courtSVGFull(shots){
  const dots=shots.map(s=>{
    const x=+s.x,y=+s.y;if(!isFinite(x)||!isFinite(y))return'';
    const cx=(x/100*280).toFixed(1),cy=(y/100*150).toFixed(1);
    return shotMade(s)?'<circle class="shot-made" cx="'+cx+'" cy="'+cy+'" r="2.2"/>'

  }).join('');
  return '<svg class="court-svg" viewBox="0 0 280 150" xmlns="http://www.w3.org/2000/svg">'+fullCourtLines()+dots+'</svg>';
}
function renderTiros(){

  if(tiroTeam&&!teams.includes(tiroTeam))tiroTeam='';
  const boxTeam=boxPool.filter(p=>!tiroTeam||p.equipo===tiroTeam);
  const pkeyP=p=>((p.num!=null?p.num:'')+' '+(p.nombre||'')).trim();
  const players=[...new Set(boxTeam.map(pkeyP))].filter(Boolean).sort();
  if(tiroPlayer!=='__all__'&&!players.includes(tiroPlayer))tiroPlayer='__all__';
  const selNum=tiroPlayer==='__all__'?null:String(tiroPlayer).split(' ')[0];
  // MAPA (sólo ubicación): los tiros con coordenadas disponibles del equipo/jugador
  const rows=pool.filter(s=>!tiroTeam||s.equipo===tiroTeam);
  const sel=tiroPlayer==='__all__'?rows:rows.filter(s=>String(s.num)===selNum);
  const selT=tiroTipo==='all'?sel:sel.filter(s=>tiroTipo==='3'?s.tipo==='3pt':s.tipo!=='3pt');
  const tipoLbl=tiroTipo==='3'?'solo triples':tiroTipo==='2'?'solo dobles':'todos los tiros';
  // Conteos 2/3/total desde el box (coinciden con la planilla)
  const boxSel=tiroPlayer==='__all__'?boxTeam:boxTeam.filter(p=>String(p.num)===selNum);
  const bAgg=boxSel.reduce((a,p)=>{a.fgm+=+p.fgm||0;a.fga+=+p.fga||0;a.tpm+=+p.tpm||0;a.tpa+=+p.tpa||0;return a;},{fgm:0,fga:0,tpm:0,tpa:0});
  const pctf=(m,a)=>a?Math.round(m/a*1000)/10:0;
  const all={m:bAgg.fgm,a:bAgg.fga,pct:pctf(bAgg.fgm,bAgg.fga)};
  const p3={m:bAgg.tpm,a:bAgg.tpa,pct:pctf(bAgg.tpm,bAgg.tpa)};

    kpi(p2.pct+'%','Tiros de 2 · '+p2.m+'/'+p2.a)+
    kpi(p3.pct+'%','Tiros de 3 · '+p3.m+'/'+p3.a)+'</div>';
  const ctx='toda la temporada'+(tiroTeam?' · '+tiroTeam:'')+(tiroPlayer!=='__all__'?' · '+tiroPlayer:'');
  const titulo=heatMode?'Zonas de fortaleza':'Mapa de tiros';

    if(plRank.length){

    '<div class="court-box">'+
    '<div class="kpis ficha-kpis">'+kpi(rPPS.toFixed(2),'PUNTOS/TIRO REAL')+kpi(xPPS.toFixed(2),'ESPERADO POR ZONA')+kpi((dPPS>0?'+':'')+dPPS.toFixed(2),'DIFERENCIA','val-hl')+'</div>'+
    '<div class="zone-sub" style="margin-top:8px">'+veredicto+' · El <b>esperado</b> es cuánto vale en promedio un tiro desde esas zonas en toda tu liga; el <b>real</b> es lo que efectivamente metió. No incluye libres.</div></div>'):'';

const CORR_METRICS=[

function metricVal(a,key){const meta=CORR_METRICS.find(m=>m.key===key);let v=num(a[key]);if(meta&&meta.cnt)v=v/(a.pj||1);return v;}
function teamColor(name){const pal=['#f97316','#4f8ef7','#34c769','#a78bfa','#e0a83b','#f05050','#22d3ee','#ec4899','#84cc16','#fb923c'];name=String(name||'');let h=0;for(let i=0;i<name.length;i++)h=(h*31+name.charCodeAt(i))>>>0;return pal[h%pal.length];}
function teamGameStats(){
  const rows=allRowsFiltered();
  const matches=matchReboundIndex(rows);
  const g={};
  for(const r of rows){const k=(r.match_id||'?')+'|'+r.equipo;(g[k]=g[k]||{match_id:r.match_id,equipo:r.equipo,fecha:r.fecha,rows:[]}).rows.push(r);}
  const out=[];
  for(const k in g){
    const e=g[k];const a=agg(e.rows);
    const mt=matches[e.match_id]||{};const me=mt[e.equipo]||{ro:0,rd:0};
    let rro=0,rrd=0;for(const rn of Object.keys(mt)){if(rn!==e.equipo){rro+=mt[rn].ro;rrd+=mt[rn].rd;}}
    a.orbPct=(me.ro+rrd)>0?Math.round(me.ro/(me.ro+rrd)*100):0;
    a.drbPct=(me.rd+rro)>0?Math.round(me.rd/(me.rd+rro)*100):0;
    a.fga=a.pt2i+a.pt3i;a.fgm=a.pt2c+a.pt3c;
    a.fgPct=a.fga>0?Math.round(a.fgm/a.fga*1000)/10:0;
    a.threeVol=a.fga>0?Math.round(a.pt3i/a.fga*1000)/10:0;
    a.astPos=a.pos>0?a.ast/a.pos:0;a.astTo=a.per>0?a.ast/a.per:0;a.astRob=a.rob>0?a.ast/a.rob:0;
    out.push({team:e.equipo,label:e.equipo,sub:'vs '+((e.rows[0]&&e.rows[0].rival)||'?')+(e.fecha?' · '+String(e.fecha).slice(5):''),a});
  }
  return out;
}
function scatterSVG(pts,xlabel,ylabel,showLabels,hl){
  const W=480,H=318,M={l:56,r:20,t:16,b:52};
  const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y);
  let xmin=Math.min(...xs),xmax=Math.max(...xs),ymin=Math.min(...ys),ymax=Math.max(...ys);
  if(xmin===xmax){xmin-=1;xmax+=1;}if(ymin===ymax){ymin-=1;ymax+=1;}
  const xp=(xmax-xmin)*0.1,yp=(ymax-ymin)*0.12;
  const x0=xmin-xp,x1=xmax+xp,y0=ymin-yp,y1=ymax+yp;
  const sx=v=>M.l+(v-x0)/(x1-x0)*(W-M.l-M.r);
  const sy=v=>H-M.b-(v-y0)/(y1-y0)*(H-M.t-M.b);
  const n=pts.length,mx=xs.reduce((s,v)=>s+v,0)/n,my=ys.reduce((s,v)=>s+v,0)/n;
  let sxy=0,sxx=0,syy=0;pts.forEach(p=>{sxy+=(p.x-mx)*(p.y-my);sxx+=(p.x-mx)**2;syy+=(p.y-my)**2;});
  const slope=sxx?sxy/sxx:0,intercept=my-slope*mx,r=(sxx&&syy)?sxy/Math.sqrt(sxx*syy):0;
  const fmt=v=>Math.abs(v)>=100?Math.round(v):Math.abs(v)>=10?Math.round(v*10)/10:Math.round(v*100)/100;
  // fondo neutro, sin líneas de promedio ni cuadrantes
  const quad='<rect x="'+M.l+'" y="'+M.t+'" width="'+(W-M.l-M.r)+'" height="'+(H-M.t-M.b)+'" fill="rgba(255,255,255,0.012)"/>';
  const means='';
  let grid='';
  for(let i=0;i<=4;i++){
    const vx=x0+(x1-x0)*i/4,vy=y0+(y1-y0)*i/4;
    grid+='<line x1="'+sx(vx).toFixed(1)+'" y1="'+M.t+'" x2="'+sx(vx).toFixed(1)+'" y2="'+(H-M.b)+'" stroke="rgba(255,255,255,0.05)"/>'+
      '<line x1="'+M.l+'" y1="'+sy(vy).toFixed(1)+'" x2="'+(W-M.r)+'" y2="'+sy(vy).toFixed(1)+'" stroke="rgba(255,255,255,0.05)"/>'+
      '<text x="'+sx(vx).toFixed(1)+'" y="'+(H-M.b+15)+'" fill="#aeb4c2" font-size="9.5" text-anchor="middle" font-family="DM Mono,monospace">'+fmt(vx)+'</text>'+
      '<text x="'+(M.l-7)+'" y="'+(sy(vy)+3.5).toFixed(1)+'" fill="#aeb4c2" font-size="9.5" text-anchor="end" font-family="DM Mono,monospace">'+fmt(vy)+'</text>';
  }
  const ty0=intercept+slope*x0,ty1=intercept+slope*x1;
  const trend='<line x1="'+sx(x0).toFixed(1)+'" y1="'+sy(ty0).toFixed(1)+'" x2="'+sx(x1).toFixed(1)+'" y2="'+sy(ty1).toFixed(1)+'" stroke="#a78bfa" stroke-width="1.6" stroke-dasharray="5 4" stroke-opacity="0.9"/>';
  const dots=pts.map(p=>{
    const c=teamColor(p.team);
    const dim=hl&&p.team!==hl;
    const R=dim?3:(hl&&p.team===hl?5.2:4.2);
    const op=dim?0.18:0.95;
    const ring=(hl&&p.team===hl)?'<circle cx="'+sx(p.x).toFixed(1)+'" cy="'+sy(p.y).toFixed(1)+'" r="'+(R+2.6)+'" fill="none" stroke="'+c+'" stroke-opacity="0.45" stroke-width="1.2"/>':'';
    const lbl=(showLabels&&!dim)?'<text x="'+(sx(p.x)+7).toFixed(1)+'" y="'+(sy(p.y)+3.5).toFixed(1)+'" fill="#dde1ec" font-size="9" font-family="DM Sans,sans-serif" font-weight="600">'+p.label+'</text>':'';
    return ring+'<circle class="scpt" cx="'+sx(p.x).toFixed(1)+'" cy="'+sy(p.y).toFixed(1)+'" r="'+R+'" fill="'+c+'" fill-opacity="'+op+'" stroke="rgba(255,255,255,0.35)" stroke-width="0.6" data-team="'+escAttr(p.team)+'" data-sub="'+escAttr(p.sub||'')+'" data-x="'+fmt(p.x)+'" data-y="'+fmt(p.y)+'" data-col="'+c+'"></circle>'+lbl;
  }).join('');
  const titles='<text x="'+((M.l+W-M.r)/2)+'" y="'+(H-7)+'" fill="#d8dce8" font-size="11" text-anchor="middle" font-family="DM Mono,monospace" letter-spacing="0.5">'+xlabel+'</text>'+
    '<text x="15" y="'+((M.t+H-M.b)/2)+'" fill="#d8dce8" font-size="11" text-anchor="middle" font-family="DM Mono,monospace" letter-spacing="0.5" transform="rotate(-90 15 '+((M.t+H-M.b)/2)+')">'+ylabel+'</text>';
  const frame='<line x1="'+M.l+'" y1="'+M.t+'" x2="'+M.l+'" y2="'+(H-M.b)+'" stroke="rgba(255,255,255,0.22)"/><line x1="'+M.l+'" y1="'+(H-M.b)+'" x2="'+(W-M.r)+'" y2="'+(H-M.b)+'" stroke="rgba(255,255,255,0.22)"/>';
  return {svg:'<svg class="court-svg" viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">'+quad+grid+means+frame+trend+dots+titles+'</svg>',r,n};
}

// ── Top factores que más acercan a la victoria ──
function pearson(xs,ys){
  const n=xs.length;if(n<2)return 0;
  const mx=xs.reduce((s,v)=>s+v,0)/n,my=ys.reduce((s,v)=>s+v,0)/n;
  let sxy=0,sxx=0,syy=0;
  for(let i=0;i<n;i++){const dx=xs[i]-mx,dy=ys[i]-my;sxy+=dx*dy;sxx+=dx*dx;syy+=dy*dy;}
  return (sxx&&syy)?sxy/Math.sqrt(sxx*syy):0;
}
function setCorrFactor(key){corrX=key;corrY='diff';renderCorrel();}
function winFactorsPanel(ents){
  const lvlTxt=corrLevel==='team'?'comparando equipos · temporada':'partido a partido';
  const cand=CORR_METRICS.filter(m=>m.key!=='diff'&&m.key!=='ptsF'&&m.key!=='ptsC');
  const tgt=ents.map(e=>metricVal(e.a,'diff'));
  const rows=[];
  cand.forEach(m=>{
    const xs=[],ys=[];
    ents.forEach((e,i)=>{const v=metricVal(e.a,m.key),t=tgt[i];if(isFinite(v)&&isFinite(t)){xs.push(v);ys.push(t);}});
    if(xs.length<3)return;
    const r=pearson(xs,ys);
    if(!isFinite(r))return;
    rows.push({key:m.key,label:m.label,r:r,abs:Math.abs(r)});
  });
  rows.sort((a,b)=>b.abs-a.abs);
  const top=rows.slice(0,4);
  if(!top.length)return '<div class="wf-wrap"><div class="wf-head">🎯 Lo que más te acerca a ganar</div><div class="wf-empty">Necesito al menos 3 partidos para medir qué factores pesan más en el resultado. Guardá más partidos.</div></div>';
  const cards=top.map((f,idx)=>{
    const up=f.r>=0;
    const pct=Math.min(100,Math.round(f.abs*100));
    const sel=(corrX===f.key&&corrY==='diff');
    const arrow=up?'▲':'▼';
    const acol=up?'var(--positive)':'#e0a83b';
    const dir=up?'Cuanto más alto, más cerca del triunfo':'Cuanto más bajo, más cerca del triunfo';
    return '<button class="wf-card'+(sel?' sel':'')+'" onclick="setCorrFactor(\''+f.key+'\')">'+
      '<span class="wf-rank">'+(idx+1)+'</span>'+
      '<span class="wf-main"><span class="wf-label">'+f.label+'</span>'+
      '<span class="wf-dir" style="color:'+acol+'">'+arrow+' '+dir+'</span></span>'+
      '<span class="wf-meter"><span class="wf-rv">r '+(f.r>=0?'+':'')+f.r.toFixed(2)+'</span>'+
      '<span class="wf-bar"><i style="width:'+pct+'%;background:'+acol+'"></i></span></span>'+
      '</button>';
  }).join('');
  return '<div class="wf-wrap"><div class="wf-head">🎯 Lo que más te acerca a ganar'+
    '<span class="wf-sub">'+lvlTxt+' · top 4 por relación con el diferencial</span></div>'+
    '<div class="wf-grid">'+cards+'</div>'+
    '<div class="wf-foot">Ordenamos cada métrica por su correlación (r) con el diferencial de puntos —el resultado—. Tocá una tarjeta para verla en el gráfico contra el resultado. No contamos «puntos a favor/en contra» porque son el resultado en sí.</div></div>';
}

function attachScatterTips(xlabel,ylabel){

      '<div class="r">'+ylabel+': <b>'+el.getAttribute('data-y')+'</b></div>';
    tip.classList.add('on');
    const w=tip.offsetWidth,h=tip.offsetHeight;let tx=cx+15,ty=cy+15;
    if(tx+w>window.innerWidth-8)tx=cx-w-15;if(ty+h>window.innerHeight-8)ty=cy-h-15;
    tip.style.left=Math.max(8,tx)+'px';tip.style.top=Math.max(8,ty)+'px';
  };
  document.querySelectorAll('#view-correl .scpt').forEach(c=>{
    c.addEventListener('mouseenter',e=>show(c,e.clientX,e.clientY));
    c.addEventListener('mousemove',e=>show(c,e.clientX,e.clientY));
    c.addEventListener('mouseleave',hide);
    c.addEventListener('touchstart',e=>{const t=e.touches[0];show(c,t.clientX,t.clientY);e.stopPropagation();},{passive:true});
  });
  if(!window.__scTipBound){document.addEventListener('touchstart',e=>{if(!(e.target&&e.target.classList&&e.target.classList.contains('scpt')))hide();},{passive:true});window.__scTipBound=true;}

function renderCuartos(){

  // A) promedio de puntos por cuarto (liga)
  const byQ={};qs.forEach(q=>byQ[q]={pf:0,pc:0,n:0});
  rows.forEach(r=>{const q=num(r.cuarto);if(byQ[q]){byQ[q].pf+=num(r.pts_favor);byQ[q].pc+=num(r.pts_contra);byQ[q].n++;}});
  const maxPf=Math.max(1,...qs.map(q=>byQ[q].n?byQ[q].pf/byQ[q].n:0));
  const aCards=qs.map(q=>{const b=byQ[q],pf=b.n?b.pf/b.n:0,w=Math.round(pf/maxPf*100);
    return '<div class="tramo-card"><div class="lbl">'+qLabel(q)+'</div><div class="big" style="color:#f97316">'+pf.toFixed(1)+'</div><div class="sub">pts/cuarto · '+(b.n?(b.pc/b.n).toFixed(1):'0')+' en contra</div><div class="tramo-bar"><div class="tramo-fill" style="width:'+w+'%;background:#f97316"></div></div></div>';
  }).join('');
  // B) ¿ganar el cuarto = ganar el partido?
  const g={};
  rows.forEach(r=>{const k=r.match_id+'|'+r.equipo;if(!g[k])g[k]={byQ:{},gd:0};g[k].byQ[num(r.cuarto)]=num(r.diff);g[k].gd+=num(r.diff);});
  const ents=Object.values(g);
  const bCards=qs.map(q=>{
    const won=ents.filter(e=>e.byQ[q]!==undefined&&e.byQ[q]>0);
    const pct=won.length?Math.round(won.filter(e=>e.gd>0).length/won.length*100):0;
    const col=pct>=65?'#34c769':pct>=50?'#e0a83b':'#f05050';
    return '<div class="tramo-card"><div class="lbl">Gana '+qLabel(q)+'</div><div class="big" style="color:'+col+'">'+pct+'%</div><div class="sub">gana el partido · '+won.length+' casos</div><div class="tramo-bar"><div class="tramo-fill" style="width:'+pct+'%;background:'+col+'"></div></div></div>';
  }).join('');
  // C) rendimiento por cuarto de un equipo
  const teams=[...new Set(rows.map(r=>r.equipo))].sort();
  if(cuartoTeam&&!teams.includes(cuartoTeam))cuartoTeam='';
  const teamSel='<div class="tiros-ctl"><span class="zone-lbl">Equipo</span><select onchange="setCuartoTeam(this.value)"><option value="">— Elegí un equipo —</option>'+teams.map(t=>'<option'+(t===cuartoTeam?' selected':'')+'>'+t+'</option>').join('')+'</select></div>';
  let teamBlock='';
  if(cuartoTeam){
    const tr=rows.filter(r=>r.equipo===cuartoTeam);
    const t={};qs.forEach(q=>t[q]={pf:0,pc:0,diff:0,n:0,w:0,l:0,e:0});
    tr.forEach(r=>{const q=num(r.cuarto),b=t[q];if(!b)return;b.pf+=num(r.pts_favor);b.pc+=num(r.pts_contra);b.diff+=num(r.diff);b.n++;const d=num(r.diff);if(d>0)b.w++;else if(d<0)b.l++;else b.e++;});
    const head='<tr><th style="text-align:left">Cuarto</th><th>PJ</th><th>PF</th><th>PC</th><th>DIF</th><th>Récord</th></tr>';
    const body=qs.map(q=>{const b=t[q];if(!b.n)return'';const dif=b.diff/b.n;
      return '<tr><td style="text-align:left"><b>'+qLabel(q)+'</b></td><td>'+b.n+'</td><td>'+(b.pf/b.n).toFixed(1)+'</td><td>'+(b.pc/b.n).toFixed(1)+'</td><td style="color:'+dc(dif)+'">'+sgn(Math.round(dif*10)/10)+'</td><td>'+b.w+'-'+b.l+(b.e?'-'+b.e:'')+'</td></tr>';}).join('');
    teamBlock='<div class="sec">'+cuartoTeam+' · rendimiento por cuarto</div><div class="board"><div class="tblwrap"><table class="t"><thead>'+head+'</thead><tbody>'+body+'</tbody></table></div></div>';
  }
  el.innerHTML='<div class="sec">Promedio de puntos por cuarto (liga)</div>'+
    '<div class="tramo-grid" style="grid-template-columns:repeat('+cols+',1fr)">'+aCards+'</div>'+
    '<div class="sec">¿Ganar el cuarto = ganar el partido?</div>'+
    '<div class="tramo-grid" style="grid-template-columns:repeat('+cols+',1fr)">'+bCards+'</div>'+
    teamSel+teamBlock;
}

  return '<svg class="court-svg" viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">'+grid+bars+baseline+line+vdots+xl+legend+'</svg>';

function radarSVG(dims){
  const cx=160,cy=152,R=100,N=dims.length;
  const ang=i=>(-90+i*360/N)*Math.PI/180;
  const pt=(i,rr)=>[cx+Math.cos(ang(i))*rr,cy+Math.sin(ang(i))*rr];

  let axes='';dims.forEach((d,i)=>{const[x,y]=pt(i,R);axes+='<line x1="'+cx+'" y1="'+cy+'" x2="'+x.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="rgba(255,255,255,0.08)"/>';});

  let labels='';dims.forEach((d,i)=>{const[x,y]=pt(i,R+19);const anc=Math.abs(x-cx)<12?'middle':(x>cx?'start':'end');
    labels+='<text x="'+x.toFixed(1)+'" y="'+(y-2).toFixed(1)+'" fill="#aeb4c2" font-size="9" text-anchor="'+anc+'" font-family="DM Sans,sans-serif">'+d[0]+'</text>'+
      '<text x="'+x.toFixed(1)+'" y="'+(y+9).toFixed(1)+'" fill="#34c769" font-size="11.5" font-weight="800" text-anchor="'+anc+'" font-family="Barlow Condensed,sans-serif">'+(d[1]/10).toFixed(1)+'</text>';});

}
function radarPentaSVG(labels,series){

  const pt=(i,rr)=>[cx+Math.cos(ang(i))*rr,cy+Math.sin(ang(i))*rr];
  let rings='';[20,40,60,80,100].forEach(lev=>{const pts=labels.map((_,i)=>{const[x,y]=pt(i,lev/100*R);return x.toFixed(1)+','+y.toFixed(1);}).join(' ');rings+='<polygon points="'+pts+'" fill="none" stroke="rgba(255,255,255,0.07)"/>';});

    const verts=s.vals.map((v,i)=>{const[x,y]=pt(i,cl(v)/100*R);return '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="2.4" fill="'+s.color+'"/>';}).join('');
    polys+='<polygon points="'+poly+'" fill="'+s.color+'" fill-opacity="0.13" stroke="'+s.color+'" stroke-width="1.7"/>'+verts;
  });
  let lbls='';labels.forEach((d,i)=>{const[x,y]=pt(i,R+19);const anc=Math.abs(x-cx)<12?'middle':(x>cx?'start':'end');
    lbls+='<text x="'+x.toFixed(1)+'" y="'+(y+3).toFixed(1)+'" fill="#aeb4c2" font-size="9.5" text-anchor="'+anc+'" font-family="DM Sans,sans-serif">'+d+'</text>';});
  return '<svg viewBox="0 0 340 320" class="court-svg" style="max-width:380px;margin:0 auto;display:block">'+rings+axes+polys+lbls+'</svg>';
}
function renderFicha(){

  const valArr=pool.map(fichaVal);
  const pAnot=pctRank(A.anot,pg(cur,'pts')),pGen=pctRank(A.gen,pg(cur,'ast')),pTiro=pctRank(A.tiro,pg(cur,'tpm')),pReb=pctRank(A.reb,pg(cur,'reb')),pDef=pctRank(A.def,pg(cur,'rob')+pg(cur,'tap'));
  const pVers=Math.round((pAnot+pGen+pTiro+pReb+pDef)/5),pGlob=pctRank(valArr,fichaVal(cur));
  const dims=[['Anotación',pAnot],['Generación',pGen],['Tiro ext.',pTiro],['Rebote',pReb],['Defensa',pDef],['Versatilidad',pVers],['Global',pGlob]];
  // jugadores similares: distancia entre perfiles de percentiles (5 facetas)
  const curVec=[pAnot,pGen,pTiro,pReb,pDef];

  // ── CLONES (modo tabla: ranking de TODOS los jugadores por parecido al de referencia) ──

    }).filter(r=>r.p!==cur);
    crows.sort((x,y)=>{const c=x[cloneSort.key]-y[cloneSort.key];return cloneSort.dir<0?-c:c;});

    const cref='<div class="ficha-card" style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:16px 20px"><div><div class="fh-name" style="font-size:26px">'+cur.nombre+' <span class="fh-num">#'+cur.num+'</span></div><div class="fh-team" style="margin-top:5px">'+cur.equipo+' · jugador de referencia</div></div><span class="fh-tag" style="margin-left:auto">'+roleFromVec(curVec)+'</span></div>';

async function shareFicha(){
  const btn=document.getElementById('fichaPdfBtn');if(!btn)return;const old=btn.textContent;btn.textContent='Generando…';btn.disabled=true;
  try{
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
    const node=document.getElementById('ficha-report');
    node.querySelectorAll('.pbar-fill').forEach(f=>{if(f.dataset.w)f.style.width=f.dataset.w+'%';});
    const cur=fichaList().find(p=>fichaId(p)===fichaSel);
    const nombre='Ficha_'+String(cur?cur.nombre:'jugador').replace(/\s+/g,'_');
    const canvas=await html2canvas(node,{backgroundColor:'#08090d',scale:2,useCORS:true});
    await new Promise(res=>canvas.toBlob(async(blob)=>{
      const file=new File([blob],nombre+'.png',{type:'image/png'});
      if(navigator.canShare&&navigator.canShare({files:[file]})){
        try{await navigator.share({files:[file],title:nombre});}catch(e){}
      }else{
        const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=nombre+'.png';a.click();URL.revokeObjectURL(url);
      }
      res();
    },'image/png'));
  }catch(e){alert('No se pudo generar la ficha: '+(e.message||e));}
  btn.textContent=old;btn.disabled=false;
}
function pp1(v){return (Math.round(v*10)/10).toFixed(1);}

// ── VISTA BUSCADOR (filtro por característica + rango de percentil) ──
const BS_DIMS=[['anot','Anotación'],['gen','Generación'],['tiro','Tiro ext.'],['reb','Rebote'],['def','Defensa'],['vers','Versatilidad'],['glob','Global']];
let bsRows=[{dim:'anot',min:70,max:100}];
function bsLabel(k){const d=BS_DIMS.find(x=>x[0]===k);return d?d[1]:k;}
function playerUSG(p){
  const fz=(document.getElementById('selFase')||{}).value||'';
  const inFz=q=>!fz||q.fase===fz;
  const myRows=PLAYERS.filter(q=>inFz(q)&&q.equipo===p.equipo&&String(q.num)===String(p.num)&&(+q.min>0));
  if(!myRows.length)return null;
  const mids=new Set(myRows.map(q=>q.match_id));
  const teamRows=PLAYERS.filter(q=>inFz(q)&&q.equipo===p.equipo&&mids.has(q.match_id));
  const s=(rows,k)=>rows.reduce((a,q)=>a+(+q[k]||0),0);
  const pMP=s(myRows,'min'),tMP=s(teamRows,'min');
  const den=pMP*(s(teamRows,'fga')+0.44*s(teamRows,'fta')+s(teamRows,'per'));
  if(!(pMP>0&&den>0))return null;
  return Math.round(100*((s(myRows,'fga')+0.44*s(myRows,'fta')+s(myRows,'per'))*(tMP/5))/den);
}
let bsSort={key:'',dir:-1};
function bsSortBy(key){if(bsSort.key===key)bsSort.dir*=-1;else{bsSort.key=key;bsSort.dir=-1;}bsApply();}
function buscadorData(){
  const pool=fichaList();const pg=(p,k)=>p[k]/(p.g||1);
  const A={anot:pool.map(p=>pg(p,'pts')),gen:pool.map(p=>pg(p,'ast')),tiro:pool.map(p=>pg(p,'tpm')),reb:pool.map(p=>pg(p,'reb')),def:pool.map(p=>pg(p,'rob')+pg(p,'tap'))};
  const valArr=pool.map(fichaVal);
  return pool.map(p=>{
    const a=pctRank(A.anot,pg(p,'pts')),ge=pctRank(A.gen,pg(p,'ast')),ti=pctRank(A.tiro,pg(p,'tpm')),re=pctRank(A.reb,pg(p,'reb')),de=pctRank(A.def,pg(p,'rob')+pg(p,'tap'));
    const ve=Math.round((a+ge+ti+re+de)/5),gl=pctRank(valArr,fichaVal(p));
    return {p,pct:{anot:a,gen:ge,tiro:ti,reb:re,def:de,vers:ve,glob:gl},pts:pg(p,'pts'),reb:pg(p,'reb'),ast:pg(p,'ast'),val:fichaVal(p),usg:playerUSG(p)};
  });
}
function bsSync(){
  const rows=[...document.querySelectorAll('#view-buscador .bs-row')];
  if(rows.length)bsRows=rows.map(row=>{
    const dim=row.querySelector('.bs-dim').value;
    let mn=parseInt(row.querySelector('.bs-min').value),mx=parseInt(row.querySelector('.bs-max').value);
    if(isNaN(mn))mn=0;if(isNaN(mx))mx=100;mn=Math.max(0,Math.min(100,mn));mx=Math.max(0,Math.min(100,mx));if(mn>mx){const t=mn;mn=mx;mx=t;}
    return {dim,min:mn,max:mx};
  });
}
function bsAdd(){bsSync();const used=bsRows.map(r=>r.dim);const next=(BS_DIMS.find(d=>!used.includes(d[0]))||BS_DIMS[0])[0];bsRows.push({dim:next,min:0,max:100});renderBuscador();}
function bsDel(i){bsSync();bsRows.splice(i,1);if(!bsRows.length)bsRows=[{dim:'anot',min:70,max:100}];renderBuscador();}
function openFicha(id){fichaSel=id;if(typeof switchView==='function')switchView('ficha');renderFicha();window.scrollTo({top:0,behavior:'smooth'});}
function renderBuscador(){
  const el=document.getElementById('view-buscador');
  if(!fichaList().length){el.innerHTML='<div class="empty">Todavía no hay stats individuales.<br>Necesitás la tabla <b>jugadores_log</b> y re-guardar partidos desde Quintetos.</div>';return;}

    '<select class="bs-dim" onchange="bsApply()">'+BS_DIMS.map(d=>'<option value="'+d[0]+'"'+(r.dim===d[0]?' selected':'')+'>'+d[1]+'</option>').join('')+'</select>'+
    '<span class="bs-range">percentil <input class="bs-min" type="number" min="0" max="100" value="'+r.min+'" onchange="bsApply()"> a <input class="bs-max" type="number" min="0" max="100" value="'+r.max+'" onchange="bsApply()"></span>'+
    (bsRows.length>1?'<button class="bs-del" onclick="bsDel('+i+')">✕</button>':'')+
  '</div>').join('');
  el.innerHTML='<div class="sec">Buscar jugadores por característica</div>'+

    '<div class="zone-sub" style="margin-top:10px">Elegí una faceta y el rango de percentil (0-100). Sumá condiciones para cruzar características (ej: Anotación 70-100 + Rebote 0-40 = anotadores que no rebotean). Tocá un jugador para abrir su ficha.</div></div>'+
    '<div id="bs-results"></div>';
  bsApply();
}
function bsApply(){
  bsSync();
  const data=buscadorData();
  const res=data.filter(d=>bsRows.every(r=>d.pct[r.dim]>=r.min&&d.pct[r.dim]<=r.max));
  const out=document.getElementById('bs-results');if(!out)return;
  if(!res.length){out.innerHTML='<div class="bs-count">0 jugadores cumplen</div><div class="empty">Ningún jugador entra en ese rango. Probá ampliando los límites.</div>';return;}
  const filterDims=[...new Set(bsRows.map(r=>r.dim))];
  const cols=[
    {key:'nombre',label:'Jugador',l:true,str:true,val:d=>d.p.nombre,cell:d=>'<b>'+(d.p.num?'#'+d.p.num+' ':'')+d.p.nombre+'</b>'},
    {key:'equipo',label:'Equipo',l:true,str:true,val:d=>d.p.equipo,cell:d=>d.p.equipo},
    {key:'g',label:'PJ',val:d=>d.p.g,cell:d=>d.p.g},
  ].concat(filterDims.map(dim=>({key:'pct_'+dim,label:bsLabel(dim),val:d=>d.pct[dim],cell:d=>'<span class="pc" style="color:'+pctColor(d.pct[dim])+'">'+d.pct[dim]+'</span>'})))
   .concat([
    {key:'pts',label:'PTS',val:d=>d.pts,cell:d=>pp1(d.pts)},
    {key:'reb',label:'REB',val:d=>d.reb,cell:d=>pp1(d.reb)},
    {key:'ast',label:'AST',val:d=>d.ast,cell:d=>pp1(d.ast)},
    {key:'usg',label:'USG%',val:d=>d.usg==null?-1:d.usg,cell:d=>d.usg==null?'—':d.usg+'%'},
    {key:'val',label:'VAL',val:d=>d.val,cell:d=>pp1(d.val)},
  ]);
  // columna de orden: la elegida, o por defecto la primera faceta del filtro
  let col=cols.find(c=>c.key===bsSort.key);
  if(!col)col=cols.find(c=>c.key==='pct_'+filterDims[0])||cols[cols.length-1];
  const dir=bsSort.key?bsSort.dir:-1;
  res.sort((a,b)=>{const va=col.val(a),vb=col.val(b);const c=col.str?String(va).localeCompare(String(vb)):(va-vb);return dir<0?-c:c;});
  const th='<tr><th>#</th>'+cols.map(c=>{const active=col.key===c.key;const arrow=active?(dir<0?' ▾':' ▴'):'';return '<th'+(c.l?' class="l"':'')+' style="cursor:pointer;user-select:none" onclick="bsSortBy(\''+c.key+'\')" title="Ordenar por '+c.label+'">'+c.label+arrow+'</th>';}).join('')+'</tr>';
  const body=res.map((d,i)=>'<tr onclick="openFicha(\''+escAttr(fichaId(d.p))+'\')"><td>'+(i+1)+'</td>'+cols.map(c=>'<td'+(c.l?' class="l"':'')+'>'+c.cell(d)+'</td>').join('')+'</tr>').join('');
  out.innerHTML='<div class="bs-count">'+res.length+' jugador'+(res.length>1?'es':'')+' cumplen · tocá un encabezado para ordenar</div><div class="court-box" style="overflow-x:auto"><table class="bs-table"><thead>'+th+'</thead><tbody>'+body+'</tbody></table></div>';
}

function combos(arr,k){const res=[];(function go(start,cur){if(cur.length===k){res.push(cur.slice());return;}for(let i=start;i<arr.length;i++){cur.push(arr[i]);go(i+1,cur);cur.pop();}})(0,[]);return res;}
// Constante de confianza por minutos: una dupla/terna con pocos minutos juntos
// ve su impacto "encogido" hacia 0, para que no se cuelen muestras chicas.
// Con DUP_MIN_K=35, una pareja con pocos minutos juntos no puede colarse arriba
// de una que sostuvo su impacto durante muchos más minutos.
const DUP_MIN_K=35;
function leagueCombos(size,ignoreTeam){
  const team=ignoreTeam?'':document.getElementById('selTeam').value;
  const rows=allRowsFiltered().filter(r=>!team||r.equipo===team);
  const groups={};
  for(const r of rows){const ps=r.jugadores;if(!ps||ps.length!==5)continue;
    combos(ps,size).forEach(combo=>{const key=r.equipo+'#'+combo.map(pkey).sort().join('|');
      (groups[key]=groups[key]||{team:r.equipo,players:combo,rows:[]}).rows.push(r);});}
  let lus=Object.values(groups).map(g=>{
    const a=agg(g.rows);
    const net=a.min>0?Math.round(a.diff/a.min*40*10)/10:0;
    const conf=a.min/(a.min+DUP_MIN_K);          // los minutos importan
    const score=Math.round(net*conf*10)/10;       // impacto ajustado por minutos
    const key=g.team+'#'+g.players.map(pkey).sort().join('|');
    return {team:g.team,players:g.players,a,net,conf,score,key};
  });
  let f=lus.filter(l=>l.a.min>=10);if(f.length<5)f=lus.filter(l=>l.a.min>=5);if(f.length<5)f=lus.filter(l=>l.a.min>=2);
  return f;
}
// ── Panel de 3 tarjetas (pelota / tiro / defensa) vs promedio de la liga ──
// 'a' = agregado del sujeto (equipo o dupla/terna), 'la' = agregado de toda la liga
function weaknessPanel(a,la,subj,heading,intro){
  if(a.pos<=0)return '';
  const rt=(n,d)=>d>0?n/d:0;
  // 1) PELOTA — pérdidas por asistencia + pérdidas cada 100 posesiones
  const toAstT=rt(a.per,a.ast), toAstL=rt(la.per,la.ast);
  const to100T=rt(a.per,a.pos)*100, to100L=rt(la.per,la.pos)*100;
  // 2) TIRO — volumen (tiros x 100 pos) + dependencia del triple + eFG
  const fga100T=rt(a.fga,a.pos)*100, fga100L=rt(la.fga,la.pos)*100;
  const threeT=rt(a.pt3i,a.fga)*100, threeL=rt(la.pt3i,la.fga)*100;
  const efgT=a.efg, efgL=la.efg;
  // 3) DEFENSA — puntos recibidos por posesión
  const efdT=a.efDef, efdL=la.efDef;
  function card(tag,val,unit,sub,lg,worse){
    const cc=worse?'var(--negative)':'var(--positive)';
    const badge=worse?'⚠ peor que la liga':'✓ mejor que la liga';
    return '<div class="wk-card"><div class="wk-top"><span class="wk-tag">'+tag+'</span>'+
      '<span class="wk-badge" style="color:'+cc+';border-color:'+cc+'">'+badge+'</span></div>'+
      '<div class="wk-val" style="color:'+cc+'">'+val+' <span class="wk-u">'+unit+'</span></div>'+
      '<div class="wk-sub">'+sub+'</div><div class="wk-lg">Liga: '+lg+'</div></div>';
  }
  const c1=card('🟠 PELOTA',pp(toAstT),'PÉR x AST',
    to100T.toFixed(1)+' pérdidas cada 100 posesiones',
    pp(toAstL)+' pér/ast · '+to100L.toFixed(1)+'/100', toAstT>toAstL);
  const threeRisk=(threeT>threeL+3)&&(efgT<efgL);
  const c2=card('🟠 TIRO',fga100T.toFixed(1),'TIROS x 100 POS',
    threeT.toFixed(0)+'% son triples · eFG '+efgT.toFixed(1)+'%',
    fga100L.toFixed(1)+' tiros/100 · '+threeL.toFixed(0)+'% de 3 · eFG '+efgL.toFixed(1)+'%', threeRisk);
  const c3=card('🔵 DEFENSA',pp(efdT),'PTS RECIB x POS',
    'cuánto te anota el rival por cada posesión',
    pp(efdL)+' pts/pos', efdT>efdL);
  const flags=[];
  if(toAstT>toAstL)flags.push({n:'el cuidado de la pelota',d:(toAstT-toAstL)/(toAstL||1)});
  if(efdT>efdL)flags.push({n:'la defensa (le anotan fácil)',d:(efdT-efdL)/(efdL||1)});
  if(threeRisk)flags.push({n:'la dependencia del triple',d:(threeT-threeL)/(threeL||1)});
  flags.sort((a,b)=>b.d-a.d);
  const lead=flags.length
    ? '<div class="wk-lead">El punto más flojo de <b>'+subj+'</b> es <b>'+flags[0].n+'</b> comparado con el promedio de la liga.</div>'
    : '<div class="wk-lead"><b>'+subj+'</b> no muestra debilidades marcadas vs la liga en estas tres métricas. 👏</div>';
  return (heading?'<div class="sec" style="font-size:13px;margin-top:6px">'+heading+'</div>':'')+
    (intro?'<div class="zone-sub" style="margin:4px 0 10px">'+intro+'</div>':'')+
    '<div class="wk-grid">'+c1+c2+c3+'</div>'+lead;
}

  let w=0,l=0;Object.values(byMatch).forEach(d=>{if(d>0)w++;else if(d<0)l++;});return {w,l};
}
function clutchStats(team){
  const inC=r=>(+r.period>=4)&&r.seg!=null&&(+r.seg<=300)&&Math.abs((+r.s_fav||0)-(+r.s_riv||0))<=5;
  const off=PBP.filter(r=>r.equipo===team&&inC(r)),def=PBP.filter(r=>r.rival===team&&inC(r));
  const ptsFor=off.reduce((s,r)=>s+(+r.pts||0),0),ptsAgs=def.reduce((s,r)=>s+(+r.pts||0),0);
  const mids=new Set([...off,...def].map(r=>r.match_id));
  let w=0,l=0;teamGames(team).forEach(g=>{if(mids.has(g.mid)){if(g.diff>0)w++;else if(g.diff<0)l++;}});
  return {ptsFor,ptsAgs,events:off.length+def.length,matches:mids.size,w,l};
}

function leagueAvgFour(stats,def){
  const acc={efg:0,tov:0,orb:0,ftr:0};let n=0;
  stats.forEach(s=>{const f=def?fourDef(s.team,s.a):fourOff(s.a);acc.efg+=f.efg;acc.tov+=f.tov;acc.orb+=f.orb;acc.ftr+=f.ftr;n++;});
  if(!n)return acc;return {efg:+(acc.efg/n).toFixed(1),tov:+(acc.tov/n).toFixed(1),orb:Math.round(acc.orb/n),ftr:+(acc.ftr/n).toFixed(1)};

function paretoChart(items,totalOverride){
  const W=680,H=330,M={l:40,r:46,t:18,b:78},n=items.length;
  const total=(totalOverride||items.reduce((s,it)=>s+it.val,0))||1,maxVal=Math.max(...items.map(it=>it.val),1);
  const innerW=W-M.l-M.r,innerH=H-M.t-M.b,step=innerW/n,bw=Math.min(46,step*0.6);
  const cx=i=>M.l+step*(i+0.5),syL=v=>H-M.b-(v/maxVal)*innerH,syR=p=>H-M.b-(p/100)*innerH;
  let grid='';for(let i=0;i<=4;i++){const v=maxVal*i/4,y=syL(v).toFixed(1);
    grid+='<line x1="'+M.l+'" y1="'+y+'" x2="'+(W-M.r)+'" y2="'+y+'" stroke="rgba(255,255,255,0.05)"/>'+
      '<text x="'+(M.l-5)+'" y="'+(+y+3)+'" fill="#8891a0" font-size="8.5" text-anchor="end" font-family="DM Mono,monospace">'+Math.round(v)+'</text>';}
  let rax='';[0,25,50,75,100].forEach(p=>{const y=syR(p).toFixed(1);rax+='<text x="'+(W-M.r+6)+'" y="'+(+y+3)+'" fill="#f9a86b" font-size="8.5" text-anchor="start" font-family="DM Mono,monospace">'+p+'%</text>';});
  const l80='<line x1="'+M.l+'" y1="'+syR(80).toFixed(1)+'" x2="'+(W-M.r)+'" y2="'+syR(80).toFixed(1)+'" stroke="#f97316" stroke-opacity="0.45" stroke-dasharray="4 4"/>';
  let bars='',xl='',cum=0;const pts=[];
  items.forEach((it,i)=>{const x=cx(i),top=syL(it.val),share=Math.round(it.val/total*100);
    bars+='<rect x="'+(x-bw/2).toFixed(1)+'" y="'+top.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+(H-M.b-top).toFixed(1)+'" rx="2" fill="#34c769" fill-opacity="0.55"/>'+
      '<text x="'+x.toFixed(1)+'" y="'+(top-4).toFixed(1)+'" fill="#34c769" font-size="9" font-weight="800" text-anchor="middle" font-family="Barlow Condensed,sans-serif">'+share+'%</text>';
    cum+=it.val;const cp=Math.round(cum/total*100);pts.push([x,syR(cp),cp]);
    const lab=(it.num?'#'+it.num+' ':'')+String(it.name).split(' ')[0];
    xl+='<text transform="rotate(38 '+x.toFixed(1)+' '+(H-M.b+13)+')" x="'+x.toFixed(1)+'" y="'+(H-M.b+13)+'" fill="#aeb4c2" font-size="8.5" text-anchor="start" font-family="DM Mono,monospace">'+lab+'</text>';});
  const line='<polyline points="'+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')+'" fill="none" stroke="#f97316" stroke-width="2"/>';
  const dots=pts.map(p=>'<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3" fill="#f97316"/><text x="'+p[0].toFixed(1)+'" y="'+(p[1]-6).toFixed(1)+'" fill="#f9a86b" font-size="8" text-anchor="middle" font-family="DM Mono,monospace">'+p[2]+'%</text>').join('');
  const baseline='<line x1="'+M.l+'" y1="'+(H-M.b)+'" x2="'+(W-M.r)+'" y2="'+(H-M.b)+'" stroke="rgba(255,255,255,0.22)"/>';
  return '<svg class="court-svg" viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">'+grid+l80+bars+baseline+line+dots+xl+rax+'</svg>';
}

function armLineupAggs(rows){
  const groups={};
  (rows||[]).forEach(r=>{if(!Array.isArray(r.jugadores)||r.jugadores.length!==5)return;const k=(r.equipo||'')+'#'+(r.jugadores_key||pkeyArr(r.jugadores));(groups[k]=groups[k]||{team:r.equipo,players:r.jugadores,rows:[]}).rows.push(r);});
  return Object.values(groups).map(g=>({team:g.team,players:g.players,a:agg(g.rows)}));
}
function armLuCard(title,cls,list,mode){
  // mode: 'mine' (muestra NET y +/-) · 'rival' (muestra cuánto te superó)
  if(!list.length)return '<div class="lu-card '+cls+'"><div class="lu-h">'+title+'</div><div class="zone-sub" style="font-size:11px">Todavía no hay quintetos con minutos suficientes para mostrar acá.</div></div>';

    let meta;
    if(mode==='rival'){const txt=d>0?('te superó por +'+d):(d<0?('lo superaste por '+(-d)):'quedó parejo');meta='<span style="color:'+(d>0?'var(--negative)':'var(--positive)')+'">'+txt+'</span> · '+Math.round(x.a.min)+' min';}
    else{meta='<span style="color:'+dc(d)+'">'+sgn(d)+'</span> · NET '+net.toFixed(2)+' · '+Math.round(x.a.min)+' min';}
    return '<div class="lu-item"><div class="lu-rank">'+(i+1)+'</div><div class="lu-body">'+
      (mode==='rival'?'<div class="lu-team">'+x.team+'</div>':'')+

  }).join('');
  return '<div class="lu-card '+cls+'"><div class="lu-h">'+title+'</div>'+items+'</div>';
}
function armDestacados(team){
  const MINMIN=4;
  const mine=armLineupAggs(teamRows(team)).filter(x=>x.a.min>=MINMIN);
  const byNet=mine.slice().sort((a,b)=>((b.a.efOff-b.a.efDef)-(a.a.efOff-a.a.efDef)));
  const best=byNet.slice(0,3),worst=byNet.slice(-3).reverse();
  const rivAg=armLineupAggs(allRowsFiltered().filter(r=>r.rival===team)).filter(x=>x.a.min>=MINMIN);
  const byDmg=rivAg.slice().sort((a,b)=>(b.a.diff||0)-(a.a.diff||0));
  const mostDmg=byDmg.slice(0,3),leastDmg=byDmg.slice(-3).reverse();
  return '<div class="sec" style="margin-top:18px">Quintetos destacados · '+team+'</div>'+
    '<div class="zone-sub" style="margin-bottom:6px">Ordenado por rendimiento (mínimo '+MINMIN+' min juntos para entrar). NET = puntos por posesión a favor menos en contra.</div>'+
    '<div class="arm-dest">'+
      armLuCard('🟢 Tus 3 mejores quintetos','good',best,'mine')+

      armLuCard('🛡 Los que más daño te hicieron','bad',mostDmg,'rival')+
      armLuCard('✅ Los que menos daño te hicieron','good',leastDmg,'rival')+
    '</div>';
}
