<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Esfuerzo · ScoutPro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=DM+Mono:wght@400;500&family=Barlow+Condensed:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg-base:#08090d;--bg-raised:#0f1117;--bg-panel:#161820;--bg-hover:#1e202a;
  --border-subtle:rgba(255,255,255,0.05);--border-light:rgba(255,255,255,0.09);--border-strong:rgba(255,255,255,0.18);
  --offense:#f97316;--offense-bg:rgba(249,115,22,0.10);--offense-mid:rgba(249,115,22,0.22);
  --defense:#4f8ef7;--defense-bg:rgba(79,142,247,0.10);--defense-mid:rgba(79,142,247,0.22);
  --positive:#34c769;--negative:#f05050;--insight:#a78bfa;
  --text:#d8dce8;--text-2:#8891a0;--text-3:#434b5a;
  --font-ui:'DM Sans',system-ui,sans-serif;--font-mono:'DM Mono',monospace;--font-disp:'Barlow Condensed',sans-serif;
  --sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--r-sm:3px;--r:5px;--r-lg:8px;--t-fast:100ms ease;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg-base);color:var(--text);font-family:var(--font-ui);font-size:13px;-webkit-font-smoothing:antialiased;min-height:100vh}
.topbar{display:flex;align-items:center;gap:var(--sp-3);padding:12px 20px;border-bottom:1px solid var(--border-light);background:var(--bg-raised);position:sticky;top:0;z-index:20}
.logo{font-family:var(--font-disp);font-weight:900;font-size:22px;letter-spacing:2px;line-height:1;flex-shrink:0}
.logo .a{color:var(--offense)}
.logo .v{font-family:var(--font-mono);font-size:8px;color:var(--text-3);letter-spacing:2px;margin-left:6px;border:1px solid var(--border-light);border-radius:var(--r-sm);padding:2px 6px;vertical-align:middle}
.tb-spacer{flex:1}
.tb-btn{background:var(--bg-panel);border:1px solid var(--border-light);border-radius:var(--r-sm);color:var(--text-2);font-family:var(--font-mono);font-size:10px;padding:7px 13px;cursor:pointer;transition:all var(--t-fast);white-space:nowrap;text-decoration:none;display:inline-block}
.tb-btn:hover{border-color:var(--offense);color:var(--offense)}
.tb-btn.qtos:hover{border-color:var(--insight);color:var(--insight)}
.wrap{max-width:1180px;margin:0 auto;padding:var(--sp-5) 20px 80px}
.controls{display:flex;flex-wrap:wrap;gap:var(--sp-3);margin-bottom:var(--sp-4)}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-family:var(--font-mono);font-size:8px;letter-spacing:1px;color:var(--text-3);text-transform:uppercase}
.field select,.field input{background:var(--bg-raised);border:1px solid var(--border-light);border-radius:var(--r);padding:9px var(--sp-3);font-family:var(--font-ui);font-size:13px;color:var(--text);outline:none;min-width:150px;cursor:pointer}
.field input{cursor:text;font-family:var(--font-mono);font-size:12px}
.teamfix{background:var(--offense-bg);border:1px solid rgba(249,115,22,.4);border-radius:var(--r);padding:9px var(--sp-3);font-family:var(--font-disp);font-weight:700;font-size:15px;letter-spacing:.5px;color:var(--offense);min-width:150px}
.tabs{display:flex;gap:4px;margin-bottom:var(--sp-4);border-bottom:1px solid var(--border-light)}
.tab{background:none;border:none;border-bottom:2px solid transparent;color:var(--text-3);font-family:var(--font-mono);font-size:11px;letter-spacing:.5px;padding:10px 16px;cursor:pointer;transition:all var(--t-fast);margin-bottom:-1px}
.tab:hover{color:var(--text-2)}
.tab.active{color:var(--offense);border-bottom-color:var(--offense)}
.view{display:none}.view.active{display:block}
.sec{font-family:var(--font-disp);font-weight:700;font-size:16px;letter-spacing:.5px;color:var(--text);display:flex;align-items:center;gap:10px;margin:var(--sp-5) 0 var(--sp-3)}
.sec::after{content:'';flex:1;height:1px;background:var(--border-subtle)}
.zone-sub{font-family:var(--font-mono);font-size:11px;color:var(--text-2);line-height:1.6}
.kpis{display:flex;flex-wrap:wrap;gap:var(--sp-3);margin-bottom:var(--sp-4)}
.kpi{background:var(--bg-raised);border:1px solid var(--border-light);border-radius:var(--r-lg);padding:var(--sp-4);min-width:120px;flex:1}
.kpi .v{font-family:var(--font-disp);font-weight:800;font-size:26px;line-height:1}
.kpi .k{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.6px;color:var(--text-2);text-transform:uppercase;margin-top:7px;font-weight:500}
.v.acc{color:var(--offense)}.v.def{color:var(--defense)}.v.pos{color:var(--positive)}.v.neg{color:var(--negative)}.v.ins{color:var(--insight)}
.board{background:var(--bg-raised);border:1px solid var(--border-light);border-radius:var(--r-lg);overflow:hidden;margin-bottom:var(--sp-4)}
.board-title{font-family:var(--font-disp);font-weight:700;font-size:15px;letter-spacing:.5px;color:var(--offense);padding:var(--sp-3) var(--sp-4);border-bottom:1px solid var(--border-subtle)}
.tblwrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse}
table.t th{font-family:var(--font-mono);font-size:8px;letter-spacing:.8px;color:var(--text-2);padding:10px var(--sp-2);text-align:right;text-transform:uppercase;border-bottom:1px solid var(--border-light);font-weight:500;white-space:nowrap}
table.t th.l,table.t td.l{text-align:left}
table.t td{padding:8px var(--sp-2);border-bottom:1px solid var(--border-subtle);font-family:var(--font-mono);font-size:10.5px;text-align:right;white-space:nowrap}
table.t tbody tr:hover{background:var(--bg-hover)}
.pchip{font-family:var(--font-mono);font-size:9px;color:var(--text);background:var(--bg-base);border:1px solid var(--border-subtle);border-radius:var(--r-sm);padding:2px 7px 2px 3px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.pchip .pn{font-family:var(--font-mono);font-size:8px;font-weight:500;color:#000;background:var(--offense);border-radius:2px;padding:0 3px;min-width:14px;text-align:center}
.empty{text-align:center;color:var(--text-2);font-family:var(--font-mono);font-size:12px;line-height:1.8;padding:60px 20px}
.loadbox{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:80px 20px;color:var(--text-2);font-family:var(--font-mono);font-size:11px;letter-spacing:1px;text-transform:uppercase}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--border-strong);border-top-color:var(--offense);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* ── bloques ofensivas / defensivas ── */
.side{border:1px solid var(--border-light);border-radius:var(--r-lg);overflow:hidden;margin-bottom:var(--sp-3)}
.side>summary{list-style:none;cursor:pointer;padding:11px 15px;font-family:var(--font-disp);font-weight:700;font-size:15px;letter-spacing:.5px;display:flex;align-items:center;gap:8px;background:var(--bg-raised)}
.side>summary::-webkit-details-marker{display:none}
.side.of>summary{color:var(--offense)}.side.df>summary{color:var(--defense)}
.side>summary::before{content:'▸';font-size:11px;color:var(--text-3);transition:transform var(--t-fast)}
.side[open]>summary::before{transform:rotate(90deg)}
.cat{padding:4px 15px 12px}
/* ── métrica individual (con jugadores) ── */
.imet{padding:10px 0;border-bottom:1px solid var(--border-subtle)}
.imet:last-child{border-bottom:none}
.imet-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.imet-l{flex:1;font-size:13.5px;color:var(--text);min-width:140px}
.imet-net{font-family:var(--font-mono);font-size:13px;font-weight:600;min-width:34px;text-align:center}
.imet-net.pos{color:var(--positive)}.imet-net.neg{color:var(--negative)}.imet-net.zero{color:var(--text-3)}
.abtn{border:none;border-radius:8px;font-family:var(--font-disp);font-weight:700;font-size:14px;letter-spacing:.4px;padding:10px 16px;cursor:pointer;transition:filter var(--t-fast)}
.abtn:hover{filter:brightness(1.12)}
.abtn.good{background:var(--positive);color:#04170a}
.abtn.bad{background:var(--negative);color:#1c0505}
.abtn.plain-of{background:var(--offense);color:#1a1205}
.abtn.plain-df{background:var(--defense);color:#fff}
.abtn.minus{background:var(--bg-panel);border:1px solid var(--border-light);color:var(--text-2);font-size:15px;padding:9px 13px}
.abtn.minus:hover{color:var(--negative);border-color:var(--negative)}
.imet-players{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ppill{display:inline-flex;align-items:center;gap:6px;background:var(--bg-base);border:1px solid var(--border-light);border-radius:20px;padding:3px 10px 3px 4px;font-size:11.5px}
.ppill .pn{font-family:var(--font-mono);font-size:9px;font-weight:600;color:#000;background:var(--text-2);border-radius:3px;padding:1px 5px;min-width:18px;text-align:center}
.ppill .g{font-family:var(--font-mono);font-size:10.5px;color:var(--positive)}
.ppill .b{font-family:var(--font-mono);font-size:10.5px;color:var(--negative)}
.ppill .nt{font-family:var(--font-mono);font-size:10.5px;font-weight:600;border-left:1px solid var(--border-light);padding-left:6px}
.ppill .nt.pos{color:var(--positive)}.ppill .nt.neg{color:var(--negative)}.ppill .nt.zero{color:var(--text-2)}
/* ── modal elegir jugador ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--bg-panel);border:1px solid var(--border-strong);border-radius:12px;max-width:560px;width:100%;max-height:80vh;overflow:auto;padding:18px}
.modal-t{font-family:var(--font-disp);font-weight:800;font-size:17px;letter-spacing:.5px;margin-bottom:4px}
.modal-t .good{color:var(--positive)}.modal-t .bad{color:var(--negative)}
.modal-s{font-family:var(--font-mono);font-size:10.5px;color:var(--text-2);margin-bottom:14px}
.mgrid{display:flex;flex-wrap:wrap;gap:8px}
.mp{display:flex;align-items:center;gap:8px;background:var(--bg-raised);border:1px solid var(--border-light);border-radius:9px;padding:9px 14px 9px 8px;cursor:pointer;font-size:13px;transition:all var(--t-fast)}
.mp:hover{border-color:var(--offense);background:var(--offense-bg)}
.mp .pn{font-family:var(--font-mono);font-size:10px;font-weight:600;color:#000;background:var(--offense);border-radius:4px;padding:2px 6px;min-width:22px;text-align:center}
.mp.add{border-style:dashed;color:var(--text-2)}
.modal-x{margin-top:14px;display:flex;justify-content:flex-end}
/* ── KILLS ── */
.kills-box{border:1px solid rgba(79,142,247,.35);background:var(--defense-bg);border-radius:var(--r-lg);padding:16px;margin:6px 0 10px}
.kills-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.kills-title{font-family:var(--font-disp);font-weight:800;font-size:18px;letter-spacing:.5px;color:var(--defense)}
.kills-sub{font-family:var(--font-mono);font-size:10px;color:var(--text-2)}
.kills-main{display:flex;flex-wrap:wrap;gap:14px;align-items:stretch}
.streak-card{flex:1;min-width:230px;background:var(--bg-raised);border:1px solid var(--border-light);border-radius:var(--r-lg);padding:14px;display:flex;flex-direction:column;gap:12px;align-items:center}
.streak-dots{display:flex;gap:12px}
.dot{width:34px;height:34px;border-radius:50%;border:2px solid var(--border-strong);background:var(--bg-base);transition:all .15s;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:12px;color:var(--text-3)}
.dot.on{background:var(--defense);border-color:var(--defense);color:#fff;box-shadow:0 0 12px rgba(79,142,247,.5)}
.streak-lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--text-2)}
.streak-lbl b{color:var(--defense)}
.kills-btns{display:flex;gap:10px;width:100%}
.btn-def{flex:1;background:var(--defense);border:none;border-radius:8px;color:#fff;font-family:var(--font-disp);font-weight:700;font-size:16px;letter-spacing:.5px;padding:14px 10px;cursor:pointer;transition:filter var(--t-fast)}
.btn-def:hover{filter:brightness(1.12)}
.btn-broken{flex:1;background:var(--bg-panel);border:1px solid var(--negative);border-radius:8px;color:var(--negative);font-family:var(--font-disp);font-weight:700;font-size:16px;letter-spacing:.5px;padding:14px 10px;cursor:pointer;transition:all var(--t-fast)}
.btn-broken:hover{background:rgba(240,80,80,.12)}
.kills-count{flex:0 0 auto;min-width:170px;background:var(--bg-raised);border:1px solid var(--border-light);border-radius:var(--r-lg);padding:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.kills-num{font-family:var(--font-disp);font-weight:900;font-size:52px;line-height:1;color:var(--defense)}
.kills-num.flash{animation:killflash .6s ease}
@keyframes killflash{0%{transform:scale(1)}30%{transform:scale(1.35);color:#fff;text-shadow:0 0 20px var(--defense)}100%{transform:scale(1)}}
.kills-k{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.8px;color:var(--text-2);text-transform:uppercase}
.kills-adj{display:flex;gap:6px;margin-top:4px}
.kills-adj button{width:28px;height:26px;background:var(--bg-panel);border:1px solid var(--border-light);border-radius:6px;color:var(--text-2);cursor:pointer;font-family:var(--font-mono);font-size:13px;transition:all var(--t-fast)}
.kills-adj button:hover{color:var(--text);border-color:var(--border-strong)}
.kills-stats{display:flex;gap:16px;margin-top:12px;flex-wrap:wrap;align-items:center}
.ks{font-family:var(--font-mono);font-size:10.5px;color:var(--text-2)}
.ks b{color:var(--text);font-size:12px}
.btn-undo{background:var(--bg-panel);border:1px solid var(--border-light);border-radius:8px;color:var(--text-2);font-family:var(--font-mono);font-size:10px;padding:8px 14px;cursor:pointer;transition:all var(--t-fast)}
.btn-undo:hover{color:var(--offense);border-color:var(--offense)}
.btn-undo:disabled{opacity:.4;cursor:default}
/* stats personalizadas */
.cust-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border-subtle)}
.cust-side{font-family:var(--font-mono);font-size:9px;font-weight:600;border-radius:4px;padding:2px 6px;color:#000;min-width:38px;text-align:center}
.cust-side.of{background:var(--offense)}.cust-side.df{background:var(--defense)}.cust-side.col{background:var(--insight)}
.cust-name{flex:1;font-size:13px;color:var(--text)}
.cust-del{background:none;border:1px solid var(--border-light);border-radius:6px;color:var(--text-3);width:26px;height:26px;cursor:pointer;font-size:12px;flex:none;transition:all var(--t-fast)}
.cust-del:hover{color:var(--negative);border-color:var(--negative)}
.cust-form{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--border-light)}
.cust-form input,.cust-form select,.cust-form label.chk{background:var(--bg-base);border:1px solid var(--border-light);border-radius:7px;padding:9px 11px;color:var(--text);font-family:var(--font-ui);font-size:13px;outline:none}
.cust-form input[type=text]{flex:1;min-width:160px}
.cust-form label.chk{display:inline-flex;align-items:center;gap:7px;cursor:pointer;color:var(--text-2)}
.cust-form input:focus,.cust-form select:focus{border-color:var(--offense)}
.savebar{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg-base) 28%);padding:18px 0 4px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.btn-primary{background:var(--offense);border:none;border-radius:6px;color:#1a1205;font-family:var(--font-mono);font-size:12px;letter-spacing:.5px;padding:11px 22px;cursor:pointer;font-weight:600;transition:filter var(--t-fast)}
.btn-primary:hover{filter:brightness(1.08)}
.btn-ghost{background:var(--bg-panel);border:1px solid var(--border-light);border-radius:6px;color:var(--text-2);font-family:var(--font-mono);font-size:11px;padding:11px 16px;cursor:pointer}
.savemsg{font-family:var(--font-mono);font-size:11px}
.bar-wrap{display:inline-block;width:60px;height:6px;background:var(--bg-base);border-radius:3px;overflow:hidden;vertical-align:middle;margin-left:6px}
.bar{height:100%;background:var(--offense)}
.note{background:rgba(167,139,250,.07);border:1px solid rgba(167,139,250,.25);border-radius:var(--r-lg);padding:12px 15px;font-size:12.5px;color:var(--text-2);line-height:1.6;margin-bottom:var(--sp-4)}
.note b{color:var(--insight)}
pre.sql{background:var(--bg-base);border:1px solid var(--border-subtle);border-radius:6px;padding:12px 14px;font-family:var(--font-mono);font-size:11.5px;color:var(--text);overflow-x:auto;margin:8px 0;line-height:1.5}
.tag-own{font-family:var(--font-mono);font-size:8px;letter-spacing:.5px;text-transform:uppercase;color:var(--insight);border:1px solid rgba(167,139,250,.4);border-radius:3px;padding:1px 4px;vertical-align:middle}
</style>
</head>
<body>
<div class="topbar">
  <div class="logo"><span class="a">ESFUERZO</span><span class="v">HUSTLE</span></div>
  <div class="tb-spacer"></div>
  <a class="tb-btn" href="estadistico.html">📊 Estadístico</a>
  <a class="tb-btn qtos" href="quintetos.html">🔄 Quintetos</a>
  <a class="tb-btn" href="index.html">🏠 Menú</a>
  <button class="tb-btn" id="btnReload" onclick="loadAll()">↻ Actualizar</button>
</div>

<div class="wrap">
  <div class="tabs" id="tabs" style="display:none">
    <button class="tab active" data-v="cargar" onclick="switchView('cargar')">📝 Cargar</button>
    <button class="tab" data-v="evaluar" onclick="switchView('evaluar')">📊 Evaluar</button>
  </div>
  <div class="view active" id="view-cargar"></div>
  <div class="view" id="view-evaluar"></div>
  <div id="msg" class="empty"><div class="loadbox"><div class="spinner"></div><div>Cargando…</div></div></div>
</div>
<div id="modalHost"></div>

<script>
const SB_CFG={url:'https://jqudeomgafqilqmqcqzg.supabase.co',key:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpxdWRlb21nYWZxaWxxbXFjcXpnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyNjY1MTQsImV4cCI6MjA5NTg0MjUxNH0.0tl4jVOnuOE8DxTOQfGF2qirCeMIKRdv5RCZ0dGzBl8'};
let sb=null;function getSB(){if(!sb&&window.supabase)sb=window.supabase.createClient(SB_CFG.url,SB_CFG.key);return sb;}

/* ════════ MÉTRICAS ════════
   tipo: 'ind' (individual, se asigna a un jugador) | 'col' (colectiva)
   side: 'of' | 'df' (solo para individuales)
   pm:   true → tiene buenos (+1) y malos (−1); el neto = buenos − malos
   Todo cuenta en UNIDADES (sin pesos). */
const METRICS=[
  // ── INDIVIDUALES OFENSIVAS ──
  {k:'hockey_pass', tipo:'ind', side:'of', l:'Hockey pass'},
  {k:'screen_ast',  tipo:'ind', side:'of', l:'Screen assist (asistencia tras cortina)'},
  // ── INDIVIDUALES DEFENSIVAS ──
  {k:'closeout',    tipo:'ind', side:'df', l:'Close out', pm:true},
  {k:'desvio',      tipo:'ind', side:'df', l:'Desvío de pelotas'},
  // ── COLECTIVAS ──
  {k:'kills',       tipo:'col', l:'Kills (3 defensas consecutivas)'},
];
let CUSTOM=[];           // métricas personalizadas: {k,l,tipo,side,pm,custom:true}
let METRICAS_OK=true;
function AM(){return METRICS.concat(CUSTOM);}
function indMetrics(side){return AM().filter(m=>m.tipo==='ind'&&(!side||m.side===side));}
function metByK(k){return AM().find(m=>m.k===k);}
function slug(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'').slice(0,24)||'stat';}

/* ════════ ESTADO ════════ */
let ROSTERS={};          // equipo -> [{num,name}]
let TEAMS=[];
let TEAMCNT={};          // cuántos registros tiene cada equipo en la cuenta
let MI_EQUIPO='';        // equipo vinculado a la cuenta
let ESF=[];              // filas de esfuerzo_log
let TABLE_OK=true;
// captura
let capTeam='',capRival='',capFecha=new Date().toISOString().slice(0,10),capLocal=true;
let sheet=newSheet();    // planilla del partido
let HIST=[];             // pila para deshacer
let PEND=null;           // acción pendiente de asignar jugador: {mk,kind:'p'|'m',delta}
const TEAM_JUG='EQUIPO';
function newSheet(){return {col:{kills:0,def_streak:0,def_tot:0,def_rotas:0},ind:{},players:{}};}

function pk(p){return (p.num!=null?p.num:'')+'|'+String(p.name||'').toLowerCase().replace(/[\s.,]/g,'');}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}
function jsq(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");}
function n(x){return +x||0;}
function matchId(){return 'ESF|'+capTeam+'|'+capRival+'|'+capFecha;}
function fmtNet(v){return (v>0?'+':'')+v;}
function netCls(v){return v>0?'pos':(v<0?'neg':'zero');}

/* celda de un jugador en una métrica: {p:buenos, m:malos} */
function cell(mk,pkey,create){
  sheet.ind[mk]=sheet.ind[mk]||{};
  if(!sheet.ind[mk][pkey]&&create)sheet.ind[mk][pkey]={p:0,m:0};
  return sheet.ind[mk][pkey];
}
function netCell(c){return n(c&&c.p)-n(c&&c.m);}
function metricNet(mk){const o=sheet.ind[mk]||{};let s=0;Object.values(o).forEach(c=>s+=netCell(c));return s;}
function sideNet(side){let s=0;indMetrics(side).forEach(m=>s+=metricNet(m.k));return s;}
function totalIdx(){return sideNet('of')+sideNet('df')+n(sheet.col.kills);}

/* ════════ CARGA ════════ */
async function loadAll(){
  const c=getSB();
  if(!c){document.getElementById('msg').innerHTML='<div class="empty">No se pudo iniciar Supabase.</div>';return;}
  document.getElementById('msg').style.display='';document.getElementById('tabs').style.display='none';
  // plantel desde quintetos_log
  try{
    const qr=await c.from('quintetos_log').select('equipo,jugadores').limit(20000);
    const rows=qr.error?[]:(qr.data||[]);
    const rmap={};
    rows.forEach(r=>{let js=r.jugadores;if(typeof js==='string'){try{js=JSON.parse(js);}catch(_){js=[];}}if(!Array.isArray(js))return;
      const t=r.equipo;if(!t)return;TEAMCNT[t]=(TEAMCNT[t]||0)+1;rmap[t]=rmap[t]||{};
      js.forEach(p=>{if(!p)return;const k=pk(p);if(!rmap[t][k])rmap[t][k]={num:p.num,name:p.name};else if(p.name&&p.name.length>(rmap[t][k].name||'').length)rmap[t][k].name=p.name;});
    });
    ROSTERS={};Object.entries(rmap).forEach(([t,m])=>{ROSTERS[t]=Object.values(m).sort((a,b)=>(n(a.num)-n(b.num))||String(a.name).localeCompare(b.name));});
  }catch(_){ROSTERS={};}
  // métricas personalizadas
  try{
    const mr=await c.from('esfuerzo_metricas').select('*').order('created_at',{ascending:true});
    if(mr.error){METRICAS_OK=false;CUSTOM=[];}
    else{METRICAS_OK=true;CUSTOM=(mr.data||[]).map(m=>{
      const side=m.side;
      let tipo='ind',sd='of';
      if(side==='col')tipo='col';
      else if(side==='df')sd='df';
      else sd='of'; // 'of', 'ind' viejas u otros
      return {k:m.k,l:m.label||m.k,tipo,side:sd,pm:false,custom:true};
    });}
  }catch(_){METRICAS_OK=false;CUSTOM=[];}
  // esfuerzo_log
  try{
    const er=await c.from('esfuerzo_log').select('*').limit(50000);
    if(er.error){TABLE_OK=false;ESF=[];}else{TABLE_OK=true;ESF=er.data||[];}
  }catch(_){TABLE_OK=false;ESF=[];}
  // parsear extra en cada fila
  ESF.forEach(r=>{let ex=r.extra;if(typeof ex==='string'){try{ex=JSON.parse(ex);}catch(_){ex=null;}}r._ex=(ex&&typeof ex==='object')?ex:{};});
  const tset=new Set(Object.keys(ROSTERS));
  ESF.forEach(r=>{if(r.equipo){tset.add(r.equipo);TEAMCNT[r.equipo]=(TEAMCNT[r.equipo]||0)+1;}});
  TEAMS=[...tset].sort();

  // ── equipo vinculado a la cuenta: el guardado, o el que más registros tiene ──
  let savedT='';try{savedT=localStorage.getItem('esf_mi_equipo')||'';}catch(_){}
  if(savedT&&TEAMS.includes(savedT))MI_EQUIPO=savedT;
  else MI_EQUIPO=TEAMS.slice().sort((a,b)=>(TEAMCNT[b]||0)-(TEAMCNT[a]||0))[0]||'';
  capTeam=MI_EQUIPO;evTeam=MI_EQUIPO;
  document.getElementById('msg').style.display='none';
  document.getElementById('tabs').style.display='';
  renderCargar();renderEvaluar();
}
function switchView(v){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.v===v));
  document.querySelectorAll('.view').forEach(el=>el.classList.remove('active'));
  document.getElementById('view-'+v).classList.add('active');
}

/* ════════ TAB CARGAR ════════ */
function setMiEquipo(v){MI_EQUIPO=v;capTeam=v;evTeam=v;try{localStorage.setItem('esf_mi_equipo',v);}catch(_){}renderCargar();renderEvaluar();}
function setCapField(f,v){if(f==='rival')capRival=v;else if(f==='fecha')capFecha=v;else if(f==='local')capLocal=(v==='1');}
function snap(){HIST.push(JSON.stringify(sheet));if(HIST.length>80)HIST.shift();const u=document.getElementById('btnUndo');if(u)u.disabled=false;}
function undo(){if(!HIST.length)return;sheet=JSON.parse(HIST.pop());renderCargar();}

/* ── acciones individuales: elegir jugador ── */
function askPlayer(mk,kind,delta){
  PEND={mk,kind:kind||'p',delta:delta==null?1:delta};
  const m=metByK(mk);if(!m)return;
  const roster=(ROSTERS[capTeam]||[]).slice();
  // sumar jugadores manuales ya usados en esta planilla
  Object.entries(sheet.players).forEach(([k,p])=>{if(!roster.some(r=>pk(r)===k))roster.push(p);});
  const what=PEND.delta<0?'Corregir (−1)':(PEND.kind==='m'?'<span class="bad">✗ Malo</span>':(m.pm?'<span class="good">✓ Bueno</span>':'+1'));
  const host=document.getElementById('modalHost');
  host.innerHTML='<div class="overlay" onclick="if(event.target===this)closeModal()">'+
    '<div class="modal">'+
    '<div class="modal-t">'+esc(m.l)+' — '+what+'</div>'+
    '<div class="modal-s">¿A qué jugador pertenece la acción?</div>'+
    '<div class="mgrid">'+
      roster.map(p=>{const k=pk(p);
        return '<div class="mp" onclick="pickPlayer(\''+jsq(k)+'\')"><span class="pn">'+(p.num!=null?p.num:'·')+'</span>'+esc(p.name||'?')+'</div>';
      }).join('')+
      '<div class="mp add" onclick="addManualPlayer()">➕ Otro jugador…</div>'+
    '</div>'+
    '<div class="modal-x"><button class="btn-ghost" onclick="closeModal()">Cancelar</button></div>'+
    '</div></div>';
  // guardar referencia de datos de jugadores del roster para pickPlayer
  window.__pickMap={};roster.forEach(p=>{window.__pickMap[pk(p)]=p;});
}
function closeModal(){document.getElementById('modalHost').innerHTML='';PEND=null;}
function addManualPlayer(){
  const name=prompt('Nombre del jugador:');if(!name)return;
  const numS=prompt('Número de camiseta (opcional):');
  const p={num:numS!==null&&numS.trim()!==''?n(numS):null,name:name.trim()};
  window.__pickMap[pk(p)]=p;
  pickPlayer(pk(p));
}
function pickPlayer(k){
  if(!PEND)return;
  const p=(window.__pickMap||{})[k];if(!p){closeModal();return;}
  snap();
  sheet.players[k]={num:p.num,name:p.name};
  const c=cell(PEND.mk,k,true);
  if(PEND.kind==='m')c.m=Math.max(0,n(c.m)+PEND.delta);
  else c.p=Math.max(0,n(c.p)+PEND.delta);
  if(c.p===0&&c.m===0)delete sheet.ind[PEND.mk][k];
  closeModal();
  renderCargar();
}

/* ── KILLS: encadenado de defensas ── */
function defOk(){
  snap();
  const col=sheet.col;
  col.def_tot=n(col.def_tot)+1;
  col.def_streak=n(col.def_streak)+1;
  let killed=false;
  if(col.def_streak>=3){col.kills=n(col.kills)+1;col.def_streak=0;killed=true;}
  paintKills(killed);updateTotals();
}
function defBroken(){
  snap();
  sheet.col.def_rotas=n(sheet.col.def_rotas)+1;
  sheet.col.def_streak=0;
  paintKills(false);updateTotals();
}
function killAdj(d){snap();sheet.col.kills=Math.max(0,n(sheet.col.kills)+d);paintKills(false);updateTotals();}
function paintKills(flash){
  const st=n(sheet.col.def_streak);
  for(let i=1;i<=3;i++){const d=document.getElementById('dot'+i);if(d)d.classList.toggle('on',st>=i);}
  const sl=document.getElementById('streakLbl');if(sl)sl.innerHTML='Defensas encadenadas: <b>'+st+' / 3</b>';
  const kEl=document.getElementById('killsNum');
  if(kEl){kEl.textContent=n(sheet.col.kills);
    if(flash){kEl.classList.remove('flash');void kEl.offsetWidth;kEl.classList.add('flash');}}
  const dt=document.getElementById('ksTot');if(dt)dt.innerHTML='Defensas totales: <b>'+n(sheet.col.def_tot)+'</b>';
  const dr=document.getElementById('ksRotas');if(dr)dr.innerHTML='Cadenas rotas: <b>'+n(sheet.col.def_rotas)+'</b>';
}
function updateTotals(){
  const a=document.getElementById('curIdx');if(a)a.textContent=fmtNet(totalIdx());
  const ao=document.getElementById('curIdxO');if(ao)ao.textContent=fmtNet(sideNet('of'));
  const ad=document.getElementById('curIdxD');if(ad)ad.textContent=fmtNet(sideNet('df'));
  const ak=document.getElementById('curKills');if(ak)ak.textContent=n(sheet.col.kills);
}

function metRow(m){
  const cells=sheet.ind[m.k]||{};
  const net=metricNet(m.k);
  const pills=Object.entries(cells).map(([k,c])=>{
    const p=sheet.players[k]||{};const nt=netCell(c);
    const inner=m.pm
      ? '<span class="g">+'+n(c.p)+'</span><span class="b">−'+n(c.m)+'</span><span class="nt '+netCls(nt)+'">'+fmtNet(nt)+'</span>'
      : '<span class="nt '+netCls(nt)+'">'+n(c.p)+'</span>';
    return '<span class="ppill"><span class="pn">'+(p.num!=null?p.num:'·')+'</span>'+esc(p.name||'?')+' '+inner+'</span>';
  }).join('');
  const btns=m.pm
    ? '<button class="abtn good" onclick="askPlayer(\''+m.k+'\',\'p\',1)">✓ Bueno</button>'+
      '<button class="abtn bad" onclick="askPlayer(\''+m.k+'\',\'m\',1)">✗ Malo</button>'
    : '<button class="abtn plain-'+m.side+'" onclick="askPlayer(\''+m.k+'\',\'p\',1)">+1</button>';
  return '<div class="imet"><div class="imet-top">'+
    '<span class="imet-l">'+esc(m.l)+(m.custom?' <span class="tag-own">propia</span>':'')+'</span>'+
    '<span class="imet-net '+netCls(net)+'">'+fmtNet(net)+'</span>'+btns+
    '</div>'+(pills?'<div class="imet-players">'+pills+'</div>':'')+'</div>';
}

function teamFieldHtml(){
  if(!TEAMS.length)
    return '<div class="field"><label>Equipo</label><input type="text" value="'+esc(capTeam)+'" placeholder="Nombre del equipo" oninput="capTeam=this.value;evTeam=this.value;MI_EQUIPO=this.value"></div>';
  if(TEAMS.length===1)
    return '<div class="field"><label>Equipo (vinculado a tu cuenta)</label><div class="teamfix">🔗 '+esc(MI_EQUIPO)+'</div></div>';
  return '<div class="field"><label>Equipo (vinculado a tu cuenta)</label><select onchange="setMiEquipo(this.value)">'+
    TEAMS.map(t=>'<option'+(t===MI_EQUIPO?' selected':'')+'>'+esc(t)+'</option>').join('')+'</select></div>';
}

  const el=document.getElementById('view-cargar');
  const teamField=teamFieldHtml();
  const meta='<div class="controls">'+teamField+
    '<div class="field"><label>Rival</label><input type="text" value="'+esc(capRival)+'" placeholder="Nombre del rival" oninput="setCapField(\'rival\',this.value)"></div>'+
    '<div class="field"><label>Fecha</label><input type="date" value="'+esc(capFecha)+'" oninput="setCapField(\'fecha\',this.value)"></div>'+
    '<div class="field"><label>Condición</label><select onchange="setCapField(\'local\',this.value)"><option value="1"'+(capLocal?' selected':'')+'>Local</option><option value="0"'+(!capLocal?' selected':'')+'>Visitante</option></select></div>'+
    '</div>';

  const kpis='<div class="kpis">'+
    '<div class="kpi"><div class="v acc" id="curIdx">'+fmtNet(totalIdx())+'</div><div class="k">Unidades totales</div></div>'+
    '<div class="kpi"><div class="v" style="color:var(--offense)" id="curIdxO">'+fmtNet(sideNet('of'))+'</div><div class="k">Ofensivas (neto)</div></div>'+
    '<div class="kpi"><div class="v def" id="curIdxD">'+fmtNet(sideNet('df'))+'</div><div class="k">Defensivas (neto)</div></div>'+
    '<div class="kpi"><div class="v ins" id="curKills">'+n(sheet.col.kills)+'</div><div class="k">Kills</div></div>'+

  const blockOf='<details class="side of" open><summary>▲ Individuales ofensivas</summary><div class="cat">'+

  const blockDf='<details class="side df" open><summary>▼ Individuales defensivas</summary><div class="cat">'+

  // ── COLECTIVAS: Kills ──
  const st=n(sheet.col.def_streak);
  const dots=[1,2,3].map(i=>'<div class="dot'+(st>=i?' on':'')+'" id="dot'+i+'">'+i+'</div>').join('');
  const killsBox='<div class="kills-box">'+
    '<div class="kills-head"><span class="kills-title">🛡 KILLS</span><span class="kills-sub">3 defensas consecutivas = 1 kill. Si la defensa se rompe, la cadena vuelve a 0.</span></div>'+
    '<div class="kills-main">'+
      '<div class="streak-card">'+
        '<div class="streak-dots">'+dots+'</div>'+
        '<div class="streak-lbl" id="streakLbl">Defensas encadenadas: <b>'+st+' / 3</b></div>'+
        '<div class="kills-btns">'+
          '<button class="btn-def" onclick="defOk()">✓ Defensa lograda</button>'+
          '<button class="btn-broken" onclick="defBroken()">✕ Defensa rota</button>'+
        '</div>'+
      '</div>'+
      '<div class="kills-count">'+
        '<div class="kills-num" id="killsNum">'+n(sheet.col.kills)+'</div>'+
        '<div class="kills-k">Kills</div>'+
        '<div class="kills-adj"><button onclick="killAdj(-1)" title="Corregir: −1 kill">−</button><button onclick="killAdj(1)" title="Corregir: +1 kill">+</button></div>'+
      '</div>'+
    '</div>'+
    '<div class="kills-stats">'+
      '<span class="ks" id="ksTot">Defensas totales: <b>'+n(sheet.col.def_tot)+'</b></span>'+
      '<span class="ks" id="ksRotas">Cadenas rotas: <b>'+n(sheet.col.def_rotas)+'</b></span>'+
      '<button class="btn-undo" id="btnUndo" onclick="undo()"'+(HIST.length?'':' disabled')+'>↩ Deshacer última</button>'+
    '</div></div>';
  const blockCol='<details class="side df" open><summary>👥 Colectivas</summary><div class="cat">'+killsBox+'</div></details>';

  const save='<div class="savebar">'+
    '<button class="btn-primary" onclick="saveEsf()">💾 Guardar partido</button>'+
    '<button class="btn-ghost" onclick="loadEsfMatch()">↘ Cargar lo ya guardado de este partido</button>'+
    '<button class="btn-ghost" onclick="clearCap()">Limpiar planilla</button>'+

  let setup='';
  if(!TABLE_OK)setup=tableSetup();

  el.innerHTML=meta+kpis+
    '<div class="zone-sub" style="margin:2px 0 10px">Tocá el botón de una acción individual y elegí a qué jugador pertenece. Todas las acciones suman +1; la única que puede restar es el <b>Close out malo (−1)</b>. Si te equivocás, usá ↩ Deshacer.</div>'+

}

/* ── Panel para crear / borrar métricas personalizadas ── */
function customPanel(){
  if(!METRICAS_OK) return customSetup();
  const list=CUSTOM.length
    ? CUSTOM.map(m=>{const cls=m.tipo==='col'?'col':m.side;const lbl=m.tipo==='col'?'COL':(m.side==='of'?'OF':'DEF');
        return '<div class="cust-row"><span class="cust-side '+cls+'">'+lbl+'</span>'+
        '<span class="cust-name">'+esc(m.l)+(m.pm?' <span class="tag-own">±</span>':'')+'</span>'+
        '<button class="cust-del" title="Borrar esta métrica" onclick="delCustom(\''+m.k+'\')">✕</button></div>';}).join('')
    : '<div class="zone-sub" style="padding:2px 0 6px">Todavía no creaste ninguna. Agregá la primera abajo 👇</div>';
  return '<details class="board" style="margin-top:18px"><summary style="cursor:pointer;list-style:none;padding:11px 15px;font-family:var(--font-disp);font-weight:700;font-size:15px;color:var(--insight)">➕ Mis métricas de esfuerzo (crear / borrar) ▾</summary>'+
    '<div style="padding:6px 15px 16px">'+
    '<div class="zone-sub" style="margin-bottom:10px">Creá tus propias métricas. Las individuales se asignan a un jugador al marcarlas y todas suman +1 por unidad.</div>'+
    list+
    '<div class="cust-form">'+
      '<input id="ncName" type="text" placeholder="Nombre (ej: Sprint de vuelta en defensa)" maxlength="48">'+
      '<select id="ncTipo"><option value="of">Individual ofensiva</option><option value="df" selected>Individual defensiva</option><option value="col">Colectiva</option></select>'+
      '<button class="btn-primary" style="padding:9px 16px" onclick="addCustom()">Agregar</button>'+
      '<span class="savemsg" id="ncMsg"></span>'+
    '</div></div></details>';
}
function customSetup(){
  const sql='alter table esfuerzo_log add column if not exists extra jsonb default \'{}\'::jsonb;\n\n'+
    'create table if not exists esfuerzo_metricas (\n  k text primary key,\n  label text,\n  side text,\n  cat text,\n  peso numeric default 1,\n  created_at timestamptz default now()\n);\n'+
    'alter table esfuerzo_metricas enable row level security;\n'+
    'drop policy if exists "esfm_all" on esfuerzo_metricas;\n'+
    'create policy "esfm_all" on esfuerzo_metricas for all using (true) with check (true);';
  return '<div class="note" style="margin-top:18px"><b>Para crear métricas propias, corré este upgrade una sola vez</b> en el SQL Editor de Supabase y después tocá «↻ Actualizar»:'+
    '<pre class="sql">'+esc(sql)+'</pre>Agrega una columna flexible para los valores y una tablita para las definiciones. No toca nada de lo que ya tenés.</div>';
}
async function addCustom(){
  const name=(document.getElementById('ncName').value||'').trim();
  const tv=document.getElementById('ncTipo').value;
  const msg=document.getElementById('ncMsg');
  if(!name){if(msg){msg.textContent='Poné un nombre.';msg.style.color='var(--negative)';}return;}
  const k='cst_'+slug(name)+'_'+Date.now().toString(36).slice(-4);
  const c=getSB();
  if(msg){msg.textContent='Guardando…';msg.style.color='var(--text-2)';}
  const ins=await c.from('esfuerzo_metricas').insert([{k,label:name,side:tv,cat:'',peso:1}]);
  if(ins.error){
    if(/relation .* does not exist|esfuerzo_metricas/.test(ins.error.message)){METRICAS_OK=false;renderCargar();return;}
    if(msg){msg.textContent=ins.error.message;msg.style.color='var(--negative)';}return;
  }
  const tipo=tv==='col'?'col':'ind';
  CUSTOM.push({k,l:name,tipo,side:tv==='col'?'of':tv,pm:false,custom:true});
  renderCargar();renderEvaluar();
}
async function delCustom(k){
  const m=CUSTOM.find(x=>x.k===k);if(!m)return;
  if(!confirm('¿Borrar la métrica «'+m.l+'»? Sus valores ya cargados dejan de mostrarse (no se borran de la base).'))return;
  const c=getSB();const del=await c.from('esfuerzo_metricas').delete().eq('k',k);
  if(del.error){alert(del.error.message);return;}
  CUSTOM=CUSTOM.filter(x=>x.k!==k);
  renderCargar();renderEvaluar();
}
function clearCap(){if(!confirm('¿Borrar todo lo cargado en pantalla? (no toca lo guardado en la base)'))return;sheet=newSheet();HIST=[];renderCargar();}

async function loadEsfMatch(){
  const c=getSB();const mid=matchId();
  const r=await c.from('esfuerzo_log').select('*').eq('equipo',capTeam).eq('match_id',mid);
  if(r.error){msgSave(r.error.message,true);return;}
  if(!r.data||!r.data.length){msgSave('No hay nada guardado para '+capTeam+' vs '+(capRival||'?')+' ('+capFecha+').',true);return;}
  sheet=newSheet();HIST=[];
  r.data.forEach(row=>{
    let ex=row.extra;if(typeof ex==='string'){try{ex=JSON.parse(ex);}catch(_){ex=null;}}
    if(!ex||typeof ex!=='object')return;
    if(ex.col&&typeof ex.col==='object')Object.keys(ex.col).forEach(k=>{sheet.col[k]=n(ex.col[k]);});
    else{['kills','def_streak','def_tot','def_rotas'].forEach(k=>{if(k in ex)sheet.col[k]=n(ex[k]);});}
    if(ex.ind&&typeof ex.ind==='object')Object.entries(ex.ind).forEach(([mk,cells])=>{
      if(!cells||typeof cells!=='object')return;
      sheet.ind[mk]=sheet.ind[mk]||{};
      Object.entries(cells).forEach(([pkey,cv])=>{sheet.ind[mk][pkey]={p:n(cv&&cv.p),m:n(cv&&cv.m)};});
    });
    if(ex.players&&typeof ex.players==='object')Object.entries(ex.players).forEach(([k,p])=>{if(p)sheet.players[k]={num:p.num,name:p.name};});
  });
  msgSave('Planilla cargada desde la base.',false);renderCargar();
}
function msgSave(t,err){const el=document.getElementById('saveMsg');if(el){el.textContent=t;el.style.color=err?'var(--negative)':'var(--positive)';}}
function sheetHasData(){
  if(n(sheet.col.kills)||n(sheet.col.def_tot)||n(sheet.col.def_rotas)||n(sheet.col.def_streak))return true;
  return Object.values(sheet.ind).some(cells=>Object.values(cells).some(c=>n(c.p)||n(c.m)));
}
async function saveEsf(){
  const c=getSB();
  if(!String(capTeam||'').trim()){msgSave('Poné el nombre del equipo antes de guardar.',true);return;}
  if(!capRival.trim()){msgSave('Poné el nombre del rival antes de guardar.',true);return;}
  if(!sheetHasData()){msgSave('No hay nada para guardar.',true);return;}
  const mid=matchId();
  const row={equipo:capTeam,rival:capRival.trim(),es_local:capLocal,fecha:capFecha,match_id:mid,
    jugador:TEAM_JUG,jugador_num:null,minutos:0,
    extra:{col:sheet.col,ind:sheet.ind,players:sheet.players}};
  msgSave('Guardando…',false);
  const del=await c.from('esfuerzo_log').delete().eq('equipo',capTeam).eq('match_id',mid);
  if(del.error){if(/relation .* does not exist|esfuerzo_log/.test(del.error.message)){TABLE_OK=false;renderCargar();return;}msgSave(del.error.message,true);return;}
  const ins=await c.from('esfuerzo_log').insert([row]);
  if(ins.error){
    if(/column .*extra|extra.* does not exist/i.test(ins.error.message)){msgSave('Falta la columna «extra» en esfuerzo_log. Mirá el recuadro de «Mis métricas» y corré el SQL.',true);METRICAS_OK=false;renderCargar();return;}
    msgSave(ins.error.message,true);return;
  }
  msgSave('✓ Partido guardado.',false);
  await loadAll();
}

/* ════════ TAB EVALUAR ════════ */
let evTeam='',evNorm='tot';
function setEv(f,v){if(f==='team')evTeam=v;else if(f==='norm')evNorm=v;renderEvaluar();}
function renderEvaluar(){
  const el=document.getElementById('view-evaluar');
  if(!TABLE_OK){el.innerHTML='<div class="sec">Evaluación</div>'+tableSetup();return;}
  if(!ESF.length){el.innerHTML='<div class="empty">Todavía no hay esfuerzo cargado.<br>Cargá un partido en la pestaña <b>📝 Cargar</b> y volvé acá.</div>';return;}
  const teams=[...new Set(ESF.map(r=>r.equipo))].filter(Boolean).sort();
  if(!teams.includes(evTeam))evTeam=teams.includes(MI_EQUIPO)?MI_EQUIPO:teams[0];
  const perG=evNorm==='pg';

  const rows=ESF.filter(r=>r.equipo===evTeam);
  // acumular por partido (colectivas) y por jugador (individuales, HISTÓRICO)
  const byMatch={};
  const byPlayer={};   // pkey -> {p:{num,name},pj:Set,met:{mk:{p,m}}}
  rows.forEach(r=>{
    const ex=r._ex||{};
    const mo=byMatch[r.match_id]||(byMatch[r.match_id]={mid:r.match_id,fecha:r.fecha||'',rival:r.rival||'?',local:r.es_local,kills:0,def_tot:0,def_rotas:0,indNet:0});
    const col=(ex.col&&typeof ex.col==='object')?ex.col:ex;
    mo.kills+=n(col.kills);mo.def_tot+=n(col.def_tot);mo.def_rotas+=n(col.def_rotas);
    const ind=(ex.ind&&typeof ex.ind==='object')?ex.ind:{};
    const players=(ex.players&&typeof ex.players==='object')?ex.players:{};
    Object.entries(ind).forEach(([mk,cells])=>{
      if(!cells||typeof cells!=='object')return;
      Object.entries(cells).forEach(([pkey,cv])=>{
        const p=players[pkey]||{num:null,name:pkey};
        const po=byPlayer[pkey]||(byPlayer[pkey]={p:{num:p.num,name:p.name},pj:new Set(),met:{}});
        if(p.name&&String(p.name).length>String(po.p.name||'').length)po.p={num:p.num,name:p.name};
        po.pj.add(r.match_id);
        const mm=po.met[mk]||(po.met[mk]={p:0,m:0});
        mm.p+=n(cv&&cv.p);mm.m+=n(cv&&cv.m);
        mo.indNet+=n(cv&&cv.p)-n(cv&&cv.m);
      });
    });
  });
  const mrows=Object.values(byMatch).map(o=>({...o,idx:o.indNet+o.kills}))
    .sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)));
  const pj=mrows.length||1;
  const f=perG?1/pj:1;

  const totKills=mrows.reduce((s,r)=>s+r.kills,0);
  const totDef=mrows.reduce((s,r)=>s+r.def_tot,0);
  const totRotas=mrows.reduce((s,r)=>s+r.def_rotas,0);
  const totInd=mrows.reduce((s,r)=>s+r.indNet,0);
  const killRate=totDef>0?(totKills*3/totDef*100):0;

  const ctl='<div class="controls">'+teamFieldHtml()+
    '<div class="field"><label>Normalización</label><select onchange="setEv(\'norm\',this.value)"><option value="tot"'+(!perG?' selected':'')+'>Totales históricos</option><option value="pg"'+(perG?' selected':'')+'>Promedio por partido</option></select></div>'+
    '</div>';

  const sfx=perG?' /partido':'';
  const kpis='<div class="kpis">'+
    '<div class="kpi"><div class="v acc">'+(perG?((totInd+totKills)*f).toFixed(1):fmtNet(totInd+totKills))+'</div><div class="k">Unidades totales'+sfx+'</div></div>'+
    '<div class="kpi"><div class="v" style="color:var(--offense)">'+(perG?(totInd*f).toFixed(1):fmtNet(totInd))+'</div><div class="k">Individuales (neto)'+sfx+'</div></div>'+
    '<div class="kpi"><div class="v def">'+(perG?(totKills*f).toFixed(1):totKills)+'</div><div class="k">Kills'+sfx+'</div></div>'+
    '<div class="kpi"><div class="v ins">'+killRate.toFixed(0)+'%</div><div class="k">Defensas dentro de kills</div></div>'+
    '<div class="kpi"><div class="v">'+mrows.length+'</div><div class="k">Partidos</div></div>'+
    '</div>';

  // ── HISTÓRICO POR JUGADOR ──
  const inds=indMetrics();
  const players=Object.values(byPlayer).map(po=>{
    let tot=0;inds.forEach(m=>{const c=po.met[m.k];tot+=n(c&&c.p)-n(c&&c.m);});
    return {...po,tot};
  }).sort((a,b)=>b.tot-a.tot);
  const maxT=Math.max(1,...players.map(p=>Math.abs(p.tot)));
  const cellHtml=(m,po)=>{
    const c=po.met[m.k];if(!c||(!n(c.p)&&!n(c.m)))return '<td style="color:var(--text-3)">·</td>';
    const nt=n(c.p)-n(c.m);
    const col=nt>0?'var(--positive)':(nt<0?'var(--negative)':'var(--text-2)');
    const detail=m.pm?' <span style="color:var(--text-3);font-size:9px">(+'+n(c.p)+' −'+n(c.m)+')</span>':'';
    return '<td style="color:'+col+';font-weight:600">'+fmtNet(nt)+detail+'</td>';
  };
  const tablaJug=players.length
    ? '<div class="board"><div class="board-title">Puntaje histórico por jugador'+(perG?'':' (todos los partidos)')+'</div><div class="tblwrap"><table class="t"><thead><tr>'+
      '<th class="l">#</th><th class="l">Jugador</th><th>PJ</th>'+inds.map(m=>'<th title="'+esc(m.l)+'">'+esc(shortL(m))+'</th>').join('')+'<th>Total</th></tr></thead><tbody>'+
      players.map((po,i)=>{
        const totShow=perG?(po.tot/(po.pj.size||1)).toFixed(1):fmtNet(po.tot);
        return '<tr><td class="l">'+(i+1)+'</td>'+
        '<td class="l"><span class="pchip"><span class="pn">'+(po.p.num!=null?po.p.num:'·')+'</span>'+esc(po.p.name||'?')+'</span></td>'+
        '<td>'+po.pj.size+'</td>'+
        inds.map(m=>cellHtml(m,po)).join('')+
        '<td style="color:var(--offense);font-weight:700">'+totShow+
        '<span class="bar-wrap"><span class="bar" style="width:'+Math.round(Math.abs(po.tot)/maxT*100)+'%;background:'+(po.tot<0?'var(--negative)':'var(--offense)')+'"></span></span></td></tr>';
      }).join('')+
      '</tbody></table></div></div>'+
      '<div class="zone-sub" style="margin:-6px 0 12px">En las métricas con buenos y malos (ej. Close out), el número es el neto: buenos − malos. Entre paréntesis, el detalle.</div>'
    : '<div class="empty" style="padding:30px">Todavía no hay acciones individuales asignadas a jugadores.</div>';

  // ── HISTÓRICO VS RIVALES + TENDENCIAS ──
  const chron=mrows.slice().sort((a,b)=>String(a.fecha).localeCompare(String(b.fecha)));
  const byRival={};
  chron.forEach(r=>{
    const rk=String(r.rival||'?').trim().toLowerCase();
    const o=byRival[rk]||(byRival[rk]={rival:r.rival||'?',pj:0,kills:0,units:0,ind:0,def:0,rotas:0,seq:[],last:''});
    o.pj++;o.kills+=r.kills;o.units+=r.idx;o.ind+=r.indNet;o.def+=r.def_tot;o.rotas+=r.def_rotas;
    o.seq.push(r.idx);o.last=r.fecha;
  });
  const rvRows=Object.values(byRival).sort((a,b)=>b.pj-a.pj||b.units-a.units);
  const trendOf=seq=>{
    if(seq.length<2)return '<span style="color:var(--text-3)">·</span>';
    const last=seq[seq.length-1];
    const prevAvg=seq.slice(0,-1).reduce((s,v)=>s+v,0)/(seq.length-1);
    if(last>prevAvg)return '<span style="color:var(--positive)">▲ mejorando</span>';
    if(last<prevAvg)return '<span style="color:var(--negative)">▼ bajando</span>';
    return '<span style="color:var(--text-2)">▬ estable</span>';
  };
  const tablaRiv=rvRows.length
    ? '<div class="board"><div class="board-title">Histórico vs rivales</div><div class="tblwrap"><table class="t"><thead><tr>'+
      '<th class="l">Rival</th><th>PJ</th><th>Últ. partido</th><th>Kills</th><th>Kills/PJ</th><th>Indiv. neto</th><th>Def tot</th><th>Rotas</th><th>Unid. tot</th><th>Unid./PJ</th><th class="l">Tendencia</th></tr></thead><tbody>'+
      rvRows.map(o=>'<tr><td class="l" style="font-weight:600">'+esc(o.rival)+'</td><td>'+o.pj+'</td><td>'+esc(o.last)+'</td>'+
        '<td style="color:var(--defense);font-weight:600">'+o.kills+'</td><td>'+(o.kills/o.pj).toFixed(1)+'</td>'+
        '<td>'+fmtNet(o.ind)+'</td><td>'+o.def+'</td><td style="color:var(--negative)">'+o.rotas+'</td>'+
        '<td style="color:var(--offense);font-weight:600">'+fmtNet(o.units)+'</td><td>'+(o.units/o.pj).toFixed(1)+'</td>'+
        '<td class="l">'+trendOf(o.seq)+' '+spark(o.seq,110,26,'var(--offense)')+'</td></tr>').join('')+
      '</tbody></table></div></div>'+
      '<div class="zone-sub" style="margin:-6px 0 12px">La tendencia compara el último cruce contra el promedio de los anteriores contra ese rival. La línea muestra las unidades cruce a cruce.</div>'
    : '';
  const tendGral=chron.length>1
    ? '<div class="board"><div class="board-title">Tendencia general — unidades por partido</div>'+
      '<div style="padding:14px 16px;display:flex;flex-wrap:wrap;gap:20px;align-items:center">'+
      spark(chron.map(r=>r.idx),Math.max(260,Math.min(560,chron.length*46)),64,'var(--offense)')+
      '<div class="zone-sub">'+chron.map(r=>'<div>'+esc(r.fecha)+' vs '+esc(r.rival)+': <b style="color:var(--offense)">'+fmtNet(r.idx)+'</b> · kills '+r.kills+'</div>').join('')+'</div>'+
      '</div></div>'
    : '';

  // ── colectivas partido a partido ──
  const maxI=Math.max(1,...mrows.map(r=>Math.abs(r.idx)));
  const tablaM='<div class="board"><div class="board-title">'+esc(evTeam)+' — partido a partido</div><div class="tblwrap"><table class="t"><thead><tr>'+
    '<th class="l">Fecha</th><th class="l">Rival</th><th>Kills</th><th>Def tot</th><th>Rotas</th><th>Indiv. (neto)</th><th>Unidades</th></tr></thead><tbody>'+
    mrows.map(r=>'<tr><td class="l">'+esc(r.fecha)+'</td><td class="l">'+esc(r.rival)+(r.local===false?' <span style="color:var(--text-3)">(V)</span>':'')+'</td>'+
      '<td style="color:var(--defense);font-weight:600">'+r.kills+'</td><td>'+r.def_tot+'</td><td style="color:var(--negative)">'+r.def_rotas+'</td>'+
      '<td>'+fmtNet(r.indNet)+'</td>'+
      '<td style="color:var(--offense);font-weight:600">'+fmtNet(r.idx)+'<span class="bar-wrap"><span class="bar" style="width:'+Math.round(Math.abs(r.idx)/maxI*100)+'%"></span></span></td></tr>').join('')+
    '</tbody></table></div></div>';

  el.innerHTML=ctl+kpis+
    '<div class="zone-sub" style="margin-bottom:8px">Puntaje en unidades: cada acción suma +1 (solo el Close out malo resta −1) y cada kill vale +1. El histórico acumula todos los partidos guardados del equipo.</div>'+
    tendGral+tablaRiv+tablaJug+tablaM;
}
function spark(vals,w,h,color){
  if(!vals||!vals.length)return '';
  w=w||120;h=h||28;
  const max=Math.max(...vals),min=Math.min(...vals);
  const rng=(max-min)||1;
  const pts=vals.map((v,i)=>{
    const x=vals.length===1?w/2:(i/(vals.length-1))*(w-8)+4;
    const y=h-5-((v-min)/rng)*(h-10);
    return [x,y];
  });
  const poly=pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const last=pts[pts.length-1];
  return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" style="vertical-align:middle;overflow:visible">'+
    (vals.length>1?'<polyline points="'+poly+'" fill="none" stroke="'+color+'" stroke-width="1.6" stroke-linejoin="round"/>':'')+
    pts.map(p=>'<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="1.8" fill="'+color+'" opacity=".55"/>').join('')+
    '<circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="3" fill="'+color+'"/></svg>';
}
function shortL(m){
  const map={hockey_pass:'H.Pass',screen_ast:'Scr.Ast',closeout:'Closeout',desvio:'Desvíos'};
  if(map[m.k])return map[m.k];
  return m.l.length>10?m.l.slice(0,10)+'…':m.l;
}

/* ════════ SETUP (si falta la tabla) ════════ */
function tableSetup(){
  const sql='create table if not exists esfuerzo_log (\n'+
    '  id bigint generated always as identity primary key,\n'+
    '  created_at timestamptz default now(),\n'+
    '  equipo text, rival text, fase text, es_local bool,\n'+
    '  fecha date, match_id text,\n'+
    '  jugador text, jugador_num int, minutos int default 0,\n'+
    '  extra jsonb default \'{}\'::jsonb\n);\n\n'+
    'alter table esfuerzo_log enable row level security;\n'+
    'drop policy if exists "esf_all" on esfuerzo_log;\n'+
    'create policy "esf_all" on esfuerzo_log for all using (true) with check (true);\n\n'+
    '-- Definiciones de métricas personalizadas\n'+
    'create table if not exists esfuerzo_metricas (\n  k text primary key, label text, side text, cat text,\n  peso numeric default 1, created_at timestamptz default now()\n);\n'+
    'alter table esfuerzo_metricas enable row level security;\n'+
    'drop policy if exists "esfm_all" on esfuerzo_metricas;\n'+
    'create policy "esfm_all" on esfuerzo_metricas for all using (true) with check (true);';
  return '<div class="note"><b>Falta crear la tabla <code>esfuerzo_log</code> en Supabase.</b><br>'+
    'Pegá esto en el SQL Editor de Supabase y dale Run. Después tocá «↻ Actualizar» acá arriba y ya podés cargar.'+
    '<pre class="sql">'+esc(sql)+'</pre>'+
    'Si la tabla ya existía, no hace falta correr nada: los valores se guardan en la columna <code>extra</code> (si no la tenés, agregala con el SQL del recuadro de «Mis métricas»).</div>';
}
