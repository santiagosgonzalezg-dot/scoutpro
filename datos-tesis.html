<style>
:root{
  --bg-base:#08090d;--bg-raised:#0f1117;--bg-panel:#161820;--bg-hover:#1e202a;
  --border-subtle:rgba(255,255,255,0.05);--border-light:rgba(255,255,255,0.09);--border-strong:rgba(255,255,255,0.18);
  --offense:#f97316;--offense-bg:rgba(249,115,22,0.10);--offense-mid:rgba(249,115,22,0.30);
  --defense:#4f8ef7;--defense-bg:rgba(79,142,247,0.10);--defense-mid:rgba(79,142,247,0.30);
  --positive:#34c769;--negative:#f05050;--insight:#a78bfa;
  --text:#d8dce8;--text-2:#8891a0;--text-3:#6b7484;
  --font-ui:'DM Sans',system-ui,sans-serif;--font-mono:'DM Mono',monospace;--font-disp:'Barlow Condensed',sans-serif;
  --sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--r-sm:3px;--r:5px;--r-lg:8px;--t-fast:100ms ease;
  --c1:#f97316;--c2:#4f8ef7;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg-base);color:var(--text);font-family:var(--font-ui);font-size:13px;-webkit-font-smoothing:antialiased;min-height:100vh}
.topbar{display:flex;align-items:center;gap:var(--sp-3);padding:12px 20px;border-bottom:1px solid var(--border-light);background:var(--bg-raised);position:sticky;top:0;z-index:20}
.logo{font-family:var(--font-disp);font-weight:900;font-size:22px;letter-spacing:2px;line-height:1;flex-shrink:0}
.logo .a{color:var(--insight)}
.logo .v{font-family:var(--font-mono);font-size:8px;color:var(--text-3);letter-spacing:2px;margin-left:6px;border:1px solid var(--border-light);border-radius:var(--r-sm);padding:2px 6px;vertical-align:middle}
.tb-spacer{flex:1}
.btn{background:var(--bg-panel);border:1px solid var(--border-light);border-radius:var(--r-sm);color:var(--text-2);font-family:var(--font-mono);font-size:10px;padding:7px 13px;cursor:pointer;transition:all var(--t-fast);white-space:nowrap}
.btn:hover{border-color:var(--insight);color:var(--insight)}
.btn.danger:hover{border-color:var(--negative);color:var(--negative)}
.btn-primary{background:var(--offense);border:none;border-radius:6px;color:#1a1205;font-family:var(--font-mono);font-size:12px;letter-spacing:.5px;padding:12px 24px;cursor:pointer;font-weight:600;transition:filter var(--t-fast)}
.btn-primary:hover{filter:brightness(1.08)}.btn-primary:disabled{opacity:.35;cursor:not-allowed;filter:none}
.wrap{max-width:1180px;margin:0 auto;padding:var(--sp-5) 20px 80px}
.tabs{display:flex;gap:4px;margin-bottom:var(--sp-4);border-bottom:1px solid var(--border-light);flex-wrap:wrap}
.tab{background:none;border:none;border-bottom:2px solid transparent;color:var(--text-3);font-family:var(--font-mono);font-size:11px;letter-spacing:.5px;padding:10px 16px;cursor:pointer;margin-bottom:-1px}
.tab:hover{color:var(--text-2)}.tab.active{color:var(--insight);border-bottom-color:var(--insight)}
.view{display:none}.view.active{display:block}
.sec{font-family:var(--font-disp);font-weight:700;font-size:16px;letter-spacing:.5px;color:var(--text);display:flex;align-items:center;gap:10px;margin:var(--sp-5) 0 var(--sp-3)}
.sec::after{content:'';flex:1;height:1px;background:var(--border-subtle)}
.note{background:rgba(167,139,250,.07);border:1px solid rgba(167,139,250,.25);border-radius:var(--r-lg);padding:12px 15px;font-size:12.5px;color:var(--text-2);line-height:1.6;margin-bottom:var(--sp-4)}
.note b{color:var(--insight)}
.card{background:var(--bg-raised);border:1px solid var(--border-light);border-radius:var(--r-lg);padding:var(--sp-4);margin-bottom:var(--sp-4)}
.card-t{font-family:var(--font-disp);font-weight:700;font-size:15px;letter-spacing:.5px;margin-bottom:var(--sp-3)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:var(--sp-4)}
.controls{display:flex;flex-wrap:wrap;gap:var(--sp-3);align-items:flex-end}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-family:var(--font-mono);font-size:8px;letter-spacing:1px;color:var(--text-3);text-transform:uppercase}
.field select,.field input{background:var(--bg-base);border:1px solid var(--border-light);border-radius:var(--r);padding:9px var(--sp-3);font-family:var(--font-ui);font-size:13px;color:var(--text);outline:none;min-width:150px}
.field select:focus,.field input:focus{border-color:var(--insight)}
.field.w{flex:1;min-width:170px}
/* captura */
.teambtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tbtn{border:2px solid var(--border-light);background:var(--bg-panel);color:var(--text);border-radius:10px;padding:16px 10px;font-family:var(--font-disp);font-weight:800;font-size:20px;letter-spacing:.5px;cursor:pointer;transition:all var(--t-fast);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbtn small{display:block;font-family:var(--font-mono);font-weight:500;font-size:9px;letter-spacing:1px;color:var(--text-2);margin-top:3px}
.tbtn.t1.on{background:var(--offense-bg);border-color:var(--c1);color:var(--c1)}
.tbtn.t2.on{background:var(--defense-bg);border-color:var(--c2);color:var(--c2)}
.lab{font-family:var(--font-mono);font-size:9.5px;letter-spacing:1px;color:var(--text-2);text-transform:uppercase;margin:16px 0 8px}
.lab i{font-style:normal;color:var(--text-3);text-transform:none;letter-spacing:0;margin-left:6px}
.opts{display:grid;gap:10px}
.opts.c3{grid-template-columns:repeat(3,1fr)}.opts.c2{grid-template-columns:repeat(2,1fr)}
.opts.chips{display:flex;flex-wrap:wrap;gap:8px}
.obtn{background:var(--bg-panel);border:1px solid var(--border-light);color:var(--text);border-radius:10px;padding:14px 8px;font-family:var(--font-disp);font-weight:800;font-size:19px;cursor:pointer;transition:all var(--t-fast);text-align:center;line-height:1.1}
.obtn small{display:block;font-family:var(--font-mono);font-weight:500;font-size:9.5px;color:var(--text-2);margin-top:4px;letter-spacing:.3px}
.obtn:hover{border-color:var(--border-strong)}
.obtn.on{border-color:var(--insight);background:rgba(167,139,250,.14);color:#fff}
.obtn.on.ok{border-color:var(--positive);background:rgba(52,199,105,.14);color:var(--positive)}
.obtn.on.ko{border-color:var(--negative);background:rgba(240,80,80,.14);color:var(--negative)}
.chip{background:var(--bg-panel);border:1px solid var(--border-light);color:var(--text-2);border-radius:20px;padding:8px 14px;font-family:var(--font-ui);font-size:12.5px;cursor:pointer}
.chip.on{border-color:var(--insight);color:#fff;background:rgba(167,139,250,.14)}
.regrow{display:flex;gap:10px;align-items:center;margin-top:18px;flex-wrap:wrap}
.regmsg{font-family:var(--font-mono);font-size:11px;color:var(--text-2)}
.livecount{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.lc{flex:1;min-width:120px;background:var(--bg-base);border:1px solid var(--border-light);border-radius:8px;padding:10px 12px}
.lc b{font-family:var(--font-disp);font-size:24px;font-weight:800;display:block;line-height:1}
.lc span{font-family:var(--font-mono);font-size:9px;letter-spacing:.8px;color:var(--text-2);text-transform:uppercase}
/* listas / tablas */
.tblwrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse}
table.t th{font-family:var(--font-mono);font-size:8.5px;letter-spacing:.8px;color:var(--text-2);padding:10px var(--sp-2);text-align:right;text-transform:uppercase;border-bottom:1px solid var(--border-light);font-weight:500;white-space:nowrap}
table.t th.l,table.t td.l{text-align:left}
table.t td{padding:8px var(--sp-2);border-bottom:1px solid var(--border-subtle);font-family:var(--font-mono);font-size:11px;text-align:right;white-space:nowrap}
table.t tbody tr:hover{background:var(--bg-hover)}
table.t tr.grp td{background:var(--bg-panel);font-family:var(--font-disp);font-size:14px;font-weight:700;text-align:left;letter-spacing:.4px}
td.low{color:var(--text-3)}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;vertical-align:-1px}
.dbtn{background:none;border:1px solid var(--border-light);border-radius:6px;color:var(--text-3);width:26px;height:26px;cursor:pointer;font-size:12px}
.dbtn:hover{color:var(--negative);border-color:var(--negative)}
.badge{font-family:var(--font-mono);font-size:9px;border-radius:4px;padding:2px 6px;color:#000;font-weight:600}
.empty{text-align:center;color:var(--text-2);font-family:var(--font-mono);font-size:12px;line-height:1.8;padding:50px 20px}
/* kpis */
.kpis{display:flex;flex-wrap:wrap;gap:var(--sp-3);margin-bottom:var(--sp-4)}
.kpi{background:var(--bg-raised);border:1px solid var(--border-light);border-radius:var(--r-lg);padding:var(--sp-4);min-width:120px;flex:1 1 130px}
.kpi .v{font-family:var(--font-disp);font-weight:800;font-size:26px;line-height:1}
.kpi .k{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.6px;color:var(--text-2);text-transform:uppercase;margin-top:7px}
.kpi .s{font-family:var(--font-mono);font-size:10px;color:var(--text-3);margin-top:3px}
.teamhead{display:flex;align-items:center;gap:10px;font-family:var(--font-disp);font-weight:800;font-size:20px;letter-spacing:.5px;margin:6px 0 10px}
.matchhead{background:var(--bg-raised);border:1px solid var(--border-light);border-radius:var(--r-lg);padding:14px 18px;margin-bottom:var(--sp-4);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.mh-t{font-family:var(--font-disp);font-weight:800;font-size:26px;letter-spacing:.5px}
.mh-s{font-family:var(--font-mono);font-size:10.5px;color:var(--text-2);letter-spacing:.5px}
.insights{list-style:none;display:flex;flex-direction:column;gap:8px}
.insights li{font-size:13px;line-height:1.55;color:var(--text);padding:10px 14px;background:var(--bg-base);border:1px solid var(--border-light);border-left:3px solid var(--insight);border-radius:6px}
.insights li.w{border-left-color:var(--text-3);color:var(--text-2)}
/* gráficos */
.chart{width:100%;overflow:visible}
.chart text{font-family:var(--font-mono);fill:var(--text-2);font-size:10px}
.chart .val{fill:var(--text);font-size:10.5px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:11.5px;color:var(--text-2);margin:2px 0 8px}
.tip{position:fixed;z-index:100;pointer-events:none;background:var(--bg-panel);border:1px solid var(--border-strong);border-radius:6px;padding:7px 10px;font-family:var(--font-mono);font-size:10.5px;color:var(--text);display:none;max-width:240px;line-height:1.5}
.mini{font-family:var(--font-mono);font-size:10px;color:var(--text-3)}
.cst{font-family:var(--font-mono);font-size:10px;color:var(--text-2);border:1px solid var(--border-light);border-radius:20px;padding:5px 11px;white-space:nowrap}
.cst.ok{color:var(--positive);border-color:rgba(52,199,105,.4)}.cst.pend{color:#f5b042;border-color:rgba(245,176,66,.45)}.cst.err{color:var(--negative);border-color:rgba(240,80,80,.5);cursor:pointer}
.login{max-width:420px;margin:30px auto}.login .field{margin-bottom:12px}.login .field input{width:100%}
@media(max-width:640px){.opts.c3{grid-template-columns:1fr}.tbtn{font-size:17px}}
@media print{
  body{background:#fff;color:#111}.topbar,.tabs,.btn,.spnav-burger,.noprint,.tip{display:none!important}
  .card,.kpi,.matchhead,.lc{background:#fff!important;border-color:#ccc!important}
  .view{display:none!important}.view.print{display:block!important}
  .insights li{background:#fff;color:#111}
  table.t td,table.t th,.chart text,.chart .val,.kpi .k,.mh-s,.mini{color:#222;fill:#222}
  .kpi .v,.mh-t,.teamhead{color:#111}
}

<script>
/* ═══════════════════════════════════════════════════════════════
   DATOS TESIS · Momento de la posesión en que se lanza (Playoffs LA)
   Almacenamiento: Supabase → tablas tesis_partidos y tesis_tiros
   (RLS: cada usuario ve y edita solo sus propios registros).
   Usa la misma sesión que el resto de ScoutPro (mismo origen).
   Si una operación falla (sin conexión), queda en una cola local
   y se reintenta sola; no se pierde.
   Para eliminar la sección: borrar este archivo y las dos tablas.
   ═══════════════════════════════════════════════════════════════ */
const SB_URL='https://jqudeomgafqilqmqcqzg.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpxdWRlb21nYWZxaWxxbXFjcXpnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyNjY1MTQsImV4cCI6MjA5NTg0MjUxNH0.0tl4jVOnuOE8DxTOQfGF2qirCeMIKRdv5RCZ0dGzBl8';
const LS_ACTIVE='sp_tesis_active',LS_Q='sp_tesis_cola',LS_LEGACY='sp_tesis_v1';
const SEG=[
  {n:1,l:'Primeros 8"',r:'seg. 1–8',s:'1.º tramo'},
  {n:2,l:'Segundos 8"',r:'seg. 9–16',s:'2.º tramo'},
  {n:3,l:'Terceros 8"',r:'seg. 17–24',s:'3.º tramo'}
];
const SEGCOL=['#c4b5fd','#8b5cf6','#5b3fd0'];           /* secuencial: temprano → tardío */
const FASES=['Octavos de final','Cuartos de final','Semifinal','Final','Otra'];
const DET_OK=['Asistido','Individual','Con falta (+1)'];
const DET_KO=['Rebote defensivo','Rebote ofensivo','Tapón','Con falta (TL)'];
const C1='#f97316',C2='#4f8ef7';

let DB={games:[],active:null},sb=null,SESSION=null,CLOUD={state:'init',err:''},Q=loadQ(),FLUSHING=false;
let UI={team:null,seg:null,pts:null,res:null,det:null,view:'cargar',tFase:'',tTeam:'',tGames:null};

function saveActive(){try{DB.active?localStorage.setItem(LS_ACTIVE,DB.active):localStorage.removeItem(LS_ACTIVE);}catch(e){}}
function save(){saveActive();}
function loadQ(){try{return JSON.parse(localStorage.getItem(LS_Q)||'[]')||[];}catch(e){return[];}}
function saveQ(){try{localStorage.setItem(LS_Q,JSON.stringify(Q));}catch(e){}}
function legacy(){try{const d=JSON.parse(localStorage.getItem(LS_LEGACY)||'null');if(d&&Array.isArray(d.games)&&d.games.length)return d;}catch(e){}return null;}
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isUuid=x=>/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(String(x||''));
function uid(){if(window.crypto&&crypto.randomUUID)return crypto.randomUUID();const b=new Uint8Array(16);crypto.getRandomValues(b);b[6]=b[6]&15|64;b[8]=b[8]&63|128;const h=[...b].map(x=>x.toString(16).padStart(2,'0')).join('');return h.slice(0,8)+'-'+h.slice(8,12)+'-'+h.slice(12,16)+'-'+h.slice(16,20)+'-'+h.slice(20);}
const tkey=s=>String(s||'').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ');
const pct=(a,b)=>b>0?(100*a/b):null;
const fp=(v,d=0)=>v==null?'—':v.toFixed(d)+'%';
const f2=v=>v==null?'—':v.toFixed(2);
const game=id=>DB.games.find(g=>g.id===id);
const active=()=>game(DB.active)||null;
function gname(g){return (g.fase?g.fase+' · ':'')+'Juego '+g.juego+' · '+g.local+' vs '+g.visitante;}
function teamName(g,side){return side==='L'?g.local:g.visitante;}
const teamColor=side=>side==='L'?C1:C2;

/* ─────────── nube (Supabase) ─────────── */
const rowG=g=>({id:g.id,fase:g.fase||'',juego:g.juego,local:g.local,visitante:g.visitante,fecha:g.fecha||null});
const rowT=(g,s)=>({id:s.id,partido_id:g.id,equipo:s.t,tramo:s.seg,puntos:s.pts,emboca:!!s.res,detalle:s.det||'',created_at:s.ts||new Date().toISOString()});
function paintStatus(){
  const e=$('cst');if(!e)return;
  let c='cst',t;
  if(CLOUD.state==='nolib'||!SESSION){t='☁ Sin sesión';}
  else if(Q.length){c+=CLOUD.err?' err':' pend';t=(CLOUD.err?'⚠ ':'⏳ ')+Q.length+' sin subir'+(CLOUD.err?' · reintentar':'…');}
  else if(CLOUD.state==='ok'){c+=' ok';t='☁ Guardado en Supabase';}
  else if(CLOUD.state==='fail'){c+=' err';t='⚠ Sin conexión';}
  else t='☁ Conectando…';
  e.className=c;e.textContent=t;e.title=CLOUD.err||'';
}
async function cloud(op){Q.push(op);saveQ();paintStatus();await flush();}
async function flush(){
  if(!sb||!SESSION||FLUSHING)return;FLUSHING=true;CLOUD.err='';
  try{
    while(Q.length){
      const o=Q[0];let r;
      if(o.k==='ins_g')r=await sb.from('tesis_partidos').upsert(o.row);
      else if(o.k==='ins_t')r=await sb.from('tesis_tiros').upsert(o.row);
      else if(o.k==='del_t')r=await sb.from('tesis_tiros').delete().eq('id',o.id);
      else if(o.k==='del_g')r=await sb.from('tesis_partidos').delete().eq('id',o.id);
      else if(o.k==='wipe')r=await sb.from('tesis_partidos').delete().neq('id','00000000-0000-0000-0000-000000000000');
      else r={};
      if(r.error){
        const st=r.status||0,perm=st>=400&&st<500&&![401,408,429].includes(st);
        CLOUD.err=r.error.message||'Error';
        if(perm){Q.shift();saveQ();continue;}   /* error definitivo: se descarta para no trabar la cola */
        break;
      }
      Q.shift();saveQ();
    }
  }catch(e){CLOUD.err=(e&&e.message)||'Sin conexión';}
  FLUSHING=false;paintStatus();
}
async function pull(){
  CLOUD.state='sync';paintStatus();
  try{
    const pr=await sb.from('tesis_partidos').select('*').order('created_at',{ascending:true}).order('id');
    if(pr.error)throw pr.error;
    let tiros=[],f=0;
    for(;;){const r=await sb.from('tesis_tiros').select('*').order('created_at',{ascending:true}).order('id').range(f,f+999);
      if(r.error)throw r.error;tiros=tiros.concat(r.data||[]);if((r.data||[]).length<1000)break;f+=1000;if(f>200000)break;}
    const by={};tiros.forEach(t=>{(by[t.partido_id]=by[t.partido_id]||[]).push({id:t.id,t:t.equipo,seg:t.tramo,pts:t.puntos,res:t.emboca?1:0,det:t.detalle||'',ts:t.created_at});});
    const prev=DB.active||localStorage.getItem(LS_ACTIVE);
    DB.games=(pr.data||[]).map(p=>({id:p.id,fase:p.fase,juego:p.juego,local:p.local,visitante:p.visitante,fecha:p.fecha||'',shots:by[p.id]||[]}));
    DB.active=prev&&game(prev)?prev:(DB.games.length?DB.games[DB.games.length-1].id:null);
    saveActive();CLOUD.state='ok';CLOUD.err='';
  }catch(e){CLOUD.state='fail';CLOUD.err=(e&&e.message)||'Sin conexión';}
  paintStatus();
}
async function afterLogin(){CLOUD.state='sync';renderAll();await flush();await pull();renderAll();}
async function doLogin(){
  const m=$('lgMsg');m.textContent='Ingresando…';
  const r=await sb.auth.signInWithPassword({email:$('lgEmail').value.trim(),password:$('lgPass').value});
  if(r.error){m.textContent='No se pudo ingresar: '+r.error.message;return;}
  SESSION=r.data.session;afterLogin();
}

function importGames(list){

async function boot(){

/* ─────────── estadística ─────────── */
function agg(shots){
  const o={n:0,m:0,n3:0,m3:0,n2:0,m2:0,pts:0,orb:0,miss:0};
  shots.forEach(s=>{o.n++;if(s.res)o.m++;o.pts+=s.res?s.pts:0;
    if(s.pts===3){o.n3++;if(s.res)o.m3++;}else{o.n2++;if(s.res)o.m2++;}
    if(!s.res){o.miss++;if(s.det==='Rebote ofensivo')o.orb++;}});
  o.fg=pct(o.m,o.n);o.p3=pct(o.m3,o.n3);o.p2=pct(o.m2,o.n2);
  o.efg=o.n?100*(o.m+0.5*o.m3)/o.n:null;o.ppt=o.n?o.pts/o.n:null;o.r3=pct(o.n3,o.n);o.orbp=pct(o.orb,o.miss);
  return o;
}
function bySeg(shots){const r={};SEG.forEach(s=>r[s.n]=agg(shots.filter(x=>x.seg===s.n)));return r;}

/* ─────────── gráfico de barras agrupadas (SVG) ───────────
   cats: etiquetas del eje X · series: [{name,color,vals[],tips[]}] · fmt: formateador */
function barChart(cats,series,fmt,opt){
  opt=opt||{};const W=560,H=210,L=38,R=8,T=14,B=34;
  const raw=Math.max(opt.max||0,...series.flatMap(s=>s.vals.map(v=>v||0)),1)*1.08;
  const max=Math.max(20,Math.ceil(raw/20)*20);   /* eje con escalones redondos (20, 40, 60…) */
  const iw=W-L-R,ih=H-T-B,gw=iw/cats.length,bw=Math.min(46,(gw-18)/series.length);
  let g='';
  for(let i=0;i<=4;i++){const v=max*i/4,y=T+ih-ih*i/4;
    g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="rgba(255,255,255,${i?0.06:0.18})"/><text x="${L-6}" y="${y+3}" text-anchor="end">${Math.round(v)}${opt.unit||''}</text>`;}
  cats.forEach((c,ci)=>{
    const cx=L+gw*ci+gw/2,tot=bw*series.length+2*(series.length-1),x0=cx-tot/2;
    series.forEach((s,si)=>{
      const v=s.vals[ci],h=v==null?0:ih*v/max,x=x0+si*(bw+2),y=T+ih-h;
      if(v!=null)g+=`<path d="M${x},${T+ih}V${y+4}Q${x},${y} ${x+4},${y}H${x+bw-4}Q${x+bw},${y} ${x+bw},${y+4}V${T+ih}Z" fill="${s.color}" data-tip="${esc(s.tips[ci])}"/>
        <text class="val" x="${x+bw/2}" y="${y-4}" text-anchor="middle">${fmt(v)}</text>`;
      else g+=`<text x="${x+bw/2}" y="${T+ih-4}" text-anchor="middle">—</text>`;
    });
    g+=`<text x="${cx}" y="${H-16}" text-anchor="middle" style="fill:var(--text)">${esc(c.l)}</text><text x="${cx}" y="${H-3}" text-anchor="middle" style="font-size:9px">${esc(c.r)}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.title||'Gráfico')}">${g}</svg>`;
}
/* barras apiladas 100 % por categoría (una barra por partido / juego) */
function stackChart(rows,opt){
  /* rows: [{label,sub,vals:[a,b,c] (conteos),tipHead}] */
  const W=560,rh=30,T=6,L=118,R=40,H=T+rows.length*rh+6;
  let g='';
  rows.forEach((r,i)=>{
    const tot=r.vals.reduce((a,b)=>a+b,0),y=T+i*rh;let x=L;const iw=W-L-R;
    g+=`<text x="${L-8}" y="${y+16}" text-anchor="end" style="fill:var(--text)">${esc(r.label)}</text>`;
    if(!tot){g+=`<text x="${L}" y="${y+16}">sin tiros</text>`;return;}
    r.vals.forEach((v,k)=>{
      const w=iw*v/tot;if(!v)return;
      g+=`<rect x="${x+1}" y="${y+4}" width="${Math.max(w-2,1)}" height="${rh-10}" rx="3" fill="${SEGCOL[k]}" data-tip="${esc(r.tipHead+' · '+SEG[k].l+': '+v+' de '+tot+' ('+(100*v/tot).toFixed(0)+'%)')}"/>`;
      if(w>26)g+=`<text x="${x+w/2}" y="${y+18}" text-anchor="middle" style="fill:${k===0?'#1a1205':'#fff'};font-size:10px">${(100*v/tot).toFixed(0)}%</text>`;
      x+=w;});
    g+=`<text x="${W-R+6}" y="${y+16}">n=${tot}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt&&opt.title||'Distribución')}">${g}</svg>`;
}

let INF_ID=null;
function insightsFor(name,seg,tot,base){
  const out=[];if(!tot.n){return [['w',name+': sin tiros cargados.']];}
  const lowN=tot.n<10;
  const top=SEG.reduce((a,s)=>seg[s.n].n>seg[a.n].n?s:a,SEG[0]);
  out.push(['',`<b>${esc(name)}</b> lanzó ${seg[top.n].n} de sus ${tot.n} tiros (${fp(pct(seg[top.n].n,tot.n))}) en los <b>${top.l.toLowerCase()}</b> de la posesión (${top.r}).`]);
  const el=SEG.filter(s=>seg[s.n].n>=3);
  if(el.length>=2){
    const b=el.reduce((a,s)=>seg[s.n].efg>seg[a.n].efg?s:a),w=el.reduce((a,s)=>seg[s.n].efg<seg[a.n].efg?s:a);
    if(b!==w)out.push(['',`Mayor eficiencia (eFG%) en los ${b.l.toLowerCase()}: ${fp(seg[b.n].efg)} (${seg[b.n].m}/${seg[b.n].n}); la menor, en los ${w.l.toLowerCase()}: ${fp(seg[w.n].efg)} (${seg[w.n].m}/${seg[w.n].n}).`]);
  }
  const late=pct(seg[3].n,tot.n);
  out.push(['',`Tiros de «último momento» (terceros 8″): ${seg[3].n} (${fp(late)}), con ${fp(seg[3].efg)} de eFG%${seg[3].n?`; tiró de 3 el ${fp(seg[3].r3)} de esos intentos`:''}.`]);
  if(base&&base.n>=30&&late!=null){const bl=pct(base.s3,base.n),d=late-bl;
    if(Math.abs(d)>=8)out.push(['',`Frente al promedio de la muestra cargada (${fp(bl)} en terceros 8″), ${esc(name)} tiró ${d>0?'más':'menos'} tarde (${d>0?'+':''}${d.toFixed(0)} pp).`]);}
  if(lowN||SEG.some(s=>seg[s.n].n>0&&seg[s.n].n<5))out.push(['w','Atención: hay tramos con menos de 5 tiros; los porcentajes por tramo son indicativos y no concluyentes.']);
  return out;
}

  const efg=sides.map(s=>({name:s.name,color:s.col,vals:SEG.map(x=>s.seg[x.n].efg),tips:SEG.map(x=>`${s.name} · ${x.l}: eFG% ${fp(s.seg[x.n].efg,1)} (${s.seg[x.n].m}/${s.seg[x.n].n}${s.seg[x.n].n?', '+s.seg[x.n].m3+' triples':''})`)}));
  const leg=`<div class="legend">${sides.map(s=>`<span><span class="sw" style="background:${s.col}"></span>${esc(s.name)}</span>`).join('')}</div>`;
  h+=`<div class="sec">Momento de la posesión en que se lanza</div><div class="grid2">
    <div class="card"><div class="card-t">Distribución de los tiros por tramo <span class="mini">(% de sus propios tiros)</span></div>${leg}${barChart(cats,dist,v=>v.toFixed(0)+'%',{unit:'%',title:'Distribución por tramo'})}</div>
    <div class="card"><div class="card-t">Eficiencia (eFG%) por tramo</div>${leg}${barChart(cats,efg,v=>v.toFixed(0)+'%',{unit:'%',max:60,title:'eFG por tramo'})}</div></div>`;
  /* tabla */
  h+=`<div class="sec">Detalle por tramo</div><div class="card"><div class="tblwrap"><table class="t"><thead><tr><th class="l">Equipo / tramo</th><th>Tiros</th><th>% de sus tiros</th><th>Conv.</th><th>FG%</th><th>3PA</th><th>3P%</th><th>2PA</th><th>2P%</th><th>eFG%</th><th>Pts</th><th>Pts/tiro</th><th>Tras fallo: rebote of.</th></tr></thead><tbody>`;

      h+=`<tr class="${lo?'':''}"><td class="l">${x.l} <span class="mini">${x.r}</span></td><td>${a.n}</td><td>${fp(pct(a.n,s.tot.n))}</td><td>${a.m}</td><td class="${lo?'low':''}">${fp(a.fg,1)}</td><td>${a.n3}</td><td class="${lo?'low':''}">${fp(a.p3,1)}</td><td>${a.n2}</td><td class="${lo?'low':''}">${fp(a.p2,1)}</td><td class="${lo?'low':''}">${fp(a.efg,1)}</td><td>${a.pts}</td><td>${f2(a.ppt)}</td><td>${a.miss?a.orb+'/'+a.miss+' ('+fp(a.orbp)+')':'—'}</td></tr>`;});
    const t=s.tot;h+=`<tr><td class="l"><b>Total</b></td><td><b>${t.n}</b></td><td>100%</td><td><b>${t.m}</b></td><td>${fp(t.fg,1)}</td><td>${t.n3}</td><td>${fp(t.p3,1)}</td><td>${t.n2}</td><td>${fp(t.p2,1)}</td><td>${fp(t.efg,1)}</td><td><b>${t.pts}</b></td><td>${f2(t.ppt)}</td><td>${t.miss?t.orb+'/'+t.miss+' ('+fp(t.orbp)+')':'—'}</td></tr>`;
  });
  h+=`</tbody></table></div><div class="mini" style="margin-top:8px">eFG% = (convertidos + 0,5 × triples convertidos) ÷ intentos. Los valores en gris provienen de menos de 5 tiros. «Rebote of.» se calcula solo con los fallos en los que se indicó el detalle.</div></div>`;
  /* qué pasó */
  const dets=[...DET_OK,...DET_KO];
  const anyDet=g.shots.some(s=>s.det);
  if(anyDet){
    h+=`<div class="sec">Qué pasó tras el tiro</div><div class="card"><div class="tblwrap"><table class="t"><thead><tr><th class="l">Detalle</th>${sides.map(s=>`<th>${esc(s.name)}</th>`).join('')}</tr></thead><tbody>${dets.map(d=>`<tr><td class="l">${d}</td>${sides.map(s=>`<td>${s.sh.filter(x=>x.det===d).length}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`;
  }
  /* lectura */
  h+=`<div class="sec">Lectura del partido</div><div class="card">${sides.map(s=>`<div class="teamhead" style="font-size:16px"><span class="sw" style="background:${s.col}"></span>${esc(s.name)}</div><ul class="insights" style="margin-bottom:14px">${insightsFor(s.name,s.seg,s.tot,base).map(([c,t])=>`<li class="${c}">${t}</li>`).join('')}</ul>`).join('')}</div>`;

/* ═══════════════ TENDENCIAS ═══════════════ */
function renderTend(){
  const el=$('view-tend');if(gate(el))return;
  if(!DB.games.length){el.innerHTML='<div class="empty">Cargá partidos para ver tendencias.</div>';return;}
  const fases=[...new Set(DB.games.map(g=>g.fase).filter(Boolean))];
  const teams=teamList();
  let G=DB.games.filter(g=>!UI.tFase||g.fase===UI.tFase);
  let h=`<div class="controls noprint" style="margin-bottom:16px">
    <div class="field"><label>Fase</label><select onchange="UI.tFase=this.value;UI.tTeam='';renderTend()"><option value="">Todas</option>${fases.map(f=>`<option ${UI.tFase===f?'selected':''}>${esc(f)}</option>`).join('')}</select></div>
    <div class="field w"><label>Equipo</label><select onchange="UI.tTeam=this.value;renderTend()"><option value="">Toda la muestra (todos los equipos)</option>${teams.map(t=>`<option ${UI.tTeam===t?'selected':''}>${esc(t)}</option>`).join('')}</select></div>
    <button class="btn" onclick="printView('tend')">🖨 Imprimir / PDF</button></div>`;
  /* shots por (juego, equipo) */
  const rec=[];G.forEach(g=>{['L','V'].forEach(side=>{const nm=teamName(g,side);rec.push({g,side,nm,opp:teamName(g,side==='L'?'V':'L'),sh:g.shots.filter(s=>s.t===side)});});});
  const sel=UI.tTeam?rec.filter(r=>tkey(r.nm)===tkey(UI.tTeam)):rec;
  const shots=sel.flatMap(r=>r.sh);
  const title=UI.tTeam||'Toda la muestra';
  if(!shots.length){el.innerHTML=h+'<div class="empty">No hay tiros cargados para este filtro.</div>';return;}
  const tot=agg(shots),seg=bySeg(shots);
  h+=`<div class="matchhead"><div><div class="mh-s">${UI.tFase?esc(UI.tFase):'TODAS LAS FASES'} · ${sel.filter(r=>r.sh.length).length} ${UI.tTeam?'partidos':'registros equipo-partido'}</div><div class="mh-t">${esc(title)}</div></div><div class="tb-spacer"></div><div class="mh-s">${tot.n} tiros de campo</div></div>`;
  h+=`<div class="kpis"><div class="kpi"><div class="v">${fp(tot.fg,1)}</div><div class="k">FG%</div><div class="s">${tot.m}/${tot.n}</div></div>
    <div class="kpi"><div class="v">${fp(tot.efg,1)}</div><div class="k">eFG%</div></div>
    <div class="kpi"><div class="v">${fp(tot.r3,0)}</div><div class="k">% de tiros de 3</div></div>
    <div class="kpi"><div class="v">${f2(tot.ppt)}</div><div class="k">Pts por tiro</div></div>
    <div class="kpi"><div class="v">${fp(pct(seg[3].n,tot.n),0)}</div><div class="k">Tiros en terceros 8″</div></div></div>`;
  /* agregado */
  const cats=SEG.map(s=>({l:s.l,r:s.r}));
  const sA=[{name:'% de tiros',color:'#8b5cf6',vals:SEG.map(x=>pct(seg[x.n].n,tot.n)),tips:SEG.map(x=>`${x.l}: ${seg[x.n].n} de ${tot.n} tiros (${fp(pct(seg[x.n].n,tot.n))})`)}];
  const sB=[{name:'eFG%',color:'#8b5cf6',vals:SEG.map(x=>seg[x.n].efg),tips:SEG.map(x=>`${x.l}: eFG% ${fp(seg[x.n].efg,1)} (${seg[x.n].m}/${seg[x.n].n})`)}];
  h+=`<div class="sec">Perfil de ${esc(title)}</div><div class="grid2">
   <div class="card"><div class="card-t">Distribución por tramo <span class="mini">(% de tiros)</span></div>${barChart(cats,sA,v=>v.toFixed(0)+'%',{unit:'%',title:'Distribución'})}</div>
   <div class="card"><div class="card-t">Eficiencia (eFG%) por tramo</div>${barChart(cats,sB,v=>v.toFixed(0)+'%',{unit:'%',max:60,title:'eFG por tramo'})}</div></div>`;
  h+=`<div class="card"><div class="tblwrap"><table class="t"><thead><tr><th class="l">Tramo</th><th>Tiros</th><th>% de tiros</th><th>FG%</th><th>3PA</th><th>% de 3</th><th>3P%</th><th>2P%</th><th>eFG%</th><th>Pts/tiro</th><th>Rebote of. tras fallo</th></tr></thead><tbody>${SEG.map(x=>{const a=seg[x.n],lo=a.n<5;return`<tr><td class="l">${x.l} <span class="mini">${x.r}</span></td><td>${a.n}</td><td>${fp(pct(a.n,tot.n))}</td><td class="${lo?'low':''}">${fp(a.fg,1)}</td><td>${a.n3}</td><td>${fp(a.r3)}</td><td class="${lo?'low':''}">${fp(a.p3,1)}</td><td class="${lo?'low':''}">${fp(a.p2,1)}</td><td class="${lo?'low':''}">${fp(a.efg,1)}</td><td>${f2(a.ppt)}</td><td>${a.miss?fp(a.orbp):'—'}</td></tr>`;}).join('')}</tbody></table></div></div>`;
  /* evolución partido a partido */
  const rows=sel.filter(r=>r.sh.length).sort((a,b)=>(a.g.fecha||'').localeCompare(b.g.fecha||'')||a.g.juego-b.g.juego);
  h+=`<div class="sec">Evolución ${UI.tTeam?'partido a partido':'por registro equipo-partido'}</div><div class="card"><div class="card-t">Reparto de tiros por tramo <span class="mini">(100 % = tiros del equipo en ese partido)</span></div>${segLegend()}
   ${stackChart(rows.map(r=>{const s=bySeg(r.sh);return{label:(UI.tTeam?'':r.nm+' · ')+'J'+r.g.juego+(UI.tTeam?' vs '+r.opp:''),vals:SEG.map(x=>s[x.n].n),tipHead:r.nm+' ('+(r.g.fase||'')+' J'+r.g.juego+')'};}),{title:'Evolución'})}</div>`;
  h+=`<div class="card"><div class="card-t">eFG% por tramo, partido a partido</div><div class="tblwrap"><table class="t"><thead><tr><th class="l">Partido</th><th class="l">Fase</th>${SEG.map(s=>`<th>${s.l}</th>`).join('')}<th>Total</th></tr></thead><tbody>${rows.map(r=>{const s=bySeg(r.sh),t=agg(r.sh);return`<tr><td class="l">${esc((UI.tTeam?'':r.nm+' · ')+'J'+r.g.juego+' vs '+r.opp)}</td><td class="l">${esc(r.g.fase||'')}</td>${SEG.map(x=>`<td class="${s[x.n].n<5?'low':''}">${fp(s[x.n].efg)} <span class="mini">(${s[x.n].n})</span></td>`).join('')}<td>${fp(t.efg)} <span class="mini">(${t.n})</span></td></tr>`;}).join('')}</tbody></table></div><div class="mini" style="margin-top:8px">Entre paréntesis, cantidad de tiros.</div></div>`;
  /* por número de juego de la serie */
  const byJ={};G.forEach(g=>{(byJ[g.juego]=byJ[g.juego]||[]);const rs=rec.filter(r=>r.g===g&&(!UI.tTeam||tkey(r.nm)===tkey(UI.tTeam)));rs.forEach(r=>byJ[g.juego].push(...r.sh));});
  const js=Object.keys(byJ).map(Number).filter(j=>byJ[j].length).sort((a,b)=>a-b);
  if(js.length){
    h+=`<div class="sec">Por número de juego de la serie</div><div class="card"><div class="card-t">¿Cambia el momento del tiro a medida que avanza la serie?</div>${segLegend()}
    ${stackChart(js.map(j=>{const s=bySeg(byJ[j]);return{label:'Juego '+j,vals:SEG.map(x=>s[x.n].n),tipHead:title+' · Juego '+j};}),{title:'Por juego'})}
    <div class="tblwrap" style="margin-top:10px"><table class="t"><thead><tr><th class="l">Juego</th><th>Tiros</th>${SEG.map(s=>`<th>% ${s.l}</th>`).join('')}<th>eFG% total</th><th>eFG% terceros 8″</th></tr></thead><tbody>${js.map(j=>{const sh=byJ[j],t=agg(sh),s=bySeg(sh);return`<tr><td class="l">Juego ${j}</td><td>${t.n}</td>${SEG.map(x=>`<td>${fp(pct(s[x.n].n,t.n))}</td>`).join('')}<td>${fp(t.efg)}</td><td class="${s[3].n<5?'low':''}">${fp(s[3].efg)}</td></tr>`;}).join('')}</tbody></table></div></div>`;
  }
  /* comparativo de equipos (solo toda la muestra) */
  if(!UI.tTeam){
    const tm={};rec.forEach(r=>{const k=tkey(r.nm);(tm[k]=tm[k]||{nm:r.nm,sh:[],gp:0});tm[k].sh.push(...r.sh);if(r.sh.length)tm[k].gp++;});
    const list=Object.values(tm).filter(x=>x.sh.length).sort((a,b)=>b.sh.length-a.sh.length);
    h+=`<div class="sec">Comparativo entre equipos</div><div class="card"><div class="tblwrap"><table class="t"><thead><tr><th class="l">Equipo</th><th>PJ</th><th>Tiros</th><th>% 1.º 8″</th><th>% 2.º 8″</th><th>% 3.º 8″</th><th>eFG% 1.º</th><th>eFG% 2.º</th><th>eFG% 3.º</th><th>eFG% total</th></tr></thead><tbody>${list.map(x=>{const t=agg(x.sh),s=bySeg(x.sh);return`<tr><td class="l">${esc(x.nm)}</td><td>${x.gp}</td><td>${t.n}</td>${SEG.map(k=>`<td>${fp(pct(s[k.n].n,t.n))}</td>`).join('')}${SEG.map(k=>`<td class="${s[k.n].n<5?'low':''}">${fp(s[k.n].efg)}</td>`).join('')}<td>${fp(t.efg)}</td></tr>`;}).join('')}</tbody></table></div></div>`;
  }
  /* lectura */
  const base={n:DB.games.flatMap(x=>x.shots).length,s3:DB.games.flatMap(x=>x.shots).filter(s=>s.seg===3).length};
  h+=`<div class="sec">Lectura de tendencias</div><div class="card"><ul class="insights">${insightsFor(title,seg,tot,UI.tTeam?base:null).map(([c,t])=>`<li class="${c}">${t}</li>`).join('')}</ul></div>`;
  el.innerHTML=h;
}

/* ═══════════════ DATOS Y RESPALDO ═══════════════ */
function csvRows(){
  const r=[['fase','juego','fecha','local','visitante','n_tiro','equipo','rival','condicion','tramo','segundos','puntos_intento','resultado','que_paso']];
  DB.games.forEach(g=>g.shots.forEach((s,i)=>r.push([g.fase,g.juego,g.fecha,g.local,g.visitante,i+1,teamName(g,s.t),teamName(g,s.t==='L'?'V':'L'),s.t==='L'?'Local':'Visitante',s.seg,SEG[s.seg-1].r.replace('seg. ',''),s.pts,s.res?'Emboca':'Falla',s.det||''])));
  return r;
}
function download(name,text,mime){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:mime}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}
function expCSV(){download('datos-tesis.csv','﻿'+csvRows().map(r=>r.map(c=>'"'+String(c==null?'':c).replace(/"/g,'""')+'"').join(';')).join('\r\n'),'text/csv;charset=utf-8');}
function expJSON(){download('datos-tesis-respaldo.json',JSON.stringify(DB,null,1),'application/json');}
function impJSON(inp){
  const f=inp.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=async()=>{try{const d=JSON.parse(rd.result);if(!d||!Array.isArray(d.games))throw 0;
    if(!confirm('Se sumarán '+d.games.length+' partidos a la base (los que ya existan con el mismo ID se actualizan). ¿Continuar?'))return;
    importGames(d.games);if(!DB.active&&DB.games.length)DB.active=DB.games[0].id;saveActive();paintStatus();renderAll();await flush();renderAll();alert('Respaldo importado.');}
    catch(e){alert('El archivo no es un respaldo válido.');}};
  rd.readAsText(f);inp.value='';
}
function wipe(){if(confirm('Se borrarán TODOS los partidos y tiros de su cuenta en Supabase. ¿Continuar?')&&confirm('Última confirmación: esta acción no se puede deshacer.')){DB={games:[],active:null};save();cloud({k:'wipe'});renderAll();}}
function renderDatos(){
  if(gate($('view-datos')))return;
  const n=DB.games.reduce((a,g)=>a+g.shots.length,0);
  let h=legacyBanner()+`<div class="note"><b>Dónde se guardan los datos:</b> en Supabase, en las tablas <b>tesis_partidos</b> y <b>tesis_tiros</b>, asociadas a su cuenta. Se ven desde cualquier dispositivo en el que ingrese. El <b>CSV</b> abre directo en Excel o SPSS para el análisis de la tesis; el <b>respaldo JSON</b> es una copia de seguridad adicional.</div>
  <div class="card"><div class="controls"><button class="btn" onclick="expCSV()">⬇ Exportar CSV (todos los tiros)</button><button class="btn" onclick="expJSON()">⬇ Respaldo JSON</button>
   <label class="btn" style="cursor:pointer">⬆ Importar respaldo<input type="file" accept=".json,application/json" style="display:none" onchange="impJSON(this)"></label>
   <div class="tb-spacer"></div><button class="btn danger" onclick="wipe()">Borrar todo</button></div>
   <div class="mini" style="margin-top:10px">${DB.games.length} partidos · ${n} tiros cargados</div></div>`;
  if(!DB.games.length){h+='<div class="empty">Sin datos todavía.</div>';}
  else h+=`<div class="card"><div class="card-t">Partidos cargados</div><div class="tblwrap"><table class="t"><thead><tr><th class="l">Fase</th><th>Juego</th><th class="l">Local</th><th class="l">Visitante</th><th class="l">Fecha</th><th>Tiros</th><th></th></tr></thead><tbody>${DB.games.map(g=>`<tr><td class="l">${esc(g.fase)}</td><td>${g.juego}</td><td class="l">${esc(g.local)}</td><td class="l">${esc(g.visitante)}</td><td class="l">${esc(g.fecha||'—')}</td><td>${g.shots.length}</td><td><button class="btn" onclick="DB.active='${g.id}';save();go('cargar')">Abrir</button> <button class="btn" onclick="INF_ID='${g.id}';go('informe')">Informe</button></td></tr>`).join('')}</tbody></table></div></div>`;
  $('view-datos').innerHTML=h;
}

function printView(v){document.querySelectorAll('.view').forEach(x=>x.classList.remove('print'));$('view-'+v).classList.add('print');window.print();}
function renderAll(){go(UI.view);}   /* solo se dibuja la pestaña activa (evita IDs duplicados en el login) */
function go(v){
  UI.view=v;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.v===v));
  document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id==='view-'+v));

}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>go(t.dataset.v));

  var css=''
    +'.spnav-burger{display:flex;position:fixed;top:10px;right:12px;z-index:960;width:46px;height:46px;border-radius:13px;background:rgba(22,24,32,.92);border:1px solid rgba(255,255,255,.18);color:#e7eaf2;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);cursor:pointer;align-items:center;justify-content:center;padding:0;transition:border-color .15s,color .15s}'

    +'.spnav-sheet{position:absolute;top:0;right:0;bottom:0;width:min(300px,84vw);background:#0f1117;border-left:1px solid rgba(255,255,255,.1);padding:16px 12px;overflow:auto;display:flex;flex-direction:column;gap:5px;font-family:\'DM Sans\',system-ui,sans-serif}'

  function mk(it){var a=document.createElement('a');a.href=it.href;var f=it.href.toLowerCase().split('#')[0];
    if(f===cur||(it.home&&(cur===''||cur.indexOf('index')===0)))a.className='active';
