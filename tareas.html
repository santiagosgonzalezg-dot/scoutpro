<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cuerpo técnico · ScoutPRO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg-base:#08090d;--bg-raised:#0f1117;--bg-panel:#161820;--bg-hover:#1e202a;
  --bl:rgba(255,255,255,.05);--bm:rgba(255,255,255,.09);--bs:rgba(255,255,255,.18);
  --offense:#f97316;--insight:#a78bfa;--positive:#34c769;--negative:#f05050;--defense:#4f8ef7;--amber:#e0b341;
  --text:#fff;--text-2:#8891a0;--text-3:#5a6172;
  --disp:'Barlow Condensed',sans-serif;--body:'DM Sans',sans-serif;--mono:'DM Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg-base);color:var(--text);font-family:var(--body);font-size:13px;-webkit-font-smoothing:antialiased;min-height:100vh}

.topbar{display:flex;align-items:center;gap:12px;padding:0 20px;height:52px;background:var(--bg-raised);border-bottom:1px solid var(--bm);position:sticky;top:0;z-index:30}
.tb-logo{font-family:var(--disp);font-weight:800;font-size:18px;letter-spacing:2px;flex-shrink:0}
.tb-logo span{color:var(--offense)}
.tb-right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.tb-btn{background:var(--bg-panel);border:1px solid var(--bm);border-radius:5px;color:var(--text-2);font-family:var(--mono);font-size:10px;letter-spacing:.3px;padding:7px 13px;cursor:pointer;text-decoration:none;transition:all .15s;white-space:nowrap}
.tb-btn:hover{border-color:var(--offense);color:var(--offense)}

.wrap{max-width:940px;margin:0 auto;padding:22px 20px 80px}

/* hero + identidad */
.hero{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.hero-id{flex:1;min-width:220px}
.hero h1{font-family:var(--disp);font-weight:900;font-size:30px;letter-spacing:.5px;line-height:1}
.hero p{color:var(--text-2);font-size:13px;margin-top:6px;max-width:560px}
.me-card{display:flex;align-items:center;gap:11px;background:var(--bg-raised);border:1px solid var(--bm);border-radius:13px;padding:11px 14px}
.me-meta{min-width:0}
.me-n{font-weight:700;font-size:13.5px;line-height:1.1}
.me-sub{font-family:var(--mono);font-size:9.5px;color:var(--text-3);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rolepill{font-family:var(--mono);font-size:8.5px;letter-spacing:.4px;text-transform:uppercase;padding:3px 8px;border-radius:20px;border:1px solid color-mix(in srgb,var(--offense) 45%,transparent);color:var(--offense)}
.rolepill.esp{border-color:color-mix(in srgb,var(--defense) 45%,transparent);color:var(--defense)}

.tabs{display:flex;gap:6px;margin:20px 0 18px;flex-wrap:wrap}
.tab{background:var(--bg-panel);border:1px solid var(--bm);border-radius:9px;color:var(--text-2);font-family:var(--mono);font-size:11px;letter-spacing:.4px;padding:9px 15px;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:7px}
.tab:hover{border-color:var(--bs);color:var(--text)}
.tab.active{border-color:var(--offense);background:color-mix(in srgb,var(--offense) 12%,transparent);color:var(--offense)}
.tab .cnt{font-family:var(--mono);font-size:9px;background:var(--bg-base);border:1px solid var(--bm);border-radius:20px;padding:1px 6px;color:var(--text-2)}
.tab.active .cnt{border-color:color-mix(in srgb,var(--offense) 45%,transparent);color:var(--offense)}
.tab.alert .cnt{background:color-mix(in srgb,var(--negative) 18%,transparent);border-color:color-mix(in srgb,var(--negative) 50%,transparent);color:var(--negative)}

/* subtabs */
.subtabs{display:flex;gap:5px;background:var(--bg-panel);border:1px solid var(--bm);border-radius:11px;padding:4px;margin:0 0 16px;flex-wrap:wrap}
.subtab{flex:1;min-width:104px;text-align:center;padding:8px 10px;font-family:var(--mono);font-size:10.5px;letter-spacing:.4px;color:var(--text-3);cursor:pointer;border-radius:8px;border:1px solid transparent;transition:all .15s}
.subtab:hover{color:var(--text)}
.subtab.on{color:var(--offense);background:color-mix(in srgb,var(--offense) 13%,transparent);border-color:color-mix(in srgb,var(--offense) 38%,transparent)}

.sec{font-family:var(--disp);font-weight:800;font-size:15px;letter-spacing:.4px;text-transform:uppercase;color:var(--text);margin:22px 0 12px;display:flex;align-items:center;gap:10px}
.sec::before{content:"";width:3px;height:16px;background:var(--offense);border-radius:2px}
.sec::after{content:"";flex:1;height:1px;background:var(--bm)}
.sec.tight{margin:14px 0 10px}

.card{background:var(--bg-raised);border:1px solid var(--bm);border-radius:14px;padding:16px}
.empty{font-family:var(--mono);font-size:11px;color:var(--text-3);line-height:1.6;padding:8px 0}

/* form */
.frm{display:flex;flex-direction:column;gap:11px}
.frm-row{display:flex;gap:10px;flex-wrap:wrap}
.fld{display:flex;flex-direction:column;gap:5px;flex:1;min-width:150px}
.fld.wide{flex-basis:100%}
.fld label{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3)}
.fld input,.fld select,.fld textarea{background:var(--bg-panel);border:1px solid var(--bm);border-radius:8px;color:var(--text);font-family:var(--body);font-size:13.5px;padding:10px 12px;outline:none;transition:border-color .15s;width:100%}
.fld textarea{resize:vertical;min-height:62px}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--offense)}
.btn{border:none;border-radius:8px;font-family:var(--disp);font-weight:700;font-size:14px;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;transition:all .15s;padding:10px 18px}
.btn-primary{background:var(--offense);color:#fff}
.btn-primary:hover{background:#ea6c10}
.btn-primary:disabled{background:var(--bg-hover);color:var(--text-3);cursor:not-allowed}
.msg{font-family:var(--mono);font-size:10.5px;line-height:1.5;min-height:13px}
.msg.err{color:var(--negative)}.msg.ok{color:var(--positive)}

/* filtros + chips */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 14px}
.chip{background:var(--bg-panel);border:1px solid var(--bm);border-radius:20px;color:var(--text-2);font-family:var(--mono);font-size:10px;letter-spacing:.4px;padding:6px 12px;cursor:pointer;transition:all .15s}
.chip:hover{border-color:var(--bs);color:var(--text)}
.chip.on{border-color:var(--offense);color:var(--offense);background:color-mix(in srgb,var(--offense) 10%,transparent)}

/* avatar */
.avatar{width:36px;height:36px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:800;font-size:14px;color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.22)}
.avatar.sm{width:28px;height:28px;font-size:11px}

/* ───────── MURO DEL STAFF ───────── */
.composer{background:var(--bg-raised);border:1px solid var(--bm);border-radius:14px;padding:14px;margin-bottom:16px}
.composer textarea{width:100%;background:var(--bg-panel);border:1px solid var(--bm);border-radius:10px;color:var(--text);font-family:var(--body);font-size:13.5px;padding:11px 12px;outline:none;resize:vertical;min-height:60px}
.composer textarea:focus{border-color:var(--offense)}
.composer-bar{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.composer-bar select{background:var(--bg-panel);border:1px solid var(--bm);border-radius:8px;color:var(--text-2);font-family:var(--mono);font-size:10.5px;padding:8px 10px;outline:none}
.composer-bar .grow{flex:1}
.post{background:var(--bg-raised);border:1px solid var(--bm);border-radius:14px;padding:14px 15px;margin-bottom:11px}
.post.pin{border-color:color-mix(in srgb,var(--amber) 45%,transparent);background:color-mix(in srgb,var(--amber) 5%,var(--bg-raised))}
.post-h{display:flex;align-items:center;gap:10px}
.post-id{flex:1;min-width:0}
.post-n{font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.post-sub{font-family:var(--mono);font-size:9px;color:var(--text-3);margin-top:2px}
.areatag{font-family:var(--mono);font-size:8px;letter-spacing:.5px;text-transform:uppercase;padding:3px 8px;border-radius:20px;color:#0a0b10;font-weight:600;white-space:nowrap}
.post-x{background:none;border:1px solid var(--bm);color:var(--text-3);border-radius:7px;padding:5px 8px;font-size:10px;font-family:var(--mono);cursor:pointer;transition:all .15s}
.post-x:hover{border-color:var(--bs);color:var(--text)}
.post-x.danger:hover{border-color:var(--negative);color:var(--negative)}
.post-txt{font-size:13.5px;line-height:1.55;color:var(--text);margin:10px 0 4px;white-space:pre-wrap;word-break:break-word}
.post-foot{display:flex;align-items:center;gap:12px;margin-top:8px}
.reply-toggle{font-family:var(--mono);font-size:10px;color:var(--text-2);background:none;border:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.reply-toggle:hover{color:var(--offense)}
.thread{margin:12px 0 2px;padding-left:12px;border-left:2px solid var(--bm);display:flex;flex-direction:column;gap:10px}
.reply{display:flex;gap:9px}
.reply-b{flex:1;min-width:0}
.reply-n{font-weight:600;font-size:12px;display:flex;gap:6px;align-items:center}
.reply-t{font-size:12.5px;color:var(--text-2);line-height:1.45;margin-top:2px;white-space:pre-wrap;word-break:break-word}
.reply-time{font-family:var(--mono);font-size:8.5px;color:var(--text-3)}
.reply-form{display:flex;gap:8px;margin-top:4px}
.reply-form input{flex:1;background:var(--bg-panel);border:1px solid var(--bm);border-radius:8px;color:var(--text);font-family:var(--body);font-size:12.5px;padding:8px 11px;outline:none}
.reply-form input:focus{border-color:var(--offense)}

/* comentarios contextuales (tareas / jugadores) */
.cthread{margin-top:11px;padding-top:11px;border-top:1px dashed var(--bm);display:flex;flex-direction:column;gap:9px}
.cmt{display:flex;gap:8px}
.cmt-b{flex:1;min-width:0}
.cmt-n{font-weight:600;font-size:11.5px;display:flex;gap:6px;align-items:center}
.cmt-t{font-size:12px;color:var(--text-2);line-height:1.4;margin-top:2px;white-space:pre-wrap;word-break:break-word}
.cmt-x{background:none;border:none;color:var(--text-3);cursor:pointer;font-size:11px}
.cmt-x:hover{color:var(--negative)}

/* exercise grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.ex{background:var(--bg-raised);border:1px solid var(--bm);border-radius:13px;padding:14px;display:flex;flex-direction:column;gap:8px}
.ex-top{display:flex;align-items:flex-start;gap:8px}
.ex-t{font-family:var(--disp);font-weight:700;font-size:17px;line-height:1.1;flex:1}
.ex-x{background:none;border:1px solid var(--bm);color:var(--text-3);border-radius:7px;width:26px;height:26px;font-size:11px;cursor:pointer;flex-shrink:0;transition:all .15s}
.ex-x:hover{border-color:var(--negative);color:var(--negative)}
.ex-d{font-size:12px;color:var(--text-2);line-height:1.5}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.tag{font-family:var(--mono);font-size:8.5px;text-transform:uppercase;letter-spacing:.5px;padding:4px 9px;border-radius:20px;color:#0a0b10;font-weight:600;white-space:nowrap}
.tag.ghost{background:none;color:var(--text-3);border:1px solid var(--bm)}
.ex-by{font-family:var(--mono);font-size:9px;color:var(--text-3);margin-top:auto}

.mini{background:var(--bg-panel);border:1px solid var(--bm);color:var(--text-2);border-radius:7px;font-family:var(--mono);font-size:10px;padding:7px 11px;cursor:pointer;white-space:nowrap;transition:all .15s}
.mini:hover{border-color:var(--positive);color:var(--positive)}
.mini.danger:hover{border-color:var(--negative);color:var(--negative)}
.mini.neutral:hover{border-color:var(--bs);color:var(--text)}

/* ───────── COMPOSER NUEVA TAREA ───────── */
.ntask{background:linear-gradient(180deg,color-mix(in srgb,var(--offense) 7%,var(--bg-raised)),var(--bg-raised));border:1px solid var(--bm);border-radius:16px;overflow:hidden;margin-bottom:16px}
.ntask-h{display:flex;align-items:center;gap:9px;padding:13px 16px;border-bottom:1px solid var(--bm)}
.ntask-h .dotmark{width:8px;height:8px;border-radius:50%;background:var(--offense);box-shadow:0 0 0 4px color-mix(in srgb,var(--offense) 18%,transparent)}
.ntask-h h3{font-family:var(--disp);font-weight:800;font-size:16px;letter-spacing:.4px;text-transform:uppercase}
.ntask-h span{font-family:var(--mono);font-size:9.5px;color:var(--text-3);margin-left:auto}
.ntask-b{padding:16px}
.flabel{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3);margin-bottom:7px;display:block}
.field+.field{margin-top:14px}
.src-toggle{display:flex;gap:6px;background:var(--bg-panel);border:1px solid var(--bm);border-radius:10px;padding:4px}
.src-toggle button{flex:1;background:none;border:1px solid transparent;border-radius:7px;color:var(--text-2);font-family:var(--mono);font-size:11px;letter-spacing:.3px;padding:9px;cursor:pointer;transition:all .15s}
.src-toggle button.on{color:var(--offense);background:color-mix(in srgb,var(--offense) 13%,transparent);border-color:color-mix(in srgb,var(--offense) 38%,transparent)}
.exlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:9px;max-height:230px;overflow:auto;padding:2px}
.expick{text-align:left;background:var(--bg-panel);border:1px solid var(--bm);border-radius:11px;padding:11px 12px;cursor:pointer;transition:all .15s;display:flex;flex-direction:column;gap:6px}
.expick:hover{border-color:var(--bs)}
.expick.on{border-color:var(--offense);background:color-mix(in srgb,var(--offense) 9%,transparent);box-shadow:0 0 0 1px var(--offense) inset}
.expick-t{font-family:var(--disp);font-weight:700;font-size:15px;line-height:1.1}
.expick-tags{display:flex;gap:5px;flex-wrap:wrap}
.inp{background:var(--bg-panel);border:1px solid var(--bm);border-radius:9px;color:var(--text);font-family:var(--body);font-size:13.5px;padding:10px 12px;outline:none;width:100%;transition:border-color .15s}
.inp:focus{border-color:var(--offense)}
textarea.inp{resize:vertical;min-height:58px}
.two{display:flex;gap:12px;flex-wrap:wrap}
.two>.field{flex:1;min-width:150px;margin-top:0}
.whogrid{display:flex;gap:8px;flex-wrap:wrap}
.whochip{display:flex;align-items:center;gap:8px;background:var(--bg-panel);border:1px solid var(--bm);border-radius:30px;padding:5px 13px 5px 5px;cursor:pointer;transition:all .15s;user-select:none}
.whochip:hover{border-color:var(--bs)}
.whochip.on{border-color:var(--offense);background:color-mix(in srgb,var(--offense) 11%,transparent)}
.whochip .nm{font-size:12.5px;font-weight:600}
.whochip .ck{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--bm);display:flex;align-items:center;justify-content:center;font-size:9px;color:transparent;flex-shrink:0}
.whochip.on .ck{background:var(--offense);border-color:var(--offense);color:#fff}
.savelib{display:flex;align-items:center;gap:10px;margin-top:14px;background:var(--bg-panel);border:1px dashed var(--bm);border-radius:10px;padding:10px 13px;cursor:pointer}
.savelib .sw{width:38px;height:22px;border-radius:20px;background:var(--bg-hover);position:relative;flex-shrink:0;transition:background .15s}
.savelib .sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--text-3);transition:all .15s}
.savelib.on .sw{background:color-mix(in srgb,var(--offense) 60%,transparent)}
.savelib.on .sw::after{left:18px;background:#fff}
.savelib .sl{font-size:12.5px;color:var(--text-2)}.savelib .sl b{color:var(--text);font-weight:600}
.ntask-foot{display:flex;align-items:center;gap:12px;margin-top:16px;flex-wrap:wrap}
.btn-lg{padding:11px 22px;font-size:15px}

/* ───────── RESUMEN POR ASISTENTE ───────── */
.coachgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:11px;margin-bottom:6px}
.coach{display:flex;align-items:center;gap:13px;background:var(--bg-raised);border:1px solid var(--bm);border-radius:14px;padding:13px 15px}
.ring{--p:0;width:48px;height:48px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:conic-gradient(var(--positive) calc(var(--p)*1%),var(--bg-panel) 0);position:relative}
.ring::before{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--bg-raised)}
.ring b{position:relative;font-family:var(--disp);font-weight:800;font-size:14px;color:var(--text)}
.coach-id{flex:1;min-width:0}
.coach-n{font-weight:700;font-size:13.5px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.coach-s{font-family:var(--mono);font-size:9.5px;color:var(--text-3);margin-top:4px}
.coach-s .ok{color:var(--positive)}.coach-s .pn{color:var(--amber)}

/* ───────── FILAS DE TAREA ───────── */
.task{position:relative;background:var(--bg-raised);border:1px solid var(--bm);border-radius:13px;padding:13px 15px 13px 17px;margin-bottom:10px;overflow:hidden}
.task::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--amber)}
.task.done::before{background:var(--positive)}
.task.done{opacity:.66}
.task-main{display:flex;align-items:flex-start;gap:12px}
.task-av{flex-shrink:0}
.task-body{flex:1;min-width:0}
.task-t{font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;line-height:1.25}
.task-t.strike{text-decoration:line-through;text-decoration-color:var(--text-3)}
.task-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:7px}
.pill{font-family:var(--mono);font-size:9px;letter-spacing:.3px;padding:3px 9px;border-radius:20px;border:1px solid var(--bm);color:var(--text-2);white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.pill.who-p{border-color:var(--bm)}
.pill.due{color:var(--text-2)}
.pill.due.soon{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 40%,transparent)}
.pill.due.late{color:var(--negative);border-color:color-mix(in srgb,var(--negative) 40%,transparent)}
.task-note{font-size:12.5px;color:var(--text-2);margin-top:8px;line-height:1.5;background:var(--bg-panel);border-radius:9px;padding:8px 11px;border:1px solid var(--bl)}
.st{font-family:var(--mono);font-size:8.5px;letter-spacing:.5px;padding:4px 9px;border-radius:20px;text-transform:uppercase;white-space:nowrap;flex-shrink:0}
.st.pend{color:var(--amber);background:color-mix(in srgb,var(--amber) 12%,transparent);border:1px solid color-mix(in srgb,var(--amber) 38%,transparent)}
.st.hecha{color:var(--positive);background:color-mix(in srgb,var(--positive) 12%,transparent);border:1px solid color-mix(in srgb,var(--positive) 38%,transparent)}
.task-act{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.task-act .st{margin-right:2px}

/* plantel */
.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:11px}
.pl{display:flex;align-items:center;gap:12px;background:var(--bg-raised);border:1px solid var(--bm);border-radius:13px;padding:12px 13px}
.pl-num{width:40px;height:40px;border-radius:10px;background:var(--bg-panel);border:1px solid var(--bm);display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:900;font-size:19px;color:var(--offense);flex-shrink:0}
.pl-body{flex:1;min-width:0}
.pl-n{font-weight:600;font-size:14px;display:flex;align-items:center;gap:7px}
.pl-pos{font-family:var(--mono);font-size:9.5px;color:var(--text-2);text-transform:uppercase;letter-spacing:.4px;margin-top:2px}
.pl-x{background:none;border:1px solid var(--bm);color:var(--text-3);border-radius:7px;width:26px;height:26px;font-size:11px;cursor:pointer;flex-shrink:0;transition:all .15s}
.pl-x:hover{border-color:var(--negative);color:var(--negative)}

  function sparkline(vals){
    const w=104,h=28,n=vals.length||7,max=Math.max(1,...vals);let bars='';
    for(let i=0;i<n;i++){const v=vals[i]||0;const bh=Math.max(2,Math.round(v/max*(h-3)));const cw=w/n,bw=cw*0.62,x=i*cw+(cw-bw)/2,y=h-bh;
      bars+='<rect x="'+x.toFixed(1)+'" y="'+y+'" width="'+bw.toFixed(1)+'" height="'+bh+'" rx="1.5" fill="var(--defense)" opacity="'+(0.4+0.6*(v/max)).toFixed(2)+'"></rect>';}
    return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">'+bars+'</svg>';
  }

  // ════════ MOTOR DE CARGA (ACWR / monotonía / strain / readiness) ════════
  function readinessScore(r){if(!r)return null;const v=[];if(r.sueno)v.push(r.sueno);if(r.fatiga)v.push(r.fatiga);if(r.dolor)v.push(r.dolor);if(r.animo)v.push(r.animo);if(!v.length)return null;return Math.round(v.reduce((a,b)=>a+b,0)/v.length/5*100);}
  function computeFisico(pid){
    const rows=CARGAS.filter(c=>c.jugador_id===pid);
    const byDate={};rows.forEach(c=>{byDate[c.fecha]=(byDate[c.fecha]||0)+(c.carga||0);});
    // serie de 28 días (índice 0 = hace 27 días, 27 = hoy)
    const series=[];for(let i=27;i>=0;i--){const ds=daysAgoStr(i);series.push(byDate[ds]||0);}
    const last7=series.slice(21);          // últimos 7 días
    const prev7=series.slice(14,21);       // 7 días anteriores
    const acute=last7.reduce((a,b)=>a+b,0);
    const prev=prev7.reduce((a,b)=>a+b,0);
    const total28=series.reduce((a,b)=>a+b,0);
    const chronic=total28/4;               // promedio semanal de 4 semanas
    const acwr=chronic>0?acute/chronic:null;
    // monotonía: media/desvío de la carga diaria de los últimos 7 días
    const mean=acute/7;
    const sd=Math.sqrt(last7.reduce((a,b)=>a+(b-mean)*(b-mean),0)/7);
    const monotony=sd>0?mean/sd:(mean>0?3:0);
    const strain=Math.round(acute*monotony);
    const wow=prev>0?(acute-prev)/prev:null; // variación semana vs semana
    // distribución por tipo (últimos 7d)
    const dist={};rows.forEach(c=>{if(c.fecha>=daysAgoStr(6)){const t=c.tipo||'otro';dist[t]=(dist[t]||0)+(c.carga||0);}});
    // readiness (último registro)
    const rr=(READY[pid]||[])[0]||null;const rscore=readinessScore(rr);const rdias=rr?diasDesde(rr.fecha):null;
    // dispo
    const dp=DISPO[pid];const estado=dp?dp.estado:'sindato';
    // sesiones 7d
    const n7=rows.filter(c=>c.fecha>=daysAgoStr(6)).length;
    const rpe7=rows.filter(c=>c.fecha>=daysAgoStr(6)&&c.rpe!=null);
    const rpeAvg=rpe7.length?(rpe7.reduce((a,b)=>a+b.rpe,0)/rpe7.length):null;
    const last=rows[0]?rows[0].fecha:null;
    // banderas
    const flags=[];let level='green';
    function lift(l){const order={green:0,blue:1,amber:2,red:3};if(order[l]>order[level])level=l;}
    if(acwr!=null&&acute>0){
      if(acwr>1.5){flags.push({l:'red',i:'⚠',t:'<b>Pico de carga</b> — esta semana cargó muy por encima de su base (ACWR '+acwr.toFixed(2)+'). Zona de riesgo de lesión: conviene aflojar.'});lift('red');}
      else if(acwr>1.3){flags.push({l:'amber',i:'▲',t:'<b>Carga elevada</b> — viene subiendo fuerte (ACWR '+acwr.toFixed(2)+'). Vigilá la próxima sesión.'});lift('amber');}
      else if(acwr<0.8){flags.push({l:'blue',i:'▽',t:'<b>Carga baja</b> — está entrenando por debajo de su base (ACWR '+acwr.toFixed(2)+'). Puede ir sumando.'});lift('blue');}
    }
    if(monotony>2&&acute>0){flags.push({l:'amber',i:'≈',t:'<b>Entrenamiento monótono</b> — días muy parejos (monotonía '+monotony.toFixed(1)+'). Meté un día fácil y uno fuerte para variar.'});lift('amber');}
    if(wow!=null&&wow>0.6&&prev>0){flags.push({l:'amber',i:'↑',t:'<b>Salto semanal</b> — la carga subió '+Math.round(wow*100)+'% respecto a la semana pasada.'});lift('amber');}
    if(rscore!=null&&rscore<50&&rdias<=2){flags.push({l:'red',i:'🛌',t:'<b>Readiness bajo</b> ('+rscore+'/100, '+ultimaLabel(rdias)+') — durmió/recuperó mal. Ojo con exigirlo hoy.'});lift('red');}
    else if(rscore!=null&&rscore<65&&rdias<=2){flags.push({l:'amber',i:'🛌',t:'<b>Readiness justo</b> ('+rscore+'/100). Seguilo de cerca.'});lift('amber');}
    if(estado==='afuera'){flags.push({l:'red',i:'⛔',t:'<b>Marcado afuera</b> en disponibilidad.'});lift('red');}
    else if(estado==='limitado'){flags.push({l:'amber',i:'◐',t:'<b>Marcado limitado</b> en disponibilidad.'});lift('amber');}
    const plan=PLAN[pid];
    if(plan&&plan.objetivo&&acute>plan.objetivo*1.1){flags.push({l:'amber',i:'◎',t:'<b>Se pasó del plan</b> — objetivo '+plan.objetivo+' UA, lleva '+acute+'.'});lift('amber');}
    return {acute,prev,chronic:Math.round(chronic),acwr,monotony,strain,wow,series,last7,dist,n7,rpeAvg,last,rscore,rdias,estado,plan,flags,level};
  }

  // ── tareas ──
  function dueInfo(f){
    if(!f)return null;const d=diasDesde(f); // d>0 => fecha en el pasado
    if(d>0)return{cls:'late',label:'venció '+(d===1?'ayer':'hace '+d+'d')};
    if(d===0)return{cls:'soon',label:'vence hoy'};
    if(d===-1)return{cls:'soon',label:'vence mañana'};
    if(d>=-2)return{cls:'soon',label:'vence en '+Math.abs(d)+'d'};
    return{cls:'',label:'vence '+dParse(f).toLocaleDateString('es-UY',{day:'2-digit',month:'short'})};
  }

    let act='';
    if(opts.canToggle)act+=done?'<button class="mini neutral" onclick="toggleTask(\''+esc(t.id)+'\',\'pendiente\')">↺ Reabrir</button>':'<button class="mini" onclick="toggleTask(\''+esc(t.id)+'\',\'hecha\')">✓ Hecha</button>';

      '<div class="task-av">'+avatar(avName,'')+'</div>'+
      '<div class="task-body">'+
        '<div class="task-t'+(done?' strike':'')+'">'+esc(t.titulo)+'</div>'+
        '<div class="task-meta">'+pills.join('')+'</div>'+
        (t.nota?'<div class="task-note">'+esc(t.nota)+'</div>':'')+

      '</div>'+
      '<div class="task-act"><span class="st '+(done?'hecha':'pend')+'">'+(done?'hecha':'pendiente')+'</span>'+act+'</div>'+

  function metric(v,l,cls){return '<div class="metric '+(cls||'')+'"><div class="mv">'+v+'</div><div class="ml">'+l+'</div></div>';}
  function tableroView(){
    const data=PLAYERS.map(p=>({p,f:computeFisico(p.id)}));
    const conDatos=data.filter(d=>d.f.acute>0||d.f.rscore!=null||d.f.estado!=='sindato');
    const order={red:0,amber:1,blue:2,green:3};
    conDatos.sort((a,b)=>order[a.f.level]-order[b.f.level]||b.f.acute-a.f.acute);
    const reds=conDatos.filter(d=>d.f.level==='red').length, ambers=conDatos.filter(d=>d.f.level==='amber').length;
    let head='<div class="sec">Tablero de riesgo · esta semana</div>';
    head+='<div class="legend" style="margin:-4px 0 14px">'+
      (reds?'<b style="color:var(--negative)">'+reds+' en rojo</b> · ':'')+(ambers?'<b style="color:var(--amber)">'+ambers+' en amarillo</b> · ':'')+
      'El <b>ACWR</b> compara la carga de los últimos 7 días con tu base de 4 semanas. Verde 0,8–1,3 · ámbar 1,3–1,5 · rojo &gt;1,5.</div>';
    if(!conDatos.length)return head+'<div class="empty">Todavía no hay carga ni readiness registrados esta semana. Empezá en «Registrar sesión» o «Readiness diario».</div>';
    const cards=conDatos.map(({p,f})=>{
      const acwrCls=f.acwr==null?'':(f.acwr>1.5?'hot':f.acwr>1.3?'warm':f.acwr<0.8?'cool':'ok');
      const monoCls=f.monotony>2?'warm':'';
      const readyCls=f.rscore==null?'':(f.rscore<50?'hot':f.rscore<65?'warm':'ok');
      const badge={red:'Riesgo alto',amber:'Atención',blue:'Carga baja',green:'En zona'}[f.level];
      const distTotal=Object.values(f.dist).reduce((a,b)=>a+b,0);
      const dseg=TRABAJO.filter(t=>f.dist[t.k]);
      const distBar=distTotal?('<div class="distbar">'+dseg.map(t=>'<span style="width:'+(f.dist[t.k]/distTotal*100).toFixed(1)+'%;background:'+t.color+'"></span>').join('')+'</div>'+
        '<div class="tchips">'+dseg.map(t=>'<span class="tchip"><i style="background:'+t.color+'"></i>'+esc(t.label)+' '+Math.round(f.dist[t.k]/distTotal*100)+'%</span>').join('')+'</div>'):'<div class="muted">Sin trabajo etiquetado</div>';

  function readinessView(){
    const can=canReadiness();const today=todayStr();
    let form='';
    if(can){
      const sel='<select id="rd-jug">'+PLAYERS.map(p=>'<option value="'+esc(p.id)+'">'+(p.dorsal!=null?'#'+p.dorsal+' ':'')+esc(p.nombre)+'</option>').join('')+'</select>';

      form='<div class="sec">Check-in de hoy</div><div class="card"><div class="frm">'+
        '<div class="frm-row"><div class="fld"><label>Jugador</label>'+sel+'</div><div class="fld"><label>Fecha</label><input id="rd-fecha" type="date" value="'+today+'"></div></div>'+

        '<div class="frm-row">'+wf('Sueño','rd-sue',true)+wf('Energía','rd-fat',true)+wf('Sin dolor','rd-dol',true)+wf('Ánimo','rd-ani',true)+'</div>'+
        '<div class="cg-live-box" style="margin-top:2px"><div class="cg-live-l">Readiness estimado</div><div class="cg-live" id="rd-live" style="color:var(--positive)">—</div></div>'+
        '<div class="fld wide"><label>Nota (opcional)</label><input id="rd-nota" placeholder="Cómo amaneció, molestias, sueño…"></div>'+
        '<div class="frm-row" style="align-items:center"><button class="btn btn-primary" onclick="saveReady()">Guardar readiness</button><span class="msg" id="rd-msg"></span></div>'+
      '</div></div>';
    }
    // tablero readiness de hoy
    let panel='<div class="sec">Readiness del plantel</div>';
    const data=PLAYERS.map(p=>({p,arr:READY[p.id]||[]})).filter(d=>d.arr.length);
    if(!data.length)panel+='<div class="empty">Todavía no hay check-ins cargados. '+(can?'Cargá el primero arriba.':'Cuando el PF o el médico carguen, aparecen acá.')+'</div>';
    else panel+=data.map(({p,arr})=>{
      const last=arr[0];const sc=readinessScore(last);const dias=diasDesde(last.fecha);
      const col=sc==null?'var(--text-3)':(sc<50?'var(--negative)':sc<65?'var(--amber)':'var(--positive)');
      const series=[];for(let i=6;i>=0;i--){const ds=daysAgoStr(i);const r=arr.find(x=>x.fecha===ds);series.push(r?(readinessScore(r)||0):0);}
      const parts=[['Sueño',last.sueno],['Energía',last.fatiga],['Sin dolor',last.dolor],['Ánimo',last.animo]];
      return '<div class="risk r-'+(sc==null?'green':sc<50?'red':sc<65?'amber':'green')+'">'+
        '<div class="risk-h"><span class="pl-num" style="width:32px;height:32px;font-size:15px">'+(p.dorsal!=null?p.dorsal:'–')+'</span>'+
          '<div class="risk-id"><div class="risk-n">'+esc(p.nombre)+'</div><div class="risk-p">'+ultimaLabel(dias)+(last.nota?' · 📝':'')+'</div></div>'+
          '<span class="risk-badge" style="color:'+col+';border:1px solid '+col+'55;background:transparent"><b style="font-family:var(--disp);font-size:15px">'+(sc==null?'—':sc)+'</b> /100</span></div>'+
        '<div class="metrics" style="margin-bottom:0">'+parts.map(x=>metric(x[1]!=null?x[1]:'—',x[0],x[1]!=null?(x[1]>=4?'ok':x[1]<=2?'hot':'warm'):'')).join('')+'</div>'+
        (last.nota?'<div class="flag" style="margin-top:10px"><span class="fi">📝</span><span>'+esc(last.nota)+'</span></div>':'')+
        '<div class="risk-spark"><div class="spark-col"><div class="lcol-t">Readiness · 7 días</div>'+sparkline(series)+'<div class="spark-x"><span>-6</span><span>-3</span><span>hoy</span></div></div></div>'+
      '</div>';
    }).join('');
    return form+panel;
  }

    if(isNaN(rpe)&&isNaN(min))return err('Marcá el RPE o cargá los minutos.');
    const num=id=>{const v=parseInt($v(id)||'',10);return isNaN(v)?null:v;};
    const o={jugador_id:jid,fecha:$v('cg-fecha')||todayStr(),tipo:$v('cg-tipo')||'otro',rpe:isNaN(rpe)?null:rpe,minutos:isNaN(min)?null:min,sueno:num('cg-sue'),fatiga:num('cg-fat'),dolor:num('cg-dol'),animo:num('cg-ani'),nota:($v('cg-nota')||'').trim()||null};
    const btn=document.querySelector('.btn-primary');if(btn)btn.disabled=true;const r=await addCarga(o);if(btn)btn.disabled=false;
    if(r.error)return err('No se pudo registrar: '+r.error);
    if(msg){msg.textContent='✓ Sesión registrada.';msg.className='msg ok';}
    await loadCargas();paint();
  };
  window.removeCarga=async function(id){if(!confirm('¿Borrar este registro?'))return;await delCarga(id);await loadCargas();paint();};
  window.savePlan=async function(jid){
    const inp=$('pl-'+jid);const v=parseInt(inp&&inp.value||'',10);
    const r=await setPlan(jid,isNaN(v)?null:v);if(r&&r.error){alert('No se pudo guardar el plan: '+r.error);return;}
    await loadPlan();paint();
  };
  window.saveReady=async function(){
    const msg=$('rd-msg');function err(t){if(msg){msg.textContent=t;msg.className='msg err';}}
    const jid=$v('rd-jug')||'';if(!jid)return err('Elegí un jugador.');
    const num=id=>{const v=parseInt($v(id)||'',10);return isNaN(v)?null:v;};
    const vals=[num('rd-sue'),num('rd-fat'),num('rd-dol'),num('rd-ani')].filter(x=>x!=null);
    if(!vals.length)return err('Marcá al menos una escala.');
    const score=Math.round(vals.reduce((a,b)=>a+b,0)/vals.length/5*100);
    const o={jugador_id:jid,fecha:$v('rd-fecha')||todayStr(),sueno:num('rd-sue'),fatiga:num('rd-fat'),dolor:num('rd-dol'),animo:num('rd-ani'),score,nota:($v('rd-nota')||'').trim()||null};
    const btn=document.querySelector('.btn-primary');if(btn)btn.disabled=true;const r=await setReady(o);if(btn)btn.disabled=false;
    if(r.error)return err('No se pudo guardar: '+r.error);
    if(msg){msg.textContent='✓ Readiness guardado ('+score+'/100).';msg.className='msg ok';}
    await loadReady();paint();
  };

  // ── boot ──
  async function bootData(user){
    await loadMe(user);
    const valid=['feed','asignar','mias','club','biblioteca','jugadores','disponibilidad','fisico'];
    const h=(location.hash||'').replace('#','');
    if(valid.includes(h))TAB=h; else TAB='feed';
    await Promise.all([
      loadFeed(),loadComs(),loadExercises(),loadTasks(),
      ME.rol==='headcoach'?loadTeam():Promise.resolve(),
      loadPlayers(),loadDispo(),loadNotas(),loadCargas(),loadPlan(),loadReady()
    ]);
    paint();
  }
  function boot(){
    if(!sb){showGate();setMsg('No se pudo conectar al servidor. Recargá.','err');return;}
    showGate();
    sb.auth.getSession().then(({data})=>{if(data&&data.session){hideGate();bootData(data.session.user);}});
    sb.auth.onAuthStateChange((ev,session)=>{if(session){hideGate();bootData(session.user);}else showGate();});
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
})();
</script>
<script src="scoutpro-nav.js"></script>
</body>
</html>
