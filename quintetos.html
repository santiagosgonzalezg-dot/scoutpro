<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quintetos · Eficiencia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=DM+Mono:wght@400;500&family=Barlow+Condensed:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg-base:#08090d; --bg-raised:#0f1117; --bg-panel:#161820; --bg-hover:#1e202a; --bg-active:#252836;
  --border-subtle:rgba(255,255,255,0.05); --border-light:rgba(255,255,255,0.09); --border-strong:rgba(255,255,255,0.18);
  --offense:#f97316; --offense-bg:rgba(249,115,22,0.10); --offense-mid:rgba(249,115,22,0.22);
  --defense:#4f8ef7; --defense-bg:rgba(79,142,247,0.10); --defense-mid:rgba(79,142,247,0.22);
  --positive:#34c769; --positive-bg:rgba(52,199,105,0.10); --negative:#f05050; --negative-bg:rgba(240,80,80,0.10);
  --insight:#a78bfa; --insight-bg:rgba(167,139,250,0.10); --neutral:#9ca3b0; --neutral2:#555d6e;
  --text:#d8dce8; --text-2:#8891a0; --text-3:#434b5a; --text-4:#252c38;
  --font-ui:'DM Sans',system-ui,sans-serif; --font-mono:'DM Mono',monospace; --font-disp:'Barlow Condensed',sans-serif;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px;
  --r-sm:3px; --r:5px; --r-lg:8px;
  --t-fast:100ms ease; --t-base:150ms ease;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg-base);color:var(--text);font-family:var(--font-ui);font-size:13px;-webkit-font-smoothing:antialiased;min-height:100vh}
.mono{font-family:var(--font-mono)}
.disp{font-family:var(--font-disp)}

/* TOPBAR */
.topbar{display:flex;align-items:center;gap:var(--sp-3);padding:12px 20px;border-bottom:1px solid var(--border-light);background:var(--bg-raised);position:sticky;top:0;z-index:20}
.logo{font-family:var(--font-disp);font-weight:900;font-size:22px;letter-spacing:2px;line-height:1}
.logo .lo-q{color:var(--offense)}
.logo .lo-v{font-family:var(--font-mono);font-size:8px;color:var(--text-3);letter-spacing:2px;margin-left:6px;border:1px solid var(--border-light);border-radius:var(--r-sm);padding:2px 6px;vertical-align:middle}
.tb-spacer{flex:1}
.tb-meta{font-family:var(--font-mono);font-size:9px;color:var(--text-3);letter-spacing:1px;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.logo{cursor:pointer;flex-shrink:0}
.tb-home{background:var(--offense-bg);border:1px solid var(--offense-mid);border-radius:var(--r-sm);color:var(--offense);font-family:var(--font-mono);font-size:10px;letter-spacing:.5px;padding:7px 13px;cursor:pointer;transition:all var(--t-fast);display:inline-block;white-space:nowrap;flex-shrink:0}
.tb-home:hover{background:var(--offense-mid);color:#fff}
.tb-nav{background:var(--bg-panel);border:1px solid var(--border-light);border-radius:var(--r-sm);color:var(--text-2);font-family:var(--font-mono);font-size:10px;letter-spacing:.5px;padding:7px 12px;transition:all var(--t-fast);white-space:nowrap;text-decoration:none;display:inline-block;flex-shrink:0}
.tb-nav:hover{border-color:var(--text-2);color:var(--text)}
.tb-nav.stat:hover{border-color:var(--insight);color:var(--insight)}

.wrap{max-width:1280px;margin:0 auto;padding:20px}

/* LOAD BAR */
.loadbar{background:var(--bg-raised);border:1px solid var(--border-light);border-radius:var(--r-lg);padding:var(--sp-4);margin-bottom:var(--sp-4)}
.loadbar-row{display:flex;gap:var(--sp-3);align-items:flex-end;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:5px}
.field.grow{flex:1;min-width:200px}
.field label{font-family:var(--font-mono);font-size:8px;letter-spacing:1px;color:var(--text-3);text-transform:uppercase}
.field input{background:var(--bg-base);border:1px solid var(--border-light);border-radius:var(--r);padding:9px var(--sp-3);font-family:var(--font-mono);font-size:13px;color:var(--text);outline:none;transition:border-color var(--t-base);width:100%}
.field input:focus{border-color:var(--offense)}
.btn-go{background:var(--offense);color:#fff;border:none;border-radius:var(--r);padding:11px 22px;font-family:var(--font-disp);font-size:15px;font-weight:700;letter-spacing:1.5px;cursor:pointer;transition:filter var(--t-base);text-transform:uppercase;white-space:nowrap}
.btn-go:hover{filter:brightness(1.1)}
.btn-go:disabled{opacity:.5;cursor:wait}
.status{margin-top:10px;font-family:var(--font-mono);font-size:11px;display:none}
.status.show{display:block}
.status.err{color:var(--negative)} .status.ok{color:var(--positive)} .status.load{color:var(--text-2)}
.hint{font-family:var(--font-mono);font-size:10px;color:var(--text-3);margin-top:8px;line-height:1.6}

/* MATCH HEADER */
.matchcard{background:var(--bg-raised);border:1px solid var(--border-light);border-radius:var(--r-lg);padding:var(--sp-5);margin-bottom:var(--sp-4);display:none}
.matchcard.show{display:block}
.savebar{background:var(--bg-raised);border:1px solid var(--border-light);border-radius:var(--r-lg);padding:var(--sp-3) var(--sp-4);margin-bottom:var(--sp-4);display:none}
.savebar.show{display:block}
.savebar-row{display:flex;gap:var(--sp-3);align-items:flex-end;flex-wrap:wrap}
.sb-title{font-family:var(--font-disp);font-weight:700;font-size:14px;letter-spacing:.5px;color:var(--positive);align-self:center}
.savebar .field input{padding:7px 10px;font-size:12px}
.btn-save{background:var(--positive);color:#06210f;border:none;border-radius:var(--r);padding:9px 18px;font-family:var(--font-disp);font-weight:700;font-size:14px;letter-spacing:1px;cursor:pointer;text-transform:uppercase;white-space:nowrap}
.btn-save:hover{filter:brightness(1.08)}
.btn-save:disabled{opacity:.5;cursor:wait}
.save-status{font-family:var(--font-mono);font-size:10px;align-self:center}
.save-status.err{color:var(--negative)} .save-status.ok{color:var(--positive)} .save-status.load{color:var(--text-2)}
.mc-score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:var(--sp-4)}
.mc-team{display:flex;align-items:center;gap:var(--sp-3)}
.mc-team.t2{flex-direction:row-reverse;text-align:right}
.mc-badge{width:46px;height:46px;border-radius:var(--r);display:flex;align-items:center;justify-content:center;font-family:var(--font-disp);font-weight:800;font-size:18px;flex-shrink:0}
.mc-badge.t1{background:var(--offense-bg);color:var(--offense);border:1px solid var(--offense-mid)}
.mc-badge.t2{background:var(--defense-bg);color:var(--defense);border:1px solid var(--defense-mid)}
.mc-name{font-family:var(--font-disp);font-weight:800;font-size:24px;letter-spacing:.5px;line-height:1}
.mc-pts{font-family:var(--font-disp);font-weight:900;font-size:44px;line-height:1}
.mc-pts.t1{color:var(--offense)} .mc-pts.t2{color:var(--defense)}
.mc-vs{font-family:var(--font-mono);font-size:10px;color:var(--text-3);letter-spacing:2px}
.mc-quarters{display:flex;justify-content:center;gap:var(--sp-2);margin-top:var(--sp-4);flex-wrap:wrap}
.qchip{font-family:var(--font-mono);font-size:9px;color:var(--text-2);background:var(--bg-panel);border:1px solid var(--border-subtle);border-radius:var(--r-sm);padding:4px 10px}
.qchip b{color:var(--text);font-weight:500}

/* TABS */
.tabs{display:flex;gap:4px;margin-bottom:var(--sp-4);border-bottom:1px solid var(--border-light);display:none}
.tabs.show{display:flex}
.tab{background:none;border:none;border-bottom:2px solid transparent;color:var(--text-3);font-family:var(--font-disp);font-weight:700;font-size:15px;letter-spacing:1px;text-transform:uppercase;padding:9px 16px;cursor:pointer;transition:all var(--t-base);margin-bottom:-1px}
.tab:hover{color:var(--text-2)}
.tab.active{color:var(--offense);border-bottom-color:var(--offense)}
.view{display:none} .view.active{display:block}

.section-sep{font-family:var(--font-mono);font-size:8px;letter-spacing:2px;text-transform:uppercase;color:var(--text-3);margin:var(--sp-4) 0 var(--sp-3);display:flex;align-items:center;gap:var(--sp-3)}
.section-sep::after{content:'';flex:1;height:1px;background:var(--border-subtle)}

/* COMPARAR */
.cmp-grid{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:var(--sp-4);align-items:start}
@media(max-width:1000px){.cmp-grid{grid-template-columns:1fr}}
.picker{background:var(--bg-raised);border:1px solid var(--border-light);border-radius:var(--r-lg);padding:var(--sp-3);display:flex;flex-direction:column;gap:var(--sp-2);max-height:640px}
.picker-head{font-family:var(--font-disp);font-weight:700;font-size:14px;letter-spacing:.5px;padding-bottom:var(--sp-2);border-bottom:1px solid var(--border-subtle);display:flex;align-items:center;gap:var(--sp-2)}
.picker.t1 .picker-head{color:var(--offense)} .picker.t2 .picker-head{color:var(--defense)}
.picker-list{overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding-right:2px}
.lu-opt{background:var(--bg-panel);border:1px solid var(--border-subtle);border-radius:var(--r);padding:8px 10px;cursor:pointer;transition:all var(--t-fast)}
.lu-opt:hover{border-color:var(--border-strong);background:var(--bg-hover)}
.lu-opt.sel-1{border-color:var(--offense);background:var(--offense-bg)}
.lu-opt.sel-2{border-color:var(--defense);background:var(--defense-bg)}
.lu-opt-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.lu-mins{font-family:var(--font-mono);font-size:9px;color:var(--text-2)}
.lu-plusminus{font-family:var(--font-disp);font-weight:800;font-size:15px}
.lu-players{display:flex;flex-wrap:wrap;gap:3px}
.pchip{font-family:var(--font-mono);font-size:9px;color:var(--text);background:var(--bg-base);border:1px solid var(--border-subtle);border-radius:var(--r-sm);padding:2px 6px 2px 3px;display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.pchip .pn{font-family:var(--font-mono);font-size:8px;font-weight:500;color:#000;border-radius:2px;padding:0 3px}
.picker.t1 .pchip .pn{background:var(--offense)} .picker.t2 .pchip .pn{background:var(--defense)}

.cmp-center{background:var(--bg-raised);border:1px solid var(--border-light);border-radius:var(--r-lg);padding:var(--sp-4)}
.radar-wrap{display:flex;justify-content:center;margin-bottom:var(--sp-3)}
.cmp-h2h{width:100%;border-collapse:collapse;margin-top:var(--sp-2)}
.cmp-h2h td{padding:6px var(--sp-2);font-family:var(--font-mono);font-size:11px;border-bottom:1px solid var(--border-subtle)}
.cmp-h2h .h2h-lbl{text-align:center;color:var(--text-3);font-size:8px;letter-spacing:1px;text-transform:uppercase}
.cmp-h2h .h2h-a{text-align:right;color:var(--offense);font-family:var(--font-disp);font-weight:800;font-size:16px}
.cmp-h2h .h2h-b{text-align:left;color:var(--defense);font-family:var(--font-disp);font-weight:800;font-size:16px}
.cmp-h2h .win{filter:brightness(1.25)} .cmp-h2h .dim{opacity:.45}
.bars{display:flex;flex-direction:column;gap:7px;margin-top:var(--sp-3)}
.bar-row{display:grid;grid-template-columns:34px 1fr 56px 1fr 34px;align-items:center;gap:6px}
.bar-row .blbl{font-family:var(--font-mono);font-size:7px;color:var(--text-3);text-transform:uppercase;text-align:center;letter-spacing:.5px}
.bar-row .bnum{font-family:var(--font-mono);font-size:10px;color:var(--text-2)}
.bar-track{height:8px;background:var(--bg-panel);border-radius:2px;overflow:hidden;display:flex}
.bar-track.a{justify-content:flex-end} .bar-fill{height:100%;border-radius:2px}
.bar-fill.a{background:var(--offense)} .bar-fill.b{background:var(--defense)}

/* POR CUARTO */
.qtabs{display:flex;gap:5px;margin-bottom:var(--sp-3)}
.qtab{background:var(--bg-panel);border:1px solid var(--border-subtle);border-radius:var(--r-sm);color:var(--text-3);font-family:var(--font-mono);font-size:10px;padding:5px 13px;cursor:pointer;transition:all var(--t-fast)}
.qtab.active{border-color:var(--offense);color:var(--offense);background:var(--offense-bg)}
.qcols{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3)}
@media(max-width:820px){.qcols{grid-template-columns:1fr}}
.qcol-head{font-family:var(--font-disp);font-weight:700;font-size:15px;letter-spacing:.5px;margin-bottom:var(--sp-2);padding-bottom:5px;border-bottom:1px solid var(--border-subtle)}
.qcol.t1 .qcol-head{color:var(--offense)} .qcol.t2 .qcol-head{color:var(--defense)}
.lcard{background:var(--bg-raised);border:1px solid var(--border-subtle);border-left-width:3px;border-radius:var(--r);padding:var(--sp-3);margin-bottom:var(--sp-2)}
.lcard.t1{border-left-color:var(--offense)} .lcard.t2{border-left-color:var(--defense)}
.lcard-meta{display:flex;justify-content:space-between;align-items:center;font-family:var(--font-mono);font-size:9px;color:var(--text-3);margin-bottom:7px}
.wb{color:var(--negative);font-weight:500}
.lcard-players{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.sgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;margin-bottom:8px}
.scell{background:var(--bg-panel);border-radius:var(--r-sm);padding:5px 2px;text-align:center}
.scell.zero{opacity:.35}
.scell .sv{font-family:var(--font-disp);font-weight:800;font-size:15px;line-height:1}
.scell.hi .sv{color:var(--offense)}
.scell .sk{font-family:var(--font-mono);font-size:6px;color:var(--text-3);letter-spacing:.5px;margin-top:2px;text-transform:uppercase}
.diffbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-family:var(--font-mono);font-size:9px;color:var(--text-3);padding-top:7px;border-top:1px solid var(--border-subtle)}
.diffbar .dv{font-family:var(--font-disp);font-weight:800;font-size:15px;color:var(--text)}
.diffbar .dv.rec{color:var(--defense)} .diffbar .dv.ann{color:var(--offense)}

/* CONSOLIDADO */
.board{background:var(--bg-raised);border:1px solid var(--border-light);border-radius:var(--r-lg);overflow:hidden;margin-bottom:var(--sp-4)}
.board-title{font-family:var(--font-disp);font-weight:700;font-size:15px;letter-spacing:.5px;padding:var(--sp-3) var(--sp-4);border-bottom:1px solid var(--border-subtle)}
.board.t1 .board-title{color:var(--offense)} .board.t2 .board-title{color:var(--defense)}
.btbl{width:100%;border-collapse:collapse}
.btbl thead tr{background:var(--bg-panel)}
.btbl th{font-family:var(--font-mono);font-size:8px;letter-spacing:.8px;color:var(--text-2);padding:10px var(--sp-2);text-align:right;text-transform:uppercase;border-bottom:1px solid var(--border-light);font-weight:500;white-space:nowrap}
.btbl th:nth-child(1),.btbl th:nth-child(2),.btbl th:nth-child(3){text-align:left}
.btbl th.sortable{cursor:pointer;user-select:none;transition:color var(--t-fast)}
.btbl th.sortable:hover{color:var(--text)}
.btbl th.sorted{color:var(--offense)}
.btbl th .arr{font-size:8px;margin-left:1px}
.btbl td{padding:7px var(--sp-2);border-bottom:1px solid var(--border-subtle);font-family:var(--font-mono);font-size:10px;text-align:right;white-space:nowrap}
.btbl td:nth-child(1),.btbl td:nth-child(2),.btbl td:nth-child(3){text-align:left}
.btbl td.col-active{color:var(--text);background:rgba(249,115,22,0.05)}
.btbl th.sorted{background:rgba(249,115,22,0.07)}
.btbl tr:hover td{background:var(--bg-hover)}
.btbl .qn{color:var(--text-3)}
.sorthint{font-family:var(--font-mono);font-size:9px;color:var(--text-3);margin-right:auto;align-self:center}
.bq{font-family:var(--font-mono);font-size:7px;color:var(--text-2);background:var(--bg-panel);border-radius:2px;padding:1px 4px;margin-right:2px}
.toolbar{display:flex;justify-content:flex-end;gap:var(--sp-2);margin-bottom:var(--sp-3)}
.btn{background:var(--bg-panel);border:1px solid var(--border-light);border-radius:var(--r-sm);color:var(--text-2);font-family:var(--font-mono);font-size:10px;padding:6px 12px;cursor:pointer;transition:all var(--t-fast)}
.btn:hover{border-color:var(--offense);color:var(--offense)}
.empty{text-align:center;color:var(--text-3);font-family:var(--font-mono);font-size:11px;padding:40px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="topbar">
  <div class="logo" onclick="goHome()" title="Volver al inicio"><span class="lo-q">QUINTETOS</span><span class="lo-v">FIBA · v2</span></div>
  <button class="tb-home" id="homeBtn" onclick="goHome()">↩ Volver al inicio</button>
  <div class="tb-spacer"></div>
  <div class="tb-meta" id="tbMeta"></div>
  <a class="tb-nav stat" href="estadistico.html">📊 Estadístico</a>
  <a class="tb-nav" href="defensa.html">🛡 Defensa</a>
  <a class="tb-nav" href="index.html">🏠 Menú</a>
</div>

<div class="wrap">
  <div class="loadbar">
    <div class="loadbar-row">
      <div class="field grow">
        <label>Número o link del partido</label>
        <input id="matchId" placeholder="2853460" value="">
      </div>
      <div class="field grow">
        <label>Proxy</label>
        <input id="proxyUrl" value="https://jqudeomgafqilqmqcqzg.supabase.co/functions/v1/fibaproxy">
      </div>
      <button class="btn-go" id="goBtn" onclick="loadMatch()">Cargar partido</button>
    </div>
    <div class="status" id="status"></div>
    <div class="hint">Pegá el número del partido (o el link entero) y tocá «Cargar partido». Arma los quintetos solo, sin Excel.</div>
  </div>

  <div class="matchcard" id="matchcard"></div>

  <div class="savebar" id="savebar">
    <div class="savebar-row">
      <div class="sb-title">Guardar en base</div>
      <div class="field"><label>Fecha</label><input id="mFecha" type="date"></div>
      <div class="field"><label>Fase</label><input id="mFase" placeholder="Liga / Playoff"></div>
      <div class="field"><label>Jornada</label><input id="mJornada" placeholder="Fecha 12"></div>
      <button class="btn-save" id="saveBtn" onclick="saveMatch()">↑ Guardar partido</button>
      <span style="width:1px;height:30px;background:var(--border-light);margin:0 4px"></span>
      <div class="field"><label>Informe de</label><select id="pgTeam" style="background:var(--bg-base);border:1px solid var(--border-light);border-radius:var(--r);padding:9px var(--sp-3);font-family:var(--font-mono);font-size:12px;color:var(--text);outline:none"></select></div>
      <button class="btn-save" id="pgBtn" onclick="postGameReport()" style="background:var(--bg-panel);border:1px solid var(--offense-mid);color:var(--offense)">📄 Informe post-partido</button>
      <div class="save-status" id="saveStatus"></div>
    </div>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab active" data-v="cmp" onclick="switchView('cmp')">Comparar</button>
    <button class="tab" data-v="cuarto" onclick="switchView('cuarto')">Por cuarto</button>
    <button class="tab" data-v="cons" onclick="switchView('cons')">Consolidado</button>
  </div>

  <div class="view active" id="view-cmp"></div>
  <div class="view" id="view-cuarto"></div>
  <div class="view" id="view-cons"></div>
</div>

<script>
// ════════════════════════════════════════════════════════════════
//  ESTADO
// ════════════════════════════════════════════════════════════════
const S={data:null,teams:{1:{name:'',players:{}},2:{name:'',players:{}}},pool:{},nameByPid:{},events:{},periods:[],starters:{1:{},2:{}},results:null,cmpSel:{1:null,2:null}};

// ════════════════════════════════════════════════════════════════
//  HELPERS DE IDENTIDAD
// ════════════════════════════════════════════════════════════════
function normName(n){return String(n||'').toLowerCase().replace(/[\s.,]/g,'');}
function makePid(num,name){return num+'|'+normName(name);}
function emptyStats(){return{ast:0,rob:0,per:0,pt2conv:0,pt2fail:0,pt3conv:0,pt3fail:0,tlconv:0,tlfail:0,rebOff:0,rebDef:0,oppPt2conv:0,oppPt3conv:0,oppPt2fail:0,oppPt3fail:0,oppTlconv:0,oppTlfail:0,oppRebOff:0,oppPer:0};}

// ════════════════════════════════════════════════════════════════
//  CONVERSIÓN FIBA JSON  ->  eventos internos
// ════════════════════════════════════════════════════════════════
function mapFibaType(e){
  const a=e.actionType;
  if(a==='substitution')return e.subType==='out'?'subOut':e.subType==='in'?'subIn':'other';
  if(a==='assist')return 'ast';
  if(a==='steal')return 'rob';
  if(a==='turnover')return 'per';
  if(a==='2pt')return e.success?'pt2conv':'pt2fail';
  if(a==='3pt')return e.success?'pt3conv':'pt3fail';
  if(a==='freethrow')return e.success?'tlconv':'tlfail';
  if(a==='rebound')return e.subType==='offensive'?'rebOff':e.subType==='defensive'?'rebDef':'other';
  return 'other';
}

function ingest(data){
  S.data=data;
  S.teams={1:{name:'',players:{}},2:{name:'',players:{}}};
  S.pool={};S.nameByPid={};S.events={};S.periods=[];S.starters={1:{},2:{}};S.cmpSel={1:null,2:null};
  const q1starters={1:[],2:[]};

  for(const t of [1,2]){
    const tm=data.tm[String(t)];
    if(!tm)throw new Error('Faltan datos del equipo '+t);
    S.teams[t].name=tm.name||('Equipo '+t);
    S.teams[t].byNum={};
    const pl=tm.pl||{};
    for(const pno of Object.keys(pl)){
      const p=pl[pno];
      const num=String(p.shirtNumber||'').trim();
      const name=p.name||p.scoreboardName||((p.firstNameInitial?p.firstNameInitial+'. ':'')+(p.familyName||''));
      const pid=makePid(num,name);
      const rec={num,name,pid};
      S.teams[t].players[pid]=rec;
      if(num)S.teams[t].byNum[num]=rec;
      S.pool[pid]=rec;
      S.nameByPid[pid]=rec;
      if(p.starter===1||p.starter==='1')q1starters[t].push(rec);
    }
  }

  // Agrupar pbp por período (el pbp viene en orden inverso: lo damos vuelta)
  const byPeriod={};
  for(const e of (data.pbp||[])){
    const per=e.period||1;
    (byPeriod[per]=byPeriod[per]||[]).push(e);
  }
  S.periods=Object.keys(byPeriod).map(Number).sort((a,b)=>a-b);

  for(const per of S.periods){
    const chrono=byPeriod[per].slice().reverse(); // de inicio a fin del período
    const evs=[];
    for(const e of chrono){
      const type=mapFibaType(e);
      const num=String(e.shirtNumber||'').trim();
      const rawName=e.player||'';
      if(!num && !rawName){
        // Rebote de equipo (sin jugador): lo dejamos para sumarlo al quinteto en cancha
        if(e.actionType==='rebound' && (e.tno===1||e.tno===2) && (type==='rebOff'||type==='rebDef')){
          evs.push({time:'P'+per+' '+(e.gt||'00:00'),type,num:'',name:'',pid:'',teamReb:e.tno,action:'rebound'});
        }
        continue;            // otros eventos de sistema se descartan
      }
      // Resolver al jugador canónico por equipo (tno) + dorsal, así el pid
      // siempre coincide con el plantel aunque el nombre venga en mayúsculas.
      let pid,name;
      const t=e.tno;
      const canon=(t===1||t===2)&&num?S.teams[t].byNum[num]:null;
      if(canon){pid=canon.pid;name=canon.name;}
      else{pid=makePid(num,rawName);name=(S.nameByPid[pid]&&S.nameByPid[pid].name)||rawName;}
      evs.push({time:'P'+per+' '+(e.gt||'00:00'),type,num,name,pid,action:e.actionType});
    }
    S.events[per]=evs;
  }

  // Titulares: P inicial = starter flags; resto = último quinteto del período anterior
  const pids1=new Set(Object.keys(S.teams[1].players));
  const pids2=new Set(Object.keys(S.teams[2].players));
  if(!S.periods.length)throw new Error('El partido no tiene jugada por jugada.');

  S.starters[1][S.periods[0]]=q1starters[1].length?q1starters[1]:fallbackStarters(1);
  S.starters[2][S.periods[0]]=q1starters[2].length?q1starters[2]:fallbackStarters(2);
  for(let i=1;i<S.periods.length;i++){
    const prev=S.periods[i-1],cur=S.periods[i];
    const len=periodStart(prev);
    const s1=buildLineups(S.events[prev],S.starters[1][prev],pids1,pids2,prev,len,1);
    const s2=buildLineups(S.events[prev],S.starters[2][prev],pids2,pids1,prev,len,2);
    S.starters[1][cur]=s1[s1.length-1].players;
    S.starters[2][cur]=s2[s2.length-1].players;
  }

  // Procesar todos los períodos
  const results={};
  for(const q of S.periods){
    const len=periodStart(q);
    results[q]={
      lineups1:buildLineups(S.events[q],S.starters[1][q],pids1,pids2,q,len,1),
      lineups2:buildLineups(S.events[q],S.starters[2][q],pids2,pids1,q,len,2)
    };
  }
  S.results=results;
}

function fallbackStarters(t){
  // Si no hay flags de titular, tomamos los 5 con más minutos jugados
  const tm=S.data.tm[String(t)];const pl=tm.pl||{};
  const arr=Object.keys(pl).map(pno=>{
    const p=pl[pno];const num=String(p.shirtNumber||'').trim();
    const name=p.name||p.scoreboardName||'';
    const mins=parseFloat(String(p.sMinutes||'0').replace(':','.'))||0;
    return {num,name,pid:makePid(num,name),mins};
  }).sort((a,b)=>b.mins-a.mins).slice(0,5);
  return arr.map(r=>({num:r.num,name:r.name,pid:r.pid}));
}

function periodStart(per){
  const data=S.data||{};
  if(per>(data.periodsMax||4))return (data.periodLengthOVERTIME||5);
  return (data.periodLengthREGULAR||10);
}

// ════════════════════════════════════════════════════════════════
//  MOTOR DE QUINTETOS  (lógica original, reutilizada)
// ════════════════════════════════════════════════════════════════
function buildLineups(events,starters,myPids,oppPids,quarter,startMin,myTeamNo){
  startMin=startMin||10;
  const startLabel=String(startMin).padStart(2,'0')+':00';
  let currentMap=new Map();
  for(const p of starters)currentMap.set(p.pid,{num:p.num,name:p.name,pid:p.pid});

  const segs=[];
  let segStart='P'+quarter+' '+startLabel;
  let segStats=emptyStats();
  const pendingQueue=[];
  const currentArr=()=>Array.from(currentMap.values());
  const isOnCourt=(ev)=>currentMap.has(ev.pid)||!!findFuzzy(ev,currentArr());
  const resolveOutPid=(outEv)=>{if(currentMap.has(outEv.pid))return outEv.pid;const f=findFuzzy(outEv,currentArr());return f?f.pid:null;};

  for(const ev of events){
    if(ev.teamReb){
      // Rebote de equipo: lo suma el quinteto propio que está en cancha
      if(ev.teamReb===myTeamNo){ if(ev.type in segStats)segStats[ev.type]++; }
      else if(ev.type==='rebOff'){ segStats.oppRebOff++; }
      continue;
    }
    const isMine=myPids.has(ev.pid);
    const isOpp=oppPids.has(ev.pid);
    const onCourt=isOnCourt(ev);

    if(ev.type==='subOut'){
      if(isMine||(onCourt&&!isOpp))pendingQueue.push({ev});
    }
    else if(ev.type==='subIn'){
      if(isOpp)continue;
      if(!pendingQueue.length){
        if(currentMap.has(ev.pid))continue;
        if(currentMap.size>=5){
          const arr=currentArr();
          const victim=arr.find(p=>!myPids.has(p.pid))||arr[arr.length-1];
          segs.push({startTime:segStart,endTime:ev.time,players:currentArr(),subOut:victim,subIn:ev,stats:{...segStats}});
          currentMap.delete(victim.pid);
          currentMap.set(ev.pid,{num:ev.num,name:ev.name,pid:ev.pid});
          segStart=ev.time;segStats=emptyStats();
        } else {
          currentMap.set(ev.pid,{num:ev.num,name:ev.name,pid:ev.pid});
        }
        continue;
      }
      let matchIdx=-1;
      for(let i=0;i<pendingQueue.length;i++){if(resolveOutPid(pendingQueue[i].ev)!==null){matchIdx=i;break;}}
      if(matchIdx===-1)continue;
      const {ev:outEv}=pendingQueue.splice(matchIdx,1)[0];
      const outPid=resolveOutPid(outEv);
      if(currentMap.has(ev.pid)&&ev.pid!==outPid)continue;
      segs.push({startTime:segStart,endTime:ev.time,players:currentArr(),subOut:outEv,subIn:ev,stats:{...segStats}});
      currentMap.delete(outPid);
      if(!currentMap.has(ev.pid))currentMap.set(ev.pid,{num:ev.num,name:ev.name,pid:ev.pid});
      segStart=ev.time;segStats=emptyStats();
    }
    else if(ev.type!=='other'){
      if((isMine||onCourt)&&!isOpp){if(ev.type in segStats)segStats[ev.type]++;}
      if(isOpp){
        if(ev.type==='pt2conv')segStats.oppPt2conv++;
        if(ev.type==='pt3conv')segStats.oppPt3conv++;
        if(ev.type==='pt2fail')segStats.oppPt2fail++;
        if(ev.type==='pt3fail')segStats.oppPt3fail++;
        if(ev.type==='tlconv')segStats.oppTlconv++;
        if(ev.type==='tlfail')segStats.oppTlfail++;
        if(ev.type==='rebOff')segStats.oppRebOff++;
        if(ev.type==='per')segStats.oppPer++;
      }
    }
  }
  segs.push({startTime:segStart,endTime:'P'+quarter+' 00:00',players:currentArr(),subOut:null,subIn:null,stats:{...segStats}});
  return segs;
}
function findFuzzy(ev,arr){return arr.find(p=>fuzzyMatch(p,ev))||null;}
function fuzzyMatch(p,ev){
  if(p.num&&ev.num&&p.num===ev.num)return true;
  const pn=normName(p.name),en=normName(ev.name);
  if(pn===en)return true;
  if(pn.length>=5&&en.length>=5&&pn.slice(-5)===en.slice(-5))return true;
  return false;
}

// ════════════════════════════════════════════════════════════════
function parseTime(t){const m=t.match(/P(\d+)\s+(\d{1,2}):(\d{2})/);if(!m)return 0;return parseInt(m[2])+parseInt(m[3])/60;}
function segMinutes(seg){const d=parseTime(seg.startTime)-parseTime(seg.endTime);return d<0?0:d;}
function fmtMins(m){const mins=Math.floor(m);const secs=Math.round((m-mins)*60);return mins+"'"+String(secs).padStart(2,'0')+'"';}
function estPosProp(s){
  const fga=(s.pt2conv+s.pt2fail)+(s.pt3conv+s.pt3fail);
  const fta=(s.tlconv||0)+(s.tlfail||0);
  return Math.max(0, fga - (s.rebOff||0) + (s.per||0) + 0.44*fta);
}
function estPosRival(s){
  const oppFga=(s.oppPt2conv+s.oppPt2fail)+(s.oppPt3conv+s.oppPt3fail);
  const oppFta=(s.oppTlconv||0)+(s.oppTlfail||0);
  return Math.max(0, oppFga - (s.oppRebOff||0) + (s.oppPer||0) + 0.44*oppFta);
}

function buildConsolidatedData(res){
  const acc={1:{},2:{}};
  for(const q of Object.keys(res)){
    const process=(lineups,team)=>{
      for(const seg of lineups){
        const key=seg.players.map(p=>p.pid).sort().join('||');
        const mins=segMinutes(seg);
        if(!acc[team][key])acc[team][key]={players:seg.players,totalMins:0,count:0,stats:emptyStats(),quarters:[]};
        acc[team][key].totalMins+=mins;acc[team][key].count++;
        if(!acc[team][key].quarters.includes(q))acc[team][key].quarters.push(q);
        for(const k of Object.keys(seg.stats))acc[team][key].stats[k]+=seg.stats[k];
      }
    };
    process(res[q].lineups1,1);process(res[q].lineups2,2);
  }
  return acc;
}

function calcMetrics(r){
  const s=r.stats;
  const ptsA=s.pt2conv*2+s.pt3conv*3+(s.tlconv||0);
  const ptsR=(s.oppPt2conv||0)*2+(s.oppPt3conv||0)*3+(s.oppTlconv||0);
  const posProp=estPosProp(s)||1, posRiv=estPosRival(s)||1;
  const efOff=Math.round(ptsA/posProp*100);
  const efDefRaw=Math.round(ptsR/posRiv*100);
  return{ptsA,ptsR,diff:ptsA-ptsR,efOff,efDef:Math.max(0,100-efDefRaw),efDefRaw,
    posProp,posRiv,mins:r.totalMins||0,
    ast:s.ast||0,rob:s.rob||0,per:s.per||0,rebOff:s.rebOff||0,rebDef:s.rebDef||0,
    pt2c:s.pt2conv,pt2i:s.pt2conv+s.pt2fail,pt3c:s.pt3conv,pt3i:s.pt3conv+s.pt3fail,
    tlc:(s.tlconv||0),tli:(s.tlconv||0)+(s.tlfail||0),raw:s};
}

function parseMinStr(m){

  if(typeof m==='number')return m;

  if(mm)return parseInt(mm[1])+parseInt(mm[2])/60;
  return parseFloat(m)||0;
}
function buildPlayerRows(matchId,fecha,fase,jornada){

    for(const pno of Object.keys(pl)){
      const p=pl[pno];const num=String(p.shirtNumber||'').trim();if(!num)continue;
      const g=(...ks)=>{for(const k of ks){if(p[k]!=null&&p[k]!=='')return Math.round(+p[k]||0);}return 0;};
      rows.push({match_id:matchId,fecha,fase,jornada,
        equipo:S.teams[team].name,rival,es_local:team===1,
        num,nombre:p.name||p.scoreboardName||'',
        min:+parseMinStr(p.sMinutes).toFixed(2),
        pts:g('sPoints'),ast:g('sAssists'),rob:g('sSteals'),tap:g('sBlocks'),per:g('sTurnovers'),
        ro:g('sReboundsOffensive'),rd:g('sReboundsDefensive'),reb:g('sReboundsTotal'),
        fgm:g('sFieldGoalsMade'),fga:g('sFieldGoalsAttempted'),
        tpm:g('sThreePointersMade'),tpa:g('sThreePointersAttempted'),
        ftm:g('sFreeThrowsMade'),fta:g('sFreeThrowsAttempted'),
        faltas:g('sFoulsPersonal','sFoulsTotal','sFouls'),
        mas_menos:g('sPlusMinusPoints','sPlusMinus'),
        ef:g('sEfficiency','eff','sEff')});
    }
  }
  return rows;
}
function computeTramos(){
  // Reconstruye, por equipo y en orden cronológico, el tramo de posesión (1/2/3) de cada tiro
  const result={'1':[], '2':[]};
  const byPer={};
  for(const e of (S.data.pbp||[])){const p=e.period||1;(byPer[p]=byPer[p]||[]).push(e);}
  const toSec=gt=>{const m=String(gt||'').match(/(\d+):(\d+)/);return m?(+m[1]*60+ +m[2]):null;};
  const perLen=p=>p<=4?600:300; // 10' por cuarto, 5' suplementario (FIBA)
  for(const p of Object.keys(byPer).map(Number).sort((a,b)=>a-b)){
    const evs=byPer[p].slice().reverse(); // a cronológico
    const lastGain={'1':perLen(p),'2':perLen(p)};
    for(const e of evs){
      const sec=toSec(e.gt);if(sec==null)continue;

      const opp=t==='1'?'2':'1';

      if(at==='2pt'||at==='3pt'){
        const used=Math.max(0,Math.min(24,lastGain[t]-sec));

        const made=(e.success===1||e.success===true);
        result[t].push({num:String(e.shirtNumber||'').trim(),made:!!made,type:at,tramo});
        if(made)lastGain[opp]=sec; // canasta -> rival saca
        continue;
      }
      if(at==='rebound'){lastGain[t]=sec;continue;}   // def: gana posesión · of: reinicia reloj
      if(at==='steal'){lastGain[t]=sec;continue;}
      if(at==='turnover'){lastGain[opp]=sec;continue;}
      if(at==='freethrow'){if(e.success===1||e.success===true)lastGain[opp]=sec;continue;}
    }
  }

}

function buildShotRows(matchId,fecha,fase,jornada){

      else made=/made|scored|conv/i.test(String(sh.subType||sh.result||''));
      made=!!made;
      const at=String(sh.actionType||sh.subType||'');
      const tipo=(at.includes('3')||+sh.points===3||+sh.pts===3)?'3pt':'2pt';
      const num=String(sh.shirtNumber||sh.p||'').trim();
      // emparejar con el tramo (mismo dorsal + resultado + tipo, en orden)
      let tramo=null;

    }
  }
  return rows;
}

function renderCmpCenter(a,b){
  const radar=buildRadar(a,b);
  const h2h=[
    ['MIN',fmtMins(a.mins),fmtMins(b.mins),null],
    ['+/-',(a.diff>0?'+':'')+a.diff,(b.diff>0?'+':'')+b.diff,'max',a.diff,b.diff],
    ['PTS A FAVOR',a.ptsA,b.ptsA,'max',a.ptsA,b.ptsA],
    ['PTS EN CONTRA',a.ptsR,b.ptsR,'min',a.ptsR,b.ptsR],
    ['EF. OFENSIVA',(a.efOff/100).toFixed(2),(b.efOff/100).toFixed(2),'max',a.efOff,b.efOff],
    ['EF. DEFENSIVA',(a.efDefRaw/100).toFixed(2),(b.efDefRaw/100).toFixed(2),'min',a.efDefRaw,b.efDefRaw],
  ];
  const rows=h2h.map(r=>{
    let ca='',cb='';
    if(r[3]==='max'){if(r[4]>r[5]){ca='win';cb='dim'}else if(r[5]>r[4]){cb='win';ca='dim'}}
    if(r[3]==='min'){if(r[4]<r[5]){ca='win';cb='dim'}else if(r[5]<r[4]){cb='win';ca='dim'}}
    return '<tr><td class="h2h-a '+ca+'">'+r[1]+'</td><td class="h2h-lbl">'+r[0]+'</td><td class="h2h-b '+cb+'">'+r[2]+'</td></tr>';
  }).join('');
  const bars=buildBars(a,b);
  return '<div class="radar-wrap">'+radar+'</div>'+
    '<table class="cmp-h2h"><tbody>'+rows+'</tbody></table>'+
    '<div class="section-sep">Conteo directo</div>'+
    '<div class="bars">'+bars+'</div>';
}

function buildBars(a,b){
  const rows=[
    ['PT2',a.pt2c,b.pt2c],['PT3',a.pt3c,b.pt3c],['AST',a.ast,b.ast],
    ['ROB',a.rob,b.rob],['PÉRD',a.per,b.per],['REB',a.rebOff+a.rebDef,b.rebOff+b.rebDef]
  ];
  return rows.map(r=>{
    const mx=Math.max(r[1],r[2],1);
    const wa=Math.round(r[1]/mx*100),wb=Math.round(r[2]/mx*100);
    return '<div class="bar-row">'+
      '<span class="bnum" style="text-align:right">'+r[1]+'</span>'+
      '<div class="bar-track a"><div class="bar-fill a" style="width:'+wa+'%"></div></div>'+
      '<span class="blbl">'+r[0]+'</span>'+
      '<div class="bar-track b"><div class="bar-fill b" style="width:'+wb+'%"></div></div>'+
      '<span class="bnum">'+r[2]+'</span></div>';
  }).join('');
}

function buildRadar(a,b){
  // 5 ejes: EF.OF, EF.DEF, AST, ROB, REB  (normalizados al máximo entre los dos)
  const axes=[
    ['EF.OF',a.efOff,b.efOff],
    ['EF.DEF',a.efDef,b.efDef],
    ['AST',a.ast,b.ast],
    ['ROB',a.rob,b.rob],
    ['REB',a.rebOff+a.rebDef,b.rebOff+b.rebDef]
  ];
  const cx=130,cy=120,R=88,n=axes.length;
  const ang=(i)=>(-Math.PI/2)+i*2*Math.PI/n;
  const norm=(v,mx)=>mx>0?Math.max(0.04,v/mx):0.04;
  let grid='';
  for(let g=1;g<=3;g++){
    const rr=R*g/3;let pts=[];
    for(let i=0;i<n;i++)pts.push((cx+rr*Math.cos(ang(i)))+','+(cy+rr*Math.sin(ang(i))));
    grid+='<polygon points="'+pts.join(' ')+'" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>';
  }
  let spokes='',labels='';
  axes.forEach((ax,i)=>{
    const x=cx+R*Math.cos(ang(i)),y=cy+R*Math.sin(ang(i));
    spokes+='<line x1="'+cx+'" y1="'+cy+'" x2="'+x+'" y2="'+y+'" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>';
    const lx=cx+(R+16)*Math.cos(ang(i)),ly=cy+(R+16)*Math.sin(ang(i));
    labels+='<text x="'+lx+'" y="'+ly+'" fill="#8891a0" font-family="DM Mono, monospace" font-size="8" text-anchor="middle" dominant-baseline="middle">'+ax[0]+'</text>';
  });
  const poly=(key,color)=>{
    let pts=[];
    axes.forEach((ax,i)=>{const mx=Math.max(ax[1],ax[2]);const r=R*norm(key==='a'?ax[1]:ax[2],mx);pts.push((cx+r*Math.cos(ang(i)))+','+(cy+r*Math.sin(ang(i))));});
    return '<polygon points="'+pts.join(' ')+'" fill="'+color+'22" stroke="'+color+'" stroke-width="2"/>';
  };
  return '<svg width="260" height="240" viewBox="0 0 260 240">'+grid+spokes+labels+poly('a','#f97316')+poly('b','#4f8ef7')+'</svg>';
}

function lcard(l,team){
  const s=l.stats;const pt2t=s.pt2conv+s.pt2fail,pt3t=s.pt3conv+s.pt3fail,tlt=s.tlconv+s.tlfail;
  const ptsA=s.pt2conv*2+s.pt3conv*3+(s.tlconv||0);const ptsR=s.oppPt2conv*2+s.oppPt3conv*3;
  const diff=ptsA-ptsR;const dc=diff>0?'var(--positive)':diff<0?'var(--negative)':'var(--text-3)';
  const warn=l.players.length!==5?'<span class="wb">⚠ '+l.players.length+'/5</span>':'';
  const chips=l.players.map(p=>pchip(p,team)).join('');
  const sg=[scell('PT2',s.pt2conv+'/'+pt2t,pt2t>0),scell('PT3',s.pt3conv+'/'+pt3t,pt3t>0),scell('TL',s.tlconv+'/'+tlt,tlt>0),scell('AST',s.ast,s.ast>0),scell('ROB',s.rob,s.rob>0),scell('PÉRD',s.per,s.per>0),scell('RD',s.rebDef,s.rebDef>0),scell('RO',s.rebOff,s.rebOff>0)].join('');
  const diffbar='<div class="diffbar">'+
    '<span>PTS+ <span class="dv ann">'+ptsA+'</span></span><span>PTS- <span class="dv rec">'+ptsR+'</span></span>'+
    '<span>NET <span class="dv" style="color:'+dc+'">'+(diff>0?'+':'')+diff+'</span></span>'+
    '<span>~POS '+Math.round(estPosProp(s))+'/'+Math.round(estPosRival(s))+'</span></div>';
  return '<div class="lcard t'+team+'"><div class="lcard-meta"><span>▶ '+l.startTime.replace('P'+curQ+' ','')+' · ⏹ '+l.endTime.replace('P'+curQ+' ','')+'</span>'+warn+'</div>'+
    '<div class="lcard-players">'+chips+'</div><div class="sgrid">'+sg+'</div>'+diffbar+'</div>';
}

// ---- CONSOLIDADO ----
let consSort={key:'mins',dir:-1}; // dir: -1 desc, 1 asc
const CONS_COLS=[
  {key:'mins', label:'Min',    fmt:m=>fmtMins(m.mins),     val:m=>m.mins},
  {key:'pos',  label:'POS',    fmt:m=>Math.round(m.posProp), val:m=>m.posProp},
  {key:'diff', label:'+/-',    fmt:m=>(m.diff>0?'+':'')+m.diff, val:m=>m.diff, color:m=>m.diff>0?'var(--positive)':m.diff<0?'var(--negative)':'var(--text-3)'},
  {key:'ptsA', label:'PTS+',   fmt:m=>m.ptsA,              val:m=>m.ptsA},
  {key:'ptsR', label:'PTS-',   fmt:m=>m.ptsR,              val:m=>m.ptsR},
  {key:'efOff',label:'EF.OF',  fmt:m=>(m.efOff/100).toFixed(2),  val:m=>m.efOff},
  {key:'efDef',label:'EF.DEF', fmt:m=>(m.efDefRaw/100).toFixed(2),val:m=>m.efDefRaw},
  {key:'pt2',  label:'PT2',    fmt:m=>m.pt2c+'/'+m.pt2i,   val:m=>m.pt2c},
  {key:'pt3',  label:'PT3',    fmt:m=>m.pt3c+'/'+m.pt3i,   val:m=>m.pt3c},
  {key:'ast',  label:'AST',    fmt:m=>m.ast,               val:m=>m.ast},
  {key:'rob',  label:'ROB',    fmt:m=>m.rob,               val:m=>m.rob},
  {key:'per',  label:'PÉR',    fmt:m=>m.per,               val:m=>m.per},
  {key:'reb',  label:'REB',    fmt:m=>m.rebDef+m.rebOff,   val:m=>m.rebDef+m.rebOff},
  {key:'rd',   label:'RD',     fmt:m=>m.rebDef,            val:m=>m.rebDef},
  {key:'ro',   label:'RO',     fmt:m=>m.rebOff,            val:m=>m.rebOff},
];
function setConsSort(key){ if(consSort.key===key)consSort.dir*=-1; else {consSort.key=key;consSort.dir=-1;} renderConsolidado(); }
function renderConsolidado(){
  const acc=buildConsolidatedData(S.results);
  const arrow=consSort.dir<0?'▼':'▲';
  const head='<th>#</th><th>Quinteto</th><th>Q</th>'+CONS_COLS.map(c=>{
    const on=c.key===consSort.key;
    return '<th class="sortable'+(on?' sorted':'')+'" onclick="setConsSort(\''+c.key+'\')" title="Ordenar por '+c.label+'">'+c.label+(on?' <span class="arr">'+arrow+'</span>':'')+'</th>';
  }).join('');
  const col=CONS_COLS.find(c=>c.key===consSort.key)||CONS_COLS[0];
  const tbl=(team)=>{
    let rows=Object.values(acc[team]).map(r=>({r,m:calcMetrics(r)}));
    if(!rows.length)return '';
    rows.sort((a,b)=>(col.val(a.m)-col.val(b.m))*consSort.dir);
    const body=rows.map((row,i)=>{
      const r=row.r,m=row.m;
      const q=r.quarters.slice().sort().map(x=>'<span class="bq">'+(x>4?('OT'+(x-4)):('Q'+x))+'</span>').join('');
      const cells=CONS_COLS.map(c=>{
        const active=c.key===consSort.key;
        const style=c.color?(' style="color:'+c.color(m)+'"'):'';
        return '<td class="'+(active?'col-active':'')+'"'+style+'>'+c.fmt(m)+'</td>';
      }).join('');
      return '<tr><td class="qn">'+String(i+1).padStart(2,'0')+'</td>'+
        '<td>'+r.players.map(p=>pchip(p,team)).join(' ')+'</td><td>'+q+'</td>'+cells+'</tr>';
    }).join('');
    return '<div class="board t'+team+'"><div class="board-title">'+S.teams[team].name+'</div>'+
      '<div style="overflow-x:auto"><table class="btbl"><thead><tr>'+head+'</tr></thead><tbody>'+body+'</tbody></table></div></div>';
  };
  document.getElementById('view-cons').innerHTML=
    '<div class="toolbar"><span class="sorthint">Tocá un encabezado para ordenar · ahora por '+col.label+' '+arrow+'</span><button class="btn" onclick="exportCSV()">↓ Exportar CSV</button></div>'+
    tbl(1)+tbl(2);
}

function exportCSV(){
  const acc=buildConsolidatedData(S.results);
  let csv='Equipo,Quinteto,Cuartos,Min,POS,+/-,PTS A favor,PTS En contra,EF.OF,EF.DEF,PT2 C/I,PT3 C/I,AST,ROB,PER,REB,RD,RO\n';
  for(const team of [1,2]){
    const rows=Object.values(acc[team]).sort((a,b)=>b.totalMins-a.totalMins);
    for(const r of rows){
      const m=calcMetrics(r);
      const quinteto=r.players.map(p=>'#'+p.num+' '+p.name).join(' | ');
      csv+='"'+S.teams[team].name+'","'+quinteto+'","'+r.quarters.slice().sort().join(',')+'",'+
        fmtMins(m.mins)+','+m.posProp+','+(m.diff>0?'+':'')+m.diff+','+m.ptsA+','+m.ptsR+','+m.efOff+','+m.efDefRaw+','+
        m.pt2c+'/'+m.pt2i+','+m.pt3c+'/'+m.pt3i+','+m.ast+','+m.rob+','+m.per+','+(m.rebDef+m.rebOff)+','+m.rebDef+','+m.rebOff+'\n';
    }
  }
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='quintetos_'+(S.teams[1].name||'partido')+'.csv';a.click();
}

// ---- TABS ----
function switchView(v){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.v===v));
  document.querySelectorAll('.view').forEach(el=>el.classList.remove('active'));
  document.getElementById('view-'+v).classList.add('active');
}
</script>
